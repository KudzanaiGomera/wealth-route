<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WealthRoute</title>
    <meta name="theme-color" content="#0e6b57" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
/* WealthRoute design tokens. A "private ledger" feel: warm paper or deep
   ink backdrop, a literary serif for the numbers that matter, deep emerald
   as the one accent that does real work, gold reserved for medium-priority
   signal so it doesn't compete with the primary accent. */

:root {
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  --bg: #f6f4ee;
  --panel: #ffffff;
  --panel-alt: #fbfaf5;
  --text: #171a19;
  --muted: #5b6560;
  --border: #e3e0d3;
  --accent: #0e6b57;
  --accent-contrast: #ffffff;
  --gold: #a9781f;
  --danger: #a6332b;
  --success: #2e7d4f;
  --shadow: 0 1px 2px rgba(23, 26, 25, 0.04);

  --chart-1: #0e6b57;
  --chart-2: #a9781f;
  --chart-3: #5b6560;
  --chart-4: #7c9c93;
  --chart-5: #c4a468;
}

:root[data-theme="dark"] {
  --bg: #101615;
  --panel: #171f1d;
  --panel-alt: #1c2422;
  --text: #e8ece9;
  --muted: #93a19a;
  --border: #283330;
  --accent: #34b493;
  --accent-contrast: #06120e;
  --gold: #dcab52;
  --danger: #e2685f;
  --success: #59c48a;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);

  --chart-1: #34b493;
  --chart-2: #dcab52;
  --chart-3: #93a19a;
  --chart-4: #6c9186;
  --chart-5: #c9ac72;
}

*, *::before, *::after { box-sizing: border-box; }

html { min-width: 320px; }

body {
  margin: 0;
  font-family: var(--font-sans);
  background:
    radial-gradient(circle at 8% 10%, color-mix(in srgb, var(--accent) 12%, transparent) 0, transparent 35%),
    radial-gradient(circle at 90% 0%, color-mix(in srgb, var(--gold) 12%, transparent) 0, transparent 28%),
    var(--bg);
  color: var(--text);
  transition: background-color 0.15s ease, color 0.15s ease;
}

/* ---------- Top bar ---------- */

.topbar {
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border-bottom: 1px solid var(--border);
  padding: 0.85rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: nowrap;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(8px);
}
.brand {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  letter-spacing: 0.01em;
  color: var(--text);
  text-decoration: none;
}
.brand:hover { color: var(--accent); }
.brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.brand-mark { flex-shrink: 0; }
.brand-mark path { stroke: var(--accent); }
.brand-mark circle { fill: var(--accent); }

#nav {
  display: flex;
  gap: 0.2rem;
  flex-wrap: nowrap;
  flex-direction: column;
  position: absolute;
  right: 1rem;
  top: calc(100% + 0.45rem);
  min-width: 230px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 0.4rem;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-4px);
  transition: opacity 0.16s ease, transform 0.16s ease;
}
#nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.88rem;
  padding: 0.45rem 0.55rem;
  border-bottom: none;
  border-radius: 7px;
}
#nav a.active {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  font-weight: 600;
}
#nav a:hover { background: var(--panel-alt); }
#nav .nav-section-title {
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.35rem 0.55rem 0.2rem;
}
#nav .nav-divider {
  height: 1px;
  background: var(--border);
  margin: 0.3rem 0.2rem;
}
#nav a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.topbar.nav-open #nav {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.nav-controls {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: auto;
}

.nav-jump {
  height: 2.1rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-alt);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.83rem;
  padding: 0 0.85rem;
  min-width: 190px;
}

.nav-toggle {
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel-alt);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.nav-toggle-bars {
  width: 0.9rem;
  height: 0.7rem;
  display: grid;
  align-content: space-between;
}

.nav-toggle-bars span {
  display: block;
  height: 2px;
  border-radius: 2px;
  background: var(--text);
}

.theme-toggle {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text);
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--accent); }

#content { width: 100%; max-width: 1280px; margin: 0 auto; padding: 1.75rem clamp(1rem, 3vw, 2rem) 3rem; }
#content > section { animation: sectionIn 220ms ease-out; }

.global-notice {
  max-width: 980px;
  margin: 0.75rem auto 0;
  padding: 0 1.5rem;
}
.global-notice .notice-card {
  border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border));
  background: color-mix(in srgb, var(--danger) 9%, var(--panel));
  border-radius: 10px;
  padding: 0.8rem 1rem;
  font-size: 0.86rem;
}

.toast-stack {
  position: fixed;
  right: 1rem;
  bottom: 1rem;
  display: grid;
  gap: 0.5rem;
  z-index: 60;
}
.toast {
  min-width: 220px;
  max-width: 360px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 0.65rem 0.75rem;
  box-shadow: var(--shadow);
  font-size: 0.84rem;
}
.toast.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.65rem;
}
.toast-action {
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.22rem 0.6rem;
  cursor: pointer;
  white-space: nowrap;
}
.toast.success { border-color: color-mix(in srgb, var(--success) 40%, var(--border)); }
.toast.error { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }

@keyframes sectionIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Type scale ---------- */

h1 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 500; margin: 0 0 0.25rem; }
h2 { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 500; margin: 1.75rem 0 0.6rem; }
h3 { font-size: 0.95rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
.month-label { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.9rem; }

/* ---------- Dashboard hero ---------- */

.hero { margin-bottom: 0.5rem; }
.greeting { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.2rem; }
.position-summary-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.9fr;
  gap: 1.35rem;
  margin: 0.3rem 0 1rem;
  align-items: stretch;
}
.dashboard-card {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--panel-alt) 92%, var(--accent)) 0%, var(--panel) 54%, color-mix(in srgb, var(--panel-alt) 92%, var(--gold)) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.4rem 1.45rem;
  box-shadow: 0 16px 36px rgba(23, 26, 25, 0.08);
}
.dashboard-card::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--accent) 38%, transparent), transparent 36%),
    radial-gradient(circle at 92% 8%, color-mix(in srgb, var(--gold) 18%, transparent), transparent 28%);
  opacity: 0.55;
}
.dashboard-card > * { position: relative; }
.dashboard-card h2 {
  margin-top: 0;
}
.dashboard-card h1, .dashboard-card h2 { letter-spacing: 0.01em; }
.position-card { border-left: 4px solid var(--accent); }
.annual-card { border-left: 4px solid var(--gold); }
.annual-card h2 { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.annual-card h2::after {
  content: "Year to date";
  font-family: var(--font-sans);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--gold);
  border: 1px solid color-mix(in srgb, var(--gold) 42%, var(--border));
  border-radius: 999px;
  padding: 0.22rem 0.55rem;
  white-space: nowrap;
  background: color-mix(in srgb, var(--gold) 8%, var(--panel));
}
.hero-headline {
  background:
    linear-gradient(145deg, color-mix(in srgb, var(--panel) 90%, var(--accent)), var(--panel) 60%),
    var(--panel);
  border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--border));
  border-radius: 14px;
  padding: 2rem 2.1rem;
  box-shadow: inset 0 1px 0 color-mix(in srgb, #ffffff 28%, transparent), 0 12px 28px rgba(23, 26, 25, 0.08);
  margin: 1rem 0 1.25rem;
}
.hero-headline .stat-label { font-size: 0.85rem; }
.hero-headline .hero-value {
  display: block;
  font-family: var(--font-serif);
  font-size: clamp(2.35rem, 5vw, 4rem);
  line-height: 1.15;
  margin-top: 0.15rem;
}
.hero-headline .hero-value.negative { color: var(--danger); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.65rem; margin: 1rem 0; }
.dashboard-card .stat-grid { gap: 0.8rem; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 0.9rem; }
.dashboard-card .stat {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  border-color: color-mix(in srgb, var(--border) 82%, var(--accent));
  border-radius: 12px;
  min-height: 5.7rem;
  box-shadow: inset 0 1px 0 color-mix(in srgb, #ffffff 22%, transparent);
}
.dashboard-card .stat::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--gold) 72%, var(--accent)));
  opacity: 0.75;
}
.annual-card .stat:nth-child(2n)::after { background: linear-gradient(90deg, var(--gold), var(--accent)); }
.dashboard-card .stat:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.stat-label { display: block; font-size: 0.78rem; color: var(--muted); }
.stat-value { display: block; font-family: var(--font-serif); font-size: 1.3rem; margin-top: 0.2rem; }
.dashboard-card .stat-value { font-size: clamp(1.25rem, 2.2vw, 1.65rem); line-height: 1.2; }
.stat-value.negative { color: var(--danger); }

.day-category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.75rem; margin: 1rem 0; }
.day-category-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem; box-shadow: var(--shadow); }
.day-category-card.top-spend { border-color: color-mix(in srgb, var(--gold) 55%, var(--border)); background: color-mix(in srgb, var(--gold) 7%, var(--panel)); }
.day-category-card h3 { margin: 0; font-size: 0.88rem; color: var(--muted); }
.day-category-card .amount { display: block; font-family: var(--font-serif); font-size: 1.45rem; margin-top: 0.3rem; }
.day-category-card .share { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 0.15rem; }
.day-category-meter { height: 0.45rem; border-radius: 999px; background: var(--panel-alt); overflow: hidden; margin-top: 0.65rem; border: 1px solid var(--border); }
.day-category-meter span { display: block; height: 100%; width: var(--share); background: linear-gradient(90deg, var(--accent), var(--gold)); }
.day-suggestion-card { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: 8px; padding: 1rem; margin: 1rem 0; box-shadow: var(--shadow); }
.day-suggestion-card h2 { margin: 0 0 0.35rem; }
.day-suggestion-card p { margin: 0.25rem 0; color: var(--text); font-size: 0.92rem; }
.day-suggestion-card .fine-print { margin-top: 0.55rem; }

/* ---------- Health score ---------- */

.health-score {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.1rem 1.25rem;
  margin: 1.25rem 0;
}
.health-score h2 { margin-top: 0; }
.score-breakdown { display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: 0.83rem; color: var(--muted); margin: 0.5rem 0; }
.fine-print { font-size: 0.8rem; color: var(--muted); }
.suggestions-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.95rem 1.1rem;
  margin: 1rem 0;
}
.suggestions-card h3 { margin-top: 0; }
.suggestions-card ul { margin: 0.4rem 0 0; padding-left: 1.2rem; }
.suggestions-card li { margin-bottom: 0.4rem; }

.debt-calendar-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.95rem 1.1rem;
  margin-bottom: 0.9rem;
}
.debt-calendar-card h4 { margin: 0 0 0.5rem; }
.debt-calendar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 0.4rem; margin: 0.5rem 0; }
.month-btn {
  padding: 0.4rem 0.3rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-alt);
  color: var(--text);
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  text-align: center;
}
.month-btn:hover { filter: brightness(1.08); }
.month-btn.paid { background: var(--success); color: #fff; border-color: var(--success); }
.debt-calendar-stats { display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: 0.85rem; margin-top: 0.4rem; }
.debt-calendar-stats strong { font-family: var(--font-serif); }

/* ---------- Recommendations ---------- */

.recommendations { margin: 1.5rem 0; }
.rec-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--muted);
  border-radius: 8px;
  padding: 0.95rem 1.1rem;
  margin-bottom: 0.7rem;
}
.rec-card.p-high { border-left-color: var(--danger); border-left-width: 4px; }
.rec-card.p-medium { border-left-color: var(--gold); }
.rec-card.p-low { border-left-color: var(--success); }
.rec-head { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.45rem; }
.rec-index { color: var(--muted); font-family: var(--font-serif); }
.rec-title { font-weight: 600; flex: 1; }
.badge {
  font-size: 0.72rem;
  padding: 0.1rem 0.55rem;
  border-radius: 999px;
  border: 1px solid currentColor;
  font-weight: 600;
}
.badge.p-high { color: var(--danger); }
.badge.p-medium { color: var(--gold); }
.badge.p-low { color: var(--success); }
.rec-card p { margin: 0.3rem 0; font-size: 0.9rem; color: var(--text); }
.rec-card p strong { color: var(--muted); font-weight: 600; }

/* ---------- Charts ---------- */

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
.charts > *, .summary-charts > *, .position-summary-grid > *, .assistant-workspace > * { min-width: 0; }
.chart-block { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; box-shadow: var(--shadow); }
.chart-block svg, .chart-block canvas { display: block; width: 100%; max-width: 100%; height: auto; }
.chart-block svg text { fill: var(--muted); font-family: var(--font-sans); }

.summary-charts {
  display: grid;
  grid-template-columns: repeat(2, minmax(280px, 1fr));
  gap: 1rem;
  margin: 1rem 0 1.25rem;
}

.pie-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.pie-layout {
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 0.8rem;
  align-items: center;
}

.pie-legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.35rem;
  font-size: 0.82rem;
}

.pie-legend li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.legend-label {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

.legend-dot {
  width: 0.62rem;
  height: 0.62rem;
  border-radius: 999px;
  display: inline-block;
}

.legend-value {
  font-family: var(--font-serif);
}

/* ---------- Tables ---------- */

.table-wrap {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  margin: 0.75rem 0;
}
.data-table { width: 100%; min-width: max-content; border-collapse: collapse; background: var(--panel); border: none; border-radius: 0; overflow: visible; margin: 0; }
.data-table th, .data-table td { padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.88rem; white-space: nowrap; }
.data-table th { background: var(--panel-alt); font-weight: 600; color: var(--muted); font-size: 0.8rem; }
.data-table th.sortable { cursor: pointer; user-select: none; }
.data-table th.sortable:hover { color: var(--accent); }
.data-table tr:last-child td { border-bottom: none; }
.data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table .empty { color: var(--muted); text-align: center; padding: 1.25rem; }
.data-table td input.cell, .data-table td select.cell { width: 100%; min-width: 7rem; border: 1px solid transparent; background: transparent; color: var(--text); font-size: 0.85rem; padding: 0.2rem; font-family: var(--font-sans); transition: background-color 0.5s ease; }
.data-table td input.cell[data-field="name"] { min-width: 12rem; }
.data-table.debts-table { min-width: 1120px; }
.table-header-select { max-width: 5.2rem; padding: 0.15rem 0.25rem; border: 1px solid var(--border); border-radius: 4px; background: var(--panel); color: var(--text); font: inherit; }
.debts-table td:nth-child(8), .debts-table td:nth-child(9) { min-width: 11rem; }
.debts-table td:nth-child(10), .debts-table td:nth-child(11) { min-width: 8rem; }
.data-table td input.cell:focus, .data-table td select.cell:focus { border-color: var(--accent); background: var(--panel-alt); }
.data-table td input.cell.just-saved, .data-table td select.cell.just-saved { background: color-mix(in srgb, var(--success) 22%, transparent); }
.invalid-row { background: color-mix(in srgb, var(--danger) 10%, var(--panel)); }

/* ---------- Forms ---------- */

.inline-form, .stacked-form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.75rem 0; }
.stacked-form { flex-direction: column; align-items: flex-start; }
.inline-form input, .inline-form select, .stacked-form input, .stacked-form select, textarea {
  min-width: 0;
  max-width: 100%;
  padding: 0.42rem 0.55rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.88rem;
  background: var(--panel);
  color: var(--text);
  font-family: var(--font-sans);
}
button {
  padding: 0.48rem 0.95rem;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: var(--accent-contrast);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
}
button:hover { filter: brightness(1.08); }
button.secondary { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); }
button.danger { background: var(--danger); color: #fff; }
.link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.85rem; padding: 0; font-weight: 500; }

    <script>
// IndexedDB schema and migration layer.

window.WR = window.WR || {};

(function () {
  const DB_NAME = 'wealthroute';
  const DB_VERSION = 3;

  /** @type {Promise<IDBDatabase>|null} */
  let dbPromise = null;

  function ensureStore(db, name, options, indexes) {
    const store = db.objectStoreNames.contains(name)
      ? null
      : db.createObjectStore(name, options || { keyPath: 'id' });
    if (!store || !indexes || !indexes.length) return;
    indexes.forEach((indexDef) => {
      if (!store.indexNames.contains(indexDef.name)) {
        store.createIndex(indexDef.name, indexDef.keyPath, indexDef.options || undefined);
      }
    });
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        ensureStore(db, 'userProfile', { keyPath: 'id' });
        ensureStore(db, 'incomeSources', { keyPath: 'id' });
        ensureStore(db, 'fixedExpenses', { keyPath: 'id' });
        ensureStore(db, 'expenseCategories', { keyPath: 'id' });
        ensureStore(db, 'budgetLines', { keyPath: 'id' }, [{ name: 'by-month', keyPath: 'month' }]);
        ensureStore(db, 'debts', { keyPath: 'id' });
        ensureStore(db, 'debtPayments', { keyPath: 'id' }, [{ name: 'by-debt', keyPath: 'debtId' }]);
        ensureStore(db, 'emergencyFundContributions', { keyPath: 'id' });
        ensureStore(db, 'dayToDayAccounts', { keyPath: 'id' });
        ensureStore(db, 'dayToDayTransactions', { keyPath: 'id' });
        ensureStore(db, 'assets', { keyPath: 'id' });
        ensureStore(db, 'investments', { keyPath: 'id' });
        ensureStore(db, 'netWorthSnapshots', { keyPath: 'id' }, [{ name: 'by-date', keyPath: 'date' }]);
        ensureStore(db, 'exchangeRates', { keyPath: 'id' });
        ensureStore(db, 'assistantChats', { keyPath: 'id' });
      };

      request.onsuccess = () => {
        // Without this, a later deleteDatabase()/version bump blocks forever
        // behind this still-open connection.
        request.result.onversionchange = () => request.result.close();
        resolve(request.result);
      };
      request.onerror = () => reject(request.error);
    });
  }

  function getDB() {
    if (!dbPromise) dbPromise = openDatabase();
    return dbPromise;
  }

  async function resetConnection() {
    if (dbPromise) {
      const db = await dbPromise.catch(() => null);
      if (db) db.close();
    }
    dbPromise = null;
  }

  async function deleteDatabase() {
    await resetConnection();
    return new Promise((resolve, reject) => {
      const req = indexedDB.deleteDatabase(DB_NAME);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
      req.onblocked = () => resolve();
    });
  }

  WR.db = { getDB, resetConnection, deleteDatabase, DB_NAME, DB_VERSION };
})();
// Generic CRUD repository over a single IndexedDB object store. Every entity
// in the data model gets one of these via WR.createRepository(storeName).
// Index-backed queries (e.g. "budget lines for a given month") live in
// repositories.js instead, since they're store-specific.

window.WR = window.WR || {};

(function () {
  /**
   * @param {IDBRequest} request
   * @returns {Promise<any>}
   */
  function requestToPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  /**
   * @param {string} storeName
   */
  function createRepository(storeName) {
    return {
      async getAll() {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readonly');
        return requestToPromise(tx.objectStore(storeName).getAll());
      },
      /** @param {string} id */
      async getById(id) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readonly');
        return requestToPromise(tx.objectStore(storeName).get(id));
      },
      /** @param {{id: string}} item */
      async add(item) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).put(item));
        return item.id;
      },
      /** @param {{id: string}} item */
      async update(item) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).put(item));
        return item.id;
      },
      /** @param {string} id */
      async remove(id) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).delete(id));
      },
      async clear() {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).clear());
      },
    };
  }

  WR.createRepository = createRepository;
})();
// One repository per entity, plus the index-backed queries the generic
// repository can't express on its own.

window.WR = window.WR || {};

(function () {
  /** @param {IDBRequest} request */
  function requestToPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  WR.repos = {
    userProfile: WR.createRepository('userProfile'),
    incomeSources: WR.createRepository('incomeSources'),
    fixedExpenses: WR.createRepository('fixedExpenses'),
    expenseCategories: WR.createRepository('expenseCategories'),
    budgetLines: WR.createRepository('budgetLines'),
    debts: WR.createRepository('debts'),
    debtPayments: WR.createRepository('debtPayments'),
    emergencyFundContributions: WR.createRepository('emergencyFundContributions'),
    dayToDayAccounts: WR.createRepository('dayToDayAccounts'),
    dayToDayTransactions: WR.createRepository('dayToDayTransactions'),
    assets: WR.createRepository('assets'),
    investments: WR.createRepository('investments'),
    netWorthSnapshots: WR.createRepository('netWorthSnapshots'),
    exchangeRates: WR.createRepository('exchangeRates'),
    assistantChats: WR.createRepository('assistantChats'),
  };

  WR.queries = {
    /** All budget lines (income/fixed/variable/savings/debt) for a 'YYYY-MM' month. */
    async getBudgetLinesByMonth(month) {
      const db = await WR.db.getDB();
      const tx = db.transaction('budgetLines', 'readonly');
      const index = tx.objectStore('budgetLines').index('by-month');
      return requestToPromise(index.getAll(month));
    },

    /** All recorded payments made against a specific debt, across all months. */
    async getDebtPaymentsForDebt(debtId) {
      const db = await WR.db.getDB();
      const tx = db.transaction('debtPayments', 'readonly');
      const index = tx.objectStore('debtPayments').index('by-debt');
      return requestToPromise(index.getAll(debtId));
    },

    /** Full net worth history, oldest first — powers the net worth trend chart. */
    async getNetWorthHistory() {
      const db = await WR.db.getDB();
      const tx = db.transaction('netWorthSnapshots', 'readonly');
      const index = tx.objectStore('netWorthSnapshots').index('by-date');
      return requestToPromise(index.getAll());
    },
  };
})();
// Core WealthRoute data model.
//
// No TypeScript here (per your call to drop the build step), but the JSDoc
// typedefs below still give autocomplete + inline type hints in VS Code and
// most editors, with zero compilation. Factory functions generate a new id
// so call sites never construct records by hand.
//
// Derived from Budget & Goal Tracker 2026.xlsx (Sprint 0 analysis), plus two
// additions the workbook doesn't have: NetWorthSnapshot (a time series, so
// trends/forecasting are possible) and ExchangeRate (fixes the workbook's
// unconverted-USD-assets gap). The workbook's "Goal Tracker" and "Habit
// Tracker" sheets are intentionally not modelled here.

window.WR = window.WR || {};

(function () {
  /** @returns {string} */
  function newId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    // Fallback for contexts where crypto.randomUUID isn't available
    // (some restricted file:// setups) — still unique enough for local use.
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  /**
   * @typedef {Object} UserProfile
   * @property {string} id
   * @property {string} [displayName] - purely cosmetic, shown in the Dashboard greeting
   * @property {string} baseCurrency - ISO 4217 code, e.g. 'ZAR'
   * @property {string} country
   * @property {number} emergencyFundTargetMonths
   * @property {'conservative'|'moderate'|'aggressive'} riskProfile
   */
  /** @param {Omit<UserProfile,'id'>} fields */
  function createUserProfile(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} IncomeSource
   * @property {string} id
   * @property {string} name
   * @property {number} amount
   * @property {string} currency
   * @property {'once'|'weekly'|'biweekly'|'monthly'|'annual'} frequency
   * @property {string} category
   * @property {boolean} recurring
   */
  /** @param {Omit<IncomeSource,'id'>} fields */
  function createIncomeSource(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} ExpenseCategory
   * @property {string} id
   * @property {string} name
   * @property {'fixed'|'variable'} type
   * @property {boolean} essential
   */
  /** @param {Omit<ExpenseCategory,'id'>} fields */
  function createExpenseCategory(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * One line item for one month. Mirrors the workbook's Budget / Actual /
   * Difference rows, normalised across all months into one store instead of
   * duplicated across 12 near-identical sheets.
   * @typedef {Object} BudgetLine
   * @property {string} id
   * @property {string} month - 'YYYY-MM'
   * @property {'income'|'fixed'|'variable'|'savings'|'debtPayment'} type
   * @property {string} [categoryId]
   * @property {string} name
   * @property {number} budgetAmount
   * @property {number} actualAmount
   * @property {string} currency
   */
  /** @param {Omit<BudgetLine,'id'>} fields */
  function createBudgetLine(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} Debt
   * @property {string} id
   * @property {string} name
   * @property {string} [type]
   * @property {number} [originalBalance]
   * @property {number} currentBalance
   * @property {string} [currency] - ISO 4217 code; falls back to base currency if omitted
   * @property {number} interestRate - fraction, e.g. 0.2 = 20%
   * @property {number} minPayment
   * @property {string} [dueDate]
   * @property {number} [priority] - lower = higher priority; set by the debt engine later
   */
  /** @param {Omit<Debt,'id'>} fields */
  function createDebt(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} DebtPayment
   * @property {string} id
   * @property {string} debtId
   * @property {string} month - 'YYYY-MM'
   * @property {number} amount
   */
  /** @param {Omit<DebtPayment,'id'>} fields */
  function createDebtPayment(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} Asset
   * @property {string} id
   * @property {string} name
   * @property {string} type
   * @property {string} currency
   * @property {number} currentValue
   * @property {number} [purchasePrice]
   * @property {string} [purchaseDate]
   * @property {'high'|'medium'|'low'} [liquidity]
   * @property {string} [notes]
   */
  /** @param {Omit<Asset,'id'>} fields */
  function createAsset(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} Investment
   * @property {string} id
   * @property {string} name
   * @property {string} type
   * @property {string} currency
   * @property {number} currentValue
   * @property {number} totalContributions
   * @property {number} [expectedReturnAssumption] - fraction, e.g. 0.08
   * @property {'low'|'medium'|'high'} [riskCategory]
   * @property {number} [horizonYears]
   */
  /** @param {Omit<Investment,'id'>} fields */
  function createInvestment(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * A point-in-time record of assets vs liabilities. Doesn't exist anywhere in
   * the source workbook — it only ever stores "current" net worth, never a
   * history — so this is what makes trend charts and forecasting possible.
   * @typedef {Object} NetWorthSnapshot
   * @property {string} id
   * @property {string} date - ISO date
   * @property {number} totalAssets
   * @property {number} totalLiabilities
   * @property {number} netWorth
   * @property {string} currency
   */
  /** @param {Omit<NetWorthSnapshot,'id'>} fields */
  function createNetWorthSnapshot(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} ExchangeRate
   * @property {string} id
   * @property {string} fromCurrency
   * @property {string} toCurrency
   * @property {number} rate
   * @property {string} date
   */
  /** @param {Omit<ExchangeRate,'id'>} fields */
  function createExchangeRate(fields) {
    return { id: newId(), ...fields };
  }

  function createFixedExpense(fields) {
    return { id: newId(), ...fields };
  }

  function createEmergencyFundContribution(fields) {
    return { id: newId(), ...fields };
  }

  function createDayToDayAccount(fields) {
    return { id: newId(), ...fields };
  }

  function createDayToDayTransaction(fields) {
    return { id: newId(), ...fields };
  }

  function createAssistantChat(fields) {
    return { id: newId(), ...fields };
  }

  WR.models = {
    newId,
    createUserProfile,
    createIncomeSource,
    createExpenseCategory,
    createBudgetLine,
    createDebt,
    createDebtPayment,
    createAsset,
    createInvestment,
    createNetWorthSnapshot,
    createExchangeRate,
    createFixedExpense,
    createEmergencyFundContribution,
    createDayToDayAccount,
    createDayToDayTransaction,
    createAssistantChat,
  };
})();
// Cash flow, savings rate, and expense-split calculations.
//
// Every function here is pure: plain data in, plain data/numbers out. No
// storage calls, no DOM, no side effects — this is what makes the engine
// independently testable and keeps financial math out of UI code, per the
// "deterministic engine" principle from the brief.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Sum actualAmount for budget lines of a given type.
   * Caller is expected to have already filtered to a single month (e.g. via
   * WR.queries.getBudgetLinesByMonth).
   * @param {Array} budgetLines
   * @param {'income'|'fixed'|'variable'|'savings'|'debtPayment'} type
   */
  function sumActualByType(budgetLines, type) {
    return budgetLines
      .filter((line) => line.type === type)
      .reduce((total, line) => total + line.actualAmount, 0);
  }

  /**
   * Sum budgetAmount (planned, not actual) for budget lines of a given type.
   * Useful for budget-vs-actual variance, same shape as the workbook's
   * Budget/Actual/Difference columns.
   */
  function sumBudgetByType(budgetLines, type) {
    return budgetLines
      .filter((line) => line.type === type)
      .reduce((total, line) => total + line.budgetAmount, 0);
  }

  /**
   * Builds the core monthly cash flow picture from one month's budget lines.
  * Calculates available surplus after expenses and required debt payments,
  * but exposes each component separately so the dashboard
   * and rules engine can reason about them individually rather than only
   * seeing one final number.
   *
  * @param {Array} budgetLines - budget lines for a single month
  * @param {number} [minimumDebtPayments] - required payments from debt records
   * @returns {{
   *   income: number, fixedExpenses: number, variableExpenses: number,
   *   savings: number, debtPayments: number, totalExpenses: number,
   *   availableSurplus: number, savingsRate: number
   * }}
   */
  function calculateCashFlowSummary(budgetLines, minimumDebtPayments) {
    const income = sumActualByType(budgetLines, 'income');
    const fixedExpenses = sumActualByType(budgetLines, 'fixed');
    const variableExpenses = sumActualByType(budgetLines, 'variable');
    const savings = sumActualByType(budgetLines, 'savings');
    const debtPayments = minimumDebtPayments === undefined
      ? sumActualByType(budgetLines, 'debtPayment')
      : Math.max(0, Number(minimumDebtPayments) || 0);

    const totalExpenses = fixedExpenses + variableExpenses;
    const availableSurplus = income - totalExpenses - debtPayments;
    const savingsRate = income > 0 ? savings / income : 0;

    return {
      income,
      fixedExpenses,
      variableExpenses,
      savings,
      debtPayments,
      totalExpenses,
      availableSurplus,
      savingsRate,
    };
  }

  /**
   * Splits fixed+variable expense budget lines into essential vs discretionary
   * totals, using each line's categoryId to look up ExpenseCategory.essential.
   * A line with no matching category (or no categoryId at all) is counted as
   * discretionary — safer to flag it for review than to silently assume it's
   * essential when nobody has categorised it yet.
   *
   * @param {Array} budgetLines
   * @param {Array} expenseCategories
   * @returns {{ essential: number, discretionary: number }}
   */
  function calculateEssentialVsDiscretionary(budgetLines, expenseCategories) {
    const categoryById = new Map(expenseCategories.map((c) => [c.id, c]));

    let essential = 0;
    let discretionary = 0;

    budgetLines
      .filter((line) => line.type === 'fixed' || line.type === 'variable')
      .forEach((line) => {
        const category = line.categoryId ? categoryById.get(line.categoryId) : undefined;
        if (category && category.essential) {
          essential += line.actualAmount;
        } else {
          discretionary += line.actualAmount;
        }
      });

    return { essential, discretionary };
  }

  Object.assign(WR.financial, {
    sumActualByType,
    sumBudgetByType,
    calculateCashFlowSummary,
    calculateEssentialVsDiscretionary,
  });
})();
// Debt totals and interest calculations. Pure functions — no storage calls,
// no UI. This is the foundation the avalanche/snowball prioritisation engine

// the global `XLSX`). Deliberately uses a generic column-mapping approach
// rather than hardcoded cell ranges tied to one exact workbook layout —
// hardcoded ranges break the moment a row shifts; column mapping survives
// minor structural differences and works with any spreadsheet, not just
// the exact source workbook this project started from.
//
// Workflow: parse workbook -> list sheets -> user picks a sheet + maps its
// columns to WealthRoute fields -> preview -> confirm -> import as
// BudgetLine records for the current month.

window.WR = window.WR || {};
WR.excel = WR.excel || {};

(function () {
  /**
   * Parses an uploaded file (ArrayBuffer) into a SheetJS workbook.
   * @param {ArrayBuffer} arrayBuffer
   */
  function parseWorkbook(arrayBuffer) {
    return XLSX.read(arrayBuffer, { type: 'array' });
  }

  /** @param {object} workbook */
  function getSheetNames(workbook) {
    return workbook.SheetNames;
  }

  /**
   * Reads one sheet as an array of row objects, plus the header list for
   * building a mapping UI. `headerRowIndex` (0-indexed) lets the caller
   * point at whichever row actually holds column headers \u2014 not every
   * spreadsheet has them in row 1 (this workbook's own month sheets, for
   * example, have several header rows partway down the sheet). Blank
   * header cells get a synthetic "Column X" label rather than being
   * silently dropped, so every column stays mappable.
   * @param {object} workbook
   * @param {string} sheetName
   * @param {number} [headerRowIndex] - 0-indexed row number, defaults to 0 (row 1)
   */
  function readSheetRows(workbook, sheetName, headerRowIndex) {
    const startRow = headerRowIndex || 0;
    const sheet = workbook.Sheets[sheetName];
    const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, range: startRow, defval: '' });

    const headerCells = aoa[0] || [];
    const headers = headerCells.map((h, i) =>
      h === '' || h === undefined || h === null ? `Column ${XLSX.utils.encode_col(i)}` : String(h),
    );

    const rows = aoa.slice(1)
      .filter((rowArr) => rowArr.some((cell) => cell !== '' && cell !== undefined)) // skip fully blank rows
      .map((rowArr) => {
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = rowArr[i] !== undefined ? rowArr[i] : '';
        });
        return obj;
      });

    return { headers, rows };
  }

  /**
   * Validates a single mapped row before import. Returns a list of problems
   * (empty = valid) rather than throwing, so the caller can show every issue
   * in the preview instead of stopping at the first bad row.
   * @param {Object} row - already mapped to { name, amount, type, month, categoryId }
   */
  function validateImportRow(row) {
    const problems = [];
    if (!row.name || String(row.name).trim() === '') problems.push('Missing name/description');
    if (row.amount === undefined || row.amount === '' || Number.isNaN(Number(row.amount))) {
      problems.push('Missing or invalid amount');

   * thousands separators, and accounting-style negatives like "(500.00)"
   * (parentheses meaning negative, common in exported financial data).
   * @param {*} raw
   */

    const str = String(raw ?? '').trim();

    return isParenNegative ? -Math.abs(value) : value;

  /**
   * Applies a column mapping to raw sheet rows, producing WealthRoute
   * BudgetLine-shaped records (not yet saved). `mapping` keys are
   * WealthRoute field names, values are the source column header to read
   * from each raw row. `constants` supplies fields not present as columns
   * (e.g. a fixed month or type for the whole import).
   *
   * @param {Array<Object>} rawRows
   * @param {{name?: string, amount?: string, type?: string, month?: string, currency?: string}} mapping
   * @param {{type?: string, month?: string, currency?: string}} constants
   */
  function applyMapping(rawRows, mapping, constants) {
    return rawRows.map((raw) => {
      const name = mapping.name ? raw[mapping.name] : undefined;
      const amountRaw = mapping.amount ? raw[mapping.amount] : undefined;
      const amount = typeof amountRaw === 'number' ? amountRaw : parseAmount(amountRaw);
      const type = constants.type || (mapping.type ? raw[mapping.type] : undefined);
      const month = constants.month || (mapping.month ? raw[mapping.month] : undefined);
      const currency = constants.currency || (mapping.currency ? raw[mapping.currency] : 'ZAR');

      return { name, amount, type, month, currency };
    });
  }

  /**
   * Imports validated rows as BudgetLine records via the repository layer.
   * Rows that fail validation are skipped and returned separately, rather
   * than silently importing bad data.
   * @param {Array<Object>} mappedRows
   */
  async function importBudgetLines(mappedRows) {
    const imported = [];
    const rejected = [];

    for (const row of mappedRows) {
      const problems = validateImportRow(row);
      if (problems.length > 0) {
        rejected.push({ row, problems });
        continue;
      }
      const line = WR.models.createBudgetLine({
        month: row.month,
        type: row.type,
        name: row.name,
        budgetAmount: Number(row.amount),
        actualAmount: Number(row.amount),
        currency: row.currency || 'ZAR',
      });
      await WR.repos.budgetLines.add(line);
      imported.push(line);
    }

    return { imported, rejected };
  }

  /**
   * Exports all current data as a multi-sheet workbook: one sheet per
   * entity. This intentionally does not attempt to reproduce the exact
   * 16-sheet source template (Annual Overview + 12 month sheets + Networth
   * + Goal/Habit trackers) — it exports WealthRoute's own normalised data
   * model instead, which is what round-trips cleanly.
   */
  async function exportWorkbook() {
    const [budgetLines, debts, assets, investments, netWorthSnapshots] = await Promise.all([
      WR.repos.budgetLines.getAll(),
      WR.repos.debts.getAll(),
      WR.repos.assets.getAll(),
      WR.repos.investments.getAll(),
      WR.repos.netWorthSnapshots.getAll(),
    ]);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(budgetLines), 'Budget Lines');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(debts), 'Debts');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assets), 'Assets');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(investments), 'Investments');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(netWorthSnapshots), 'Net Worth History');

    XLSX.writeFile(wb, `wealthroute-export-${new Date().toISOString().slice(0, 10)}.xlsx`);
  }

  WR.excel = {
    parseWorkbook,
    getSheetNames,
    readSheetRows,
    validateImportRow,
    parseAmount,
    applyMapping,
    importBudgetLines,
    exportWorkbook,
  };
})();

(function () {
  const PALETTE = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)', 'var(--chart-1)'];

  function escapeXml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
  }

  /**
   * @param {Array<{label: string, value: number}>} data
   * @param {{width?: number, height?: number, color?: string}} [options]
   */
  function barChart(data, options) {
    const opts = options || {};
    const width = opts.width || 480;
    const height = opts.height || 240;
    const padding = 32;
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;

    if (data.length === 0) {
      return `<svg width="${width}" height="${height}"><text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="#888">No data</text></svg>`;
    }

    const maxVal = Math.max(...data.map((d) => d.value), 0.01);
    const barWidth = chartW / data.length;

    const bars = data
      .map((d, i) => {
        const barH = (Math.max(d.value, 0) / maxVal) * chartH;
        const x = padding + i * barWidth + barWidth * 0.15;
        const y = padding + (chartH - barH);
        const w = barWidth * 0.7;
        const color = opts.color || PALETTE[i % PALETTE.length];
        return `
          <rect x="${x}" y="${y}" width="${w}" height="${barH}" fill="${color}" rx="2"></rect>
          <text x="${x + w / 2}" y="${height - padding + 14}" text-anchor="middle" font-size="10" fill="#444">${escapeXml(d.label)}</text>
          <text x="${x + w / 2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="#222">${d.value.toFixed(0)}</text>
        `;
      })
      .join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
  }

  /**
   * @param {Array<{label: string, value: number}>} data - ordered chronologically
   * @param {{width?: number, height?: number, color?: string}} [options]
   */
  function lineChart(data, options) {
    const opts = options || {};
    const width = opts.width || 480;
    const height = opts.height || 240;
    const padding = 32;
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;

    if (data.length === 0) {
      return `<svg width="${width}" height="${height}"><text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="#888">No data</text></svg>`;
    }

    const values = data.map((d) => d.value);
    const maxVal = Math.max(...values);
    const minVal = Math.min(...values, 0);
    const range = maxVal - minVal || 1;
    const stepX = data.length > 1 ? chartW / (data.length - 1) : 0;
    const color = opts.color || PALETTE[0];

    const points = data.map((d, i) => {
      const x = padding + i * stepX;
      const y = padding + chartH - ((d.value - minVal) / range) * chartH;
      return { x, y, label: d.label, value: d.value };
    });

    const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const dots = points
      .map(
        (p) =>
          `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"><title>${escapeXml(p.label)}: ${p.value.toFixed(2)}</title></circle>`,
      )
      .join('');
    const labels = points
      .map((p, i) => (i % Math.ceil(points.length / 8 || 1) === 0
        ? `<text x="${p.x.toFixed(1)}" y="${height - padding + 14}" text-anchor="middle" font-size="9" fill="#444">${escapeXml(p.label)}</text>`
        : ''))
      .join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2"></path>
      ${dots}
      ${labels}
    </svg>`;
  }

  /**
   * @param {Array<{label: string, value: number}>} data
   * @param {{size?: number, innerRadius?: number}} [options]
   */
  function pieChart(data, options) {
    const opts = options || {};
    const size = opts.size || 180;
    const radius = size / 2 - 8;
    const innerRadius = opts.innerRadius || radius * 0.58;
    const cx = size / 2;
    const cy = size / 2;

    const valid = (data || []).filter((d) => Number(d.value) > 0);
    const total = valid.reduce((sum, d) => sum + Number(d.value || 0), 0);
    if (!valid.length || total <= 0) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--border)" stroke-width="14"></circle><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--muted)">No data</text></svg>`;
    }

    const arcs = [];
    let start = -Math.PI / 2;
    valid.forEach((item, i) => {
      const angle = (Number(item.value) / total) * Math.PI * 2;
      const end = start + angle;
      const x1 = cx + Math.cos(start) * radius;
      const y1 = cy + Math.sin(start) * radius;
      const x2 = cx + Math.cos(end) * radius;
      const y2 = cy + Math.sin(end) * radius;
      const large = angle > Math.PI ? 1 : 0;
      const color = PALETTE[i % PALETTE.length];
      arcs.push(`<path d="M ${cx} ${cy} L ${x1.toFixed(3)} ${y1.toFixed(3)} A ${radius} ${radius} 0 ${large} 1 ${x2.toFixed(3)} ${y2.toFixed(3)} Z" fill="${color}"></path>`);
      start = end;
    });

    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${arcs.join('')}<circle cx="${cx}" cy="${cy}" r="${innerRadius}" fill="var(--panel)"></circle><text x="${cx}" y="${cy - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">Total</text><text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="14" fill="var(--text)">${total.toFixed(0)}</text></svg>`;
  }

  WR.charts = { barChart, lineChart, pieChart };

// Theme management: defaults to the system preference, persists an
// explicit user choice in localStorage, applied via a data-theme attribute
// on <html> that the CSS custom properties key off.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const STORAGE_KEY = 'wr_theme';

  function getStoredTheme() {
    return localStorage.getItem(STORAGE_KEY);
  }

  function getSystemTheme() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    updateToggleIcon(theme);
  }

  function updateToggleIcon(theme) {
    const btn = document.getElementById('theme-toggle-btn');
    if (!btn) return;
    // Sun icon when in dark mode (click to go light), moon icon when in
    // light mode (click to go dark) \u2014 the icon shown is the destination.
    btn.innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
    btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }

  const SUN_ICON =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
  const MOON_ICON =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';

  function initTheme() {
    applyTheme(getStoredTheme() || getSystemTheme());
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || getSystemTheme();
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(STORAGE_KEY, next);
    applyTheme(next);
  }

  WR.ui.initTheme = initTheme;
  WR.ui.toggleTheme = toggleTheme;
  WR.ui.updateToggleIcon = updateToggleIcon;

  // Runs immediately at script load, not on DOMContentLoaded \u2014
  // document.documentElement already exists by the time this executes, and
  // setting the attribute this early avoids a flash of the wrong theme
  // before the rest of the page renders. The toggle button doesn't exist
  // yet at this point; updateToggleIcon() is called again once the shell
  // (with the button) is rendered.
  applyTheme(getStoredTheme() || getSystemTheme());
})();

        WR.repos.assets.getAll(),
        WR.repos.investments.getAll(),
        WR.repos.exchangeRates.getAll(),
        WR.repos.expenseCategories.getAll(),
        WR.queries.getNetWorthHistory(),
        getOrCreateProfile(),
        WR.repos.incomeSources.getAll(),
        WR.repos.fixedExpenses.getAll(),
        WR.repos.emergencyFundContributions.getAll(),
        WR.repos.dayToDayAccounts.getAll(),
        WR.repos.dayToDayTransactions.getAll(),
      ]);

    const monthBudgetLines = allBudgetLines.filter((line) => line.month === month);
    const prevMonthBudgetLines = allBudgetLines.filter((line) => line.month === prevMonth);

    const recurringIncomeLines = incomeSources
      .filter((source) => Number(source.year || selectedYear) === selectedYear && isActiveForMonth(source, month))
      .map((source) => ({
        type: 'income',
        name: source.name,
        categoryId: source.categoryId,
        budgetAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
      }));

    const recurringFixedLines = fixedExpenses
      .filter((expense) => isActiveForMonth(expense, month))
      .map((expense) => ({
        type: 'fixed',
        name: expense.name,
        categoryId: expense.categoryId,
        budgetAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
      }));

    const budgetLines = monthBudgetLines
      .filter((line) => line.type !== 'income' && line.type !== 'fixed')
      .concat(recurringIncomeLines)
      .concat(recurringFixedLines);

    const prevRecurringIncomeLines = incomeSources
      .filter((source) => Number(source.year || Number(prevMonth.slice(0, 4))) === Number(prevMonth.slice(0, 4)) && isActiveForMonth(source, prevMonth))
      .map((source) => ({
        type: 'income',
        name: source.name,
        categoryId: source.categoryId,
        budgetAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
      }));
    const prevRecurringFixedLines = fixedExpenses
      .filter((expense) => isActiveForMonth(expense, prevMonth))
      .map((expense) => ({
        type: 'fixed',
        name: expense.name,
        categoryId: expense.categoryId,
        budgetAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
      }));
    const prevBudgetLines = prevMonthBudgetLines
      .filter((line) => line.type !== 'income' && line.type !== 'fixed')
      .concat(prevRecurringIncomeLines)
      .concat(prevRecurringFixedLines);

    const F = WR.financial;
    const minimumDebtPayments = F.calculateTotalMinPayments(debts);
    const cashflow = F.calculateCashFlowSummary(budgetLines, minimumDebtPayments);
    const split = F.calculateEssentialVsDiscretionary(budgetLines, expenseCategories);
    const prevSplit = F.calculateEssentialVsDiscretionary(prevBudgetLines, expenseCategories);

    const totalDebt = F.calculateTotalDebt(debts);
    const debtToIncomeRatio = F.calculateDebtToIncomeRatio(debts, cashflow.income);
    const highestInterestDebt = F.getHighestInterestDebt(debts);

    const liquidAssets = F.calculateLiquidAssets(assets);
    // Fall back to fixed expenses as a rough proxy for "essential monthly
    // expenses" when no categories have been tagged essential yet.
    const essentialMonthlyExpenses = split.essential > 0 ? split.essential : cashflow.fixedExpenses;
    const emergencyFundMonths = F.calculateEmergencyFundMonths(liquidAssets, essentialMonthlyExpenses);

    const netWorth = F.calculateNetWorth(assets, investments, debts, exchangeRates, profile.baseCurrency);

    const assumedInvestmentReturn = profile.assumedInvestmentReturn || 0.08;

    const investmentReadiness = F.assessInvestmentReadiness({
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      highestDebtInterestRate: highestInterestDebt ? highestInterestDebt.interestRate : null,
      assumedInvestmentReturn,
      availableSurplus: cashflow.availableSurplus,
    });

    const healthScore = F.calculateFinancialHealthScore({
      income: cashflow.income,
      availableSurplus: cashflow.availableSurplus,
      savingsRate: cashflow.savingsRate,
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      debtToIncomeRatio,
      netWorthHistory,
    });

    let discretionarySpendChangePct = null;
    if (prevSplit.discretionary > 0) {
      discretionarySpendChangePct = (split.discretionary - prevSplit.discretionary) / prevSplit.discretionary;
    }

    const annualMonths = Array.from({ length: 12 }, (_, index) => `${selectedYear}-${String(index + 1).padStart(2, '0')}`);
    const recordedAnnualMonths = annualMonths.filter((monthId) => allBudgetLines.some((line) => line.month === monthId));
    const annualRows = recordedAnnualMonths.map((monthId) => {
      const monthLines = allBudgetLines.filter((line) => line.month === monthId && line.type !== 'income' && line.type !== 'fixed');
      const monthIncome = incomeSources
        .filter((source) => Number(source.year || selectedYear) === selectedYear && isActiveForMonth(source, monthId))
        .map((source) => ({ type: 'income', actualAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly') }));
      const monthFixed = fixedExpenses
        .filter((expense) => isActiveForMonth(expense, monthId))
        .map((expense) => ({ type: 'fixed', actualAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly') }));
      const fullLines = monthLines.concat(monthIncome).concat(monthFixed);
      const monthCashflow = F.calculateCashFlowSummary(fullLines, minimumDebtPayments);
      return { month: monthId, cashflow: monthCashflow };
    });

    const annualSummary = annualRows.reduce((summary, row) => {
      summary.totalIncome += row.cashflow.income;
      summary.totalFixedExpenses += row.cashflow.fixedExpenses;
      summary.totalVariableExpenses += row.cashflow.variableExpenses;
      summary.totalExpenses += row.cashflow.totalExpenses;
      summary.totalSaved += row.cashflow.savings;
      summary.totalDebtPaid += row.cashflow.debtPayments;
      summary.availableSurplus += row.cashflow.availableSurplus;
      return summary;
    }, {
      totalIncome: 0,
      totalSaved: 0,
      totalInvested: 0,
      totalFixedExpenses: 0,
      totalVariableExpenses: 0,
      totalExpenses: 0,
      totalDebtPaid: 0,
      availableSurplus: 0,
    });
    annualSummary.totalInvested = annualSummary.totalSaved;

    const emergencyFundBalance = emergencyFundContributions.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    const dayToDayAccount = dayToDayAccounts.find((item) => Number(item.year) === selectedYear) || null;
    const dayToDaySummary = calculateDayToDaySummary(dayToDayAccount, dayToDayTransactions, selectedYear);

    const snapshot = {
      month,
      monthLabel: `${monthName(selectedMonthNumber)} ${selectedYear}`,
      selectedYear,
      profile,
      cashflow,
      income: cashflow.income,
      availableSurplus: cashflow.availableSurplus,
      savingsRate: cashflow.savingsRate,
      essentialVsDiscretionary: split,
      discretionarySpendChangePct,
      totalDebt,
      debtToIncomeRatio,
      highestInterestDebt,
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      netWorth,
      assumedInvestmentReturn,
      investmentReadiness,
      healthScore,
      annualSummary,
      annualMonths: annualRows,
      emergencyFundBalance,
      emergencyFundContributions,
      incomeSources,
      fixedExpenses,
      dayToDaySummary,
      dayToDayAccount,
      dayToDayTransactions,
      debts,
      assets,
      investments,
      allBudgetLines,
      expenseCategories,
      netWorthHistory,
      budgetLines,
    };

    snapshot.recommendations = WR.recommendations.generateRecommendations(snapshot);
    return snapshot;
  }

  WR.ui.monthName = monthName;

    return displayName ? `${timeGreeting}, ${displayName}` : timeGreeting;
  }

  /**
   * Briefly flashes an element to confirm an inline edit actually saved \u2014
   * cell edits save silently otherwise, with no visual confirmation.
   * @param {HTMLElement} element
   */
  function flashSaved(element) {
    if (!element) return;
    element.classList.add('just-saved');
    setTimeout(() => element.classList.remove('just-saved'), 700);
  }

  function notify(message, tone) {
    const stack = document.getElementById('toast-stack');
    if (!stack) return;
    const toast = document.createElement('div');
    toast.className = `toast ${tone || ''}`.trim();
    toast.textContent = message;
    stack.appendChild(toast);
    setTimeout(() => {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 2800);
  }

  function notifyUndo(message, onUndo, options) {
    const stack = document.getElementById('toast-stack');
    if (!stack) return;
    const opts = options || {};
    const timeoutMs = Number(opts.timeoutMs) || 5000;

    const toast = document.createElement('div');
    toast.className = 'toast row';

    const text = document.createElement('span');
    text.textContent = message;

    const button = document.createElement('button');
    button.className = 'toast-action';
    button.type = 'button';
    button.textContent = opts.undoLabel || 'Undo';

    toast.appendChild(text);
    toast.appendChild(button);
    stack.appendChild(toast);

    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    };

    const timer = setTimeout(close, timeoutMs);
    button.addEventListener('click', async () => {
      clearTimeout(timer);
      close();
      try {
        await onUndo();
        notify(opts.undoSuccessMessage || 'Restored.', 'success');
      } catch (err) {
        notify(`Undo failed: ${err.message}`, 'error');
      }
    });
  }

  async function removeWithUndo(options) {
    const existing = await options.repo.getById(options.id);
    if (!existing) return;

    await options.repo.remove(options.id);
    if (options.afterChange) await options.afterChange();

    notifyUndo(`${options.entityLabel || 'Item'} deleted.`, async () => {
      await options.repo.add(existing);
      if (options.afterChange) await options.afterChange();
    }, {
      undoLabel: 'Undo',
      undoSuccessMessage: `${options.entityLabel || 'Item'} restored.`,
      timeoutMs: options.timeoutMs || 5000,
    });
  }

    const [lines, debts] = await Promise.all([
      WR.repos.budgetLines.getAll(),

    const warnings = [];
    const badMonthCount = lines.filter((line) => !line.month || !/^\d{4}-\d{2}$/.test(String(line.month))).length;
    if (badMonthCount > 0) warnings.push(`${badMonthCount} budget rows have invalid month values.`);
    const invalidAmounts = lines.filter((line) => Number(line.budgetAmount) < 0 || Number(line.actualAmount) < 0).length;
    if (invalidAmounts > 0) warnings.push(`${invalidAmounts} budget rows have negative amounts.`);
    const badDebtBalances = debts.filter((debt) => Number(debt.currentBalance) < 0 || Number.isNaN(Number(debt.currentBalance))).length;
    if (badDebtBalances > 0) warnings.push(`${badDebtBalances} debts have invalid balances.`);
    return warnings;
