<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WealthRoute</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
/* WealthRoute design tokens. A "private ledger" feel: warm paper or deep
   ink backdrop, a literary serif for the numbers that matter, deep emerald
   as the one accent that does real work, gold reserved for medium-priority
   signal so it doesn't compete with the primary accent. */

:root {
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  --bg: #f6f4ee;
  --panel: #ffffff;
  --panel-alt: #fbfaf5;
  --text: #171a19;
  --muted: #5b6560;
  --border: #e3e0d3;
  --accent: #0e6b57;
  --accent-contrast: #ffffff;
  --gold: #a9781f;
  --danger: #a6332b;
  --success: #2e7d4f;
  --shadow: 0 1px 2px rgba(23, 26, 25, 0.04);

  --chart-1: #0e6b57;
  --chart-2: #a9781f;
  --chart-3: #5b6560;
  --chart-4: #7c9c93;
  --chart-5: #c4a468;
}

:root[data-theme="dark"] {
  --bg: #101615;
  --panel: #171f1d;
  --panel-alt: #1c2422;
  --text: #e8ece9;
  --muted: #93a19a;
  --border: #283330;
  --accent: #34b493;
  --accent-contrast: #06120e;
  --gold: #dcab52;
  --danger: #e2685f;
  --success: #59c48a;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);

  --chart-1: #34b493;
  --chart-2: #dcab52;
  --chart-3: #93a19a;
  --chart-4: #6c9186;
  --chart-5: #c9ac72;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  transition: background-color 0.15s ease, color 0.15s ease;
}

/* ---------- Top bar ---------- */

.topbar {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 0.85rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 2rem;
  flex-wrap: wrap;
}
.brand {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  letter-spacing: 0.01em;
}
.brand-mark { flex-shrink: 0; }
.brand-mark path { stroke: var(--accent); }
.brand-mark circle { fill: var(--accent); }

#nav { display: flex; gap: 1.25rem; flex-wrap: wrap; flex: 1; }
#nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.88rem;
  padding: 0.3rem 0;
  border-bottom: 2px solid transparent;
}
#nav a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
#nav a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.theme-toggle {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text);
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--accent); }

#content { max-width: 960px; margin: 0 auto; padding: 1.75rem 1.5rem 3rem; }

/* ---------- Type scale ---------- */

h1 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 500; margin: 0 0 0.25rem; }
h2 { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 500; margin: 1.75rem 0 0.6rem; }
h3 { font-size: 0.95rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
.month-label { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.9rem; }

/* ---------- Dashboard hero ---------- */

.hero { margin-bottom: 0.5rem; }
.greeting { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.2rem; }
.hero-headline {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.75rem 2rem;
  box-shadow: var(--shadow);
  margin: 1rem 0 1.25rem;
}
.hero-headline .stat-label { font-size: 0.85rem; }
.hero-headline .hero-value {
  display: block;
  font-family: var(--font-serif);
  font-size: 2.75rem;
  line-height: 1.15;
  margin-top: 0.15rem;
}
.hero-headline .hero-value.negative { color: var(--danger); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.65rem; margin: 1rem 0; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 0.9rem; }
.stat-label { display: block; font-size: 0.78rem; color: var(--muted); }
.stat-value { display: block; font-family: var(--font-serif); font-size: 1.3rem; margin-top: 0.2rem; }
.stat-value.negative { color: var(--danger); }

/* ---------- Health score ---------- */

.health-score {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.1rem 1.25rem;
  margin: 1.25rem 0;
}
.health-score h2 { margin-top: 0; }
.score-breakdown { display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: 0.83rem; color: var(--muted); margin: 0.5rem 0; }
.fine-print { font-size: 0.8rem; color: var(--muted); }

/* ---------- Recommendations ---------- */

.recommendations { margin: 1.5rem 0; }
.rec-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--muted);
  border-radius: 8px;
  padding: 0.95rem 1.1rem;
  margin-bottom: 0.7rem;
}
.rec-card.p-high { border-left-color: var(--danger); border-left-width: 4px; }
.rec-card.p-medium { border-left-color: var(--gold); }
.rec-card.p-low { border-left-color: var(--success); }
.rec-head { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.45rem; }
.rec-index { color: var(--muted); font-family: var(--font-serif); }
.rec-title { font-weight: 600; flex: 1; }
.badge {
  font-size: 0.72rem;
  padding: 0.1rem 0.55rem;
  border-radius: 999px;
  border: 1px solid currentColor;
  font-weight: 600;
}
.badge.p-high { color: var(--danger); }
.badge.p-medium { color: var(--gold); }
.badge.p-low { color: var(--success); }
.rec-card p { margin: 0.3rem 0; font-size: 0.9rem; color: var(--text); }
.rec-card p strong { color: var(--muted); font-weight: 600; }

/* ---------- Charts ---------- */

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
.chart-block { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; box-shadow: var(--shadow); }
.chart-block svg { max-width: 100%; height: auto; }
.chart-block svg text { fill: var(--muted); font-family: var(--font-sans); }

/* ---------- Tables ---------- */

.data-table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 0.75rem 0; }
.data-table th, .data-table td { padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.88rem; }
.data-table th { background: var(--panel-alt); font-weight: 600; color: var(--muted); font-size: 0.8rem; }
.data-table th.sortable { cursor: pointer; user-select: none; }
.data-table th.sortable:hover { color: var(--accent); }
.data-table tr:last-child td { border-bottom: none; }
.data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table .empty { color: var(--muted); text-align: center; padding: 1.25rem; }
.data-table td input.cell, .data-table td select.cell { width: 100%; border: 1px solid transparent; background: transparent; color: var(--text); font-size: 0.85rem; padding: 0.2rem; font-family: var(--font-sans); transition: background-color 0.5s ease; }
.data-table td input.cell:focus, .data-table td select.cell:focus { border-color: var(--accent); background: var(--panel-alt); }
.data-table td input.cell.just-saved, .data-table td select.cell.just-saved { background: color-mix(in srgb, var(--success) 22%, transparent); }
.invalid-row { background: color-mix(in srgb, var(--danger) 10%, var(--panel)); }

/* ---------- Forms ---------- */

.inline-form, .stacked-form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.75rem 0; }
.stacked-form { flex-direction: column; align-items: flex-start; }
.inline-form input, .inline-form select, .stacked-form input, .stacked-form select, textarea {
  padding: 0.42rem 0.55rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.88rem;
  background: var(--panel);
  color: var(--text);
  font-family: var(--font-sans);
}
button {
  padding: 0.48rem 0.95rem;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: var(--accent-contrast);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
}
button:hover { filter: brightness(1.08); }
button.secondary { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); }
button.danger { background: var(--danger); color: #fff; }
.link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.85rem; padding: 0; font-weight: 500; }
.link-btn:hover { text-decoration: underline; }

.toolbar { display: flex; gap: 1rem; align-items: center; margin: 0.75rem 0; flex-wrap: wrap; }
.mapping-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.5rem; margin: 0.75rem 0; }
.file-label { display: inline-block; }

.warning { color: var(--danger); }
.loading { color: var(--muted); }
.assistant-answer { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; line-height: 1.55; box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) {
  body, button { transition: none; }
}

@media (max-width: 640px) {
  #nav { gap: 0.6rem; }
  #content { padding: 1.1rem; }
  .hero-headline .hero-value { font-size: 2.1rem; }
}

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
// IndexedDB schema, opened with the native browser API directly — no
// external library, no bundler needed to resolve an import for one.

window.WR = window.WR || {};

(function () {
  const DB_NAME = 'wealthroute';
  const DB_VERSION = 1;

  /** @type {Promise<IDBDatabase>|null} */
  let dbPromise = null;

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = (event) => {
        const db = /** @type {IDBDatabase} */ (event.target.result);

        db.createObjectStore('userProfile', { keyPath: 'id' });
        db.createObjectStore('incomeSources', { keyPath: 'id' });
        db.createObjectStore('expenseCategories', { keyPath: 'id' });

        const budgetLines = db.createObjectStore('budgetLines', { keyPath: 'id' });
        budgetLines.createIndex('by-month', 'month');

        db.createObjectStore('debts', { keyPath: 'id' });

        const debtPayments = db.createObjectStore('debtPayments', { keyPath: 'id' });
        debtPayments.createIndex('by-debt', 'debtId');

        db.createObjectStore('assets', { keyPath: 'id' });
        db.createObjectStore('investments', { keyPath: 'id' });

        const netWorthSnapshots = db.createObjectStore('netWorthSnapshots', { keyPath: 'id' });
        netWorthSnapshots.createIndex('by-date', 'date');

        db.createObjectStore('exchangeRates', { keyPath: 'id' });
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  /** @returns {Promise<IDBDatabase>} */
  function getDB() {
    if (!dbPromise) {
      dbPromise = openDatabase();
    }
    return dbPromise;
  }

  /** Test-only: drop the cached connection so a fresh open() happens next time. */
  function resetConnection() {
    dbPromise = null;
  }

  /** Test-only: fully delete the database so each test run starts clean. */
  function deleteDatabase() {
    dbPromise = null;
    return new Promise((resolve, reject) => {
      const req = indexedDB.deleteDatabase(DB_NAME);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
      req.onblocked = () => resolve();
    });
  }

  WR.db = { getDB, resetConnection, deleteDatabase, DB_NAME };
})();
// Generic CRUD repository over a single IndexedDB object store. Every entity
// in the data model gets one of these via WR.createRepository(storeName).
// Index-backed queries (e.g. "budget lines for a given month") live in
// repositories.js instead, since they're store-specific.

window.WR = window.WR || {};

(function () {
  /**
   * @param {IDBRequest} request
   * @returns {Promise<any>}
   */
  function requestToPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  /**
   * @param {string} storeName
   */
  function createRepository(storeName) {
    return {
      async getAll() {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readonly');
        return requestToPromise(tx.objectStore(storeName).getAll());
      },
      /** @param {string} id */
      async getById(id) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readonly');
        return requestToPromise(tx.objectStore(storeName).get(id));
      },
      /** @param {{id: string}} item */
      async add(item) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).put(item));
        return item.id;
      },
      /** @param {{id: string}} item */
      async update(item) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).put(item));
        return item.id;
      },
      /** @param {string} id */
      async remove(id) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).delete(id));
      },
      async clear() {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).clear());
      },
    };
  }

  WR.createRepository = createRepository;
})();
// One repository per entity, plus the index-backed queries the generic
// repository can't express on its own.

window.WR = window.WR || {};

(function () {
  /** @param {IDBRequest} request */
  function requestToPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  WR.repos = {
    userProfile: WR.createRepository('userProfile'),
    incomeSources: WR.createRepository('incomeSources'),
    expenseCategories: WR.createRepository('expenseCategories'),
    budgetLines: WR.createRepository('budgetLines'),
    debts: WR.createRepository('debts'),
    debtPayments: WR.createRepository('debtPayments'),
    assets: WR.createRepository('assets'),
    investments: WR.createRepository('investments'),
    netWorthSnapshots: WR.createRepository('netWorthSnapshots'),
    exchangeRates: WR.createRepository('exchangeRates'),
  };

  WR.queries = {
    /** All budget lines (income/fixed/variable/savings/debt) for a 'YYYY-MM' month. */
    async getBudgetLinesByMonth(month) {
      const db = await WR.db.getDB();
      const tx = db.transaction('budgetLines', 'readonly');
      const index = tx.objectStore('budgetLines').index('by-month');
      return requestToPromise(index.getAll(month));
    },

    /** All recorded payments made against a specific debt, across all months. */
    async getDebtPaymentsForDebt(debtId) {
      const db = await WR.db.getDB();
      const tx = db.transaction('debtPayments', 'readonly');
      const index = tx.objectStore('debtPayments').index('by-debt');
      return requestToPromise(index.getAll(debtId));
    },

    /** Full net worth history, oldest first — powers the net worth trend chart. */
    async getNetWorthHistory() {
      const db = await WR.db.getDB();
      const tx = db.transaction('netWorthSnapshots', 'readonly');
      const index = tx.objectStore('netWorthSnapshots').index('by-date');
      return requestToPromise(index.getAll());
    },
  };
})();
// Core WealthRoute data model.
//
// No TypeScript here (per your call to drop the build step), but the JSDoc
// typedefs below still give autocomplete + inline type hints in VS Code and
// most editors, with zero compilation. Factory functions generate a new id
// so call sites never construct records by hand.
//
// Derived from Budget & Goal Tracker 2026.xlsx (Sprint 0 analysis), plus two
// additions the workbook doesn't have: NetWorthSnapshot (a time series, so
// trends/forecasting are possible) and ExchangeRate (fixes the workbook's
// unconverted-USD-assets gap). The workbook's "Goal Tracker" and "Habit
// Tracker" sheets are intentionally not modelled here.

window.WR = window.WR || {};

(function () {
  /** @returns {string} */
  function newId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    // Fallback for contexts where crypto.randomUUID isn't available
    // (some restricted file:// setups) — still unique enough for local use.
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  /**
   * @typedef {Object} UserProfile
   * @property {string} id
   * @property {string} [displayName] - purely cosmetic, shown in the Dashboard greeting
   * @property {string} baseCurrency - ISO 4217 code, e.g. 'ZAR'
   * @property {string} country
   * @property {number} emergencyFundTargetMonths
   * @property {'conservative'|'moderate'|'aggressive'} riskProfile
   */
  /** @param {Omit<UserProfile,'id'>} fields */
  function createUserProfile(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} IncomeSource
   * @property {string} id
   * @property {string} name
   * @property {number} amount
   * @property {string} currency
   * @property {'once'|'weekly'|'biweekly'|'monthly'|'annual'} frequency
   * @property {string} category
   * @property {boolean} recurring
   */
  /** @param {Omit<IncomeSource,'id'>} fields */
  function createIncomeSource(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} ExpenseCategory
   * @property {string} id
   * @property {string} name
   * @property {'fixed'|'variable'} type
   * @property {boolean} essential
   */
  /** @param {Omit<ExpenseCategory,'id'>} fields */
  function createExpenseCategory(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * One line item for one month. Mirrors the workbook's Budget / Actual /
   * Difference rows, normalised across all months into one store instead of
   * duplicated across 12 near-identical sheets.
   * @typedef {Object} BudgetLine
   * @property {string} id
   * @property {string} month - 'YYYY-MM'
   * @property {'income'|'fixed'|'variable'|'savings'|'debtPayment'} type
   * @property {string} [categoryId]
   * @property {string} name
   * @property {number} budgetAmount
   * @property {number} actualAmount
   * @property {string} currency
   */
  /** @param {Omit<BudgetLine,'id'>} fields */
  function createBudgetLine(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} Debt
   * @property {string} id
   * @property {string} name
   * @property {string} [type]
   * @property {number} [originalBalance]
   * @property {number} currentBalance
   * @property {string} [currency] - ISO 4217 code; falls back to base currency if omitted
   * @property {number} interestRate - fraction, e.g. 0.2 = 20%
   * @property {number} minPayment
   * @property {string} [dueDate]
   * @property {number} [priority] - lower = higher priority; set by the debt engine later
   */
  /** @param {Omit<Debt,'id'>} fields */
  function createDebt(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} DebtPayment
   * @property {string} id
   * @property {string} debtId
   * @property {string} month - 'YYYY-MM'
   * @property {number} amount
   */
  /** @param {Omit<DebtPayment,'id'>} fields */
  function createDebtPayment(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} Asset
   * @property {string} id
   * @property {string} name
   * @property {string} type
   * @property {string} currency
   * @property {number} currentValue
   * @property {number} [purchasePrice]
   * @property {string} [purchaseDate]
   * @property {'high'|'medium'|'low'} [liquidity]
   * @property {string} [notes]
   */
  /** @param {Omit<Asset,'id'>} fields */
  function createAsset(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} Investment
   * @property {string} id
   * @property {string} name
   * @property {string} type
   * @property {string} currency
   * @property {number} currentValue
   * @property {number} totalContributions
   * @property {number} [expectedReturnAssumption] - fraction, e.g. 0.08
   * @property {'low'|'medium'|'high'} [riskCategory]
   * @property {number} [horizonYears]
   */
  /** @param {Omit<Investment,'id'>} fields */
  function createInvestment(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * A point-in-time record of assets vs liabilities. Doesn't exist anywhere in
   * the source workbook — it only ever stores "current" net worth, never a
   * history — so this is what makes trend charts and forecasting possible.
   * @typedef {Object} NetWorthSnapshot
   * @property {string} id
   * @property {string} date - ISO date
   * @property {number} totalAssets
   * @property {number} totalLiabilities
   * @property {number} netWorth
   * @property {string} currency
   */
  /** @param {Omit<NetWorthSnapshot,'id'>} fields */
  function createNetWorthSnapshot(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} ExchangeRate
   * @property {string} id
   * @property {string} fromCurrency
   * @property {string} toCurrency
   * @property {number} rate
   * @property {string} date
   */
  /** @param {Omit<ExchangeRate,'id'>} fields */
  function createExchangeRate(fields) {
    return { id: newId(), ...fields };
  }

  WR.models = {
    newId,
    createUserProfile,
    createIncomeSource,
    createExpenseCategory,
    createBudgetLine,
    createDebt,
    createDebtPayment,
    createAsset,
    createInvestment,
    createNetWorthSnapshot,
    createExchangeRate,
  };
})();
// Cash flow, savings rate, and expense-split calculations.
//
// Every function here is pure: plain data in, plain data/numbers out. No
// storage calls, no DOM, no side effects — this is what makes the engine
// independently testable and keeps financial math out of UI code, per the
// "deterministic engine" principle from the brief.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Sum actualAmount for budget lines of a given type.
   * Caller is expected to have already filtered to a single month (e.g. via
   * WR.queries.getBudgetLinesByMonth).
   * @param {Array} budgetLines
   * @param {'income'|'fixed'|'variable'|'savings'|'debtPayment'} type
   */
  function sumActualByType(budgetLines, type) {
    return budgetLines
      .filter((line) => line.type === type)
      .reduce((total, line) => total + line.actualAmount, 0);
  }

  /**
   * Sum budgetAmount (planned, not actual) for budget lines of a given type.
   * Useful for budget-vs-actual variance, same shape as the workbook's
   * Budget/Actual/Difference columns.
   */
  function sumBudgetByType(budgetLines, type) {
    return budgetLines
      .filter((line) => line.type === type)
      .reduce((total, line) => total + line.budgetAmount, 0);
  }

  /**
   * Builds the core monthly cash flow picture from one month's budget lines.
   * Mirrors the workbook's "Left to Spend" formula (income minus everything
   * actually spent), but exposes each component separately so the dashboard
   * and rules engine can reason about them individually rather than only
   * seeing one final number.
   *
   * @param {Array} budgetLines - budget lines for a single month
   * @returns {{
   *   income: number, fixedExpenses: number, variableExpenses: number,
   *   savings: number, debtPayments: number, totalExpenses: number,
   *   availableSurplus: number, savingsRate: number
   * }}
   */
  function calculateCashFlowSummary(budgetLines) {
    const income = sumActualByType(budgetLines, 'income');
    const fixedExpenses = sumActualByType(budgetLines, 'fixed');
    const variableExpenses = sumActualByType(budgetLines, 'variable');
    const savings = sumActualByType(budgetLines, 'savings');
    const debtPayments = sumActualByType(budgetLines, 'debtPayment');

    const totalExpenses = fixedExpenses + variableExpenses;
    const availableSurplus = income - fixedExpenses - variableExpenses - savings - debtPayments;
    const savingsRate = income > 0 ? savings / income : 0;

    return {
      income,
      fixedExpenses,
      variableExpenses,
      savings,
      debtPayments,
      totalExpenses,
      availableSurplus,
      savingsRate,
    };
  }

  /**
   * Splits fixed+variable expense budget lines into essential vs discretionary
   * totals, using each line's categoryId to look up ExpenseCategory.essential.
   * A line with no matching category (or no categoryId at all) is counted as
   * discretionary — safer to flag it for review than to silently assume it's
   * essential when nobody has categorised it yet.
   *
   * @param {Array} budgetLines
   * @param {Array} expenseCategories
   * @returns {{ essential: number, discretionary: number }}
   */
  function calculateEssentialVsDiscretionary(budgetLines, expenseCategories) {
    const categoryById = new Map(expenseCategories.map((c) => [c.id, c]));

    let essential = 0;
    let discretionary = 0;

    budgetLines
      .filter((line) => line.type === 'fixed' || line.type === 'variable')
      .forEach((line) => {
        const category = line.categoryId ? categoryById.get(line.categoryId) : undefined;
        if (category && category.essential) {
          essential += line.actualAmount;
        } else {
          discretionary += line.actualAmount;
        }
      });

    return { essential, discretionary };
  }

  Object.assign(WR.financial, {
    sumActualByType,
    sumBudgetByType,
    calculateCashFlowSummary,
    calculateEssentialVsDiscretionary,
  });
})();
// Debt totals and interest calculations. Pure functions — no storage calls,
// no UI. This is the foundation the avalanche/snowball prioritisation engine
// (a later sprint) builds on top of.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /** @param {Array} debts */
  function calculateTotalDebt(debts) {
    return debts.reduce((total, debt) => total + debt.currentBalance, 0);
  }

  /** @param {Array} debts */
  function calculateTotalMinPayments(debts) {
    return debts.reduce((total, debt) => total + debt.minPayment, 0);
  }

  /**
   * Debt-to-income ratio using minimum required payments against monthly
   * income. Returns 0 when income is 0 or negative, to avoid Infinity/NaN
   * leaking into the dashboard or health score.
   * @param {Array} debts
   * @param {number} monthlyIncome
   */
  function calculateDebtToIncomeRatio(debts, monthlyIncome) {
    if (monthlyIncome <= 0) return 0;
    return calculateTotalMinPayments(debts) / monthlyIncome;
  }

  /**
   * The debt currently costing the most in interest rate — this is what
   * avalanche prioritisation and the "what should I do now" panel key off.
   * Returns null if there are no debts, rather than throwing.
   * @param {Array} debts
   */
  function getHighestInterestDebt(debts) {
    if (debts.length === 0) return null;
    return debts.reduce((highest, debt) => (debt.interestRate > highest.interestRate ? debt : highest));
  }

  /**
   * Balance-weighted average interest rate across all debts — one number
   * summarising "how expensive is my debt overall", used by the debt-vs-invest
   * decision logic in a later sprint.
   * @param {Array} debts
   */
  function calculateWeightedAverageInterestRate(debts) {
    const totalBalance = calculateTotalDebt(debts);
    if (totalBalance <= 0) return 0;
    const weightedSum = debts.reduce((sum, debt) => sum + debt.interestRate * debt.currentBalance, 0);
    return weightedSum / totalBalance;
  }

  Object.assign(WR.financial, {
    calculateTotalDebt,
    calculateTotalMinPayments,
    calculateDebtToIncomeRatio,
    getHighestInterestDebt,
    calculateWeightedAverageInterestRate,
  });
})();
// Net worth: assets minus liabilities, converted to one base currency.
// The source workbook keeps a separate USD assets table that is summed but
// never actually folded into the net worth total — this fixes that by
// requiring every value to be converted to baseCurrency before summing.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Converts an amount from one currency to another using the most recent
   * matching ExchangeRate record. Returns the original amount unconverted
   * (with a warning flag) if no rate is found and the currencies differ —
   * silently assuming a 1:1 rate would misstate net worth, so callers get
   * an explicit signal instead.
   *
   * @param {number} amount
   * @param {string} fromCurrency
   * @param {string} toCurrency
   * @param {Array} exchangeRates
   * @returns {{ value: number, converted: boolean }}
   */
  function convertCurrency(amount, fromCurrency, toCurrency, exchangeRates) {
    if (fromCurrency === toCurrency) return { value: amount, converted: true };

    const candidates = exchangeRates.filter(
      (r) => r.fromCurrency === fromCurrency && r.toCurrency === toCurrency,
    );
    if (candidates.length > 0) {
      const latest = candidates.reduce((a, b) => (a.date > b.date ? a : b));
      return { value: amount * latest.rate, converted: true };
    }

    // Try the inverse rate if that's what's stored.
    const inverseCandidates = exchangeRates.filter(
      (r) => r.fromCurrency === toCurrency && r.toCurrency === fromCurrency,
    );
    if (inverseCandidates.length > 0) {
      const latest = inverseCandidates.reduce((a, b) => (a.date > b.date ? a : b));
      return { value: amount / latest.rate, converted: true };
    }

    return { value: amount, converted: false };
  }

  /**
   * Calculates total assets, total liabilities, and net worth in one base
   * currency. Items that couldn't be converted (no exchange rate on file)
   * are tracked separately in `unconvertedItems` rather than silently
   * folded in at face value.
   *
   * @param {Array} assets
   * @param {Array} investments
   * @param {Array} debts
   * @param {Array} exchangeRates
   * @param {string} baseCurrency
   */
  function calculateNetWorth(assets, investments, debts, exchangeRates, baseCurrency) {
    let totalAssets = 0;
    let totalLiabilities = 0;
    const unconvertedItems = [];

    assets.forEach((asset) => {
      const { value, converted } = convertCurrency(
        asset.currentValue,
        asset.currency,
        baseCurrency,
        exchangeRates,
      );
      totalAssets += value;
      if (!converted) unconvertedItems.push({ name: asset.name, currency: asset.currency });
    });

    investments.forEach((inv) => {
      const { value, converted } = convertCurrency(
        inv.currentValue,
        inv.currency,
        baseCurrency,
        exchangeRates,
      );
      totalAssets += value;
      if (!converted) unconvertedItems.push({ name: inv.name, currency: inv.currency });
    });

    debts.forEach((debt) => {
      // Older records created before debts carried a currency field fall
      // back to base currency, matching the original assumption \u2014 but any
      // debt with an explicit foreign currency is now converted correctly.
      const { value, converted } = convertCurrency(
        debt.currentBalance,
        debt.currency || baseCurrency,
        baseCurrency,
        exchangeRates,
      );
      totalLiabilities += value;
      if (!converted) unconvertedItems.push({ name: debt.name, currency: debt.currency });
    });

    return {
      totalAssets,
      totalLiabilities,
      netWorth: totalAssets - totalLiabilities,
      currency: baseCurrency,
      unconvertedItems,
    };
  }

  Object.assign(WR.financial, { convertCurrency, calculateNetWorth });
})();
// Emergency fund coverage: how many months of essential expenses the
// user's liquid assets would cover.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Sums the current value of assets flagged as high liquidity — the
   * practical definition of "emergency fund" money (cash, money market,
   * easily-accessed savings), as opposed to a house or a retirement annuity.
   * @param {Array} assets
   */
  function calculateLiquidAssets(assets) {
    return assets.filter((a) => a.liquidity === 'high').reduce((sum, a) => sum + a.currentValue, 0);
  }

  /**
   * How many months of essential expenses the liquid assets would cover.
   * Returns Infinity (not a crash) when essential expenses are 0 and there
   * are liquid assets — genuinely "fully covered" in that case, and 0 when
   * there's nothing liquid at all.
   * @param {number} liquidAssets
   * @param {number} monthlyEssentialExpenses
   */
  function calculateEmergencyFundMonths(liquidAssets, monthlyEssentialExpenses) {
    if (monthlyEssentialExpenses <= 0) return liquidAssets > 0 ? Infinity : 0;
    return liquidAssets / monthlyEssentialExpenses;
  }

  Object.assign(WR.financial, { calculateLiquidAssets, calculateEmergencyFundMonths });
})();
// Financial health score. Every point traces back to an explicit formula —
// per your brief, this must never become an opaque AI-generated number.
// Five equally-weighted components (20 points each): cash flow, emergency
// fund, debt burden, savings rate, net worth trend.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  /**
   * Scales a ratio linearly onto a 0-100 range between a floor (0 points)
   * and a target (100 points). Used so each component has one obvious,
   * inspectable formula rather than a hidden curve.
   */
  function scaleLinear(value, floor, target) {
    if (target === floor) return value >= target ? 100 : 0;
    const ratio = (value - floor) / (target - floor);
    return clamp(ratio, 0, 1) * 100;
  }

  function average(snapshots) {
    return snapshots.reduce((sum, s) => sum + s.netWorth, 0) / snapshots.length;
  }

  /**
   * Compares the average of the most recent snapshots against the average
   * of the snapshots before that, rather than just the last two points \u2014
   * a single noisy or one-off snapshot can no longer single-handedly flip
   * this component. With exactly 2 snapshots this reduces to the original
   * simple comparison; with more history the window grows to smooth things
   * out, capped at 3 either side. Defaults to a neutral 50 with fewer than
   * 2 snapshots (not enough history yet) or if there's no prior window to
   * compare against.
   * @param {Array} netWorthHistory - ordered oldest-to-newest
   */
  function calculateNetWorthTrendScore(netWorthHistory) {
    if (!netWorthHistory || netWorthHistory.length < 2) return 50;
    const windowSize = Math.min(3, Math.floor(netWorthHistory.length / 2)) || 1;
    const recent = netWorthHistory.slice(-windowSize);
    const prior = netWorthHistory.slice(-windowSize * 2, -windowSize);
    if (prior.length === 0) return 50;

    const recentAvg = average(recent);
    const priorAvg = average(prior);
    if (recentAvg > priorAvg) return 100;
    if (recentAvg === priorAvg) return 50;
    return 0;
  }

  /**
   * @param {Object} inputs
   * @param {number} inputs.income - monthly income
   * @param {number} inputs.availableSurplus - monthly surplus (from calculateCashFlowSummary)
   * @param {number} inputs.savingsRate - fraction, e.g. 0.1 = 10% (from calculateCashFlowSummary)
   * @param {number} inputs.emergencyFundMonths
   * @param {number} inputs.emergencyFundTargetMonths - from UserProfile
   * @param {number} inputs.debtToIncomeRatio - fraction (from calculateDebtToIncomeRatio)
   * @param {Array} inputs.netWorthHistory - ordered oldest-to-newest, from getNetWorthHistory()
   * @returns {{ score: number, breakdown: Object }}
   */
  function calculateFinancialHealthScore(inputs) {
    const {
      income,
      availableSurplus,
      savingsRate,
      emergencyFundMonths,
      emergencyFundTargetMonths,
      debtToIncomeRatio,
      netWorthHistory,
    } = inputs;

    // Cash flow: surplus as a % of income. 0% -> 0 points, 20%+ -> 100 points.
    const surplusRatio = income > 0 ? availableSurplus / income : 0;
    const cashFlow = scaleLinear(surplusRatio, 0, 0.2);

    // Emergency fund: months covered vs the user's own target.
    const targetMonths = emergencyFundTargetMonths > 0 ? emergencyFundTargetMonths : 3;
    const emergencyFund = scaleLinear(
      Number.isFinite(emergencyFundMonths) ? emergencyFundMonths : targetMonths,
      0,
      targetMonths,
    );

    // Debt burden: lower debt-to-income is better. 0% -> 100 points, 40%+ -> 0 points.
    const debtBurden = 100 - scaleLinear(debtToIncomeRatio, 0, 0.4);

    // Savings rate: 0% -> 0 points, 20%+ -> 100 points.
    const savingsRateScore = scaleLinear(savingsRate, 0, 0.2);

    const netWorthTrend = calculateNetWorthTrendScore(netWorthHistory);

    const breakdown = { cashFlow, emergencyFund, debtBurden, savingsRate: savingsRateScore, netWorthTrend };
    const score = Math.round(
      (breakdown.cashFlow + breakdown.emergencyFund + breakdown.debtBurden + breakdown.savingsRate + breakdown.netWorthTrend) / 5,
    );

    return { score, breakdown };
  }

  Object.assign(WR.financial, { calculateFinancialHealthScore, calculateNetWorthTrendScore });
})();
// Debt prioritisation and payoff simulation. Avalanche/snowball/hybrid
// ordering, plus a month-by-month simulator that answers "how long until
// I'm debt-free" and "what happens if I pay an extra RX/month".

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  const MAX_MONTHS = 600; // 50-year safety cap, so a payment too small to ever
  // clear the balance can't loop forever — reachedSafetyCap flags this case.

  /** Highest interest rate first — minimises total interest paid. */
  function orderAvalanche(debts) {
    return [...debts].sort((a, b) => b.interestRate - a.interestRate);
  }

  /** Smallest balance first — maximises early "wins" for motivation. */
  function orderSnowball(debts) {
    return [...debts].sort((a, b) => a.currentBalance - b.currentBalance);
  }

  /**
   * Blends interest rate and balance so a merely-elevated rate on a huge
   * balance can still outrank a tiny balance at a very high rate. Weights
   * are parameters, not hidden constants, so the ordering stays inspectable.
   */
  function orderHybrid(debts, weights) {
    const w = weights || { interestWeight: 0.7, balanceWeight: 0.3 };
    if (debts.length === 0) return [];
    const maxRate = Math.max(...debts.map((d) => d.interestRate)) || 1;
    const maxBalance = Math.max(...debts.map((d) => d.currentBalance)) || 1;
    const scored = debts.map((d) => ({
      debt: d,
      score: w.interestWeight * (d.interestRate / maxRate) + w.balanceWeight * (1 - d.currentBalance / maxBalance),
    }));
    scored.sort((a, b) => b.score - a.score);
    return scored.map((s) => s.debt);
  }

  /**
   * Simulates paying off a set of debts month by month. Every open debt
   * always gets at least its minimum payment; all extra payment (plus any
   * minimums freed up as debts get fully paid off) goes to whichever debt
   * is first, still open, in `orderedDebts`.
   *
   * @param {Array} orderedDebts - pre-sorted by avalanche/snowball/hybrid
   * @param {number} extraMonthlyPayment - beyond the sum of all minimums
   * @returns {{
   *   months: number, totalInterestPaid: number,
   *   payoffOrder: Array<{name: string, monthsToPayoff: number|null}>,
   *   reachedSafetyCap: boolean
   * }}
   */
  function simulatePayoff(orderedDebts, extraMonthlyPayment) {
    const balances = orderedDebts.map((d) => ({
      name: d.name,
      balance: d.currentBalance,
      monthlyRate: d.interestRate / 12,
      minPayment: d.minPayment,
      paidOffMonth: null,
    }));

    let month = 0;
    let totalInterestPaid = 0;
    let extraPool = extraMonthlyPayment;

    while (balances.some((b) => b.balance > 0.01) && month < MAX_MONTHS) {
      month += 1;

      balances.forEach((b) => {
        if (b.balance > 0) {
          const interest = b.balance * b.monthlyRate;
          b.balance += interest;
          totalInterestPaid += interest;
        }
      });

      balances.forEach((b) => {
        if (b.balance > 0) {
          b.balance -= Math.min(b.minPayment, b.balance);
        }
      });

      let pool = extraPool;
      for (const b of balances) {
        if (b.balance > 0 && pool > 0) {
          const payment = Math.min(pool, b.balance);
          b.balance -= payment;
          pool -= payment;
        }
      }

      balances.forEach((b) => {
        if (b.balance <= 0.01 && b.paidOffMonth === null) {
          b.paidOffMonth = month;
          extraPool += b.minPayment; // rollover: freed-up minimum joins next month's extra pool
        }
      });
    }

    return {
      months: month,
      totalInterestPaid,
      payoffOrder: balances.map((b) => ({ name: b.name, monthsToPayoff: b.paidOffMonth })),
      reachedSafetyCap: month >= MAX_MONTHS,
    };
  }

  /**
   * Answers "what happens if I pay an extra RX/month" by comparing total
   * interest paid and total months with vs without the extra payment.
   */
  function calculateInterestSaved(orderedDebts, extraMonthlyPayment) {
    const withoutExtra = simulatePayoff(orderedDebts, 0);
    const withExtra = simulatePayoff(orderedDebts, extraMonthlyPayment);
    return {
      interestSaved: withoutExtra.totalInterestPaid - withExtra.totalInterestPaid,
      monthsSaved: withoutExtra.months - withExtra.months,
      withoutExtra,
      withExtra,
    };
  }

  Object.assign(WR.financial, {
    orderDebtsAvalanche: orderAvalanche,
    orderDebtsSnowball: orderSnowball,
    orderDebtsHybrid: orderHybrid,
    simulateDebtPayoff: simulatePayoff,
    calculateInterestSaved,
  });
})();
// Investment readiness. Deliberately answers "am I ready to invest?" before
// anything about what to invest in — matching the brief's explicit decision
// order (debt and emergency fund come first when they're the better use of
// money). Every outcome carries its reasons; never a bare verdict.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * @param {Object} inputs
   * @param {number} inputs.emergencyFundMonths
   * @param {number} inputs.emergencyFundTargetMonths
   * @param {number|null} inputs.highestDebtInterestRate - fraction, or null if debt-free
   * @param {number} inputs.assumedInvestmentReturn - fraction, e.g. 0.08 (configurable assumption, never guaranteed)
   * @param {number} inputs.availableSurplus - monthly
   * @returns {{ readiness: string, reasons: string[] }}
   */
  function assessInvestmentReadiness(inputs) {
    const {
      emergencyFundMonths,
      emergencyFundTargetMonths,
      highestDebtInterestRate,
      assumedInvestmentReturn,
      availableSurplus,
    } = inputs;

    const target = emergencyFundTargetMonths > 0 ? emergencyFundTargetMonths : 3;

    if (emergencyFundMonths < target * 0.5) {
      return {
        readiness: 'build_emergency_fund',
        reasons: [
          `Your emergency fund covers ${emergencyFundMonths.toFixed(1)} months of essential expenses, ` +
            `less than half of your ${target}-month target.`,
          'An emergency fund below this level means an unexpected expense would likely force you into new debt — building this up protects any investment gains you make later.',
        ],
      };
    }

    if (highestDebtInterestRate !== null && highestDebtInterestRate > assumedInvestmentReturn) {
      return {
        readiness: 'focus_on_debt',
        reasons: [
          `Your highest-interest debt costs ${(highestDebtInterestRate * 100).toFixed(1)}% a year, ` +
            `more than the ${(assumedInvestmentReturn * 100).toFixed(1)}% assumed investment return.`,
          'Paying this down is a guaranteed return equal to its interest rate — investing instead only makes sense once your most expensive debt costs less than you expect to earn.',
        ],
      };
    }

    if (emergencyFundMonths < target) {
      return {
        readiness: 'start_investing_conservatively',
        reasons: [
          `Your emergency fund covers ${emergencyFundMonths.toFixed(1)} of your ${target}-month target — ` +
            'past the halfway point, but not fully there yet.',
          'Debt is not more expensive than your assumed return, so starting conservatively while still finishing the emergency fund is reasonable.',
        ],
      };
    }

    if (availableSurplus <= 0) {
      return {
        readiness: 'review_cash_flow',
        reasons: [
          'There is no monthly surplus currently available to invest.',
          'Review spending before committing to new investment contributions — investing money you don\u2019t actually have available each month isn\u2019t sustainable.',
        ],
      };
    }

    return {
      readiness: 'ready_to_invest',
      reasons: [
        `Your emergency fund meets your ${target}-month target and your debt is not more expensive than your assumed investment return.`,
        `You have a monthly surplus of ${availableSurplus.toFixed(2)} available to allocate toward long-term investing.`,
      ],
    };
  }

  Object.assign(WR.financial, { assessInvestmentReadiness });
})();
// Multi-year forecasting. Every number here is a projection built from
// assumptions the caller supplies (growth rates, contribution amounts) —
// never presented as guaranteed, per the brief's safety principle. The UI
// layer is responsible for labelling this clearly as "projected", not "will".

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Projects net worth forward month by month, then returns one snapshot
   * per year. Debt accrues interest and is paid down by a fixed monthly
   * payment (floored at 0, doesn't go negative); investments grow by an
   * assumed annual return and receive a fixed monthly contribution.
   * Everything else that makes up net worth today (property, vehicles, etc.)
   * is held constant — this engine doesn't project asset appreciation for
   * anything except tagged investments, on purpose, since guessing at house
   * price growth is exactly the kind of unfounded certainty the brief warns
   * against.
   *
   * @param {Object} params
   * @param {number} params.currentNetWorth
   * @param {number} params.currentDebtTotal
   * @param {number} params.currentInvestmentTotal
   * @param {number} params.monthlyDebtPayment
   * @param {number} params.monthlyInvestmentContribution
   * @param {number} params.debtInterestAnnual - weighted average, fraction
   * @param {number} params.investmentReturnAnnual - assumed, fraction, never guaranteed
   * @param {number} years
   * @returns {Array<{ year: number, netWorth: number, debtBalance: number, investmentBalance: number }>}
   */
  function forecastNetWorth(params, years) {
    const {
      currentNetWorth,
      currentDebtTotal,
      currentInvestmentTotal,
      monthlyDebtPayment,
      monthlyInvestmentContribution,
      debtInterestAnnual,
      investmentReturnAnnual,
    } = params;

    // Everything else that makes up net worth today, held constant.
    const otherAssetsBaseline = currentNetWorth - currentInvestmentTotal + currentDebtTotal;

    let debtBalance = currentDebtTotal;
    let investmentBalance = currentInvestmentTotal;
    const monthlyDebtRate = debtInterestAnnual / 12;
    const monthlyInvestmentRate = investmentReturnAnnual / 12;

    const snapshots = [];
    const totalMonths = years * 12;

    for (let month = 1; month <= totalMonths; month += 1) {
      if (debtBalance > 0) {
        debtBalance += debtBalance * monthlyDebtRate;
        debtBalance = Math.max(0, debtBalance - monthlyDebtPayment);
      }
      investmentBalance = investmentBalance * (1 + monthlyInvestmentRate) + monthlyInvestmentContribution;

      if (month % 12 === 0) {
        snapshots.push({
          year: month / 12,
          netWorth: otherAssetsBaseline + investmentBalance - debtBalance,
          debtBalance,
          investmentBalance,
        });
      }
    }

    return snapshots;
  }

  Object.assign(WR.financial, { forecastNetWorth });
})();
// Pure aggregation functions powering the Reports view: totals grouped by
// month across the whole budget-line history, and spending grouped by
// expense category. No storage calls, no DOM \u2014 same "engine calculates,
// UI displays" separation as the rest of the financial engine.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Groups every budget line by month and sums each type, producing one
   * row per month the user has ever entered data for, sorted chronologically.
   * @param {Array} allBudgetLines
   * @returns {Array<{month:string, income:number, fixed:number, variable:number, savings:number, debtPayments:number}>}
   */
  function aggregateMonthlyTotals(allBudgetLines) {
    const byMonth = {};
    allBudgetLines.forEach((line) => {
      if (!byMonth[line.month]) {
        byMonth[line.month] = { month: line.month, income: 0, fixed: 0, variable: 0, savings: 0, debtPayments: 0 };
      }
      const bucket = byMonth[line.month];
      if (line.type === 'income') bucket.income += line.actualAmount;
      else if (line.type === 'fixed') bucket.fixed += line.actualAmount;
      else if (line.type === 'variable') bucket.variable += line.actualAmount;
      else if (line.type === 'savings') bucket.savings += line.actualAmount;
      else if (line.type === 'debtPayment') bucket.debtPayments += line.actualAmount;
    });
    return Object.values(byMonth).sort((a, b) => (a.month < b.month ? -1 : 1));
  }

  /**
   * Sums fixed+variable spending by expense category name for whichever
   * budget lines are passed in (caller filters to a month or range first).
   * Uncategorised spending is grouped under "Uncategorised" rather than
   * dropped, so the total always reconciles with actual spending.
   * @param {Array} budgetLines
   * @param {Array} expenseCategories
   * @returns {Array<{label:string, value:number}>} sorted highest spend first
   */
  function aggregateSpendingByCategory(budgetLines, expenseCategories) {
    const categoryById = new Map(expenseCategories.map((c) => [c.id, c]));
    const totals = {};
    budgetLines
      .filter((l) => l.type === 'fixed' || l.type === 'variable')
      .forEach((l) => {
        const category = l.categoryId ? categoryById.get(l.categoryId) : null;
        const label = category ? category.name : 'Uncategorised';
        totals[label] = (totals[label] || 0) + l.actualAmount;
      });
    return Object.entries(totals)
      .map(([label, value]) => ({ label, value }))
      .sort((a, b) => b.value - a.value);
  }

  Object.assign(WR.financial, { aggregateMonthlyTotals, aggregateSpendingByCategory });
})();
// Recommendation rules engine. Each rule is a plain object with a
// `condition` function and a `build` function that produces the
// recommendation text — rules are data, not scattered hardcoded advice
// buried in UI components, so they stay auditable and easy to change.
// This is the layer between the deterministic Financial Engine and the
// "What Should I Do Now?" panel; it never changes any stored financial
// data itself, only reads a snapshot and produces suggestions.

window.WR = window.WR || {};
WR.recommendations = WR.recommendations || {};

(function () {
  const PRIORITY_RANK = { high: 0, medium: 1, low: 2 };

  /**
   * @typedef {Object} FinancialSnapshot
   * @property {number} income
   * @property {number} availableSurplus
   * @property {number} savingsRate
   * @property {number} emergencyFundMonths
   * @property {number} emergencyFundTargetMonths
   * @property {number} debtToIncomeRatio
   * @property {Object|null} highestInterestDebt
   * @property {number} totalDebt
   * @property {number} assumedInvestmentReturn
   * @property {{essential: number, discretionary: number}} essentialVsDiscretionary
   * @property {number|null} discretionarySpendChangePct - fraction vs prior period, null if no history yet
   * @property {{readiness: string, reasons: string[]}} investmentReadiness
   */

  const RULES = [
    {
      id: 'negative-cashflow',
      priority: 'high',
      condition: (s) => s.availableSurplus < 0,
      build: (s) => ({
        title: 'Cash flow is negative this month',
        reason: `You spent ${Math.abs(s.availableSurplus).toFixed(2)} more than you earned this month.`,
        financialImpact: 'Continuing to spend beyond income means relying on debt or depleting savings to cover the gap.',
        suggestedAction: 'Review discretionary and variable expenses first \u2014 these are usually the fastest to adjust.',
        numbers: { availableSurplus: s.availableSurplus, income: s.income },
        assumptions: [],
      }),
    },
    {
      id: 'high-interest-debt',
      priority: 'high',
      condition: (s) => s.highestInterestDebt !== null && s.highestInterestDebt.interestRate > s.assumedInvestmentReturn,
      build: (s) => ({
        title: `Pay down ${s.highestInterestDebt.name}`,
        reason: `This debt costs ${(s.highestInterestDebt.interestRate * 100).toFixed(1)}% a year, more than your assumed ${(s.assumedInvestmentReturn * 100).toFixed(1)}% investment return.`,
        financialImpact: 'Extra payments here earn a guaranteed return equal to the interest rate \u2014 higher and more certain than investing while this debt remains.',
        suggestedAction: s.availableSurplus > 0
          ? `Consider directing some of your ${s.availableSurplus.toFixed(2)} monthly surplus toward this debt.`
          : 'Free up monthly surplus (see the cash flow recommendation) before adding extra debt payments.',
        numbers: { balance: s.highestInterestDebt.currentBalance, interestRate: s.highestInterestDebt.interestRate },
        assumptions: [`Assumed investment return: ${(s.assumedInvestmentReturn * 100).toFixed(1)}%/year \u2014 adjust this in Settings.`],
      }),
    },
    {
      id: 'emergency-fund-critical',
      priority: 'high',
      condition: (s) => s.emergencyFundMonths < s.emergencyFundTargetMonths * 0.5,
      build: (s) => ({
        title: 'Build your emergency fund',
        reason: `Your emergency fund covers ${s.emergencyFundMonths.toFixed(1)} months of essential expenses, under half of your ${s.emergencyFundTargetMonths}-month target.`,
        financialImpact: 'An unexpected expense at this level would likely have to be covered by new debt.',
        suggestedAction: 'Prioritise emergency savings over new investment contributions until you reach at least half your target.',
        numbers: { emergencyFundMonths: s.emergencyFundMonths, target: s.emergencyFundTargetMonths },
        assumptions: [],
      }),
    },
    {
      id: 'emergency-fund-building',
      priority: 'medium',
      condition: (s) =>
        s.emergencyFundMonths >= s.emergencyFundTargetMonths * 0.5 && s.emergencyFundMonths < s.emergencyFundTargetMonths,
      build: (s) => ({
        title: 'Keep building your emergency fund',
        reason: `You're at ${s.emergencyFundMonths.toFixed(1)} of your ${s.emergencyFundTargetMonths}-month target \u2014 past the halfway point.`,
        financialImpact: 'Closing this gap further reduces the chance a surprise expense forces you into debt.',
        suggestedAction: 'Continue current contributions, or increase them if the high-interest debt items above are resolved.',
        numbers: { emergencyFundMonths: s.emergencyFundMonths, target: s.emergencyFundTargetMonths },
        assumptions: [],
      }),
    },
    {
      id: 'discretionary-spend-increase',
      priority: 'medium',
      condition: (s) => s.discretionarySpendChangePct !== null && s.discretionarySpendChangePct > 0.15,
      build: (s) => ({
        title: 'Discretionary spending has increased',
        reason: `Discretionary spending is up ${(s.discretionarySpendChangePct * 100).toFixed(0)}% compared with your recent average.`,
        financialImpact: 'If this continues, it reduces the surplus available for debt, savings, or investing.',
        suggestedAction: 'Review recent discretionary transactions to see whether this reflects a one-off or an ongoing change.',
        numbers: { changePct: s.discretionarySpendChangePct, discretionary: s.essentialVsDiscretionary.discretionary },
        assumptions: [],
      }),
    },
    {
      id: 'investment-opportunity',
      priority: 'low',
      condition: (s) => s.investmentReadiness.readiness === 'ready_to_invest' && s.availableSurplus > 0,
      build: (s) => ({
        title: 'Consider increasing your investment contribution',
        reason: s.investmentReadiness.reasons.join(' '),
        financialImpact: `You have an unallocated monthly surplus of ${s.availableSurplus.toFixed(2)}.`,
        suggestedAction: 'Once debt and emergency fund priorities above are addressed, direct some of this surplus toward long-term investing.',
        numbers: { availableSurplus: s.availableSurplus },
        assumptions: ['Investment returns are never guaranteed \u2014 see the Investments section for your own return assumptions.'],
      }),
    },
  ];

  /**
   * Evaluates every rule against a FinancialSnapshot and returns the
   * matching recommendations, sorted high \u2192 medium \u2192 low priority.
   * @param {FinancialSnapshot} snapshot
   */
  function generateRecommendations(snapshot) {
    return RULES.filter((rule) => rule.condition(snapshot))
      .map((rule) => ({ id: rule.id, priority: rule.priority, ...rule.build(snapshot) }))
      .sort((a, b) => PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]);
  }

  WR.recommendations = { RULES, generateRecommendations };
})();
// Excel import/export, built on SheetJS (loaded via CDN in index.html as
// the global `XLSX`). Deliberately uses a generic column-mapping approach
// rather than hardcoded cell ranges tied to one exact workbook layout —
// hardcoded ranges break the moment a row shifts; column mapping survives
// minor structural differences and works with any spreadsheet, not just
// the exact source workbook this project started from.
//
// Workflow: parse workbook -> list sheets -> user picks a sheet + maps its
// columns to WealthRoute fields -> preview -> confirm -> import as
// BudgetLine records for the current month.

window.WR = window.WR || {};
WR.excel = WR.excel || {};

(function () {
  /**
   * Parses an uploaded file (ArrayBuffer) into a SheetJS workbook.
   * @param {ArrayBuffer} arrayBuffer
   */
  function parseWorkbook(arrayBuffer) {
    return XLSX.read(arrayBuffer, { type: 'array' });
  }

  /** @param {object} workbook */
  function getSheetNames(workbook) {
    return workbook.SheetNames;
  }

  /**
   * Reads one sheet as an array of row objects, plus the header list for
   * building a mapping UI. `headerRowIndex` (0-indexed) lets the caller
   * point at whichever row actually holds column headers \u2014 not every
   * spreadsheet has them in row 1 (this workbook's own month sheets, for
   * example, have several header rows partway down the sheet). Blank
   * header cells get a synthetic "Column X" label rather than being
   * silently dropped, so every column stays mappable.
   * @param {object} workbook
   * @param {string} sheetName
   * @param {number} [headerRowIndex] - 0-indexed row number, defaults to 0 (row 1)
   */
  function readSheetRows(workbook, sheetName, headerRowIndex) {
    const startRow = headerRowIndex || 0;
    const sheet = workbook.Sheets[sheetName];
    const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, range: startRow, defval: '' });

    const headerCells = aoa[0] || [];
    const headers = headerCells.map((h, i) =>
      h === '' || h === undefined || h === null ? `Column ${XLSX.utils.encode_col(i)}` : String(h),
    );

    const rows = aoa.slice(1)
      .filter((rowArr) => rowArr.some((cell) => cell !== '' && cell !== undefined)) // skip fully blank rows
      .map((rowArr) => {
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = rowArr[i] !== undefined ? rowArr[i] : '';
        });
        return obj;
      });

    return { headers, rows };
  }

  /**
   * Validates a single mapped row before import. Returns a list of problems
   * (empty = valid) rather than throwing, so the caller can show every issue
   * in the preview instead of stopping at the first bad row.
   * @param {Object} row - already mapped to { name, amount, type, month, categoryId }
   */
  function validateImportRow(row) {
    const problems = [];
    if (!row.name || String(row.name).trim() === '') problems.push('Missing name/description');
    if (row.amount === undefined || row.amount === '' || Number.isNaN(Number(row.amount))) {
      problems.push('Missing or invalid amount');
    }
    if (!['income', 'fixed', 'variable', 'savings', 'debtPayment'].includes(row.type)) {
      problems.push(`Invalid type "${row.type}"`);
    }
    if (!/^\d{4}-\d{2}$/.test(row.month || '')) problems.push('Month must be in YYYY-MM format');
    return problems;
  }

  /**
   * Parses a spreadsheet cell into a number, handling currency symbols,
   * thousands separators, and accounting-style negatives like "(500.00)"
   * (parentheses meaning negative, common in exported financial data).
   * @param {*} raw
   */
  function parseAmount(raw) {
    const str = String(raw ?? '').trim();
    const isParenNegative = /^\(.*\)$/.test(str);
    const cleaned = str.replace(/[^\d.-]/g, '');
    const value = parseFloat(cleaned);
    if (Number.isNaN(value)) return NaN;
    return isParenNegative ? -Math.abs(value) : value;
  }

  /**
   * Applies a column mapping to raw sheet rows, producing WealthRoute
   * BudgetLine-shaped records (not yet saved). `mapping` keys are
   * WealthRoute field names, values are the source column header to read
   * from each raw row. `constants` supplies fields not present as columns
   * (e.g. a fixed month or type for the whole import).
   *
   * @param {Array<Object>} rawRows
   * @param {{name?: string, amount?: string, type?: string, month?: string, currency?: string}} mapping
   * @param {{type?: string, month?: string, currency?: string}} constants
   */
  function applyMapping(rawRows, mapping, constants) {
    return rawRows.map((raw) => {
      const name = mapping.name ? raw[mapping.name] : undefined;
      const amountRaw = mapping.amount ? raw[mapping.amount] : undefined;
      const amount = typeof amountRaw === 'number' ? amountRaw : parseAmount(amountRaw);
      const type = constants.type || (mapping.type ? raw[mapping.type] : undefined);
      const month = constants.month || (mapping.month ? raw[mapping.month] : undefined);
      const currency = constants.currency || (mapping.currency ? raw[mapping.currency] : 'ZAR');

      return { name, amount, type, month, currency };
    });
  }

  /**
   * Imports validated rows as BudgetLine records via the repository layer.
   * Rows that fail validation are skipped and returned separately, rather
   * than silently importing bad data.
   * @param {Array<Object>} mappedRows
   */
  async function importBudgetLines(mappedRows) {
    const imported = [];
    const rejected = [];

    for (const row of mappedRows) {
      const problems = validateImportRow(row);
      if (problems.length > 0) {
        rejected.push({ row, problems });
        continue;
      }
      const line = WR.models.createBudgetLine({
        month: row.month,
        type: row.type,
        name: row.name,
        budgetAmount: Number(row.amount),
        actualAmount: Number(row.amount),
        currency: row.currency || 'ZAR',
      });
      await WR.repos.budgetLines.add(line);
      imported.push(line);
    }

    return { imported, rejected };
  }

  /**
   * Exports all current data as a multi-sheet workbook: one sheet per
   * entity. This intentionally does not attempt to reproduce the exact
   * 16-sheet source template (Annual Overview + 12 month sheets + Networth
   * + Goal/Habit trackers) — it exports WealthRoute's own normalised data
   * model instead, which is what round-trips cleanly.
   */
  async function exportWorkbook() {
    const [budgetLines, debts, assets, investments, netWorthSnapshots] = await Promise.all([
      WR.repos.budgetLines.getAll(),
      WR.repos.debts.getAll(),
      WR.repos.assets.getAll(),
      WR.repos.investments.getAll(),
      WR.repos.netWorthSnapshots.getAll(),
    ]);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(budgetLines), 'Budget Lines');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(debts), 'Debts');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assets), 'Assets');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(investments), 'Investments');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(netWorthSnapshots), 'Net Worth History');

    XLSX.writeFile(wb, `wealthroute-export-${new Date().toISOString().slice(0, 10)}.xlsx`);
  }

  WR.excel = {
    parseWorkbook,
    getSheetNames,
    readSheetRows,
    validateImportRow,
    parseAmount,
    applyMapping,
    importBudgetLines,
    exportWorkbook,
  };
})();
// Hand-rolled SVG charts. No charting library — the whole point of this
// project is staying dependency-light, and bar/line charts don't need one.

window.WR = window.WR || {};
WR.charts = WR.charts || {};

(function () {
  const PALETTE = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)', 'var(--chart-1)'];

  function escapeXml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
  }

  /**
   * @param {Array<{label: string, value: number}>} data
   * @param {{width?: number, height?: number, color?: string}} [options]
   */
  function barChart(data, options) {
    const opts = options || {};
    const width = opts.width || 480;
    const height = opts.height || 240;
    const padding = 32;
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;

    if (data.length === 0) {
      return `<svg width="${width}" height="${height}"><text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="#888">No data</text></svg>`;
    }

    const maxVal = Math.max(...data.map((d) => d.value), 0.01);
    const barWidth = chartW / data.length;

    const bars = data
      .map((d, i) => {
        const barH = (Math.max(d.value, 0) / maxVal) * chartH;
        const x = padding + i * barWidth + barWidth * 0.15;
        const y = padding + (chartH - barH);
        const w = barWidth * 0.7;
        const color = opts.color || PALETTE[i % PALETTE.length];
        return `
          <rect x="${x}" y="${y}" width="${w}" height="${barH}" fill="${color}" rx="2"></rect>
          <text x="${x + w / 2}" y="${height - padding + 14}" text-anchor="middle" font-size="10" fill="#444">${escapeXml(d.label)}</text>
          <text x="${x + w / 2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="#222">${d.value.toFixed(0)}</text>
        `;
      })
      .join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
  }

  /**
   * @param {Array<{label: string, value: number}>} data - ordered chronologically
   * @param {{width?: number, height?: number, color?: string}} [options]
   */
  function lineChart(data, options) {
    const opts = options || {};
    const width = opts.width || 480;
    const height = opts.height || 240;
    const padding = 32;
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;

    if (data.length === 0) {
      return `<svg width="${width}" height="${height}"><text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="#888">No data</text></svg>`;
    }

    const values = data.map((d) => d.value);
    const maxVal = Math.max(...values);
    const minVal = Math.min(...values, 0);
    const range = maxVal - minVal || 1;
    const stepX = data.length > 1 ? chartW / (data.length - 1) : 0;
    const color = opts.color || PALETTE[0];

    const points = data.map((d, i) => {
      const x = padding + i * stepX;
      const y = padding + chartH - ((d.value - minVal) / range) * chartH;
      return { x, y, label: d.label, value: d.value };
    });

    const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const dots = points
      .map(
        (p) =>
          `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"><title>${escapeXml(p.label)}: ${p.value.toFixed(2)}</title></circle>`,
      )
      .join('');
    const labels = points
      .map((p, i) => (i % Math.ceil(points.length / 8 || 1) === 0
        ? `<text x="${p.x.toFixed(1)}" y="${height - padding + 14}" text-anchor="middle" font-size="9" fill="#444">${escapeXml(p.label)}</text>`
        : ''))
      .join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2"></path>
      ${dots}
      ${labels}
    </svg>`;
  }

  WR.charts = { barChart, lineChart };
})();
// Theme management: defaults to the system preference, persists an
// explicit user choice in localStorage, applied via a data-theme attribute
// on <html> that the CSS custom properties key off.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const STORAGE_KEY = 'wr_theme';

  function getStoredTheme() {
    return localStorage.getItem(STORAGE_KEY);
  }

  function getSystemTheme() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    updateToggleIcon(theme);
  }

  function updateToggleIcon(theme) {
    const btn = document.getElementById('theme-toggle-btn');
    if (!btn) return;
    // Sun icon when in dark mode (click to go light), moon icon when in
    // light mode (click to go dark) \u2014 the icon shown is the destination.
    btn.innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
    btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }

  const SUN_ICON =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
  const MOON_ICON =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';

  function initTheme() {
    applyTheme(getStoredTheme() || getSystemTheme());
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || getSystemTheme();
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(STORAGE_KEY, next);
    applyTheme(next);
  }

  WR.ui.initTheme = initTheme;
  WR.ui.toggleTheme = toggleTheme;
  WR.ui.updateToggleIcon = updateToggleIcon;

  // Runs immediately at script load, not on DOMContentLoaded \u2014
  // document.documentElement already exists by the time this executes, and
  // setting the attribute this early avoids a flash of the wrong theme
  // before the rest of the page renders. The toggle button doesn't exist
  // yet at this point; updateToggleIcon() is called again once the shell
  // (with the button) is rendered.
  applyTheme(getStoredTheme() || getSystemTheme());
})();
// Builds the FinancialSnapshot consumed by the dashboard, the health score,
// and the recommendations engine. This is the one place raw stored records
// get turned into computed financial state — every other view reads from
// this rather than recomputing things its own way.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  function currentMonthKey(date) {
    const d = date || new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function previousMonthKey(monthKey) {
    const [y, m] = monthKey.split('-').map(Number);
    const d = new Date(y, m - 2, 1); // m is 1-indexed, so m-2 steps back one month
    return currentMonthKey(d);
  }

  async function getOrCreateProfile() {
    const profiles = await WR.repos.userProfile.getAll();
    if (profiles.length > 0) return profiles[0];
    const profile = WR.models.createUserProfile({
      baseCurrency: 'ZAR',
      country: 'South Africa',
      emergencyFundTargetMonths: 3,
      riskProfile: 'moderate',
    });
    await WR.repos.userProfile.add(profile);
    return profile;
  }

  /**
   * @param {string} [monthKey] - 'YYYY-MM', defaults to the current month
   */
  async function buildSnapshot(monthKey) {
    const month = monthKey || currentMonthKey();
    const prevMonth = previousMonthKey(month);

    const [budgetLines, prevBudgetLines, debts, assets, investments, exchangeRates, expenseCategories, netWorthHistory, profile] =
      await Promise.all([
        WR.queries.getBudgetLinesByMonth(month),
        WR.queries.getBudgetLinesByMonth(prevMonth),
        WR.repos.debts.getAll(),
        WR.repos.assets.getAll(),
        WR.repos.investments.getAll(),
        WR.repos.exchangeRates.getAll(),
        WR.repos.expenseCategories.getAll(),
        WR.queries.getNetWorthHistory(),
        getOrCreateProfile(),
      ]);

    const F = WR.financial;
    const cashflow = F.calculateCashFlowSummary(budgetLines);
    const split = F.calculateEssentialVsDiscretionary(budgetLines, expenseCategories);
    const prevSplit = F.calculateEssentialVsDiscretionary(prevBudgetLines, expenseCategories);

    const totalDebt = F.calculateTotalDebt(debts);
    const debtToIncomeRatio = F.calculateDebtToIncomeRatio(debts, cashflow.income);
    const highestInterestDebt = F.getHighestInterestDebt(debts);

    const liquidAssets = F.calculateLiquidAssets(assets);
    // Fall back to fixed expenses as a rough proxy for "essential monthly
    // expenses" when no categories have been tagged essential yet.
    const essentialMonthlyExpenses = split.essential > 0 ? split.essential : cashflow.fixedExpenses;
    const emergencyFundMonths = F.calculateEmergencyFundMonths(liquidAssets, essentialMonthlyExpenses);

    const netWorth = F.calculateNetWorth(assets, investments, debts, exchangeRates, profile.baseCurrency);

    const assumedInvestmentReturn = profile.assumedInvestmentReturn || 0.08;

    const investmentReadiness = F.assessInvestmentReadiness({
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      highestDebtInterestRate: highestInterestDebt ? highestInterestDebt.interestRate : null,
      assumedInvestmentReturn,
      availableSurplus: cashflow.availableSurplus,
    });

    const healthScore = F.calculateFinancialHealthScore({
      income: cashflow.income,
      availableSurplus: cashflow.availableSurplus,
      savingsRate: cashflow.savingsRate,
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      debtToIncomeRatio,
      netWorthHistory,
    });

    let discretionarySpendChangePct = null;
    if (prevSplit.discretionary > 0) {
      discretionarySpendChangePct = (split.discretionary - prevSplit.discretionary) / prevSplit.discretionary;
    }

    const snapshot = {
      month,
      profile,
      cashflow,
      income: cashflow.income,
      availableSurplus: cashflow.availableSurplus,
      savingsRate: cashflow.savingsRate,
      essentialVsDiscretionary: split,
      discretionarySpendChangePct,
      totalDebt,
      debtToIncomeRatio,
      highestInterestDebt,
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      netWorth,
      assumedInvestmentReturn,
      investmentReadiness,
      healthScore,
      debts,
      assets,
      investments,
      netWorthHistory,
      budgetLines,
    };

    snapshot.recommendations = WR.recommendations.generateRecommendations(snapshot);
    return snapshot;
  }

  WR.ui.currentMonthKey = currentMonthKey;
  WR.ui.previousMonthKey = previousMonthKey;
  WR.ui.getOrCreateProfile = getOrCreateProfile;
  WR.ui.buildSnapshot = buildSnapshot;
})();
