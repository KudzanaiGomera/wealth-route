      const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      date.setDate(Math.min(day, lastDay));
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    };
    return { start: dateFor(-1), endExclusive: dateFor(0) };
  }

  function currentBudgetMonth(date = new Date(), payday = 25) {
    const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
    const offset = date.getDate() >= Math.min(Number(payday) || 25, lastDay) ? 1 : 0;
    return currentMonthKey(new Date(date.getFullYear(), date.getMonth() + offset, 1));
  }

  function syncBudgetMonth(date = new Date()) {
    const month = currentBudgetMonth(date);
    const previous = WR.ui._activeBudgetMonth;
    WR.ui._activeBudgetMonth = month;
    if (!previous || previous === month) return false;
    if (WR.ui._dayMonth === previous) WR.ui._dayMonth = month;
    if (WR.ui._paydayMonth === previous) WR.ui._paydayMonth = month;
    if (WR.ui._transactionsMonth === previous) WR.ui._transactionsMonth = month;
    return true;
  }

  function calculatePayCycleFunding(cycle) {
    const cents = value => Math.round((Number(value) || 0) * 100);
    const savings = cycle.savingsAmount != null ? cents(cycle.savingsAmount) : (cycle.allocations || []).reduce((sum, item) => sum + cents(item.amount), 0);
    const salary = cents(cycle.expectedIncome) - cents(cycle.advanceAmount);
    const expenses = cents(cycle.fixedAmount) + cents(cycle.variableAmount) + cents(cycle.debtAmount);
    const buffer = cents(cycle.bufferAmount);
    const shortfall = cents(cycle.shortfallAmount);
    return { salary: salary / 100, savings: savings / 100, expenses: expenses / 100, shortfall: shortfall / 100, totalIncome: (salary - savings + buffer - shortfall) / 100, budget: (salary - savings + buffer - shortfall - expenses) / 100 };
  }

  function calculateBudgetRemainingPercentage(budget, remaining) {
    return budget > 0 ? Math.max(0, Math.min(100, remaining / budget * 100)) : 0;
  }

  function calculateBudgetSpending(budget, spent) {
    const available = Number.isFinite(Number(budget)) ? Math.max(0, Number(budget)) : 0;
    const used = Number.isFinite(Number(spent)) ? Math.max(0, Number(spent)) : 0;
    const percentage = available > 0 ? used / available * 100 : null;
    const overBudget = Math.round(Math.max(0, used - available) * 100) / 100;
    return { percentage, barPercentage: percentage === null ? (used > 0 ? 100 : 0) : Math.min(100, percentage), overBudget };
  }
  WR.ui.calculateBudgetSpending = calculateBudgetSpending;

  function calculatePayCycleBudget(accounts, transactions, cycles, advances, month, payday = 25, today = new Date().toISOString().slice(0, 10), budgetAmount) {
    const dates = payCycleDates(month, payday);
    const confirmed = cycles.filter(cycle => cycle.confirmed && cycle.payDate <= today);
    const events = transactions.map(item => ({ date: item.date, amount: (item.kind === 'add' ? 1 : -1) * (Number(item.amount) || 0), kind: item.kind === 'add' ? 'add' : 'spend' }));
    confirmed.forEach(cycle => events.push({ date: cycle.payDate, amount: calculatePayCycleFunding(cycle).budget - (Number(cycle.bufferAmount) || 0) + (Number(cycle.shortfallAmount) || 0), kind: 'funding' }));
    advances.filter(item => !item.transactionId).forEach(item => events.push({ date: item.receivedDate, amount: Number(item.amount) || 0, kind: 'add' }));
    const opening = Number(accounts.slice().sort((left, right) => Number(left.year) - Number(right.year))[0]?.startingBalance) || 0;
    const enabledFrom = confirmed.slice().sort((left, right) => left.payDate.localeCompare(right.payDate))[0]?.payDate;
    const counted = events.filter(item => item.date && item.date <= today);
    const sum = items => Math.round(items.reduce((total, item) => total + item.amount, 0) * 100) / 100;
    const anchor = cycles.filter(cycle => cycle.rolloverApplied && cycle.payDate <= dates.start).sort((left, right) => right.payDate.localeCompare(left.payDate))[0];
    const carryOver = Math.round(((anchor ? Number(anchor.rolloverAvailable) || 0 : opening) + sum(counted.filter(item => item.date < dates.start && (!anchor || item.date >= anchor.payDate)))) * 100) / 100;
    const period = counted.filter(item => item.date >= dates.start && item.date < dates.endExclusive);
    const cycle = confirmed.find(item => item.month === month);
    const funding = dates.start <= today ? Number(budgetAmount ?? (cycle ? calculatePayCycleFunding(cycle).budget : 0)) : 0;
    const added = sum(period.filter(item => item.kind === 'add'));
    const spent = -sum(period.filter(item => item.kind === 'spend'));
    const available = Math.round(funding * 100) / 100;
    const remaining = Math.round((available - spent) * 100) / 100;
    return { ...dates, enabled: !!enabledFrom, confirmed: !!cycle, carryOver, funding, added, spent, available, remaining, remainingPct: calculateBudgetRemainingPercentage(funding, remaining) };
  }

  async function ensurePaydayRollover(data, month, today = new Date().toISOString().slice(0, 10)) {
    const existing = data.cycles.find(cycle => cycle.month === month);
    if (existing?.rolloverApplied || month !== WR.ui.currentBudgetMonth(new Date(`${today}T12:00:00`))) return existing;
    const payDate = WR.ui.payCycleDates(month).start;
    const carryOver = WR.ui.calculatePayCycleBudget(data.accounts, data.transactions, data.cycles, data.advances, month, 25, today).carryOver;
    const year = Number(month.slice(0, 4));
    const defaults = {
      id: month, month, payDate, mode: 'income-table', allocations: [],
      expectedIncome: data.incomeSources.filter(source => Number(source.year || year) === year && WR.ui.isActiveForMonth(source, month)).reduce((sum, source) => sum + WR.ui.monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'), 0),
      fixedAmount: data.fixedExpenses.filter(expense => WR.ui.isActiveForMonth(expense, month)).reduce((sum, expense) => sum + WR.ui.monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'), 0),
      variableAmount: data.budgetLines.filter(line => line.month === month && line.type === 'variable').reduce((sum, line) => sum + (Number(line.actualAmount) || 0), 0),
      debtAmount: WR.financial.calculateTotalMinPayments(data.debts, data.exchangeRates, data.profile.baseCurrency),
    };
    if (!existing && defaults.expectedIncome <= 0 && carryOver === 0) return existing;
    const uid = WR.account.getCurrentUser()?.uid;
    if (!uid || !data.profile.id) return existing;
    const api = WR.account.getFirestoreApi();
    const db = WR.account.getDb();
    const cycleRef = api.doc(db, 'users', uid, 'payCycles', month);
    const profileRef = api.doc(db, 'users', uid, 'userProfile', data.profile.id);
    return api.runTransaction(db, async transaction => {
      const cycleSnapshot = await transaction.get(cycleRef);
      const old = cycleSnapshot.exists() ? cycleSnapshot.data() : {};
      if (old.rolloverApplied) return old;
      const profileSnapshot = await transaction.get(profileRef);
      const profile = profileSnapshot.exists() ? profileSnapshot.data() : data.profile;
      const next = {
        ...defaults, ...old, confirmed: true, rolloverApplied: true,
        rolloverAvailable: Math.round(carryOver * 100) / 100,
        rolloverSourceMonth: WR.ui.previousMonthKey(month),
        bufferAmount: profile.autoUseBuffer ? Math.max(0, carryOver) : Math.min(Number(old.bufferAmount) || 0, Math.max(0, carryOver)),
        shortfallAmount: Math.max(0, -carryOver),
      };
      transaction.set(cycleRef, next);
      return next;
    });
  }

  /**
   * @param {string} [monthKey] - 'YYYY-MM', defaults to the current month
   */
  function calculateReserveBorrowing(savingsPots, emergencyFundContributions, exchangeRates, baseCurrency) {
    const convertedAmount = (value, currency) => {
      const result = WR.financial.convertCurrency(value, currency || baseCurrency, baseCurrency, exchangeRates);
      return result.converted ? Math.round(result.value * 100) : 0;
    };
    const savings = savingsPots.reduce((sum, pot) => sum + (pot.borrowings || []).reduce((subtotal, loan) => {
      const repaid = (loan.repayments || []).reduce((paid, payment) => paid + Math.round((Number(payment.amount) || 0) * 100), 0);
      const remaining = Math.max(0, Math.round((Number(loan.amount) || 0) * 100) - repaid) / 100;
      return subtotal + convertedAmount(remaining, pot.currency);
    }, 0), 0) / 100;
    const emergency = emergencyFundContributions.reduce((sum, entry) => {
      return sum + convertedAmount(WR.financial.calculateEmergencyBorrowing(entry).remaining, entry.currency);
    }, 0) / 100;
    return { savings, emergency, total: Math.round((savings + emergency) * 100) / 100 };
  }

  async function buildSnapshot(monthKey) {
    const month = monthKey || currentMonthKey();
    const prevMonth = previousMonthKey(month);
    const selectedYear = Number(month.slice(0, 4));
    const selectedMonthNumber = Number(month.slice(5, 7));

    let [allBudgetLines, debts, assets, investments, exchangeRates, expenseCategories, netWorthHistory, profile, incomeSources, fixedExpenses, emergencyFundContributions, dayToDayAccounts, dayToDayTransactions, savingsPots, debtPayments, payCycles, payAdvances] =
      await Promise.all([
        WR.repos.budgetLines.getAll(),
        WR.repos.debts.getAll(),
        WR.repos.assets.getAll(),
        WR.repos.investments.getAll(),
        WR.repos.exchangeRates.getAll(),
        WR.repos.expenseCategories.getAll(),
        WR.queries.getNetWorthHistory(),
        getOrCreateProfile(),
        WR.repos.incomeSources.getAll(),
        WR.repos.fixedExpenses.getAll(),
        WR.repos.emergencyFundContributions.getAll(),
        WR.repos.dayToDayAccounts.getAll(),
        WR.repos.dayToDayTransactions.getAll(),
        WR.repos.savingsPots.getAll(),
        WR.repos.debtPayments.getAll(),
        WR.repos.payCycles.getAll(),
        WR.repos.payAdvances.getAll(),
      ]);

    if (month === currentBudgetMonth() && profile.id && !payCycles.find(cycle => cycle.month === month)?.rolloverApplied && (payCycles.length || dayToDayAccounts.length || incomeSources.some(source => Number(source.year || selectedYear) === selectedYear && isActiveForMonth(source, month)))) {
      const records = await Promise.all(['budgetLines', 'debts', 'exchangeRates', 'incomeSources', 'fixedExpenses', 'dayToDayAccounts', 'dayToDayTransactions', 'payCycles', 'payAdvances', 'userProfile'].map(store => WR.repos[store].getAll({ fresh: true })));
      [allBudgetLines, debts, exchangeRates, incomeSources, fixedExpenses, dayToDayAccounts, dayToDayTransactions, payCycles, payAdvances] = records;
      profile = records[9][0] || profile;
    }

    const effectivePayCycles = payCycles.map(cycle => {
      if (cycle.mode !== 'income-table') return cycle;
      const fixedAmount = fixedExpenses.filter(expense => isActiveForMonth(expense, cycle.month)).reduce((sum, expense) => sum + monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'), 0);
      const variableAmount = allBudgetLines.filter(line => line.month === cycle.month && line.type === 'variable').reduce((sum, line) => sum + (Number(line.actualAmount) || 0), 0);
      const debtAmount = WR.financial.calculateTotalMinPayments(debts, exchangeRates, profile.baseCurrency);
      return { ...cycle, fixedAmount, variableAmount, debtAmount };
    });
    const rollover = await ensurePaydayRollover({ profile, incomeSources, fixedExpenses, budgetLines: allBudgetLines, debts, exchangeRates, accounts: dayToDayAccounts, transactions: dayToDayTransactions, cycles: effectivePayCycles, advances: payAdvances }, month);
    if (rollover) {
      const storedIndex = payCycles.findIndex(cycle => cycle.month === month);
      if (storedIndex < 0) payCycles.push(rollover); else payCycles[storedIndex] = rollover;
      const effectiveIndex = effectivePayCycles.findIndex(cycle => cycle.month === month);
      if (effectiveIndex < 0) effectivePayCycles.push(rollover); else effectivePayCycles[effectiveIndex] = { ...rollover, fixedAmount: effectivePayCycles[effectiveIndex].fixedAmount, variableAmount: effectivePayCycles[effectiveIndex].variableAmount, debtAmount: effectivePayCycles[effectiveIndex].debtAmount };
    }
    const monthBudgetLines = allBudgetLines.filter((line) => line.month === month);
    const prevMonthBudgetLines = allBudgetLines.filter((line) => line.month === prevMonth);

    const recurringIncomeLines = incomeSources
      .filter((source) => Number(source.year || selectedYear) === selectedYear && isActiveForMonth(source, month))
      .map((source) => ({
        type: 'income',
        name: source.name,
        categoryId: source.categoryId,
        budgetAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
      }));

    const recurringFixedLines = fixedExpenses
      .filter((expense) => isActiveForMonth(expense, month))
      .map((expense) => ({
        type: 'fixed',
        name: expense.name,
        categoryId: expense.categoryId,
        budgetAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
      }));

    const applyPaydayIncome = (lines, monthId, includeBuffer = true) => {
      const cycle = payCycles.find(item => item.month === monthId);
      if (!cycle) return lines;
      const result = Number.isFinite(Number(cycle.expectedIncome))
        ? lines.filter(item => item.type !== 'income').concat({ type: 'income', name: 'Expected payday income', actualAmount: Number(cycle.expectedIncome), budgetAmount: Number(cycle.expectedIncome) })
        : lines.slice();
      result.push({ type: 'income', name: 'Advance already received', actualAmount: -(Number(cycle.advanceAmount) || 0), budgetAmount: -(Number(cycle.advanceAmount) || 0) });
      if (cycle.mode === 'income-table' && includeBuffer) result.push({ type: 'income', name: 'Income adjustments', actualAmount: (Number(cycle.bufferAmount) || 0) - (Number(cycle.shortfallAmount) || 0) - calculatePayCycleFunding(cycle).savings, budgetAmount: (Number(cycle.bufferAmount) || 0) - (Number(cycle.shortfallAmount) || 0) - calculatePayCycleFunding(cycle).savings });
      if (cycle.confirmed) result.push({ type: 'savings', name: 'Payday savings allocations', actualAmount: calculatePayCycleFunding(cycle).savings, budgetAmount: calculatePayCycleFunding(cycle).savings });
      return result;
    };
    const budgetLines = applyPaydayIncome(monthBudgetLines
      .filter((line) => line.type !== 'income' && line.type !== 'fixed')
      .concat(recurringIncomeLines)
      .concat(recurringFixedLines), month);

    const prevRecurringIncomeLines = incomeSources
      .filter((source) => Number(source.year || Number(prevMonth.slice(0, 4))) === Number(prevMonth.slice(0, 4)) && isActiveForMonth(source, prevMonth))
      .map((source) => ({
        type: 'income',
        name: source.name,
        categoryId: source.categoryId,
        budgetAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
      }));
    const prevRecurringFixedLines = fixedExpenses
      .filter((expense) => isActiveForMonth(expense, prevMonth))
      .map((expense) => ({
        type: 'fixed',
        name: expense.name,
        categoryId: expense.categoryId,
        budgetAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
      }));
    const prevBudgetLines = applyPaydayIncome(prevMonthBudgetLines
      .filter((line) => line.type !== 'income' && line.type !== 'fixed')
      .concat(prevRecurringIncomeLines)
      .concat(prevRecurringFixedLines), prevMonth);

    const F = WR.financial;
    const minimumDebtPayments = F.calculateTotalMinPayments(debts, exchangeRates, profile.baseCurrency);
    const cashflow = F.calculateCashFlowSummary(budgetLines, minimumDebtPayments);
    const paydayRecord = effectivePayCycles.find(item => item.month === month);
    const paydayFunding = calculatePayCycleFunding({ expectedIncome: recurringIncomeLines.reduce((sum, line) => sum + line.actualAmount, 0), fixedAmount: cashflow.fixedExpenses, variableAmount: cashflow.variableExpenses, debtAmount: minimumDebtPayments, allocations: [], ...paydayRecord });
    if (paydayRecord) cashflow.availableSurplus = paydayFunding.budget;
    const prevCashflow = F.calculateCashFlowSummary(prevBudgetLines, minimumDebtPayments);
    const surplusDelta = prevBudgetLines.length > 0 ? cashflow.monthlySurplus - prevCashflow.monthlySurplus : null;
    const split = F.calculateEssentialVsDiscretionary(budgetLines, expenseCategories);
    const prevSplit = F.calculateEssentialVsDiscretionary(prevBudgetLines, expenseCategories);

    const totalDebt = F.calculateTotalDebt(debts, exchangeRates, profile.baseCurrency);
    const debtToIncomeRatio = F.calculateDebtToIncomeRatio(debts, cashflow.income, exchangeRates, profile.baseCurrency);
    const highestInterestDebt = F.getHighestInterestDebt(debts);

    const liquidAssets = F.calculateLiquidAssets(assets, exchangeRates, profile.baseCurrency);
    // Fall back to fixed expenses as a rough proxy for "essential monthly
    // expenses" when no categories have been tagged essential yet.
    const essentialMonthlyExpenses = split.essential > 0 ? split.essential : cashflow.fixedExpenses;
    const emergencyFundMonths = F.calculateEmergencyFundMonths(liquidAssets, essentialMonthlyExpenses);

    const netWorth = F.calculateNetWorth(assets, investments, debts, exchangeRates, profile.baseCurrency, savingsPots, emergencyFundContributions);
    const missingCurrencies = new Set(netWorth.unconvertedItems.map((item) => item.currency));
    debtPayments.forEach((payment) => {
      const paymentCurrency = payment.currency || debts.find((debt) => debt.id === payment.debtId)?.currency || profile.baseCurrency;
      if (!F.convertCurrency(Number(payment.amount) || 0, paymentCurrency, profile.baseCurrency, exchangeRates).converted) missingCurrencies.add(paymentCurrency);
    });
    const currencyWarnings = [...missingCurrencies].filter(Boolean);
    // Compare the live net worth figure against the most recent PAST snapshot (not one recorded today),
    // so "record today's snapshot" doesn't just diff against itself and show a flat 0 delta.
    const todayIso = new Date().toISOString().slice(0, 10);
    const priorNetWorthEntries = netWorthHistory.filter((h) => h.date < todayIso);
    const netWorthDelta = priorNetWorthEntries.length
      ? netWorth.netWorth - priorNetWorthEntries[priorNetWorthEntries.length - 1].netWorth
      : null;

    const assumedInvestmentReturn = profile.assumedInvestmentReturn || 0.08;

    const investmentReadiness = F.assessInvestmentReadiness({
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      highestDebtInterestRate: highestInterestDebt ? highestInterestDebt.interestRate : null,
      assumedInvestmentReturn,
      availableSurplus: cashflow.availableSurplus,
    });

    const healthScore = F.calculateFinancialHealthScore({
      income: cashflow.income,
      availableSurplus: cashflow.availableSurplus,
      savingsRate: cashflow.savingsRate,
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      debtToIncomeRatio,
      netWorthHistory,
    });

    let discretionarySpendChangePct = null;
    if (prevSplit.discretionary > 0) {
      discretionarySpendChangePct = (split.discretionary - prevSplit.discretionary) / prevSplit.discretionary;
    }

    const annualMonths = Array.from({ length: 12 }, (_, index) => `${selectedYear}-${String(index + 1).padStart(2, '0')}`);
    const recordedMonths = [
      ...allBudgetLines.map((line) => line.month),
      ...debtPayments.map((payment) => payment.month),
      ...emergencyFundContributions.map((item) => String(item.date || '').slice(0, 7)),
      ...dayToDayTransactions.map((transaction) => String(transaction.date || '').slice(0, 7)),
      ...payCycles.map(cycle => cycle.month),
    ].filter((monthId) => String(monthId).startsWith(`${selectedYear}-`)).sort();
    const firstRecordedMonth = recordedMonths[0];
    const recordedAnnualMonths = annualMonths.filter((monthId) => monthId <= month && (!firstRecordedMonth || monthId >= firstRecordedMonth) && (
      allBudgetLines.some((line) => line.month === monthId) ||
      incomeSources.some((source) => Number(source.year || selectedYear) === selectedYear && isActiveForMonth(source, monthId)) ||
      fixedExpenses.some((expense) => isActiveForMonth(expense, monthId)) || payCycles.some(cycle => cycle.month === monthId)
    ));
    const annualRows = recordedAnnualMonths.map((monthId) => {
      const monthLines = allBudgetLines.filter((line) => line.month === monthId && line.type !== 'income' && line.type !== 'fixed');
      const monthIncome = incomeSources
        .filter((source) => Number(source.year || selectedYear) === selectedYear && isActiveForMonth(source, monthId))
        .map((source) => ({ type: 'income', actualAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly') }));
      const monthFixed = fixedExpenses
        .filter((expense) => isActiveForMonth(expense, monthId))
        .map((expense) => ({ type: 'fixed', actualAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly') }));
      const fullLines = applyPaydayIncome(monthLines.concat(monthIncome).concat(monthFixed), monthId, false);
      const monthCashflow = F.calculateCashFlowSummary(fullLines, minimumDebtPayments);
      return { month: monthId, cashflow: monthCashflow };
    });

    const annualSummary = annualRows.reduce((summary, row) => {
      summary.totalIncome += row.cashflow.income;
      summary.totalFixedExpenses += row.cashflow.fixedExpenses;
      summary.totalVariableExpenses += row.cashflow.variableExpenses;
      summary.totalExpenses += row.cashflow.totalExpenses;
      summary.totalSaved += row.cashflow.savings;
      summary.totalDebtPaid += row.cashflow.debtPayments;
      summary.availableSurplus += row.cashflow.availableSurplus;
      return summary;
    }, {
      totalIncome: 0,
      totalSaved: 0,
      totalInvested: 0,
      totalFixedExpenses: 0,
      totalVariableExpenses: 0,
      totalExpenses: 0,
      totalDebtPaid: 0,
      availableSurplus: 0,
    });
    annualSummary.totalInvested = F.calculateTotalInvestments(investments, exchangeRates, profile.baseCurrency);
    annualSummary.totalWealth = netWorth.totalAssets;

    const emergencyFundBalance = netWorth.wealth.emergencyFundTotal;
    const activePotBalance = netWorth.wealth.savingsTotal;
    annualSummary.totalSavedAndInvested = activePotBalance;
    annualSummary.totalDebtPaid = debtPayments.filter((payment) => String(payment.month).startsWith(String(selectedYear)))
      .reduce((sum, payment) => {
        const paymentCurrency = payment.currency || debts.find((debt) => debt.id === payment.debtId)?.currency || profile.baseCurrency;
        const converted = F.convertCurrency(Number(payment.amount) || 0, paymentCurrency, profile.baseCurrency, exchangeRates);
        return sum + (converted.converted ? converted.value : 0);
      }, 0);
    const dayToDayAccount = getDayToDayOpeningAccount(dayToDayAccounts, selectedYear);
    const dayToDaySummary = calculateDayToDaySummary(dayToDayAccounts, dayToDayTransactions, month);
    const payCycleBudget = calculatePayCycleBudget(dayToDayAccounts, dayToDayTransactions, effectivePayCycles, payAdvances, month, 25, undefined, paydayFunding.budget);
    dayToDaySummary.currentBalance = payCycleBudget.remaining;
    payCycleBudget.remainingPct = calculateBudgetRemainingPercentage(paydayFunding.budget, dayToDaySummary.currentBalance);

    const snapshot = {
      month,
      monthLabel: `${monthName(selectedMonthNumber)} ${selectedYear}`,
      selectedYear,
      profile,
      cashflow,
      currencyWarnings,
      income: cashflow.income,
      availableSurplus: cashflow.availableSurplus,
      surplusDelta,
      savingsRate: cashflow.savingsRate,
      essentialVsDiscretionary: split,
      discretionarySpendChangePct,
      totalDebt,
      debtToIncomeRatio,
      highestInterestDebt,
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      netWorth,
      netWorthDelta,
      assumedInvestmentReturn,
      investmentReadiness,
      healthScore,
      annualSummary,
      annualStartMonth: annualRows[0]?.month || null,
      annualMonths: annualRows,
      emergencyFundBalance,
      activePotBalance,
      reserveBorrowing: calculateReserveBorrowing(savingsPots, emergencyFundContributions, exchangeRates, profile.baseCurrency),
      emergencyFundContributions,
      incomeSources,
      fixedExpenses,
      dayToDaySummary,
      payCycleBudget,
      paydayFunding,
      paydayRecord,
      payCycles: effectivePayCycles,
      payAdvances,
      dayToDayAccount,
      dayToDayTransactions,
      debts,
      debtPayments,
      exchangeRates,
      assets,
      investments,
      allBudgetLines,
      expenseCategories,
      netWorthHistory,
      budgetLines,
    };

    snapshot.recommendations = WR.recommendations.generateRecommendations(snapshot);
    return snapshot;
  }

  WR.ui.currentMonthKey = currentMonthKey;
  WR.ui.previousMonthKey = previousMonthKey;
  WR.ui.monthName = monthName;
  WR.ui.yearsAroundCurrent = yearsAroundCurrent;
  WR.ui.getOrCreateProfile = getOrCreateProfile;
  WR.ui.isActiveForMonth = isActiveForMonth;
  WR.ui.monthlyAmountFromFrequency = monthlyAmountFromFrequency;
  /** Day-of-month 1-31, or undefined when blank/invalid (no reminder). */
  WR.ui.parseDueDay = (value) => {
    const day = Math.round(Number(value));
    return day >= 1 && day <= 31 ? day : undefined;
  };
  WR.ui.calculateDayToDayMonthBalance = calculateDayToDayMonthBalance;
  Object.assign(WR.ui, { payCycleDates, currentBudgetMonth, syncBudgetMonth, calculatePayCycleFunding, calculatePayCycleBudget, calculateBudgetRemainingPercentage, ensurePaydayRollover, calculateReserveBorrowing });
  WR.ui.buildSnapshot = buildSnapshot;
})();
// UI layer, part 1: layout shell, DOM helpers, and the Dashboard view.
// Direct DOM manipulation, no framework — innerHTML for structure,
// addEventListener for behaviour, re-render on data changes.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  function fmt(n) {
    return (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function pct(n) {
    return `${((Number(n) || 0) * 100).toFixed(1)}%`;
  }
  function el(html) {
    const template = document.createElement('template');
    WR.ui.setHTML(template, html.trim());
    return template.content.firstElementChild;
  }

  /** Purely cosmetic \u2014 no data or security implication, just personalization. */
  function greeting(displayName) {
    const hour = new Date().getHours();
    const timeGreeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    return displayName ? `${timeGreeting}, ${displayName}` : timeGreeting;
  }

  /**
   * Briefly flashes an element to confirm an inline edit actually saved \u2014
   * cell edits save silently otherwise, with no visual confirmation.
   * @param {HTMLElement} element
   */
  function flashSaved(element) {
    if (!element) return;
    element.classList.add('just-saved');
    setTimeout(() => element.classList.remove('just-saved'), 700);
  }

  function renderSaveStatus() {
    const status = document.getElementById('save-status');
    if (!status) return;
    const state = WR.saves.state;
    const offline = navigator.onLine === false;
    status.dataset.state = state.failed ? 'error' : state.pending ? 'pending' : 'ready';
    status.textContent = state.failed ? "Couldn't save. Please retry."
      : offline ? state.pending ? 'Offline - waiting to sync' : 'Offline'
      : state.pending ? 'Saving...' : state.saved ? 'Saved' : '';
    status.hidden = !status.textContent;
  }

  async function submitWithFeedback(form, operation) {
    if (form.dataset.saving === 'true') return false;
    form.dataset.saving = 'true';
    form.setAttribute('aria-busy', 'true');
    const controls = [...form.querySelectorAll('input, select, textarea, button')].map(control => [control, control.disabled]);
    controls.forEach(([control]) => { control.disabled = true; });
    const status = form.querySelector('[data-save-feedback]');
    const update = () => { if (status) status.textContent = navigator.onLine === false ? 'Offline - waiting to sync' : 'Saving...'; };
    if (status) status.dataset.state = 'pending';
    update();
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    try {
      await operation();
      if (status) { status.textContent = 'Saved'; status.dataset.state = 'ready'; }
      return true;
    } catch (error) {
      if (status) { status.textContent = "Couldn't save. Your entry is still here. Please retry."; status.dataset.state = 'error'; }
      WR.ui.notify("Couldn't save. Your entry is still here. Please retry.", 'error');
      return false;
    } finally {
      window.removeEventListener('online', update);
      window.removeEventListener('offline', update);
      controls.forEach(([control, disabled]) => { control.disabled = disabled; });
      form.dataset.saving = 'false';
      form.setAttribute('aria-busy', 'false');
    }
  }

  WR.ui.renderSaveStatus = renderSaveStatus;
  WR.ui.submitWithFeedback = submitWithFeedback;
  const formDrafts = new Map();
  const pendingForms = new Set();
  function formDraftKey(form) {
    return `${WR.account?.getCurrentUser()?.uid || 'local'}|${form.dataset.draftRoute || window.location.hash}|${form.id || form.dataset.id + ':' + form.className}`;
  }
  function draftFields(form) {
    return [...form.querySelectorAll('input[name], select[name], textarea[name]')].filter(field => !['password', 'file', 'hidden'].includes(field.type));
  }
  function captureFormDraft(form) {
    if (form.dataset.draftDirty !== 'true') return;
    const values = draftFields(form).map(field => ({ name: field.name, value: field.value, checked: field.checked }));
    formDrafts.set(form.dataset.draftKey, values);
  }
  function captureFormDrafts(container) {
    container.querySelectorAll('form[data-draft-key]').forEach(captureFormDraft);
  }
  function clearFormDraft(form) {
    formDrafts.delete(form.dataset.draftKey);
    form.dataset.draftDirty = 'false';
  }
  function clearFormDrafts() {
    formDrafts.clear();
    pendingForms.clear();
    if (typeof document !== 'undefined') document.querySelectorAll('form[data-draft-key]').forEach(form => { form.dataset.draftDirty = 'false'; });
    WR.ui._dayDraft = null;
    WR.ui._dayDraftOwner = null;
  }
  function bindReliableForm(form, operation, afterSave) {
    if (!form) return;
    form.dataset.draftRoute = window.location.hash;
    form.dataset.draftKey = formDraftKey(form);
    const key = form.dataset.draftKey;
    const fields = draftFields(form);
    const draft = formDrafts.get(key);
    if (draft) {
      fields.forEach(field => {
        const saved = draft.find(value => value.name === field.name);
        if (!saved) return;
        if (['checkbox', 'radio'].includes(field.type)) field.checked = saved.checked;
        else field.value = saved.value;
      });
      form.dataset.draftDirty = 'true';
      const details = form.closest('details');
      if (details) details.open = true;
    }
    if (!form.querySelector('[data-save-feedback]')) {
      const status = document.createElement('span');
      status.setAttribute('data-save-feedback', '');
      status.setAttribute('role', 'status');
      status.className = 'span-2';
      form.appendChild(status);
    }
    const remember = () => { form.dataset.draftDirty = 'true'; captureFormDraft(form); };
    form.addEventListener('input', remember);
    form.addEventListener('change', remember);
    form.addEventListener('reset', () => clearFormDraft(form));
    if (pendingForms.has(key)) form.querySelectorAll('input, select, textarea, button').forEach(control => { control.disabled = true; });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (pendingForms.has(key)) return;
      remember();
      pendingForms.add(key);
      const saved = await submitWithFeedback(form, () => operation(form));
      pendingForms.delete(key);
      if (saved) clearFormDraft(form);
      if (!form.isConnected) {
        if (window.location.hash === form.dataset.draftRoute && formDraftKey(form) === key) WR.ui.reRenderCurrentRoute?.();
        return;
      }
      if (saved && afterSave) {
        try { await afterSave(form); }
        catch (error) { if (error.name !== 'AbortError') WR.ui.notify('Saved, but the view could not refresh. Reload this page.', 'error'); }
      }
      if (saved && typeof document !== 'undefined' && formDraftKey(form) === key && window.location.hash === form.dataset.draftRoute) {
        const replacement = [...document.querySelectorAll('form[data-draft-key]')].find(candidate => candidate.dataset.draftKey === key);
        const isTouchDevice = window.matchMedia?.('(hover: none) and (pointer: coarse)').matches;
        if (!isTouchDevice) replacement?.querySelector('input:not([disabled]), select:not([disabled]), textarea:not([disabled])')?.focus();
      }
    });
  }
  Object.assign(WR.ui, { captureFormDrafts, clearFormDrafts, bindReliableForm });
  window.addEventListener('online', renderSaveStatus);
  window.addEventListener('offline', renderSaveStatus);
  const updateEditingState = () => {
    const active = document.activeElement;
    const editing = active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName) && !['checkbox', 'radio', 'button', 'submit'].includes(active.type);
    document.documentElement.setAttribute('data-editing', String(!!editing));
  };
  document.addEventListener('focusin', updateEditingState);
  document.addEventListener('focusout', () => requestAnimationFrame(updateEditingState));

  function notify(message, tone) {
    const stack = document.getElementById('toast-stack');
    if (!stack) return;
    const toast = document.createElement('div');
    toast.className = `toast ${tone || ''}`.trim();
    toast.textContent = message;
    stack.appendChild(toast);
    setTimeout(() => {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 2800);
  }

  function notifyUndo(message, onUndo, options) {
    const stack = document.getElementById('toast-stack');
    if (!stack) return;
    const opts = options || {};
    const timeoutMs = Number(opts.timeoutMs) || 5000;

    const toast = document.createElement('div');
    toast.className = 'toast row';

    const text = document.createElement('span');
    text.textContent = message;

    const button = document.createElement('button');
    button.className = 'toast-action';
    button.type = 'button';
    button.textContent = opts.undoLabel || 'Undo';

    toast.appendChild(text);
    toast.appendChild(button);
    stack.appendChild(toast);

    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    };

    const timer = setTimeout(close, timeoutMs);
    button.addEventListener('click', async () => {
      clearTimeout(timer);
      close();
      try {
        await onUndo();
        notify(opts.undoSuccessMessage || 'Restored.', 'success');
      } catch (err) {
        notify(`Undo failed: ${err.message}`, 'error');
      }
    });
  }

  async function removeWithUndo(options) {
    const existing = await options.repo.getById(options.id);
    if (!existing) return;

    await options.repo.remove(options.id);
    if (options.afterChange) await options.afterChange();

    notifyUndo(`${options.entityLabel || 'Item'} deleted.`, async () => {
      await options.repo.add(existing);
      if (options.afterChange) await options.afterChange();
    }, {
      undoLabel: 'Undo',
      undoSuccessMessage: `${options.entityLabel || 'Item'} restored.`,
      timeoutMs: options.timeoutMs || 5000,
    });
  }

  async function getIntegrityWarnings() {
    const [lines, debts] = await Promise.all([
      WR.repos.budgetLines.getAll(),
      WR.repos.debts.getAll(),
    ]);
    const warnings = [];
    const badMonthCount = lines.filter((line) => !line.month || !/^\d{4}-\d{2}$/.test(String(line.month))).length;
    if (badMonthCount > 0) warnings.push(`${badMonthCount} budget rows have invalid month values.`);
    const invalidAmounts = lines.filter((line) => Number(line.budgetAmount) < 0 || Number(line.actualAmount) < 0).length;
    if (invalidAmounts > 0) warnings.push(`${invalidAmounts} budget rows have negative amounts.`);
    const badDebtBalances = debts.filter((debt) => Number(debt.currentBalance) < 0 || Number.isNaN(Number(debt.currentBalance))).length;
    if (badDebtBalances > 0) warnings.push(`${badDebtBalances} debts have invalid balances.`);
    return warnings;
  }

  async function refreshIntegrityNotice() {
    const host = document.getElementById('global-notice');
    if (!host) return;
    const warnings = await getIntegrityWarnings();
    WR.ui.setHTML(host, warnings.length ? `<div class="notice-card"><strong>Data check:</strong> ${warnings.join(' ')}</div>` : '');
  }

  function fitDashboardAmounts(container) {
    container.querySelectorAll('.position-card .stat-value, .annual-card .stat-value').forEach(amount => {
      const row = amount.closest('.stat');
      if (!row) return;
      row.classList.remove('wide-amount');
      amount.style.fontSize = '';
      if (!amount.clientWidth || amount.classList.contains('balance-masked')) return;
      const baseSize = parseFloat(getComputedStyle(amount).fontSize);
      if (amount.scrollWidth > amount.clientWidth && baseSize * amount.clientWidth / amount.scrollWidth < 14) row.classList.add('wide-amount');
      if (amount.scrollWidth > amount.clientWidth) amount.style.fontSize = `${Math.floor(baseSize * amount.clientWidth / amount.scrollWidth * 10) / 10}px`;
    });
  }
  WR.ui.fitDashboardAmounts = fitDashboardAmounts;

  function enhanceResponsiveContent(container) {
    if (!container) return;
    WR.ui._dashboardAmountObserver?.disconnect();
    fitDashboardAmounts(container);
    if (typeof ResizeObserver !== 'undefined' && container.querySelector('.position-card')) {
      WR.ui._dashboardAmountObserver = new ResizeObserver(() => {
        if (container.isConnected) fitDashboardAmounts(container);
      });
      WR.ui._dashboardAmountObserver.observe(container);
    }
    container.querySelectorAll('table.data-table').forEach((table) => {
      if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
      const wrapper = document.createElement('div');
      wrapper.className = 'table-wrap';
      table.parentNode.insertBefore(wrapper, table);
      wrapper.appendChild(table);
    });
    container.querySelectorAll('.table-wrap').forEach((wrapper) => {
      wrapper.tabIndex = 0;
      wrapper.setAttribute('role', 'region');
      const heading = wrapper.closest('section, article')?.querySelector('h1, h2, h3')?.textContent.trim();
      wrapper.setAttribute('aria-label', `${heading || 'Financial records'} table`);
    });
    container.querySelectorAll('input, select, textarea').forEach((control) => {
      if (['hidden', 'submit', 'button'].includes(control.type) || control.labels?.length || control.hasAttribute('aria-label') || control.hasAttribute('aria-labelledby')) return;
      const cell = control.closest('td');
      const heading = cell?.closest('table')?.tHead?.rows[0]?.cells[cell.cellIndex]?.cloneNode(true);
      heading?.querySelectorAll('select, button').forEach((child) => child.remove());
      const field = control.dataset.field || control.name || control.id;
      const label = heading?.textContent.trim() || field.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[-_]/g, ' ') || control.placeholder || 'Value';
      control.setAttribute('aria-label', label.charAt(0).toUpperCase() + label.slice(1));
    });
    container.querySelectorAll('[role="progressbar"]').forEach((meter) => {
      if (meter.hasAttribute('aria-label') || meter.hasAttribute('aria-labelledby')) return;
      const heading = meter.closest('article, section')?.querySelector('h2, h3, h4')?.textContent.trim();
      meter.setAttribute('aria-label', `${heading || 'Savings'} progress`);
    });
  }

  const PRIMARY_NAV_ITEMS = [
    { hash: '#/dashboard', label: 'Dashboard' },
    { hash: '#/income', label: 'Income' },
    { hash: '#/fixed-expenses', label: 'Fixed Expenses' },
    { hash: '#/savings', label: 'Savings' },
    { hash: '#/transactions', label: 'Transactions' },
    { hash: '#/variable-expenses', label: 'Variable Expenses' },
    { hash: '#/debts', label: 'Debts' },
    { hash: '#/wealth', label: 'Wealth' },
    { hash: '#/goals', label: 'Goals' },
    { hash: '#/settings', label: 'Settings' },
  ];

  const SECONDARY_NAV_ITEMS = [];

  const NAV_ITEMS = PRIMARY_NAV_ITEMS.concat(SECONDARY_NAV_ITEMS);

  // A handful of the most-used destinations, always visible in the topbar on
  // wider screens. Everything else (including these, for keyboard/mobile
  // users) still lives in the grouped hamburger dropdown below.
  const HORIZONTAL_NAV_HASHES = ['#/dashboard', '#/transactions', '#/debts', '#/savings', '#/settings'];
  const HORIZONTAL_NAV_ITEMS = HORIZONTAL_NAV_HASHES.map((hash) => NAV_ITEMS.find((i) => i.hash === hash)).filter(Boolean);
  // Must match the links in the mobile bottom bar (.mobile-nav) in renderShell().
  const MOBILE_NAV_HASHES = ['#/dashboard', '#/transactions', '#/debts', '#/savings'];
  const SUPPORT_WHATSAPP_URL = 'https://wa.me/27625417921?text=' + encodeURIComponent('Hi WealthRoute support, I need help with...');

  function renderNavAccount() {
    const host = document.getElementById('nav-account');
    if (!host) return;
    if (!WR.account.isConfigured()) {
      WR.ui.setHTML(host, '');
      return;
    }
    const user = WR.account.getCurrentUser();
    WR.ui.setHTML(host, user
      ? ''
      : `
        <a href="#/settings" class="nav-account-link">Log in</a>
        <a href="#/settings" class="nav-account-link nav-account-link-accent">Sign up</a>
      `);
  }

  // Chrome/Edge/Android fire this when the site meets install criteria; we
  // stash the event and only trigger it from the dropdown button, since
  // browsers require it to be used inside a direct user gesture.
  let deferredInstallPrompt = null;

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }

  function renderNavInstall() {
    for (const hostId of ['nav-install', 'nav-install-wide']) renderInstallControl(hostId);
    const topbar = document.querySelector('.topbar');
    if (topbar) updateNavigationLayout(topbar);
  }

  function renderInstallControl(hostId) {
    const host = document.getElementById(hostId);
    if (!host) return;
    if (isStandalone()) {
      WR.ui.setHTML(host, '');
      return;
    }
    if (deferredInstallPrompt) {
      WR.ui.setHTML(host, `<button type="button" id="${hostId}-btn" class="nav-install-btn">Install WealthRoute</button>`);
      host.querySelector('button').addEventListener('click', async () => {
        const promptEvent = deferredInstallPrompt;
        if (!promptEvent) return;
        deferredInstallPrompt = null;
        renderNavInstall();
        promptEvent.prompt();
        await promptEvent.userChoice;
      });
      return;
    }
    if (isIOS()) {
      // iOS Safari has no install-prompt API at all — "Add to Home Screen" only
      // exists in the browser's own Share sheet, so this is instructions, not a button.
      WR.ui.setHTML(host, `<button type="button" id="${hostId}-btn" class="nav-install-btn">Add to Home Screen</button>`);
      host.querySelector('button').addEventListener('click', () => {
        WR.ui.notify('Tap the Share icon, then “Add to Home Screen”.', 'success');
      });
      return;
    }
    WR.ui.setHTML(host, '');
  }

  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    renderNavInstall();
  });
  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    renderNavInstall();
  });

  async function refreshCurrentPage() {
    if (WR.saves.state.pending) return;
    const userId = WR.account.getCurrentUser()?.uid;
    const route = window.location.hash;
    if (!userId) return;
    if (navigator.onLine === false) throw new Error('You are offline. Connect to refresh.');
    await Promise.all(Object.values(WR.repos).map(repo => repo.getAll({ fresh: true })));
    if (WR.account.getCurrentUser()?.uid !== userId || window.location.hash !== route) return;
    await WR.ui.reRenderCurrentRoute();
  }

  function bindPullToRefresh() {
    WR.ui._disposePullRefresh?.();
    const host = document.getElementById('app');
    const indicator = document.getElementById('pull-refresh');
    if (!host || !indicator) return;
    let start = null;
    let distance = 0;
    let refreshing = false;
    let disposed = false;
    const enabled = () => window.matchMedia('(max-width: 900px)').matches;
    const reset = () => {
      start = null;
      distance = 0;
      indicator.dataset.state = 'idle';
      indicator.setAttribute('aria-label', 'Refresh');
      indicator.setAttribute('aria-busy', 'false');
      indicator.querySelector('svg').style.transform = '';
    };
    const updateMode = () => document.documentElement.classList.toggle('pull-refresh-enabled', enabled());
    const onStart = event => {
      if (refreshing || !enabled() || window.scrollY > 0 || WR.ui._navScrollLock || WR.saves.state.pending || event.touches.length !== 1) return;
      const target = event.target;
      if (!target.closest('#content') || target.closest('input, select, textarea, button, a, [contenteditable], [role="dialog"]') || document.getElementById('content').getAttribute('aria-busy') === 'true') return;
      for (let parent = target; parent && parent.id !== 'content'; parent = parent.parentElement) {
        const style = getComputedStyle(parent);
        if ((/(auto|scroll)/.test(style.overflowY) && parent.scrollHeight > parent.clientHeight) || (/(auto|scroll)/.test(style.overflowX) && parent.scrollWidth > parent.clientWidth)) return;
      }
      start = { x: event.touches[0].clientX, y: event.touches[0].clientY };
      distance = 0;
      indicator.style.setProperty('--pull-top', `${document.querySelector('.topbar').getBoundingClientRect().bottom + 8}px`);
    };
    const onMove = event => {
      if (!start) return;
      if (event.touches.length !== 1 || !enabled() || WR.ui._navScrollLock || WR.saves.state.pending) { reset(); return; }
      const vertical = event.touches[0].clientY - start.y;
      const horizontal = Math.abs(event.touches[0].clientX - start.x);
      if (horizontal > 12 && horizontal > Math.abs(vertical)) { reset(); return; }
      if (vertical <= 0) { reset(); return; }
      if (!event.cancelable) { reset(); return; }
      event.preventDefault();
      distance = Math.min(96, vertical * 0.45);
      indicator.dataset.state = distance >= 64 ? 'ready' : 'pulling';
      indicator.querySelector('svg').style.transform = `rotate(${distance * 3}deg)`;
    };
    const onEnd = async () => {
      if (!start) return;
      const ready = distance >= 64 && enabled() && !WR.ui._navScrollLock && !WR.saves.state.pending;
      start = null;
      if (!ready) { reset(); return; }
      refreshing = true;
      indicator.dataset.state = 'refreshing';
      indicator.setAttribute('aria-label', 'Refreshing');
      indicator.setAttribute('aria-busy', 'true');
      indicator.querySelector('svg').style.transform = '';
      try {
        await refreshCurrentPage();
      } catch (error) {
        if (!disposed) WR.ui.notify(error.message || 'Could not refresh. Please retry.', 'error');
      } finally {
        refreshing = false;
        if (!disposed) reset();
      }
    };
    const onCancel = () => { if (!refreshing) reset(); };
    host.addEventListener('touchstart', onStart, { passive: true });
    host.addEventListener('touchmove', onMove, { passive: false });
    host.addEventListener('touchend', onEnd, { passive: true });
    host.addEventListener('touchcancel', onCancel, { passive: true });
    window.addEventListener('resize', updateMode);
    updateMode();
    WR.ui._disposePullRefresh = () => {
      disposed = true;
      host.removeEventListener('touchstart', onStart);
      host.removeEventListener('touchmove', onMove);
      host.removeEventListener('touchend', onEnd);
      host.removeEventListener('touchcancel', onCancel);
      window.removeEventListener('resize', updateMode);
      document.documentElement.classList.remove('pull-refresh-enabled');
      reset();
    };
  }

  function setNavigationOpen(isOpen, restoreFocus = false) {
    const topbar = document.querySelector('.topbar');
    if (!topbar) return;
    const mobile = window.matchMedia('(max-width: 900px)').matches;
    topbar.classList.toggle('nav-open', isOpen);
    document.querySelectorAll('#nav-toggle-btn, #mobile-more-btn').forEach(control => control.setAttribute('aria-expanded', String(isOpen)));
    const nav = document.getElementById('nav');
    nav.setAttribute('aria-hidden', String(!isOpen));
    nav.toggleAttribute('inert', !isOpen);
    nav.querySelectorAll('a, button').forEach(control => {
      if (isOpen) control.removeAttribute('tabindex');
      else control.setAttribute('tabindex', '-1');
    });
    if (isOpen && mobile && !WR.ui._navScrollLock) {
      WR.ui._navScrollLock = { scrollY: window.scrollY, top: document.body.style.top };
      document.body.style.top = `-${window.scrollY}px`;
      document.body.classList.add('nav-scroll-locked');
      document.getElementById('content')?.setAttribute('inert', '');
    } else if ((!isOpen || !mobile) && WR.ui._navScrollLock) {
      const locked = WR.ui._navScrollLock;
      WR.ui._navScrollLock = null;
      document.body.classList.remove('nav-scroll-locked');
      document.body.style.top = locked.top;
      document.getElementById('content')?.removeAttribute('inert');
      window.scrollTo(0, locked.scrollY);
    }
    if (isOpen) {
      nav.scrollTop = 0;
      [...nav.querySelectorAll('a, button')].find(control => control.getClientRects().length)?.focus({ preventScroll: true });
    } else if (restoreFocus) {
      document.getElementById(mobile ? 'mobile-more-btn' : 'nav-toggle-btn')?.focus({ preventScroll: true });
    }
  }
  WR.ui.closeNavigation = () => setNavigationOpen(false);
  window.addEventListener('hashchange', () => setNavigationOpen(false));
  window.addEventListener('resize', () => {
    if (WR.ui._navScrollLock && !window.matchMedia('(max-width: 900px)').matches) setNavigationOpen(false);
  });

  function updateNavigationLayout(topbar) {
    if (!topbar?.isConnected) return;
    let fits = false;
    if (window.matchMedia('(min-width: 901px)').matches) {
      topbar.classList.add('nav-measuring');
      const styles = getComputedStyle(topbar);
      const selectors = ['.brand', '.nav-horizontal', '.nav-wide-actions', '.theme-toggle', '.nav-account'];
      const widths = selectors.map(selector => {
        const element = topbar.querySelector(selector);
        return element && getComputedStyle(element).display !== 'none' ? Math.max(element.scrollWidth, element.getBoundingClientRect().width) : 0;
      }).filter(width => width > 0);
      const required = widths.reduce((sum, width) => sum + width, 0) + (parseFloat(styles.columnGap) || 0) * (widths.length - 1);

  function priorityBadge(priority) {

  /** Small "▲/▼ vs previous period" indicator; `value === null` renders nothing (no baseline to compare against yet). */
  function deltaBadge(value, currency, fmt, label) {
    if (value === null || value === undefined || !Number.isFinite(value)) return '';
    if (Math.abs(value) < 0.005) return `<span class="delta neutral">No change ${label}</span>`;
    const positive = value > 0;
    const arrow = positive ? '\u25B2' : '\u25BC';
    return `<span class="delta ${positive ? 'positive' : 'negative'}">${arrow} ${currency} ${fmt(Math.abs(value))} ${label}</span>`;
  }

  /** Records one net worth snapshot per calendar month automatically; the fixed id makes repeat calls idempotent. */
  async function ensureMonthlyNetWorthSnapshot(s) {
    const today = new Date().toISOString().slice(0, 10);
    const thisMonth = today.slice(0, 7);
    const hasWealthData = s.assets.length || s.investments.length || s.debts.length || s.activePotBalance || s.emergencyFundBalance;
    if (!hasWealthData || s.netWorthHistory.some((h) => String(h.date).startsWith(thisMonth))) return;
    const snap = {
      id: `auto-${thisMonth}`,
      date: today,
      totalAssets: s.netWorth.totalAssets,
      totalLiabilities: s.netWorth.totalLiabilities,
      netWorth: s.netWorth.netWorth,
      currency: s.profile.baseCurrency,
      auto: true,
    };
    try {
      await WR.repos.netWorthSnapshots.add(snap);
      s.netWorthHistory.push(snap);
    } catch (err) {
      console.warn('Automatic net worth snapshot failed', err);
    }
  }

  function calculateDebtFreeProgress(s) {
    const F = WR.financial;
    const base = s.profile.baseCurrency;
    let original = 0;
    let current = 0;
    const open = [];
    s.debts.forEach((d) => {
      const from = d.currency || base;
      const cur = F.convertCurrency(d.currentBalance, from, base, s.exchangeRates);
      const orig = F.convertCurrency(d.originalBalance || d.currentBalance, from, base, s.exchangeRates);
      const min = F.convertCurrency(d.minPayment, from, base, s.exchangeRates);
      if (!cur.converted || !orig.converted || !min.converted) return;
      original += Math.max(orig.value, cur.value);
      current += cur.value;
      if (cur.value > 0.01) open.push({ ...d, currentBalance: cur.value, minPayment: min.value });
    });
    if (!open.length) return null;
    const strategy = WR.ui._debtStrategy || 'avalanche';
    const ordered = strategy === 'snowball' ? F.orderDebtsSnowball(open)
      : strategy === 'hybrid' ? F.orderDebtsHybrid(open)
        : F.orderDebtsAvalanche(open);
    const plan = F.simulateDebtPayoff(ordered, WR.ui._debtExtra || 0);
    const freeDate = new Date();
    freeDate.setDate(1);
    freeDate.setMonth(freeDate.getMonth() + plan.months);
    return {
      paidPct: original > 0 ? Math.max(0, Math.min(100, ((original - current) / original) * 100)) : 0,
      paid: Math.max(0, original - current),
      remaining: current,
      months: plan.reachedSafetyCap ? null : plan.months,
      freeDateLabel: plan.reachedSafetyCap ? null : `${WR.ui.monthName(freeDate.getMonth() + 1)} ${freeDate.getFullYear()}`,
      strategy,
    };
  }

  /** Quarterly/yearly items are only due every 3/12 months counted from their anchor month. */
  function isDueInMonth(frequency, anchorMonth, monthKey) {
    if (frequency !== 'quarterly' && frequency !== 'yearly' && frequency !== 'annual') return true;
    if (!anchorMonth) return true;
    const elapsed = (Number(monthKey.slice(0, 4)) - Number(anchorMonth.slice(0, 4))) * 12
      + Number(monthKey.slice(5, 7)) - Number(anchorMonth.slice(5, 7));
    return elapsed >= 0 && elapsed % (frequency === 'quarterly' ? 3 : 12) === 0;
  }

  function upcomingBills(s, days) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const horizon = new Date(today);
    horizon.setDate(horizon.getDate() + days);
    const items = [];
    s.fixedExpenses.forEach((e) => {
      if (!(Number(e.dueDay) > 0)) return;
      items.push({
        id: e.id, repo: 'fixedExpenses', billStatuses: e.billStatuses || {},
        name: e.name, kind: 'Bill', dueDay: Number(e.dueDay),
        amount: Number(e.amount) || 0, currency: e.currency || s.profile.baseCurrency,
        isDue: (mk) => WR.ui.isActiveForMonth(e, mk) && isDueInMonth(e.frequency, e.startMonth, mk),
      });
    });
    s.debts.forEach((d) => {
      if (!(Number(d.dueDay) > 0)) return;
      items.push({
        id: d.id, repo: 'debts', billStatuses: d.billStatuses || {},
        name: d.name, kind: 'Debt payment', dueDay: Number(d.dueDay),
        amount: Math.min(Number(d.currentBalance) || 0, ['quarterly', 'yearly'].includes(d.paymentFrequency) ? Number(d.minPayment) || 0 : WR.financial.monthlyMinPayment(d)), currency: d.currency || s.profile.baseCurrency,
        isDue: (mk) => (Number(d.currentBalance) > 0.01 || s.debtPayments.some((payment) => payment.debtId === d.id && payment.month === mk)) && isDueInMonth(d.paymentFrequency, String(d.startDate || '').slice(0, 7), mk),
        hasPayment: (mk) => s.debtPayments.some((p) => p.debtId === d.id && p.month === mk),
      });
    });
    const bills = [];
    items.forEach((item) => {
      const months = new Set(Object.keys(item.billStatuses));
      for (const offset of [0, 1]) {
        const monthStart = new Date(today.getFullYear(), today.getMonth() + offset, 1);
        months.add(`${monthStart.getFullYear()}-${String(monthStart.getMonth() + 1).padStart(2, '0')}`);
      }
      months.forEach((monthKey) => {
        const monthStart = new Date(Number(monthKey.slice(0, 4)), Number(monthKey.slice(5, 7)) - 1, 1);
        const lastDay = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 0).getDate();
        const due = new Date(monthStart.getFullYear(), monthStart.getMonth(), Math.min(item.dueDay, lastDay));
        const status = item.billStatuses[monthKey];
        if (due > horizon || (status !== 'unpaid' && !item.isDue(monthKey))) return;
        const paid = item.repo === 'debts' ? !!item.hasPayment(monthKey) : status === 'paid';
        if (item.repo === 'debts' && item.amount <= 0 && !paid) return;
        const amount = paid && item.repo === 'debts' ? s.debtPayments.filter((payment) => payment.debtId === item.id && payment.month === monthKey).reduce((sum, payment) => sum + Number(payment.amount), 0) : item.amount;
        bills.push({ ...item, amount, monthKey, paid, due, daysAway: Math.round((due - today) / 86400000) });
      });
    });
    return bills.sort((a, b) => a.due - b.due);
  }

  function escapeText(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

// Variable Expenses view: manage variable expenses for a selected month.
// Every cell is directly editable,
// sortable by column, category-taggable, and confirms before deleting.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const SORTABLE_COLUMNS = [
    { field: 'name', label: 'Name' },
    { field: 'budgetAmount', label: 'Budget' },
    { field: 'actualAmount', label: 'Actual' },
    { field: 'diff', label: 'Diff' },
  ];

  function categoryOptions(categories, selectedId) {
    return (
      `<option value="">\u2014 none \u2014</option>` +
      categories.map((c) => `<option value="${WR.ui.escapeText(c.id)}" ${c.id === selectedId ? 'selected' : ''}>${WR.ui.escapeText(c.name)}</option>`).join('')
    );
  }

  function sortLines(lines, categoriesById, sort) {
    const withDerived = lines.map((l) => ({
      ...l,
      categoryName: l.categoryId && categoriesById[l.categoryId] ? categoriesById[l.categoryId].name : '',
      diff: l.actualAmount - l.budgetAmount,
    }));
    withDerived.sort((a, b) => {
      const av = a[sort.field];
      const bv = b[sort.field];
      const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
      return sort.dir === 'asc' ? cmp : -cmp;
    });
    return withDerived;
  }

  async function renderTransactions(container) {
    const month = WR.ui._transactionsMonth || WR.ui.currentBudgetMonth();
    WR.ui._transactionsMonth = month;
    const dates = WR.ui.payCycleDates(month);
    const sort = WR.ui._transactionsSort || { field: 'name', dir: 'asc' };
    if (!SORTABLE_COLUMNS.some(column => column.field === sort.field)) sort.field = 'name';
    WR.ui._transactionsSort = sort;

    const [lines, profile, prevLines] = await Promise.all([
      WR.queries.getBudgetLinesByMonth(month),
      WR.ui.getOrCreateProfile(),
      WR.queries.getBudgetLinesByMonth(WR.ui.previousMonthKey(month)),
    ]);
    // Borrowed-from-emergency-fund lines are one-off events, not part of a recurring budget.
    const prevVariableLines = prevLines.filter((line) => line.type === 'variable' && line.name !== 'Emergency Fund Borrowed');
    const sortedLines = sortLines(lines.filter((line) => line.type === 'variable'), {}, sort);
    const totalBudget = sortedLines.reduce((sum, l) => sum + l.budgetAmount, 0);
    const totalActual = sortedLines.reduce((sum, l) => sum + l.actualAmount, 0);

    const headerCells = SORTABLE_COLUMNS.map(
      (col) =>
        `<th class="sortable" data-sort-field="${col.field}">${WR.ui.escapeText(col.label)}${sort.field === col.field ? (sort.dir === 'asc' ? ' \u2191' : ' \u2193') : ''}</th>`,
    ).join('');

    const rows = sortedLines
      .map(
        (l) => `
      <tr data-id="${WR.ui.escapeText(l.id)}">
        <td><input class="cell" data-field="name" value="${WR.ui.escapeText(l.name)}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="budgetAmount" value="${WR.ui.escapeText(l.budgetAmount)}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="actualAmount" value="${WR.ui.escapeText(l.actualAmount)}"></td>
        <td class="num diff-cell">${WR.ui.fmt(l.diff)}</td>
        <td><button class="link-btn delete-line" data-id="${WR.ui.escapeText(l.id)}">Delete</button></td>
      </tr>`,
      )
      .join('');

    WR.ui.setHTML(container, `
      <h1>Variable Expenses</h1>
      <div class="toolbar">
        <label>Pay cycle:
          <input type="month" id="month-picker" value="${WR.ui.escapeText(month)}">
        </label>
      </div>
      <p class="fine-print">This cycle runs from ${WR.ui.escapeText(dates.start)} to ${WR.ui.escapeText(dates.endExclusive)} (next payday excluded). Changes save immediately. Record each expense here or in Transactions, not both.</p>
      ${sortedLines.length === 0 && prevVariableLines.length > 0 ? `
      <div class="notice-card copy-budget-card">
        <span>Start from last cycle? Copies ${prevVariableLines.length} line${prevVariableLines.length === 1 ? '' : 's'} with their budget amounts (actuals start at 0).</span>
        <button type="button" id="copy-last-month-btn">Copy last cycle's budget</button>
      </div>` : ''}

      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Total Budgeted</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(totalBudget)}</span></div>
        <div class="stat"><span class="stat-label">Total Actual</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(totalActual)}</span></div>
        <div class="stat"><span class="stat-label">Difference</span><span class="stat-value ${totalActual - totalBudget > 0 ? 'negative' : ''}">${profile.baseCurrency} ${WR.ui.fmt(totalActual - totalBudget)}</span></div>
      </div>

      <table class="data-table">
        <thead><tr>${headerCells}<th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="empty">No variable expenses yet for this month \u2014 add one below.</td></tr>'}</tbody>
      </table>

      <h3>Add a line</h3>
      <form id="add-line-form" class="inline-form">
        <input name="recordName" placeholder="Name (e.g. Groceries)" required>
        <input name="budgetAmount" type="number" step="0.01" min="0" placeholder="Budget" required>
        <input name="actualAmount" type="number" step="0.01" min="0" placeholder="Actual" required>
        <button type="submit">Add</button>
      </form>
    `);

    document.getElementById('copy-last-month-btn')?.addEventListener('click', async (event) => {
      event.currentTarget.disabled = true;
      await Promise.all(prevVariableLines.map((line) => WR.repos.budgetLines.add(WR.models.createBudgetLine({
        month,
        type: 'variable',
        name: line.name,
        categoryId: line.categoryId,
        budgetAmount: Number(line.budgetAmount) || 0,
        actualAmount: 0,
        currency: line.currency || profile.baseCurrency,
      }))));
      WR.ui.notify(`Copied ${prevVariableLines.length} budget line${prevVariableLines.length === 1 ? '' : 's'} from last cycle.`, 'success');
      renderTransactions(container);
    });

    document.getElementById('month-picker').addEventListener('change', (e) => {
      WR.ui._transactionsMonth = e.target.value;
      renderTransactions(container);
    });

    container.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        const field = th.dataset.sortField;
        if (sort.field === field) {
          sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          WR.ui._transactionsSort = { field, dir: 'asc' };
        }
        renderTransactions(container);
      });
    });

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const line = await WR.repos.budgetLines.getById(id);
          if (!line) return;
          const field = input.dataset.field;
          if (field === 'budgetAmount' || field === 'actualAmount') {
            line[field] = Math.max(0, parseFloat(input.value) || 0);
            input.value = line[field];
          } else if (field === 'categoryId') {
            line.categoryId = input.value || undefined;
          } else {
            line[field] = input.value;
          }
          await WR.repos.budgetLines.update(line);
          WR.ui.flashSaved(input);

          const diffCell = tr.querySelector('.diff-cell');
          if (diffCell) diffCell.textContent = WR.ui.fmt(line.actualAmount - line.budgetAmount);
        });
      });
    });

    container.querySelectorAll('.delete-line').forEach((btn) => {
      btn.addEventListener('click', async () => {
        await WR.ui.removeWithUndo({
          repo: WR.repos.budgetLines,
          id: btn.dataset.id,
          entityLabel: 'Transaction',
          afterChange: async () => { await renderTransactions(container); },
        });
      });
    });

    document.getElementById('add-line-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const line = WR.models.createBudgetLine({
        month,
        type: 'variable',
        name: form.elements.recordName.value,
        budgetAmount: Math.max(0, parseFloat(form.budgetAmount.value) || 0),
        actualAmount: Math.max(0, parseFloat(form.actualAmount.value) || 0),
        currency: profile.baseCurrency,
      });
      await WR.repos.budgetLines.add(line);
      renderTransactions(container);
    });
  }

  async function renderSavings(container) {
    const month = WR.ui._savingsMonth || WR.ui.currentMonthKey();
    WR.ui._savingsMonth = month;

    const [lines, profile, allLines] = await Promise.all([
      WR.queries.getBudgetLinesByMonth(month),
      WR.ui.getOrCreateProfile(),
      WR.repos.budgetLines.getAll(),
    ]);
    const savings = lines
      .filter((line) => line.type === 'savings')
      .sort((a, b) => a.name.localeCompare(b.name));
    const totalPlanned = savings.reduce((sum, l) => sum + l.budgetAmount, 0);
    const totalSaved = savings.reduce((sum, l) => sum + l.actualAmount, 0);
    const carriedBalance = allLines.filter((line) => line.type === 'savings' && line.month < month)
      .reduce((sum, line) => sum + (Number(line.actualAmount) || 0), 0);

    const rows = savings.map((line) => `
      <tr data-id="${WR.ui.escapeText(line.id)}">

        type: 'savings',

        budgetAmount: Math.max(0, parseFloat(form.budgetAmount.value) || 0),
        actualAmount: Math.max(0, parseFloat(form.actualAmount.value) || 0),

      renderSavings(container);
      if (container.id === 'general-savings') WR.ui.renderSavingsPage(container.closest('#content'));
