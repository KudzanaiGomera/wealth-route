    <style>
/* WealthRoute design tokens. A "private ledger" feel: warm paper or deep
   ink backdrop, a literary serif for the numbers that matter, deep emerald
   as the one accent that does real work, gold reserved for medium-priority
   signal so it doesn't compete with the primary accent. */

:root {
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  --bg: #f6f4ee;
  --panel: #ffffff;
  --panel-alt: #fbfaf5;
  --text: #171a19;
  --muted: #5b6560;
  --border: #e3e0d3;
  --accent: #0e6b57;
  --accent-contrast: #ffffff;
  --gold: #a9781f;
  --danger: #a6332b;
  --success: #2e7d4f;
  --shadow: 0 1px 2px rgba(23, 26, 25, 0.04);

  --chart-1: #0e6b57;
  --chart-2: #a9781f;
  --chart-3: #5b6560;
  --chart-4: #7c9c93;
  --chart-5: #c4a468;
}

:root[data-theme="dark"] {
  --bg: #101615;
  --panel: #171f1d;
  --panel-alt: #1c2422;
  --text: #e8ece9;
  --muted: #93a19a;
  --border: #283330;
  --accent: #34b493;
  --accent-contrast: #06120e;
  --gold: #dcab52;
  --danger: #e2685f;
  --success: #59c48a;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);

  --chart-1: #34b493;
  --chart-2: #dcab52;
  --chart-3: #93a19a;
  --chart-4: #6c9186;
  --chart-5: #c9ac72;
}

*, *::before, *::after { box-sizing: border-box; }

html { min-width: 320px; max-width: 100%; overflow-x: clip; }

body {
  margin: 0;
  max-width: 100%;
  overflow-x: clip;
  font-family: var(--font-sans);
  background:
    radial-gradient(circle at 8% 10%, color-mix(in srgb, var(--accent) 12%, transparent) 0, transparent 35%),
    radial-gradient(circle at 90% 0%, color-mix(in srgb, var(--gold) 12%, transparent) 0, transparent 28%),
    var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.15s ease;
}

button, a, input, select, textarea {
  -webkit-tap-highlight-color: transparent;
}

/* ---------- Auth gate ---------- */
.app-splash {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(1.5rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
  background:
    radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent) 18%, transparent) 0, transparent 40%),
    var(--bg);
}
.app-splash {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(1.5rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
  background:
    radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent) 18%, transparent) 0, transparent 40%),
    var(--bg);
  animation: splash-enter 0.45s ease-out;
  transition: opacity 0.32s ease, transform 0.32s ease, filter 0.32s ease;
}
.app-splash.is-hiding {
  opacity: 0;
  transform: scale(0.98);
  filter: blur(2px);
}
.app-splash-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.95rem;
  width: min(300px, 72vw);
  padding: 1.5rem 1.25rem 1.1rem;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--panel) 90%, transparent);
  border-radius: 22px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
  animation: splash-card-rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.splash-mark {
  width: 64px;
  height: 64px;
  filter: drop-shadow(0 10px 18px color-mix(in srgb, var(--accent) 18%, transparent));
}
.splash-mark path { stroke: var(--accent); }
.splash-mark circle { fill: var(--accent); }
.splash-name {
  font-family: var(--font-serif);
  font-size: clamp(1.2rem, 2.2vw, 1.5rem);
  letter-spacing: 0.03em;
}
.splash-status {
  color: var(--muted);
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.splash-bar {
  width: 140px;
  height: 4px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--border) 74%, transparent);
  overflow: hidden;
}
.splash-bar span {
  display: block;
  width: 34%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 52%, var(--gold)));
  animation: splash-pulse 1.2s ease-in-out infinite;
}
@keyframes splash-enter {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes splash-card-rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes splash-pulse {
  0% { transform: translateX(-25%) scaleX(0.75); opacity: 0.6; }
  50% { transform: translateX(150%) scaleX(1); opacity: 1; }
  100% { transform: translateX(330%) scaleX(0.75); opacity: 0.6; }
}
.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(1.5rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
}
.auth-card {
  width: 100%;
  max-width: 380px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 2rem 1.75rem;
}
.auth-brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-serif);
  font-size: 1.15rem;
  color: var(--text);
  margin-bottom: 1.4rem;
}
.auth-brand .brand-mark path { stroke: var(--accent); }
.auth-brand .brand-mark circle { fill: var(--accent); }
.auth-card h1 { margin: 0 0 0.35rem; font-size: 1.5rem; }
.auth-subtitle { margin: 0 0 1.3rem; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
.auth-google-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 600;
  padding: 0.65rem;
  border-radius: 9px;
}
.auth-google-btn:hover { background: var(--panel-alt); }
.auth-google-btn:disabled { opacity: 0.6; }
.auth-divider {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 1.1rem 0;
  color: var(--muted);
  font-size: 0.78rem;
}
.auth-divider::before, .auth-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}
.auth-form { display: flex; flex-direction: column; gap: 0.9rem; }
.auth-form label {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  font-size: 0.83rem;
  color: var(--muted);
}
.auth-form input {
  height: 2.5rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-alt);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.92rem;
  padding: 0 0.75rem;
}
.auth-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.auth-form button[type="submit"] {
  height: 2.6rem;
  border: none;
  border-radius: 9px;
  background: var(--accent);
  color: var(--accent-contrast);
  font-family: var(--font-sans);
  font-size: 0.94rem;
  font-weight: 600;
  margin-top: 0.2rem;
}
.auth-form button[type="submit"]:disabled { opacity: 0.7; }
.auth-error {
  margin: 0;
  min-height: 1.1em;
  color: var(--danger);
  font-size: 0.83rem;
}
.auth-switch {
  margin: 1.3rem 0 0;
  text-align: center;
  font-size: 0.86rem;
  color: var(--muted);
}
.auth-switch .link-btn { font-weight: 600; }

/* ---------- Top bar ---------- */

.topbar {
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border-bottom: 1px solid var(--border);
  /* env(safe-area-inset-*) keeps controls clear of notches/status bars when
     launched standalone from the home screen (needs viewport-fit=cover). */
  padding: calc(0.85rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right)) 0.85rem calc(1.5rem + env(safe-area-inset-left));
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: nowrap;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(8px);
}
.brand {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.65rem;
  letter-spacing: 0.01em;
  color: var(--text);
  text-decoration: none;
}
.brand:hover { color: var(--accent); }
.brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.brand-mark { flex-shrink: 0; }
.brand { min-width: 0; }
.brand-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-mark path { stroke: var(--accent); }
.brand-mark circle { fill: var(--accent); }

.nav-horizontal {
  display: none;
  align-items: center;
  gap: 0.15rem;
  min-width: 0;
  overflow-x: auto;
}
.nav-horizontal a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.86rem;
  padding: 0.4rem 0.6rem;
  border-radius: 7px;
  white-space: nowrap;
}
.nav-horizontal a.active {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  font-weight: 600;
}
.nav-horizontal a:hover { background: var(--panel-alt); }
.nav-expanded-link { display: none; }
.nav-wide-actions { display: flex; align-items: center; gap: 0.5rem; position: absolute; visibility: hidden; pointer-events: none; }
.nav-wide-actions .nav-install-btn { min-height: 44px; padding: 0.45rem 0.7rem; font-size: 0.8rem; white-space: nowrap; }
.nav-wide-actions .nav-wide-support { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-alt); color: var(--muted); }
.nav-wide-actions .nav-support-icon { width: 20px; height: 20px; fill: currentColor; }
.nav-account:empty { display: none; }

.nav-account {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: auto;
  flex-shrink: 0;
}
.nav-account-email {
  font-size: 0.8rem;
  color: var(--muted);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.nav-account-link {
  font-size: 0.86rem;
  text-decoration: none;
  color: var(--muted);
  padding: 0.4rem 0.6rem;
  border-radius: 7px;
  border: 1px solid var(--border);
  white-space: nowrap;
}
.nav-account-link:hover { background: var(--panel-alt); }
.nav-account-link-accent {
  color: var(--accent-contrast, #fff);
  background: var(--accent);
  border-color: var(--accent);
}
.nav-account-link-accent:hover { opacity: 0.9; background: var(--accent); }

#nav {
  display: flex;
  gap: 0.2rem;
  flex-wrap: nowrap;
  flex-direction: column;
  position: absolute;
  right: 1rem;
  top: calc(100% + 0.45rem);
  min-width: 230px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 0.4rem;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-4px);
  transition: opacity 0.16s ease, transform 0.16s ease;
}
#nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.88rem;
  padding: 0.45rem 0.55rem;
  border-bottom: none;
  border-radius: 7px;
}
#nav a.active {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  font-weight: 600;
}
#nav a:hover { background: var(--panel-alt); }
#nav .nav-section-title {
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.35rem 0.55rem 0.2rem;
}
#nav .nav-divider {
  height: 1px;
  background: var(--border);
  margin: 0.3rem 0.2rem;
}
.nav-action-item {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.88rem;
  padding: 0.45rem 0.55rem;
  border-radius: 7px;
  cursor: pointer;
  min-height: 44px;
  -webkit-tap-highlight-color: transparent;
}
.nav-action-item:hover { background: var(--panel-alt); }
.nav-action-item.nav-action-danger { color: var(--danger); }
.nav-action-item.nav-action-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
#nav a.nav-support-link {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-height: 44px;
  color: #128c4a;
  font-weight: 600;
}
#nav a.nav-support-link:hover { background: color-mix(in srgb, #25d366 12%, transparent); }
.nav-support-icon { width: 1.15rem; height: 1.15rem; fill: #25d366; flex-shrink: 0; }
.nav-install-btn {
  width: 100%;
  min-height: 44px;
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
  border-radius: 10px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 13%, var(--panel)), var(--panel));
  color: var(--accent);
  font-weight: 700;
  text-align: center;
  padding: 0.6rem 0.8rem;
  margin: 0.2rem 0 0.35rem;
}
.nav-install-btn:hover {
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 18%, var(--panel)), var(--panel-alt));
}
#nav a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.topbar.nav-open #nav {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.nav-controls {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: auto;
  flex-shrink: 0;
}

.nav-jump {
  height: 2.1rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-alt);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.83rem;
  padding: 0 0.85rem;
  min-width: 190px;
}

.nav-toggle {
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel-alt);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.nav-toggle-bars {
  width: 0.9rem;
  height: 0.7rem;
  display: grid;
  align-content: space-between;
}

.nav-toggle-bars span {
  display: block;
  height: 2px;
  border-radius: 2px;
  background: var(--text);
}

.theme-toggle {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text);
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--accent); }

#content { width: 100%; max-width: 1280px; margin: 0 auto; padding: 1.75rem clamp(1rem, 3vw, 2rem) 3rem; }
#content > section { animation: sectionIn 220ms ease-out; }

.global-notice {
  max-width: 980px;
  margin: 0.75rem auto 0;
  padding: 0 1.5rem;
}
.global-notice .notice-card {
  border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border));
  background: color-mix(in srgb, var(--danger) 9%, var(--panel));
  border-radius: 10px;
  padding: 0.8rem 1rem;
  font-size: 0.86rem;
}

.toast-stack {
  position: fixed;
  right: calc(1rem + env(safe-area-inset-right));
  bottom: calc(1rem + env(safe-area-inset-bottom));
  display: grid;
  gap: 0.5rem;
  z-index: 60;
}
.toast {
  min-width: 220px;
  max-width: 360px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 0.65rem 0.75rem;
  box-shadow: var(--shadow);
  font-size: 0.84rem;
}
.toast.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.65rem;
}
.toast-action {
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.22rem 0.6rem;
  cursor: pointer;
  white-space: nowrap;
}
.toast.success { border-color: color-mix(in srgb, var(--success) 40%, var(--border)); }
.toast.error { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }

@keyframes sectionIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Type scale ---------- */

h1 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 500; margin: 0 0 0.25rem; }
h2 { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 500; margin: 1.75rem 0 0.6rem; }
h3 { font-size: 0.95rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
.month-label { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.9rem; }

/* ---------- Dashboard hero ---------- */

.hero { margin-bottom: 0.5rem; }
.greeting { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.2rem; }
.position-summary-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.9fr;
  gap: 1.35rem;
  margin: 0.3rem 0 1rem;
  align-items: stretch;
}
.dashboard-card {
  position: relative;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.4rem 1.45rem;
  box-shadow: var(--shadow);
}
.dashboard-card::before {
  content: none;
}
.dashboard-card > * { position: relative; }
.dashboard-card h2 {
  margin-top: 0;
}
.dashboard-card h1, .dashboard-card h2 { letter-spacing: 0; }
.dashboard-heading { display: flex; justify-content: space-between; align-items: end; gap: 1rem; margin: 0.4rem 0 1.25rem; }
.dashboard-heading h1 { margin: 0.25rem 0 0; font-size: 1.6rem; }
.dashboard-heading .month-label { margin: 0; font-size: 0.85rem; }
.position-card { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 6%, var(--panel)), var(--panel)); border-color: var(--border); color: var(--text); }
.position-card .stat-label { color: var(--muted); }
.balance-heading { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.visibility-toggle { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 44px; width: 44px; height: 44px; padding: 0; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-alt); color: var(--text); }
.visibility-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.position-card .visibility-toggle { background: var(--panel-alt); border-color: var(--border); color: var(--muted); }
.position-card .visibility-toggle:hover { color: var(--accent); border-color: var(--accent); }
.position-card .visibility-toggle:focus-visible { outline-color: var(--accent); }
.password-field { position: relative; min-width: 0; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.65rem; margin: 1rem 0; }

}
.day-category-meter { height: 4px; border-radius: 999px; background: var(--border); overflow: hidden; margin-top: 0.65rem; }

.day-activity { margin-top: 2rem; }

.day-date-group th span { margin-left: 0.75rem; font-weight: 400; color: var(--muted); }
.data-table.day-ledger { table-layout: fixed; min-width: 900px; }
.day-ledger th:nth-child(1) { width: 145px; }
.day-ledger th:nth-child(4) { width: 150px; }

.data-table.day-ledger td { padding: 0.65rem; }
.day-ledger tr[data-id]:hover { background: color-mix(in srgb, var(--accent) 4%, var(--panel)); }
.data-table.day-ledger td input.cell, .data-table.day-ledger td select.cell { min-width: 0; min-height: 36px; border-radius: 4px; }
.day-ledger input[data-field="date"] { color-scheme: light; }
:root[data-theme="dark"] .day-ledger input[data-field="date"] { color-scheme: dark; }
.day-ledger .day-amount { display: flex; align-items: center; gap: 0.2rem; color: var(--muted); }
.day-ledger .day-amount input { text-align: right; font-variant-numeric: tabular-nums; }

.data-table.day-ledger td input.cell[type="checkbox"], #payday-form input[type="checkbox"], #day-add-form input[type="checkbox"] { width: 1rem; min-width: 1rem; height: 1rem; min-height: 1rem; flex: 0 0 1rem; accent-color: var(--accent); }
#payday-form .payday-check, #payday-form .payday-check span { display: flex; align-items: flex-start; gap: 0.5rem; }

@media (max-width: 680px) {
  .data-table.day-ledger { min-width: 0; }

  .day-ledger tbody, .day-ledger tr, .day-ledger td, .day-ledger .day-date-group th { display: block; }
  .day-ledger .day-date-group th { width: 100%; padding: 0.65rem 0.8rem; font-size: 0.78rem; }
  .day-date-group th span { float: right; margin-left: 0.5rem; font-size: 0.72rem; }
  .day-ledger tr[data-id] { display: grid; grid-template-columns: minmax(0, 1fr) minmax(80px, 105px) 44px; gap: 0 0.35rem; align-items: center; padding: 0.7rem; border-bottom: 1px solid var(--border); }

  .day-ledger td:nth-child(2) { grid-column: 1; grid-row: 1; }
  .day-ledger td:nth-child(3) { grid-column: 1; grid-row: 2; }

  .day-ledger .day-mobile-value { display: block; overflow-wrap: anywhere; }
  .day-mobile-description { font-size: 0.92rem; font-weight: 500; line-height: 1.3; }
  .day-mobile-category { color: var(--muted); font-size: 0.75rem; line-height: 1.3; padding-top: 0.2rem; }
  .day-mobile-amount { width: 100%; font-size: 0.95rem; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .day-ledger tr.is-editing .day-mobile-value { display: none; }
  .day-ledger .delete-day { display: none; }
  .day-row-toggle { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; font-size: 0.73rem; background: transparent; border: 1px solid var(--border); color: var(--muted); }

.day-suggestion-card { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: 8px; padding: 1rem; margin: 1rem 0; box-shadow: var(--shadow); }
.day-suggestion-card h2 { margin: 0 0 0.35rem; }

/* ---------- Emergency fund ---------- */

.ef-summary {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1.25rem;
  background: linear-gradient(135deg, color-mix(in srgb, var(--panel-alt) 92%, var(--accent)) 0%, var(--panel) 60%);
  border: 1px solid var(--border);

  padding: 1.4rem 1.5rem;

.ef-summary-main .stat-label { font-size: 0.85rem; }

.ef-summary-side { display: flex; gap: 1.75rem; flex-wrap: wrap; }
.ef-summary-side .stat-value { font-size: 1.15rem; margin-top: 0.15rem; }

.ef-account-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.9rem; margin: 0 0 1.35rem; }
.emergency-target + .ef-account-grid { margin-top: 1rem; }
.ef-account-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; box-shadow: var(--shadow); }
.ef-account-card h3 { margin: 0; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
.ef-account-card .amount { display: block; font-family: var(--font-serif); font-size: 1.55rem; margin-top: 0.3rem; }
.ef-account-card .amount.negative { color: var(--danger); }
.ef-account-card .share { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 0.15rem; }
.ef-meter { height: 0.45rem; border-radius: 999px; background: var(--panel-alt); overflow: hidden; margin-top: 0.65rem; border: 1px solid var(--border); }
.ef-meter span { display: block; height: 100%; width: var(--share); background: linear-gradient(90deg, var(--accent), var(--gold)); }

.ef-activity-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.2rem; margin: 0 0 1.35rem; box-shadow: var(--shadow); }
.ef-activity-card h3 { margin-top: 0; }
.ef-activity-card .toolbar { margin-top: 0; }

.ef-forms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin: 1.25rem 0; }
.ef-form-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.2rem; box-shadow: var(--shadow); }
.ef-form-card h3 { margin-top: 0; }
.ef-form-card.borrow { border-color: color-mix(in srgb, var(--gold) 40%, var(--border)); background: color-mix(in srgb, var(--gold) 6%, var(--panel)); }
.ef-form-card.transfer { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); background: color-mix(in srgb, var(--accent) 5%, var(--panel)); }
.ef-form-card .inline-form { margin: 0.5rem 0 0; }

/* ---------- Health score ---------- */

.health-score {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.1rem 1.25rem;
  margin: 1.25rem 0;
}

.score-item-head strong { color: var(--text); font-weight: 600; }

.fine-print { font-size: 0.8rem; color: var(--muted); }
.suggestions-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.95rem 1.1rem;
  margin: 1rem 0;
}

.suggestions-card ul { margin: 0.4rem 0 0; padding-left: 1.2rem; }
.suggestions-card li { margin-bottom: 0.4rem; }

.debt-calendar-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.95rem 1.1rem;
  margin-bottom: 0.9rem;
}

.month-btn {
  padding: 0.4rem 0.3rem;
  border: 1px solid var(--border);

.debt-calendar-stats { display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: 0.85rem; margin-top: 0.4rem; }
.debt-calendar-stats strong { font-family: var(--font-serif); }
.debt-list-card { min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin: 0 0 1rem; box-shadow: var(--shadow); }
.debt-list-card h2 { margin: 0; }
.debt-list-card > .fine-print { margin: 0.25rem 0 0.85rem; }
.debt-list-card .table-wrap { margin: 0; }

.payoff-section { border-top: 2px solid var(--border); padding-top: 1.4rem; margin: 2rem 0; min-width: 0; }
.payoff-section h2 { margin: 0 0 0.25rem; }
.payoff-controls { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 0.8rem; margin: 1rem 0; max-width: 740px; }
.payoff-controls label { display: grid; gap: 0.35rem; color: var(--muted); font-size: 0.82rem; font-weight: 600; }
.payoff-controls select, .payoff-controls input { width: 100%; min-width: 0; min-height: 2.8rem; padding: 0.5rem 0.65rem; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
.payoff-results { min-width: 0; background: var(--panel-alt); border-top: 3px solid var(--accent); padding: 1.1rem; }
.payoff-results h3 { margin: 1.3rem 0 0.5rem; }
.payoff-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
.payoff-metrics > div { min-width: 0; border-bottom: 1px solid var(--border); padding: 0.3rem 0 0.75rem; }
.payoff-metrics span { display: block; color: var(--muted); font-size: 0.78rem; }
.payoff-metrics strong { display: block; font-family: var(--font-serif); font-size: 1.2rem; font-weight: 600; margin-top: 0.3rem; overflow-wrap: anywhere; }
.payoff-order { padding-left: 1.5rem; margin: 0; }
.payoff-order li { padding: 0.55rem 0; border-bottom: 1px solid var(--border); }
.payoff-order li::marker { color: var(--accent); font-weight: 700; }
.payoff-order li span { overflow-wrap: anywhere; }
.payoff-order li strong { float: right; margin-left: 1rem; font-variant-numeric: tabular-nums; }

/* ---------- Recommendations ---------- */

.recommendations { margin: 1.5rem 0; }
.rec-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--muted);
  border-radius: 8px;
  padding: 0.95rem 1.1rem;
  margin-bottom: 0.7rem;
}
.rec-card.p-high { border-left-color: var(--danger); border-left-width: 4px; }
.rec-card.p-medium { border-left-color: var(--gold); }
.rec-card.p-low { border-left-color: var(--success); }
.rec-head { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.45rem; }
.rec-index { color: var(--muted); font-family: var(--font-serif); }
.rec-title { font-weight: 600; flex: 1; }
.badge {
  font-size: 0.72rem;
  padding: 0.1rem 0.55rem;
  border-radius: 999px;
  border: 1px solid currentColor;
  font-weight: 600;
}
.badge.p-high { color: var(--danger); }
.badge.p-medium { color: var(--gold); }
.badge.p-low { color: var(--success); }
.rec-card p { margin: 0.3rem 0; font-size: 0.9rem; color: var(--text); }
.rec-card p strong { color: var(--muted); font-weight: 600; }

/* ---------- Charts ---------- */

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
.charts > *, .summary-charts > *, .position-summary-grid > *, .assistant-workspace > * { min-width: 0; }
.chart-block { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; box-shadow: var(--shadow); }
.chart-block svg, .chart-block canvas { display: block; width: 100%; max-width: 100%; height: auto; }
.chart-block svg text { fill: var(--muted); font-family: var(--font-sans); }

.summary-charts {
  display: grid;
  grid-template-columns: repeat(2, minmax(280px, 1fr));
  gap: 1rem;
  margin: 1rem 0 1.25rem;
}

.pie-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.pie-layout {
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 0.8rem;
  align-items: center;
}

.pie-legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.35rem;
  font-size: 0.82rem;
}

.pie-legend li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.legend-label {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

.legend-dot {
  width: 0.62rem;
  height: 0.62rem;
  border-radius: 999px;
  display: inline-block;
}

.legend-value {
  font-family: var(--font-serif);
}

/* ---------- Tables ---------- */

.table-wrap {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  margin: 0.75rem 0;
}
.feature-section { margin: 1.5rem 0 2rem; padding: 1.25rem 0; border-top: 2px solid var(--border); min-width: 0; }
.feature-section > h1 { font-size: 1.25rem; }
.feature-section > h2 { margin-top: 0; }

/* ---------- Base fields (zero specificity, so component styles still win) ---------- */

      totalLiabilities,

(function () {
  const MAX_MONTHS = 600; // 50-year safety cap, so a payment too small to ever

  /** Highest interest rate first — minimises total interest paid. */
  function orderAvalanche(debts) {
    return [...debts].sort((a, b) => b.interestRate - a.interestRate);
  }

  /** Smallest balance first — maximises early "wins" for motivation. */
  function orderSnowball(debts) {
    return [...debts].sort((a, b) => a.currentBalance - b.currentBalance);
  }

  /**
   * Blends interest rate and balance so a merely-elevated rate on a huge
   * balance can still outrank a tiny balance at a very high rate. Weights
   * are parameters, not hidden constants, so the ordering stays inspectable.
   */
  function orderHybrid(debts, weights) {
    const w = weights || { interestWeight: 0.7, balanceWeight: 0.3 };
    if (debts.length === 0) return [];
    const maxRate = Math.max(...debts.map((d) => d.interestRate)) || 1;
    const maxBalance = Math.max(...debts.map((d) => d.currentBalance)) || 1;
    const scored = debts.map((d) => ({
      debt: d,
      score: w.interestWeight * (d.interestRate / maxRate) + w.balanceWeight * (1 - d.currentBalance / maxBalance),
    }));
    scored.sort((a, b) => b.score - a.score);
    return scored.map((s) => s.debt);
  }

  /**
   * Simulates paying off a set of debts month by month. Every open debt
   * always gets at least its minimum payment; all extra payment (plus any
   * minimums freed up as debts get fully paid off) goes to whichever debt
   * is first, still open, in `orderedDebts`.
   *
   * @param {Array} orderedDebts - pre-sorted by avalanche/snowball/hybrid

   * @returns {{
   *   months: number, totalInterestPaid: number,
   *   payoffOrder: Array<{name: string, monthsToPayoff: number|null}>,
   *   reachedSafetyCap: boolean

   */

    const balances = orderedDebts.map((d) => ({
      name: d.name,
      balance: Math.max(0, Number(d.currentBalance) || 0),
      monthlyRate: Math.max(0, Number(d.interestRate) || 0) / 12,
      minPayment: WR.financial.monthlyMinPayment(d),
      paidOffMonth: (Number(d.currentBalance) || 0) <= 0.01 ? 0 : null,
    }));

    let month = 0;
    let totalInterestPaid = 0;
    let extraPool = Math.max(0, Number(extraMonthlyPayment) || 0);

    while (balances.some((b) => b.balance > 0.01) && month < MAX_MONTHS) {
      month += 1;

      balances.forEach((b) => {
        if (b.balance > 0) {
          const interest = b.balance * b.monthlyRate;
          b.balance += interest;
          totalInterestPaid += interest;
        }
      });

      balances.forEach((b) => {
        if (b.balance > 0) {
          b.balance -= Math.min(b.minPayment, b.balance);
        }
      });

      let pool = extraPool;
      for (const b of balances) {
        if (b.balance > 0 && pool > 0) {
          const payment = Math.min(pool, b.balance);
          b.balance -= payment;
          pool -= payment;
        }
      }

      balances.forEach((b) => {
        if (b.balance <= 0.01 && b.paidOffMonth === null) {
          b.paidOffMonth = month;
          extraPool += b.minPayment; // rollover: freed-up minimum joins next month's extra pool
        }
      });
    }

      months: month,
      totalInterestPaid,
      payoffOrder: balances.map((b) => ({ name: b.name, monthsToPayoff: b.paidOffMonth })),

    const withExtra = simulatePayoff(orderedDebts, extraMonthlyPayment);

      monthsSaved: withoutExtra.months - withExtra.months,

      withExtra,

   * payment (floored at 0, doesn't go negative); investments grow by an
   * assumed annual return and receive a fixed monthly contribution.
   * Everything else that makes up net worth today (property, vehicles, etc.)

   * @param {number} params.currentDebtTotal

   * @param {number} params.monthlyInvestmentContribution
   * @param {number} params.debtInterestAnnual - weighted average, fraction
   * @param {number} params.investmentReturnAnnual - assumed, fraction, never guaranteed

      monthlyInvestmentContribution,
      debtInterestAnnual,
      investmentReturnAnnual,
    } = params;

window.WR = window.WR || {};

   * @param {Array} allBudgetLines

  function aggregateMonthlyTotals(allBudgetLines) {

      }

      else if (line.type === 'fixed') bucket.fixed += line.actualAmount;
      else if (line.type === 'variable') bucket.variable += line.actualAmount;
      else if (line.type === 'savings') bucket.savings += line.actualAmount;
      else if (line.type === 'debtPayment') bucket.debtPayments += line.actualAmount;

      .map(([label, value]) => ({ label, value }))

  function validateImportRow(row) {
    const problems = [];
    if (!row.name || String(row.name).trim() === '') problems.push('Missing name/description');
    if (row.amount === undefined || row.amount === '' || Number.isNaN(Number(row.amount))) {
      problems.push('Missing or invalid amount');

   * thousands separators, and accounting-style negatives like "(500.00)"

   * @param {*} raw
   */

    const str = String(raw ?? '').trim();

   * @param {Array<Object>} rawRows
   * @param {{name?: string, amount?: string, type?: string, month?: string, currency?: string}} mapping
   * @param {{type?: string, month?: string, currency?: string}} constants
   */
  function applyMapping(rawRows, mapping, constants) {
    return rawRows.map((raw) => {
      const name = mapping.name ? raw[mapping.name] : undefined;
      const amountRaw = mapping.amount ? raw[mapping.amount] : undefined;
      const amount = typeof amountRaw === 'number' ? amountRaw : parseAmount(amountRaw);
      const type = constants.type || (mapping.type ? raw[mapping.type] : undefined);
      const month = constants.month || (mapping.month ? raw[mapping.month] : undefined);
      const currency = constants.currency || (mapping.currency ? raw[mapping.currency] : 'ZAR');

      return { name, amount, type, month, currency };

  /**
   * Imports validated rows as BudgetLine records via the repository layer.
   * Rows that fail validation are skipped and returned separately, rather
   * than silently importing bad data.
   * @param {Array<Object>} mappedRows
   */
  async function importBudgetLines(mappedRows) {
    const imported = [];
    const rejected = [];

    for (const row of mappedRows) {
      const problems = validateImportRow(row);
      if (problems.length > 0) {
        rejected.push({ row, problems });
        continue;
      }
      const line = WR.models.createBudgetLine({
        month: row.month,
        type: row.type,
        name: row.name,
        budgetAmount: Number(row.amount),
        actualAmount: Number(row.amount),
        currency: row.currency || 'ZAR',

      await WR.repos.budgetLines.add(line);
      imported.push(line);
    }

    return { imported, rejected };
  }

  /**
   * Exports all current data as a multi-sheet workbook: one sheet per
   * entity. This intentionally does not attempt to reproduce the exact
   * 16-sheet source template (Annual Overview + 12 month sheets + Networth
   * + Goal/Habit trackers) — it exports WealthRoute's own normalised data
   * model instead, which is what round-trips cleanly.
   */
  async function exportWorkbook() {
    const [budgetLines, debts, assets, investments, netWorthSnapshots] = await Promise.all([
      WR.repos.budgetLines.getAll(),
      WR.repos.debts.getAll(),
      WR.repos.assets.getAll(),
      WR.repos.investments.getAll(),
      WR.repos.netWorthSnapshots.getAll(),
    ]);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(budgetLines), 'Budget Lines');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(debts), 'Debts');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assets), 'Assets');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(investments), 'Investments');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(netWorthSnapshots), 'Net Worth History');

    XLSX.writeFile(wb, `wealthroute-export-${new Date().toISOString().slice(0, 10)}.xlsx`);
  }

  WR.excel = {
    loadXlsx,
    parseWorkbook,
    getSheetNames,
    readSheetRows,
    validateImportRow,
    parseAmount,
    applyMapping,
    importBudgetLines,
    exportWorkbook,

window.WR = window.WR || {};

(function () {
  const PALETTE = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)', 'var(--chart-1)'];

  function escapeXml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
  }

  /**
   * @param {Array<{label: string, value: number}>} data
   * @param {{width?: number, height?: number, color?: string}} [options]
   */
  function barChart(data, options) {
    const opts = options || {};
    const width = opts.width || 480;
    const height = opts.height || 240;
    const padding = 32;
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;

    if (data.length === 0) {
      return `<svg width="${width}" height="${height}"><text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="#888">No data</text></svg>`;
    }

    const maxVal = Math.max(...data.map((d) => d.value), 0.01);
    const barWidth = chartW / data.length;

    const bars = data
      .map((d, i) => {
        const barH = (Math.max(d.value, 0) / maxVal) * chartH;
        const x = padding + i * barWidth + barWidth * 0.15;
        const y = padding + (chartH - barH);
        const w = barWidth * 0.7;
        const color = opts.color || PALETTE[i % PALETTE.length];
        return `
          <rect x="${x}" y="${y}" width="${w}" height="${barH}" fill="${color}" rx="2"></rect>
          <text x="${x + w / 2}" y="${height - padding + 14}" text-anchor="middle" font-size="10" fill="#444">${escapeXml(d.label)}</text>
          <text x="${x + w / 2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="#222">${d.value.toFixed(0)}</text>
        `;
      })
      .join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
  }

  /**
   * @param {Array<{label: string, value: number}>} data - ordered chronologically
   * @param {{width?: number, height?: number, color?: string}} [options]
   */
  function lineChart(data, options) {
    const opts = options || {};
    const width = opts.width || 480;
    const height = opts.height || 240;
    const padding = 32;
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;

    if (data.length === 0) {
      return `<svg width="${width}" height="${height}"><text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="#888">No data</text></svg>`;
    }

    const values = data.map((d) => d.value);
    const maxVal = Math.max(...values);
    const minVal = Math.min(...values, 0);
    const range = maxVal - minVal || 1;
    const stepX = data.length > 1 ? chartW / (data.length - 1) : 0;
    const color = opts.color || PALETTE[0];

    const points = data.map((d, i) => {
      const x = padding + i * stepX;
      const y = padding + chartH - ((d.value - minVal) / range) * chartH;
      return { x, y, label: d.label, value: d.value };
    });

    const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const dots = points
      .map(
        (p) =>
          `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"><title>${escapeXml(p.label)}: ${p.value.toFixed(2)}</title></circle>`,
      )
      .join('');
    const labels = points
      .map((p, i) => (i % Math.ceil(points.length / 8 || 1) === 0
        ? `<text x="${p.x.toFixed(1)}" y="${height - padding + 14}" text-anchor="middle" font-size="9" fill="#444">${escapeXml(p.label)}</text>`
        : ''))
      .join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2"></path>
      ${dots}
      ${labels}
    </svg>`;
  }

  /**
   * @param {Array<{label: string, value: number}>} data
   * @param {{size?: number, innerRadius?: number}} [options]
   */
  function pieChart(data, options) {
    const opts = options || {};
    const size = opts.size || 180;
    const radius = size / 2 - 8;
    const innerRadius = opts.innerRadius || radius * 0.58;
    const cx = size / 2;
    const cy = size / 2;

    const valid = (data || []).filter((d) => Number(d.value) > 0);
    const total = valid.reduce((sum, d) => sum + Number(d.value || 0), 0);
    if (!valid.length || total <= 0) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--border)" stroke-width="14"></circle><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--muted)">No data</text></svg>`;
    }

    const arcs = [];
    let start = -Math.PI / 2;
    valid.forEach((item, i) => {
      const angle = (Number(item.value) / total) * Math.PI * 2;
      const end = start + angle;
      const x1 = cx + Math.cos(start) * radius;
      const y1 = cy + Math.sin(start) * radius;
      const x2 = cx + Math.cos(end) * radius;
      const y2 = cy + Math.sin(end) * radius;
      const large = angle > Math.PI ? 1 : 0;
      const color = PALETTE[i % PALETTE.length];
      arcs.push(`<path d="M ${cx} ${cy} L ${x1.toFixed(3)} ${y1.toFixed(3)} A ${radius} ${radius} 0 ${large} 1 ${x2.toFixed(3)} ${y2.toFixed(3)} Z" fill="${color}"></path>`);
      start = end;
    });

    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${arcs.join('')}<circle cx="${cx}" cy="${cy}" r="${innerRadius}" fill="var(--panel)"></circle><text x="${cx}" y="${cy - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">Total</text><text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="14" fill="var(--text)">${total.toFixed(0)}</text></svg>`;
  }

  WR.charts = { barChart, lineChart, pieChart };
})();
// Theme management: defaults to the system preference, persists an
// explicit user choice in localStorage, applied via a data-theme attribute
// on <html> that the CSS custom properties key off.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const STORAGE_KEY = 'wr_theme';

  function getStoredTheme() {
    return localStorage.getItem(STORAGE_KEY);
  }

  function getSystemTheme() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    updateToggleIcon(theme);
  }

  function updateToggleIcon(theme) {
    const btn = document.getElementById('theme-toggle-btn');
    if (!btn) return;
    // Sun icon when in dark mode (click to go light), moon icon when in
    // light mode (click to go dark) \u2014 the icon shown is the destination.
    WR.ui.setHTML(btn, theme === 'dark' ? SUN_ICON : MOON_ICON);
    btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }

  const SUN_ICON =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
  const MOON_ICON =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';

  function initTheme() {
    applyTheme(getStoredTheme() || getSystemTheme());
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || getSystemTheme();
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(STORAGE_KEY, next);
    applyTheme(next);
  }

  WR.ui.initTheme = initTheme;
  WR.ui.toggleTheme = toggleTheme;
  WR.ui.updateToggleIcon = updateToggleIcon;

  // Runs immediately at script load, not on DOMContentLoaded \u2014
  // document.documentElement already exists by the time this executes, and
  // setting the attribute this early avoids a flash of the wrong theme
  // before the rest of the page renders. The toggle button doesn't exist
  // yet at this point; updateToggleIcon() is called again once the shell
  // (with the button) is rendered.
  applyTheme(getStoredTheme() || getSystemTheme());
})();

(function () {
  function currentMonthKey(date) {
    const d = date || new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function monthName(monthNumber) {
    return new Date(2000, monthNumber - 1, 1).toLocaleString('en-ZA', { month: 'long' });
  }

  function yearsAroundCurrent(before, after) {
    const nowYear = new Date().getFullYear();
    const list = [];
    for (let y = nowYear - (before || 2); y <= nowYear + (after || 2); y += 1) list.push(y);
    return list;
  }

  function previousMonthKey(monthKey) {
    const [y, m] = monthKey.split('-').map(Number);
    const d = new Date(y, m - 2, 1); // m is 1-indexed, so m-2 steps back one month
    return currentMonthKey(d);
  }

  async function getOrCreateProfile() {
    const profiles = await WR.repos.userProfile.getAll();
    if (profiles.length > 0) return profiles[0];
    const profile = WR.models.createUserProfile({
      baseCurrency: 'ZAR',
      country: 'South Africa',
      emergencyFundTargetMonths: 3,
      riskProfile: 'moderate',
    });

  function monthlyAmountFromFrequency(amount, frequency) {
    const value = Number(amount) || 0;
    if (frequency === 'weekly') return value * 52 / 12;
    if (frequency === 'biweekly') return value * 26 / 12;
    if (frequency === 'quarterly') return value / 3;
    if (frequency === 'yearly' || frequency === 'annual') return value / 12;

  function isActiveForMonth(record, monthKey) {

    const end = record.endMonth || `${record.year || monthKey.slice(0, 4)}-12`;
    return String(monthKey) >= String(start) && String(monthKey) <= String(end);

  function getDayToDayOpeningAccount(accounts, year) {
    return accounts
      .filter((account) => Number(account.year) <= Number(year))
      .sort((left, right) => Number(right.year) - Number(left.year))[0] || null;
  }

  function calculateDayToDaySummary(accountsOrAccount, transactions, throughMonth) {
    const accounts = Array.isArray(accountsOrAccount) ? accountsOrAccount : [accountsOrAccount].filter(Boolean);
    const month = typeof throughMonth === 'number' ? `${throughMonth}-12` : throughMonth;
    const year = Number(month.slice(0, 4));
    const openingAccount = getDayToDayOpeningAccount(accounts, year);
    const openingYear = Number(openingAccount?.year) || Number(year);
    const opening = Number(openingAccount?.startingBalance) || 0;
    const yearTransactions = transactions.filter((tx) => {
      const transactionMonth = String(tx.date || '').slice(0, 7);
      return transactionMonth >= `${openingYear}-01` && transactionMonth <= month;
    });

      .filter((tx) => tx.kind === 'add')
      .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
    const spent = yearTransactions
      .filter((tx) => tx.kind !== 'add')
      .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
    return {
      opening,
      added: inAmount,
      spent,
      currentBalance: opening + inAmount - spent,
      totalTransactions: yearTransactions.length,
    };

  function calculateDayToDayMonthBalance(accounts, transactions, month) {
    const year = Number(month.slice(0, 4));
    const openingAccount = getDayToDayOpeningAccount(accounts, year);
    const openingYear = Number(openingAccount?.year) || year;
    const opening = Number(openingAccount?.startingBalance) || 0;
    const relevantTransactions = transactions.filter((tx) => {
      const transactionMonth = String(tx.date || '').slice(0, 7);
      return transactionMonth >= `${openingYear}-01` && transactionMonth <= month;
    });

    const confirmed = cycles.filter(cycle => cycle.confirmed && cycle.payDate <= today);

    return api.runTransaction(db, async transaction => {

      const profileSnapshot = await transaction.get(profileRef);

        ...defaults, ...old, confirmed: true, rolloverApplied: true,

  /**
   * @param {string} [monthKey] - 'YYYY-MM', defaults to the current month

  async function buildSnapshot(monthKey) {

    const prevMonth = previousMonthKey(month);
    const selectedYear = Number(month.slice(0, 4));
    const selectedMonthNumber = Number(month.slice(5, 7));

    let [allBudgetLines, debts, assets, investments, exchangeRates, expenseCategories, netWorthHistory, profile, incomeSources, fixedExpenses, emergencyFundContributions, dayToDayAccounts, dayToDayTransactions, savingsPots, debtPayments, payCycles, payAdvances] =
      await Promise.all([
        WR.repos.budgetLines.getAll(),
        WR.repos.debts.getAll(),
        WR.repos.assets.getAll(),
        WR.repos.investments.getAll(),
        WR.repos.exchangeRates.getAll(),
        WR.repos.expenseCategories.getAll(),
        WR.queries.getNetWorthHistory(),
        getOrCreateProfile(),
        WR.repos.incomeSources.getAll(),
        WR.repos.fixedExpenses.getAll(),
        WR.repos.emergencyFundContributions.getAll(),
        WR.repos.dayToDayAccounts.getAll(),
        WR.repos.dayToDayTransactions.getAll(),
        WR.repos.savingsPots.getAll(),
        WR.repos.debtPayments.getAll(),
        WR.repos.payCycles.getAll(),
        WR.repos.payAdvances.getAll(),

      const records = await Promise.all(['budgetLines', 'debts', 'exchangeRates', 'incomeSources', 'fixedExpenses', 'dayToDayAccounts', 'dayToDayTransactions', 'payCycles', 'payAdvances', 'userProfile'].map(store => WR.repos[store].getAll({ fresh: true })));

      const variableAmount = allBudgetLines.filter(line => line.month === cycle.month && line.type === 'variable').reduce((sum, line) => sum + (Number(line.actualAmount) || 0), 0);

      .filter((source) => Number(source.year || selectedYear) === selectedYear && isActiveForMonth(source, month))
      .map((source) => ({
        type: 'income',
        name: source.name,

    const toast = document.createElement('div');
    toast.className = 'toast row';

    const text = document.createElement('span');
    text.textContent = message;

    const button = document.createElement('button');
    button.className = 'toast-action';
    button.type = 'button';
    button.textContent = opts.undoLabel || 'Undo';

    toast.appendChild(text);
    toast.appendChild(button);
    stack.appendChild(toast);

    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    };

    const timer = setTimeout(close, timeoutMs);
    button.addEventListener('click', async () => {
      clearTimeout(timer);
      close();
      try {
        await onUndo();

    if (!topbar?.isConnected) return;

    if (window.matchMedia('(min-width: 901px)').matches) {
      topbar.classList.add('nav-measuring');
      const styles = getComputedStyle(topbar);
      const selectors = ['.brand', '.nav-horizontal', '.nav-wide-actions', '.theme-toggle', '.nav-account'];

        const element = topbar.querySelector(selector);
        return element && getComputedStyle(element).display !== 'none' ? Math.max(element.scrollWidth, element.getBoundingClientRect().width) : 0;
      }).filter(width => width > 0);
      const required = widths.reduce((sum, width) => sum + width, 0) + (parseFloat(styles.columnGap) || 0) * (widths.length - 1);
      const available = topbar.clientWidth - (parseFloat(styles.paddingLeft) || 0) - (parseFloat(styles.paddingRight) || 0);
      fits = required <= available;
    }
    topbar.classList.remove('nav-measuring');
    topbar.classList.toggle('nav-expanded', fits);
    if (fits) {

  function priorityBadge(priority) {

  /** Small "▲/▼ vs previous period" indicator; `value === null` renders nothing (no baseline to compare against yet). */
  function deltaBadge(value, currency, fmt, label) {
    if (value === null || value === undefined || !Number.isFinite(value)) return '';
    if (Math.abs(value) < 0.005) return `<span class="delta neutral">No change ${label}</span>`;
    const positive = value > 0;
    const arrow = positive ? '\u25B2' : '\u25BC';
    return `<span class="delta ${positive ? 'positive' : 'negative'}">${arrow} ${currency} ${fmt(Math.abs(value))} ${label}</span>`;
  }

  /** Records one net worth snapshot per calendar month automatically; the fixed id makes repeat calls idempotent. */
  async function ensureMonthlyNetWorthSnapshot(s) {
    const today = new Date().toISOString().slice(0, 10);
    const thisMonth = today.slice(0, 7);
    const hasWealthData = s.assets.length || s.investments.length || s.debts.length;
    if (!hasWealthData || s.netWorthHistory.some((h) => String(h.date).startsWith(thisMonth))) return;
    const snap = {
      id: `auto-${thisMonth}`,
      date: today,
      totalAssets: s.netWorth.totalAssets,
      totalLiabilities: s.netWorth.totalLiabilities,
      netWorth: s.netWorth.netWorth,
      currency: s.profile.baseCurrency,
      auto: true,
    };
    try {
      await WR.repos.netWorthSnapshots.add(snap);
      s.netWorthHistory.push(snap);
    } catch (err) {
      console.warn('Automatic net worth snapshot failed', err);
    }
  }

  function calculateDebtFreeProgress(s) {
    const F = WR.financial;
    const base = s.profile.baseCurrency;
    let original = 0;
    let current = 0;
    const open = [];
    s.debts.forEach((d) => {
      const from = d.currency || base;
      const cur = F.convertCurrency(d.currentBalance, from, base, s.exchangeRates);
      const orig = F.convertCurrency(d.originalBalance || d.currentBalance, from, base, s.exchangeRates);
      const min = F.convertCurrency(d.minPayment, from, base, s.exchangeRates);
      if (!cur.converted || !orig.converted || !min.converted) return;
      original += Math.max(orig.value, cur.value);
      current += cur.value;
      if (cur.value > 0.01) open.push({ ...d, currentBalance: cur.value, minPayment: min.value });
    });
    if (!open.length) return null;
    const strategy = WR.ui._debtStrategy || 'avalanche';
    const ordered = strategy === 'snowball' ? F.orderDebtsSnowball(open)
      : strategy === 'hybrid' ? F.orderDebtsHybrid(open)
        : F.orderDebtsAvalanche(open);
    const plan = F.simulateDebtPayoff(ordered, WR.ui._debtExtra || 0);
    const freeDate = new Date();
    freeDate.setDate(1);
    freeDate.setMonth(freeDate.getMonth() + plan.months);
    return {
      paidPct: original > 0 ? Math.max(0, Math.min(100, ((original - current) / original) * 100)) : 0,
      paid: Math.max(0, original - current),
      remaining: current,
      months: plan.reachedSafetyCap ? null : plan.months,
      freeDateLabel: plan.reachedSafetyCap ? null : `${WR.ui.monthName(freeDate.getMonth() + 1)} ${freeDate.getFullYear()}`,
      strategy,
    };
  }

  /** Quarterly/yearly items are only due every 3/12 months counted from their anchor month. */
  function isDueInMonth(frequency, anchorMonth, monthKey) {
    if (frequency !== 'quarterly' && frequency !== 'yearly' && frequency !== 'annual') return true;
    if (!anchorMonth) return true;
    const elapsed = (Number(monthKey.slice(0, 4)) - Number(anchorMonth.slice(0, 4))) * 12
      + Number(monthKey.slice(5, 7)) - Number(anchorMonth.slice(5, 7));
    return elapsed >= 0 && elapsed % (frequency === 'quarterly' ? 3 : 12) === 0;
  }

  function upcomingBills(s, days) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const horizon = new Date(today);
    horizon.setDate(horizon.getDate() + days);
    const items = [];
    s.fixedExpenses.forEach((e) => {
      if (!(Number(e.dueDay) > 0)) return;
      items.push({
        id: e.id, repo: 'fixedExpenses', billStatuses: e.billStatuses || {},
        name: e.name, kind: 'Bill', dueDay: Number(e.dueDay),
        amount: Number(e.amount) || 0, currency: e.currency || s.profile.baseCurrency,
        isDue: (mk) => WR.ui.isActiveForMonth(e, mk) && isDueInMonth(e.frequency, e.startMonth, mk),
      });
    });
    s.debts.forEach((d) => {
      if (!(Number(d.dueDay) > 0)) return;
      items.push({
        id: d.id, repo: 'debts', billStatuses: d.billStatuses || {},
        name: d.name, kind: 'Debt payment', dueDay: Number(d.dueDay),
        amount: Math.min(Number(d.currentBalance) || 0, ['quarterly', 'yearly'].includes(d.paymentFrequency) ? Number(d.minPayment) || 0 : WR.financial.monthlyMinPayment(d)), currency: d.currency || s.profile.baseCurrency,
        isDue: (mk) => (Number(d.currentBalance) > 0.01 || s.debtPayments.some((payment) => payment.debtId === d.id && payment.month === mk)) && isDueInMonth(d.paymentFrequency, String(d.startDate || '').slice(0, 7), mk),
        hasPayment: (mk) => s.debtPayments.some((p) => p.debtId === d.id && p.month === mk),
      });
    });
    const bills = [];
    items.forEach((item) => {
      const months = new Set(Object.keys(item.billStatuses));
      for (const offset of [0, 1]) {
        const monthStart = new Date(today.getFullYear(), today.getMonth() + offset, 1);
        months.add(`${monthStart.getFullYear()}-${String(monthStart.getMonth() + 1).padStart(2, '0')}`);
      }
      months.forEach((monthKey) => {
        const monthStart = new Date(Number(monthKey.slice(0, 4)), Number(monthKey.slice(5, 7)) - 1, 1);
        const lastDay = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 0).getDate();
        const due = new Date(monthStart.getFullYear(), monthStart.getMonth(), Math.min(item.dueDay, lastDay));
        const status = item.billStatuses[monthKey];
        if (due > horizon || (status !== 'unpaid' && !item.isDue(monthKey))) return;
        const paid = item.repo === 'debts' ? !!item.hasPayment(monthKey) : status === 'paid';
        if (item.repo === 'debts' && item.amount <= 0 && !paid) return;
        const amount = paid && item.repo === 'debts' ? s.debtPayments.filter((payment) => payment.debtId === item.id && payment.month === monthKey).reduce((sum, payment) => sum + Number(payment.amount), 0) : item.amount;
        bills.push({ ...item, amount, monthKey, paid, due, daysAway: Math.round((due - today) / 86400000) });
      });
    });
    return bills.sort((a, b) => a.due - b.due);
  }

  function escapeText(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

// Variable Expenses view: manage variable expenses for a selected month.
// Every cell is directly editable,
// sortable by column, category-taggable, and confirms before deleting.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const SORTABLE_COLUMNS = [
    { field: 'name', label: 'Name' },
    { field: 'categoryName', label: 'Category' },
    { field: 'budgetAmount', label: 'Budget' },
    { field: 'actualAmount', label: 'Actual' },
    { field: 'diff', label: 'Diff' },
  ];

  function categoryOptions(categories, selectedId) {
    return (
      `<option value="">\u2014 none \u2014</option>` +
      categories.map((c) => `<option value="${WR.ui.escapeText(c.id)}" ${c.id === selectedId ? 'selected' : ''}>${WR.ui.escapeText(c.name)}</option>`).join('')
    );
  }

  function sortLines(lines, categoriesById, sort) {
    const withDerived = lines.map((l) => ({
      ...l,
      categoryName: l.categoryId && categoriesById[l.categoryId] ? categoriesById[l.categoryId].name : '',
      diff: l.actualAmount - l.budgetAmount,
    }));
    withDerived.sort((a, b) => {
      const av = a[sort.field];
      const bv = b[sort.field];
      const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
      return sort.dir === 'asc' ? cmp : -cmp;
    });
    return withDerived;
  }

  async function renderTransactions(container) {
    const month = WR.ui._transactionsMonth || WR.ui.currentBudgetMonth();
    WR.ui._transactionsMonth = month;
    const dates = WR.ui.payCycleDates(month);
    const sort = WR.ui._transactionsSort || { field: 'type', dir: 'asc' };
    WR.ui._transactionsSort = sort;

    const [lines, profile, categories, prevLines] = await Promise.all([
      WR.queries.getBudgetLinesByMonth(month),
      WR.ui.getOrCreateProfile(),
      WR.repos.expenseCategories.getAll(),
      WR.queries.getBudgetLinesByMonth(WR.ui.previousMonthKey(month)),
    ]);
    // Borrowed-from-emergency-fund lines are one-off events, not part of a recurring budget.
    const prevVariableLines = prevLines.filter((line) => line.type === 'variable' && line.name !== 'Emergency Fund Borrowed');
    const variableCategories = categories.filter((category) => category.type === 'variable');
    const categoriesById = Object.fromEntries(variableCategories.map((c) => [c.id, c]));

    const sortedLines = sortLines(lines.filter((line) => line.type === 'variable'), categoriesById, sort);
    const totalBudget = sortedLines.reduce((sum, l) => sum + l.budgetAmount, 0);
    const totalActual = sortedLines.reduce((sum, l) => sum + l.actualAmount, 0);

    const headerCells = SORTABLE_COLUMNS.map(
      (col) =>
        `<th class="sortable" data-sort-field="${col.field}">${WR.ui.escapeText(col.label)}${sort.field === col.field ? (sort.dir === 'asc' ? ' \u2191' : ' \u2193') : ''}</th>`,
    ).join('');

    const rows = sortedLines
      .map(
        (l) => `
      <tr data-id="${WR.ui.escapeText(l.id)}">
        <td><input class="cell" data-field="name" value="${WR.ui.escapeText(l.name)}"></td>
        <td><select class="cell" data-field="categoryId">${categoryOptions(variableCategories, l.categoryId)}</select></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="budgetAmount" value="${WR.ui.escapeText(l.budgetAmount)}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="actualAmount" value="${WR.ui.escapeText(l.actualAmount)}"></td>
        <td class="num diff-cell">${WR.ui.fmt(l.diff)}</td>
        <td><button class="link-btn delete-line" data-id="${WR.ui.escapeText(l.id)}">Delete</button></td>
      </tr>`,
      )
      .join('');

    WR.ui.setHTML(container, `
      <h1>Variable Expenses</h1>
      <div class="toolbar">
        <label>Pay cycle:
          <input type="month" id="month-picker" value="${WR.ui.escapeText(month)}">
        </label>
      </div>
      <p class="fine-print">This cycle runs from ${WR.ui.escapeText(dates.start)} to ${WR.ui.escapeText(dates.endExclusive)} (next payday excluded). Changes save immediately. Record each expense here or in Transactions, not both.</p>
      ${sortedLines.length === 0 && prevVariableLines.length > 0 ? `
      <div class="notice-card copy-budget-card">
        <span>Start from last cycle? Copies ${prevVariableLines.length} line${prevVariableLines.length === 1 ? '' : 's'} with their budget amounts (actuals start at 0).</span>
        <button type="button" id="copy-last-month-btn">Copy last cycle's budget</button>
      </div>` : ''}

      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Total Budgeted</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(totalBudget)}</span></div>
        <div class="stat"><span class="stat-label">Total Actual</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(totalActual)}</span></div>
        <div class="stat"><span class="stat-label">Difference</span><span class="stat-value ${totalActual - totalBudget > 0 ? 'negative' : ''}">${profile.baseCurrency} ${WR.ui.fmt(totalActual - totalBudget)}</span></div>
      </div>

      <table class="data-table">
        <thead><tr>${headerCells}<th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">No variable expenses yet for this month \u2014 add one below.</td></tr>'}</tbody>
      </table>

      <h3>Add a line</h3>
      <form id="add-line-form" class="inline-form">
        <input name="name" placeholder="Name (e.g. Groceries)" required>
        <select name="categoryId">${categoryOptions(variableCategories)}</select>
        <input name="budgetAmount" type="number" step="0.01" min="0" placeholder="Budget" required>
        <input name="actualAmount" type="number" step="0.01" min="0" placeholder="Actual" required>
        <button type="submit">Add</button>
      </form>
    `);

    document.getElementById('copy-last-month-btn')?.addEventListener('click', async (event) => {
      event.currentTarget.disabled = true;
      await Promise.all(prevVariableLines.map((line) => WR.repos.budgetLines.add(WR.models.createBudgetLine({
        month,
        type: 'variable',
        name: line.name,
        categoryId: line.categoryId,
        budgetAmount: Number(line.budgetAmount) || 0,
        actualAmount: 0,
        currency: line.currency || profile.baseCurrency,
      }))));
      WR.ui.notify(`Copied ${prevVariableLines.length} budget line${prevVariableLines.length === 1 ? '' : 's'} from last cycle.`, 'success');
      renderTransactions(container);
    });

    document.getElementById('month-picker').addEventListener('change', (e) => {
      WR.ui._transactionsMonth = e.target.value;
      renderTransactions(container);
    });

    container.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        const field = th.dataset.sortField;
        if (sort.field === field) {
          sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          WR.ui._transactionsSort = { field, dir: 'asc' };
        }
        renderTransactions(container);
      });
    });

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const line = await WR.repos.budgetLines.getById(id);
          if (!line) return;
          const field = input.dataset.field;
          if (field === 'budgetAmount' || field === 'actualAmount') {
            line[field] = Math.max(0, parseFloat(input.value) || 0);
            input.value = line[field];
          } else if (field === 'categoryId') {
            line.categoryId = input.value || undefined;
          } else {
            line[field] = input.value;
          }
          await WR.repos.budgetLines.update(line);
          WR.ui.flashSaved(input);

          const diffCell = tr.querySelector('.diff-cell');
          if (diffCell) diffCell.textContent = WR.ui.fmt(line.actualAmount - line.budgetAmount);
        });
      });
    });

    container.querySelectorAll('.delete-line').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this transaction? This cannot be undone.')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.budgetLines,
          id: btn.dataset.id,
          entityLabel: 'Transaction',
          afterChange: async () => { await renderTransactions(container); },
        });
      });
    });

    document.getElementById('add-line-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const line = WR.models.createBudgetLine({
        month,
        type: 'variable',
        name: form.name.value,
        categoryId: form.categoryId.value || undefined,
        budgetAmount: Math.max(0, parseFloat(form.budgetAmount.value) || 0),
        actualAmount: Math.max(0, parseFloat(form.actualAmount.value) || 0),
        currency: profile.baseCurrency,
      });
      await WR.repos.budgetLines.add(line);
      renderTransactions(container);
    });
  }

  async function renderSavings(container) {
    const month = WR.ui._savingsMonth || WR.ui.currentMonthKey();
    WR.ui._savingsMonth = month;

    const [lines, profile, allLines] = await Promise.all([
      WR.queries.getBudgetLinesByMonth(month),
      WR.ui.getOrCreateProfile(),
      WR.repos.budgetLines.getAll(),
    ]);
    const savings = lines
      .filter((line) => line.type === 'savings')
      .sort((a, b) => a.name.localeCompare(b.name));
    const totalPlanned = savings.reduce((sum, l) => sum + l.budgetAmount, 0);
    const totalSaved = savings.reduce((sum, l) => sum + l.actualAmount, 0);
    const carriedBalance = allLines.filter((line) => line.type === 'savings' && line.month < month)
      .reduce((sum, line) => sum + (Number(line.actualAmount) || 0), 0);

    const rows = savings.map((line) => `
      <tr data-id="${WR.ui.escapeText(line.id)}">
        <td><input class="cell" data-field="name" value="${WR.ui.escapeText(line.name)}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="budgetAmount" value="${WR.ui.escapeText(line.budgetAmount)}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="actualAmount" value="${WR.ui.escapeText(line.actualAmount)}"></td>
        <td class="num diff-cell">${WR.ui.fmt(line.actualAmount - line.budgetAmount)}</td>
        <td><button class="link-btn delete-saving" data-id="${WR.ui.escapeText(line.id)}">Delete</button></td>
      </tr>
    `).join('');

    WR.ui.setHTML(container, `
      ${container.id === 'general-savings' ? '<h2>Savings</h2>' : '<h1>Savings</h1>'}
      <div class="toolbar">
        <label>Month:
          <input type="month" id="savings-month-picker" value="${WR.ui.escapeText(month)}">
        </label>
      </div>
      <p class="fine-print">Enter new contributions for this month. Unused savings carry forward; do not re-enter last month's balance.</p>

      <div class="savings-total-card">
        <div>
          <span class="stat-label">Available savings</span>
          <strong class="savings-total-value">${profile.baseCurrency} ${WR.ui.fmt(carriedBalance + totalSaved)}</strong>
