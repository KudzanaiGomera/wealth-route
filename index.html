// Dedicated pages for recurring income/fixed expenses, emergency fund,
// day-to-day money, and financial insights.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const RECURRING_FREQUENCIES = ['weekly', 'biweekly', 'monthly', 'quarterly', 'yearly'];

  function recurringFrequencyOptions(selected) {
    return RECURRING_FREQUENCIES
      .map((frequency) => `<option value="${WR.ui.escapeText(frequency)}" ${frequency === selected ? 'selected' : ''}>${frequency}</option>`)
      .join('');
  }

  function categoryOptions(categories, selectedId, type) {
    const filtered = (categories || []).filter((category) => !type || category.type === type);
    return `<option value="">— none —</option>${filtered.map((category) => `<option value="${WR.ui.escapeText(category.id)}" ${category.id === selectedId ? 'selected' : ''}>${WR.ui.escapeText(category.name)}</option>`).join('')}`;
  }

  function isMonthRangeValid(startMonth, endMonth) {
    if (!startMonth || !endMonth) return true;
    return String(startMonth) <= String(endMonth);
  }

  async function savePayCycle(month, fields) {
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)) throw new Error('Choose a valid budget month.');
    const value = input => {
      const number = Number(input);
      if (!Number.isFinite(number) || number < 0) throw new Error('Amounts must be zero or greater.');
      return Math.round(number * 100) / 100;
    };
    const payDate = WR.ui.payCycleDates(month).start;
    if (fields.confirmed && payDate > new Date().toISOString().slice(0, 10)) throw new Error('A future payday can only be saved as a plan.');
    let allocations = (fields.allocations || []).map(item => ({ potId: String(item.potId || ''), amount: value(item.amount) }));
    if (allocations.some(item => !item.potId || item.amount <= 0)) throw new Error('Choose a pot and a positive amount for each savings allocation.');
    const api = WR.account.getFirestoreApi();
    const db = WR.account.getDb();
    const uid = WR.account.getCurrentUser()?.uid;
    if (!uid) throw new Error('Not signed in.');
    const cycleRef = api.doc(db, 'users', uid, 'payCycles', month);
    await api.runTransaction(db, async transaction => {
      const previous = await transaction.get(cycleRef);
      const old = previous.exists() ? previous.data() : {};
      let incomeChange;
      let profileChange;
      if (fields.incomeTable) {
        const settings = fields.incomeTable;
        const sourceIds = [...new Set([...settings.sources.map(source => source.id), ...(settings.sourceId ? [settings.sourceId] : [])])];
        const sources = await Promise.all(sourceIds.map(async id => {
          const ref = api.doc(db, 'users', uid, 'incomeSources', id);
          const snapshot = await transaction.get(ref);
          let source = snapshot.exists() ? snapshot.data() : settings.newSource;
          if (!source || source.id !== id) return null;
          if (id === settings.sourceId && settings.sourceFields) {
            source = { ...source, ...settings.sourceFields };
            incomeChange = { ref, source };
          }
          if (id === settings.sourceId && settings.removeSource) { incomeChange = { ref, remove: true }; return null; }
          if (id === settings.sourceId && settings.newSource && !snapshot.exists()) incomeChange = { ref, source };
          return source;
        }));
        const active = sources.filter(source => source && Number(source.year || month.slice(0, 4)) === Number(month.slice(0, 4)) && WR.ui.isActiveForMonth(source, month));
        if (settings.autoUseBuffer != null) {
          const ref = api.doc(db, 'users', uid, 'userProfile', settings.profileId);
          const snapshot = await transaction.get(ref);
          if (!snapshot.exists()) throw new Error('Profile no longer exists.');
          profileChange = { ref, profile: { ...snapshot.data(), autoUseBuffer: !!settings.autoUseBuffer } };
        }
        const adjustments = { ...(old.sourceAdjustments || {}) };
        if (!old.sourceAdjustments && active[0]) adjustments[active[0].id] = { advanceAmount: Number(old.advanceAmount) || 0, savingsAmount: old.savingsAmount ?? (old.allocations || []).reduce((sum, item) => sum + Number(item.amount), 0) };
        if (settings.sourceId && settings.adjustment) adjustments[settings.sourceId] = { ...(adjustments[settings.sourceId] || { advanceAmount: 0, savingsAmount: 0 }), ...settings.adjustment };
        Object.keys(adjustments).forEach(id => {
          const adjustment = adjustments[id];
          adjustments[id] = { advanceAmount: value(adjustment.advanceAmount || 0), savingsAmount: value(adjustment.savingsAmount ?? (adjustment.allocations || []).reduce((sum, item) => sum + Number(item.amount), 0)) };
        });
        const advanceAmount = active.reduce((sum, source) => sum + value(adjustments[source.id]?.advanceAmount || 0), 0);
        const savingsAmount = active.reduce((sum, source) => sum + value(adjustments[source.id]?.savingsAmount || 0), 0);
        allocations = [];
        let availableBuffer = old.rolloverApplied ? Number(old.rolloverAvailable) || 0 : settings.availableBuffer;
        let bufferAmount = value(settings.bufferAmount ?? old.bufferAmount ?? 0);
        if (settings.addFunds) {
          if (month !== WR.ui.currentBudgetMonth()) throw new Error('Add new funds to the current budget month.');
          if (!settings.addFunds.id) throw new Error('Missing funds entry ID.');
          if (old.bufferDeposits?.[settings.addFunds.id]) return;
          const amount = value(settings.addFunds.amount);
          if (amount <= 0) throw new Error('Enter an amount greater than zero.');
          if (settings.openingBuffer != null) throw new Error('Add funds separately from balance corrections.');
          availableBuffer = Math.round((availableBuffer + amount) * 100) / 100;
          fields.bufferDeposits = { ...(old.bufferDeposits || {}), [settings.addFunds.id]: { amount, date: new Date().toISOString().slice(0, 10) } };
        }
        if (settings.openingBuffer != null || settings.addFunds) {
          if (payDate > new Date().toISOString().slice(0, 10)) throw new Error('Correct the opening buffer after this pay cycle starts.');
          if (settings.openingBuffer != null) {
            const corrected = Number(settings.openingBuffer);
            if (!Number.isFinite(corrected)) throw new Error('Enter a valid buffer amount.');
            availableBuffer = Math.round(corrected * 100) / 100;
          }
          const profileRef = api.doc(db, 'users', uid, 'userProfile', settings.profileId);
          const profileSnapshot = await transaction.get(profileRef);
          const automatic = profileSnapshot.exists() && profileSnapshot.data().autoUseBuffer;
          bufferAmount = automatic ? Math.max(0, availableBuffer) : Math.min(bufferAmount, Math.max(0, availableBuffer));
          Object.assign(fields, { rolloverApplied: true, rolloverAvailable: availableBuffer, shortfallAmount: Math.max(0, -availableBuffer) });
        }
        if (bufferAmount > Math.max(0, availableBuffer)) throw new Error('Buffer exceeds the available balance.');
        Object.assign(fields, { expectedIncome: active.reduce((sum, source) => sum + WR.ui.monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'), 0), advanceAmount, savingsAmount, bufferAmount, sourceAdjustments: adjustments, confirmed: payDate <= new Date().toISOString().slice(0, 10) });
      }
      const next = { ...old, id: month, month, payDate, expectedIncome: value(fields.expectedIncome), advanceAmount: value(fields.advanceAmount ?? old.advanceAmount ?? 0), bufferAmount: value(fields.bufferAmount ?? old.bufferAmount ?? 0), fixedAmount: value(fields.fixedAmount), variableAmount: value(fields.variableAmount), debtAmount: value(fields.debtAmount), allocations, confirmed: !!fields.confirmed };
      if (fields.incomeTable) {
        next.mode = 'income-table';
        next.savingsAmount = value(fields.savingsAmount);
        if (fields.rolloverApplied) Object.assign(next, { rolloverApplied: true, rolloverAvailable: fields.rolloverAvailable, shortfallAmount: fields.shortfallAmount });
        if (fields.incomeTable.openingBuffer != null) next.bufferCorrected = true;
        if (fields.bufferDeposits) next.bufferDeposits = fields.bufferDeposits;
        if (old.allocations?.length && !old.legacySavingsAllocations) next.legacySavingsAllocations = old.allocations;
      }
      if (fields.sourceAdjustments) next.sourceAdjustments = fields.sourceAdjustments;
      if (WR.ui.calculatePayCycleFunding(next).salary < 0) throw new Error('Advances exceed the expected salary. Correct the salary or advances first.');
      if (WR.ui.calculatePayCycleFunding(next).savings > WR.ui.calculatePayCycleFunding(next).salary) throw new Error('Savings allocations exceed the salary arriving on payday.');
      const deltas = new Map();
      if (old.confirmed && !fields.incomeTable) (old.allocations || []).forEach(item => deltas.set(item.potId, (deltas.get(item.potId) || 0) - Number(item.amount)));
      if (next.confirmed) allocations.forEach(item => deltas.set(item.potId, (deltas.get(item.potId) || 0) + item.amount));
      const potIds = [...new Set([...deltas.keys(), ...allocations.map(item => item.potId)])];
      const pots = await Promise.all(potIds.map(async potId => {
        const ref = api.doc(db, 'users', uid, 'savingsPots', potId);
        const snapshot = await transaction.get(ref);
        if (!snapshot.exists()) throw new Error('A linked savings pot no longer exists.');
        const pot = snapshot.data();
        const delta = Math.round((deltas.get(potId) || 0) * 100) / 100;
        const balance = Math.round(((Number(pot.currentAmount) || 0) + delta) * 100) / 100;
        if (balance < 0) throw new Error('Cannot reverse savings already moved or spent. Restore the money to that pot first.');
        if (pot.archived && (delta > 0 || (!old.confirmed && allocations.some(item => item.potId === potId)))) throw new Error('Choose an active savings pot.');
        return { ref, delta, balance };
      }));
      pots.filter(pot => pot.delta !== 0).forEach(pot => transaction.update(pot.ref, { currentAmount: pot.balance }));
      transaction.set(cycleRef, next);
      if (profileChange) transaction.set(profileChange.ref, profileChange.profile);
      if (incomeChange?.remove) transaction.delete(incomeChange.ref);
      else if (incomeChange) transaction.set(incomeChange.ref, incomeChange.source);
    });
  }

  async function saveIncomeBudget(month, settings = {}) {
    const [snapshot, sources] = await Promise.all([WR.ui.buildSnapshot(month), WR.repos.incomeSources.getAll()]);
    const debtAmount = WR.financial.calculateTotalMinPayments(snapshot.debts, snapshot.exchangeRates, snapshot.profile.baseCurrency);
    await savePayCycle(month, { fixedAmount: snapshot.cashflow.fixedExpenses, variableAmount: snapshot.cashflow.variableExpenses, debtAmount, incomeTable: { sources, availableBuffer: snapshot.payCycleBudget.carryOver, profileId: snapshot.profile.id, ...settings } });
  }
  WR.ui.saveIncomeBudget = saveIncomeBudget;

  async function savePayAdvance(id, fields, remove = false) {
    const validDate = input => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(input || '')) return false;
      const parsed = new Date(`${input}T12:00:00Z`);
      return !Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0, 10) === input;
    };
    if (!remove && (!validDate(fields.receivedDate) || !validDate(fields.payDate) || fields.payDate.slice(-2) !== '25' || fields.receivedDate >= fields.payDate || fields.receivedDate > new Date().toISOString().slice(0, 10) || !Number.isFinite(Number(fields.amount)) || Number(fields.amount) <= 0)) throw new Error('Enter a positive advance received before its future payday on the 25th.');
    const api = WR.account.getFirestoreApi();
    const db = WR.account.getDb();
    const uid = WR.account.getCurrentUser()?.uid;
    if (!uid) throw new Error('Not signed in.');
    const ref = api.doc(db, 'users', uid, 'payAdvances', id);
    await api.runTransaction(db, async transaction => {
      const snapshot = await transaction.get(ref);
      if (!remove && snapshot.exists()) return;
      if (remove && !snapshot.exists()) return;
      const record = remove ? snapshot.data() : { id, amount: Math.round(Number(fields.amount) * 100) / 100, receivedDate: fields.receivedDate, payDate: fields.payDate, transactionId: fields.transactionId || '' };
      const payday = new Date(`${record.payDate}T12:00:00`);
      const month = WR.ui.currentBudgetMonth(payday);
      const cycleRef = api.doc(db, 'users', uid, 'payCycles', month);
      const cycleSnapshot = await transaction.get(cycleRef);
      const cycle = cycleSnapshot.exists() ? cycleSnapshot.data() : { id: month, month, payDate: record.payDate, allocations: [], confirmed: false };
      if (cycle.confirmed) throw new Error('Unconfirm that payday before changing its advances.');
      let linkedRef;
      let linked;
      if (record.transactionId) {
        linkedRef = api.doc(db, 'users', uid, 'dayToDayTransactions', record.transactionId);
        const linkedSnapshot = await transaction.get(linkedRef);
        if (!linkedSnapshot.exists()) throw new Error('The linked transaction no longer exists.');
        linked = linkedSnapshot.data();
        if (!remove && (linked.kind !== 'add' || linked.date !== record.receivedDate || Math.round(Number(linked.amount) * 100) !== Math.round(record.amount * 100) || linked.paydayAdvanceId)) throw new Error('The linked Add money entry must have the same date and amount and must not already be linked.');
      }
      const advanceAmount = Math.round(((Number(cycle.advanceAmount) || 0) + (remove ? -1 : 1) * record.amount) * 100) / 100;
      transaction.set(cycleRef, { ...cycle, advanceAmount: Math.max(0, advanceAmount) });
      if (linkedRef) transaction.set(linkedRef, { ...linked, paydayAdvanceId: remove ? '' : id });
      if (remove) transaction.delete(ref); else transaction.set(ref, record);
    });
  }

    WR.ui.syncBudgetMonth();
    const [profile, incomes, cycles] = await Promise.all([
      fresh ? WR.repos.userProfile.getAll({ fresh: true }).then(profiles => profiles[0] || WR.ui.getOrCreateProfile()) : WR.ui.getOrCreateProfile(),
      WR.repos.incomeSources.getAll({ fresh }),
      WR.repos.payCycles.getAll({ fresh }),
    ]);
    const month = WR.ui._paydayMonth || WR.ui.currentBudgetMonth();
    WR.ui._paydayMonth = month;
    const year = Number(month.slice(0, 4));
    WR.ui._incomeYear = year;
    const summaryMonth = month;
    const defaultStartMonth = month;
    const snapshot = await WR.ui.buildSnapshot(month);
    const saved = snapshot.paydayRecord || cycles.find(cycle => cycle.month === month) || {};
    const active = incomes.filter(source => Number(source.year || year) === year && WR.ui.isActiveForMonth(source, month));
    const adjustments = { ...(saved.sourceAdjustments || {}) };
    if (!saved.sourceAdjustments && active[0]) adjustments[active[0].id] = { advanceAmount: saved.advanceAmount || 0, savingsAmount: saved.savingsAmount ?? (saved.allocations || []).reduce((sum, allocation) => sum + Number(allocation.amount), 0) };
    const savingsTaken = id => Number(adjustments[id]?.savingsAmount ?? (adjustments[id]?.allocations || []).reduce((sum, allocation) => sum + Number(allocation.amount), 0));

    const rows = incomes
      .filter((item) => Number(item.year || year) === year)
      .sort((a, b) => a.name.localeCompare(b.name))
      .map((item) => `
        <tr data-id="${WR.ui.escapeText(item.id)}">
          <td><input class="cell" data-field="name" value="${WR.ui.escapeText(item.name || '')}"></td>
          <td><input class="cell num" data-field="amount" type="number" step="0.01" min="0" value="${WR.ui.escapeText(item.amount || 0)}"></td>
          <td><select class="cell" data-field="frequency">${recurringFrequencyOptions(item.frequency || 'monthly')}</select></td>
          <td><input class="cell" data-field="startMonth" type="month" value="${WR.ui.escapeText(item.startMonth || `${year}-01`)}"></td>
          <td><input class="cell" data-field="endMonth" type="month" value="${WR.ui.escapeText(item.endMonth || `${year}-12`)}"></td>
          <td><input class="cell" data-field="advanceAmount" type="number" step="0.01" min="0" value="${WR.ui.escapeText(adjustments[item.id]?.advanceAmount || 0)}" ${active.some(source => source.id === item.id) ? '' : 'disabled'}></td>
          <td><input class="cell" data-field="savingsAmount" type="number" step="0.01" min="0" value="${WR.ui.escapeText(savingsTaken(item.id))}" ${active.some(source => source.id === item.id) ? '' : 'disabled'}></td>
          <td><button class="link-btn delete-income" data-id="${WR.ui.escapeText(item.id)}">Delete</button></td>
        </tr>`)
      .join('');
    const totalIncome = incomes
      .filter((item) => Number(item.year || year) === year && WR.ui.isActiveForMonth(item, summaryMonth))
      .reduce((sum, item) => sum + WR.ui.monthlyAmountFromFrequency(item.amount, item.frequency || 'monthly') - Number(adjustments[item.id]?.advanceAmount || 0) - savingsTaken(item.id), (Number(saved.bufferAmount) || 0) - (Number(saved.shortfallAmount) || 0));

    WR.ui.setHTML(container, `
      <h1>Income</h1>
      <div class="toolbar"><label>Month<input id="income-month" type="month" value="${WR.ui.escapeText(month)}"></label></div>
      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Total income</span><span class="stat-value" id="income-total">${profile.baseCurrency} ${WR.ui.fmt(totalIncome)}</span></div>
      </div>
      <table class="data-table income-table">
        <thead><tr><th>Source</th><th>Amount (${profile.baseCurrency})</th><th>Frequency</th><th>Start month</th><th>End month</th><th>Advance</th><th>Savings taken</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="empty">No income sources.</td></tr>'}</tbody>
      </table>

      <h3>Add income source</h3>
      <form id="income-add-form" class="inline-form">
        <input name="name" placeholder="Salary, side business, rental" required>
        <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" required>
        <select name="frequency">${recurringFrequencyOptions('monthly')}</select>
        <input name="startMonth" type="month" value="${WR.ui.escapeText(defaultStartMonth)}">
        <input name="endMonth" type="month" value="${WR.ui.escapeText(year)}-12">
        <button type="submit">Add</button>
      </form>
      <p id="income-form-message" class="warning"></p>
      <section class="feature-section income-buffer"><h2>Buffer</h2>
        <div class="buffer-layout">
          <div class="buffer-balance"><span class="stat-label">Available buffer</span><strong class="buffer-value ${snapshot.payCycleBudget.carryOver < 0 ? 'negative' : ''}">${profile.baseCurrency} ${WR.ui.fmt(snapshot.payCycleBudget.carryOver)}</strong>
            <details class="card-edit buffer-edit"><summary>Edit balance</summary>
              <form id="income-buffer-opening-form" class="buffer-form"><label>Available buffer<input name="amount" type="number" step="0.01" value="${WR.ui.escapeText(snapshot.payCycleBudget.carryOver)}" ${WR.ui.payCycleDates(month).start > new Date().toISOString().slice(0, 10) ? 'disabled' : ''} required></label><button type="submit" ${WR.ui.payCycleDates(month).start > new Date().toISOString().slice(0, 10) ? 'disabled' : ''}>Apply</button></form>
            </details>
          </div>
          <div class="buffer-controls">
            <form id="income-buffer-form" class="buffer-form"><label>Add to total income<input name="amount" type="number" step="0.01" min="0" max="${Math.max(0, snapshot.payCycleBudget.carryOver)}" value="${WR.ui.escapeText(saved.bufferAmount || 0)}" required></label><button type="submit">Save</button></form>
            <form id="income-buffer-funds-form" class="buffer-form buffer-funds-form"><label>Add funds<input name="amount" type="number" step="0.01" min="0.01" placeholder="0.00" ${month !== WR.ui.currentBudgetMonth() ? 'disabled' : ''} required></label><button type="submit" ${month !== WR.ui.currentBudgetMonth() ? 'disabled' : ''}>Add</button></form>
            <label class="buffer-auto-control"><span>Use all buffer automatically</span><input id="income-auto-buffer" type="checkbox" role="switch" ${profile.autoUseBuffer ? 'checked' : ''}><span class="buffer-switch" aria-hidden="true"></span></label>
          </div>
        </div>
      </section>
    `);

    document.getElementById('income-month').addEventListener('change', (event) => {
      WR.ui._paydayMonth = event.target.value;
      renderIncome(container);
    });

    container.querySelectorAll('.income-table tbody tr[data-id]').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        if (['amount', 'advanceAmount', 'savingsAmount'].includes(input.dataset.field)) {
          input.addEventListener('input', () => {
            let preview = (Number(saved.bufferAmount) || 0) - (Number(saved.shortfallAmount) || 0);
            container.querySelectorAll('.income-table tbody tr[data-id]').forEach(row => {
              if (!active.some(source => source.id === row.dataset.id)) return;
              const value = field => Number(row.querySelector(`[data-field="${field}"]`).value) || 0;
              const source = incomes.find(item => item.id === row.dataset.id);
              preview += WR.ui.monthlyAmountFromFrequency(value('amount'), source.frequency || 'monthly') - value('advanceAmount') - value('savingsAmount');
            });
            container.querySelector('#income-total').textContent = `${profile.baseCurrency} ${WR.ui.fmt(preview)}`;
          });
        }
        input.addEventListener('change', async () => {
          const field = input.dataset.field;
          try {
            if (['advanceAmount', 'savingsAmount'].includes(field)) {
              const adjustment = { [field]: Number(input.value) };
              await saveIncomeBudget(month, { sourceId: id, adjustment });
            } else {
              const income = await WR.repos.incomeSources.getById(id);
              if (!income) return;
              const sourceFields = { [field]: field === 'amount' ? Number(input.value) : input.value };
              if (field === 'amount' && (!Number.isFinite(sourceFields.amount) || sourceFields.amount < 0)) throw new Error('Enter a valid amount.');
              if (!isMonthRangeValid(sourceFields.startMonth ?? income.startMonth, sourceFields.endMonth ?? income.endMonth)) throw new Error('Invalid month range.');
              await saveIncomeBudget(month, { sourceId: id, sourceFields });
            }
            await renderIncome(container, true);
            WR.ui.enhanceResponsiveContent(container);
          } catch (error) { WR.ui.notify(error.message, 'error'); await renderIncome(container); WR.ui.enhanceResponsiveContent(container); }
        });
      });
    });

    container.querySelectorAll('.delete-income').forEach((button) => {
      button.addEventListener('click', async () => {
        if (!confirm('Delete this income source?')) return;
        try { await saveIncomeBudget(month, { sourceId: button.dataset.id, removeSource: true }); await renderIncome(container, true); WR.ui.enhanceResponsiveContent(container); } catch (error) { WR.ui.notify(error.message, 'error'); }
      });
    });

    document.getElementById('income-add-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const startMonth = form.startMonth.value;
      const endMonth = form.endMonth.value;
      const message = document.getElementById('income-form-message');
      if (!isMonthRangeValid(startMonth, endMonth)) {
        message.textContent = 'Invalid month range: start month must be before or equal to end month.';
        return;
      }
      message.textContent = '';
      const newSource = WR.models.createIncomeSource({
        year,
        name: form.name.value.trim(),
        amount: Math.max(0, parseFloat(form.amount.value) || 0),
        currency: profile.baseCurrency,
        frequency: form.frequency.value,
        startMonth,
        endMonth,
      });
      try { await saveIncomeBudget(month, { sourceId: newSource.id, newSource }); await renderIncome(container, true); WR.ui.enhanceResponsiveContent(container); } catch (error) { message.textContent = error.message; }
    });
    document.getElementById('income-buffer-opening-form').addEventListener('submit', async event => {
      event.preventDefault();
      try { await saveIncomeBudget(month, { openingBuffer: Number(event.currentTarget.elements.amount.value) }); await renderIncome(container, true); WR.ui.enhanceResponsiveContent(container); } catch (error) { WR.ui.notify(error.message, 'error'); }
    });
    document.getElementById('income-buffer-form').addEventListener('submit', async event => {
      event.preventDefault();
      try { await saveIncomeBudget(month, { bufferAmount: Number(event.currentTarget.elements.amount.value) }); await renderIncome(container, true); WR.ui.enhanceResponsiveContent(container); } catch (error) { WR.ui.notify(error.message, 'error'); }
    });
    const depositId = WR.models.newId();
    document.getElementById('income-buffer-funds-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button');
      button.disabled = true;
      try { await saveIncomeBudget(month, { addFunds: { id: depositId, amount: Number(form.elements.amount.value) } }); await renderIncome(container, true); WR.ui.enhanceResponsiveContent(container); } catch (error) { WR.ui.notify(error.message, 'error'); } finally { button.disabled = false; }
    });
    document.getElementById('income-auto-buffer').addEventListener('change', async event => {
      const enabled = event.target.checked;
      try { await saveIncomeBudget(month, { autoUseBuffer: enabled, ...(enabled ? { bufferAmount: Math.max(0, snapshot.payCycleBudget.carryOver) } : {}) }); await renderIncome(container, true); WR.ui.enhanceResponsiveContent(container); } catch (error) { event.target.checked = !enabled; WR.ui.notify(error.message, 'error'); }
    });
  }

  async function renderFixedExpenses(container) {
    const parseDueDay = WR.ui.parseDueDay;
    const [profile, categories, expenses] = await Promise.all([
      WR.ui.getOrCreateProfile(),
      WR.repos.expenseCategories.getAll(),
      WR.repos.fixedExpenses.getAll(),
    ]);

    const rows = expenses
      .sort((a, b) => a.name.localeCompare(b.name))
      .map((expense) => `
        <tr data-id="${WR.ui.escapeText(expense.id)}">
          <td><input class="cell" data-field="name" value="${WR.ui.escapeText(expense.name || '')}"></td>
          <td><input class="cell num" data-field="amount" type="number" step="0.01" min="0" value="${WR.ui.escapeText(expense.amount || 0)}"></td>
          <td><select class="cell" data-field="frequency">${recurringFrequencyOptions(expense.frequency || 'monthly')}</select></td>
          <td><select class="cell" data-field="categoryId">${categoryOptions(categories, expense.categoryId, 'fixed')}</select></td>
          <td><input class="cell" data-field="startMonth" type="month" value="${WR.ui.escapeText(expense.startMonth || WR.ui.currentMonthKey())}"></td>
          <td><input class="cell" data-field="endMonth" type="month" value="${WR.ui.escapeText(expense.endMonth || '')}"></td>
          <td><input class="cell num" data-field="dueDay" type="number" min="1" max="31" step="1" placeholder="—" value="${WR.ui.escapeText(expense.dueDay || '')}"></td>
          <td><button class="link-btn delete-fixed-expense" data-id="${WR.ui.escapeText(expense.id)}">Delete</button></td>
        </tr>`)
      .join('');
    const summaryMonth = WR.ui.currentMonthKey();
    const totalFixedExpenses = expenses
      .filter((expense) => WR.ui.isActiveForMonth(expense, summaryMonth))
      .reduce((sum, expense) => sum + WR.ui.monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'), 0);

    WR.ui.setHTML(container, `
      <h1>Fixed Expenses</h1>
      <p class="fine-print">Recurring fixed expenses are entered once and automatically applied to every applicable month.</p>
      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Monthly Fixed Expenses (${WR.ui.monthName(Number(summaryMonth.slice(5)))} ${summaryMonth.slice(0, 4)})</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(totalFixedExpenses)}</span></div>
      </div>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Amount (${profile.baseCurrency})</th><th>Frequency</th><th>Category</th><th>Start month</th><th>End month</th><th>Due day</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="empty">No fixed expenses yet.</td></tr>'}</tbody>
      </table>

      <h3>Add fixed expense</h3>
      <form id="fixed-add-form" class="inline-form">
        <input name="name" placeholder="Rent, insurance, internet" required>
        <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" required>
        <select name="frequency">${recurringFrequencyOptions('monthly')}</select>
        <select name="categoryId">${categoryOptions(categories, undefined, 'fixed')}</select>
        <input name="startMonth" type="month" value="${WR.ui.escapeText(WR.ui.currentMonthKey())}">
        <input name="endMonth" type="month">
        <input name="dueDay" type="number" min="1" max="31" step="1" placeholder="Due day (1-31)">
        <button type="submit">Add</button>
      </form>
      <p id="fixed-form-message" class="warning"></p>
    `);

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const expense = await WR.repos.fixedExpenses.getById(id);
          if (!expense) return;
          const field = input.dataset.field;
          if (field === 'amount') {
            expense.amount = Math.max(0, parseFloat(input.value) || 0);
            input.value = expense.amount;
          } else if (field === 'dueDay') {
            expense.dueDay = parseDueDay(input.value);
            input.value = expense.dueDay || '';
          } else {
            expense[field] = input.value || undefined;
          }
          if (!isMonthRangeValid(expense.startMonth, expense.endMonth)) {
            WR.ui.notify('Fixed expense month range is invalid.', 'error');
            renderFixedExpenses(container);
            return;
          }
          expense.currency = profile.baseCurrency;
          await WR.repos.fixedExpenses.update(expense);
          WR.ui.flashSaved(input);
        });
      });
    });

    container.querySelectorAll('.delete-fixed-expense').forEach((button) => {
      button.addEventListener('click', async () => {
        if (!confirm('Delete this fixed expense?')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.fixedExpenses,
          id: button.dataset.id,
          entityLabel: 'Fixed expense',
          afterChange: async () => { await renderFixedExpenses(container); },
        });
      });
    });

    document.getElementById('fixed-add-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const message = document.getElementById('fixed-form-message');
      if (!isMonthRangeValid(form.startMonth.value, form.endMonth.value)) {
        message.textContent = 'Invalid month range: start month must be before or equal to end month.';
        return;
      }
      message.textContent = '';
      await WR.repos.fixedExpenses.add(WR.models.createFixedExpense({
        name: form.name.value.trim(),
        amount: Math.max(0, parseFloat(form.amount.value) || 0),
        frequency: form.frequency.value,
        categoryId: form.categoryId.value || undefined,
        startMonth: form.startMonth.value || WR.ui.currentMonthKey(),
        endMonth: form.endMonth.value || undefined,
        dueDay: parseDueDay(form.dueDay.value),
        currency: profile.baseCurrency,
      }));
      renderFixedExpenses(container);
    });
  }

  const DEFAULT_EMERGENCY_FUND_ACCOUNTS = [
    { id: 'moneyclub', label: 'MoneyClub Emergency Fund' },
    { id: 'fnb', label: 'FNB Emergency Fund' },
  ];
  const escapeEf = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  async function renderEmergencyFund(container) {
    const [profile, contributions] = await Promise.all([
      WR.ui.getOrCreateProfile(),
      WR.repos.emergencyFundContributions.getAll(),
    ]);
    const EMERGENCY_FUND_ACCOUNTS = Array.isArray(profile.emergencyFundAccounts) && profile.emergencyFundAccounts.length
      ? profile.emergencyFundAccounts
      : DEFAULT_EMERGENCY_FUND_ACCOUNTS;
    const emergencyFundAccountLabel = (accountId) =>
      (EMERGENCY_FUND_ACCOUNTS.find((a) => a.id === accountId) || EMERGENCY_FUND_ACCOUNTS[0]).label;
    const emergencyFundAccountOptions = (selected) => EMERGENCY_FUND_ACCOUNTS.map((a) =>
      `<option value="${WR.ui.escapeText(a.id)}" ${a.id === selected ? 'selected' : ''}>${escapeEf(a.label)}</option>`).join('');
    const month = WR.ui._emergencyFundMonth || WR.ui.currentMonthKey();
    WR.ui._emergencyFundMonth = month;
    const sorted = contributions.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const countedAmount = (item) => {
      const amount = Number(item.amount) || 0;
      return item.returned && amount < 0 ? 0 : amount;
    };
    const accountOf = (item) => item.account || EMERGENCY_FUND_ACCOUNTS[0].id;
    const total = sorted.reduce((sum, item) => sum + countedAmount(item), 0);
    const totalsByAccount = EMERGENCY_FUND_ACCOUNTS.map((a) => ({
      ...a,
      total: sorted.filter((item) => accountOf(item) === a.id).reduce((sum, item) => sum + countedAmount(item), 0),
    }));
    const monthContributions = sorted.filter((item) => String(item.date || '').slice(0, 7) === month);
    const monthNet = monthContributions.reduce((sum, item) => sum + countedAmount(item), 0);
    const shareOf = (accountTotal) => (total > 0 ? Math.max(0, Math.min(100, (accountTotal / total) * 100)) : 0);
    const snapshot = await WR.ui.buildSnapshot();
    const estimatedTarget = (snapshot.essentialVsDiscretionary.essential || snapshot.cashflow.fixedExpenses) * snapshot.emergencyFundTargetMonths;
    const target = Number(profile.emergencyFundTargetAmount) > 0 ? Number(profile.emergencyFundTargetAmount) : estimatedTarget;
    const targetProgress = target > 0 ? Math.min(100, Math.round(total / target * 100)) : 0;

    const rows = monthContributions.map((item) => {
      const isBorrowed = (Number(item.amount) || 0) < 0 && !item.transferId;
      const returned = Boolean(item.returned);
      return `
      <tr data-id="${WR.ui.escapeText(item.id)}">
        <td><input class="cell" data-field="date" type="date" value="${WR.ui.escapeText(item.date)}"></td>
        <td><select class="cell" data-field="account">${emergencyFundAccountOptions(accountOf(item))}</select></td>
        <td><input class="cell" data-field="amount" type="number" step="0.01" value="${WR.ui.escapeText(item.amount)}"></td>
        <td><input class="cell" data-field="note" value="${WR.ui.escapeText(item.note || '')}"></td>
        <td>${isBorrowed ? `<button class="link-btn toggle-emergency-return" data-id="${WR.ui.escapeText(item.id)}">${returned ? 'Unmark returned' : 'Mark returned'}</button>` : ''}</td>
        <td><button class="link-btn delete-emergency" data-id="${WR.ui.escapeText(item.id)}">Delete</button></td>
      </tr>`;
    }).join('');

    WR.ui.setHTML(container, `
      ${container.id === 'emergency-savings' ? '<h2>Emergency Fund</h2>' : '<h1>Emergency Fund</h1>'}
      <p class="month-label">Track contributions and borrowing across your emergency fund accounts.</p>

      <div class="ef-summary">
        <div class="ef-summary-main">
          <span class="stat-label">Combined balance</span>
          <span class="ef-summary-value ${total < 0 ? 'negative' : ''}">${profile.baseCurrency} ${WR.ui.fmt(total)}</span>
        </div>
        <div class="ef-summary-side">
          <div><span class="stat-label">Selected month net change</span><span class="stat-value ${monthNet < 0 ? 'negative' : ''}">${profile.baseCurrency} ${WR.ui.fmt(monthNet)}</span></div>
          <div><span class="stat-label">Entries this month</span><span class="stat-value">${monthContributions.length}</span></div>
        </div>
      </div>

      <div class="goal-card emergency-target"><h3>Emergency fund target</h3>
        <strong>${targetProgress}% Complete</strong><div class="goal-meter" role="progressbar" aria-valuenow="${targetProgress}" aria-valuemin="0" aria-valuemax="100"><span style="width:${targetProgress}%"></span></div>
        <p>${target > 0 ? `${profile.baseCurrency} ${WR.ui.fmt(total)} of ${profile.baseCurrency} ${WR.ui.fmt(target)}` : 'Set a target amount to track your progress.'}</p>
        <form id="emergency-target-form" class="inline-form"><label>Target amount (${profile.baseCurrency}):
          <input name="target" type="number" min="0.01" step="0.01" value="${WR.ui.escapeText(Number(profile.emergencyFundTargetAmount) || '')}" required></label>
          <button type="submit">Save target</button></form></div>

      <div class="ef-account-grid">
        ${totalsByAccount.map((a) => `
        <div class="ef-account-card">
          <h3>${escapeEf(a.label)}</h3>
          <span class="amount ${a.total < 0 ? 'negative' : ''}">${profile.baseCurrency} ${WR.ui.fmt(a.total)}</span>
          <span class="share">${shareOf(a.total).toFixed(0)}% of combined balance</span>
          <div class="ef-meter"><span style="--share:${shareOf(a.total)}%"></span></div>
        </div>`).join('')}
      </div>

      ${container.id !== 'emergency-savings' ? `<div class="ef-activity-card">
        <h3>Activity</h3>
        <div class="toolbar"><label>Month: <input id="emergency-fund-month" type="month" value="${WR.ui.escapeText(month)}"></label></div>
        <table class="data-table">
          <thead><tr><th>Date</th><th>Account</th><th>Contribution (${profile.baseCurrency})</th><th>Note</th><th>Returned</th><th></th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="empty">No emergency fund activity for this month.</td></tr>'}</tbody>
        </table>
      </div>` : ''}

      <div class="ef-forms-grid">
        <div class="ef-form-card">
          <h3>Add contribution</h3>
          <form id="emergency-add-form" class="inline-form">
            <input name="date" type="date" value="${WR.ui.escapeText(new Date().toISOString().slice(0, 10))}" required>
            <select name="account" required>${emergencyFundAccountOptions()}</select>
            <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" required>
            <input name="note" placeholder="Optional note">
            <button type="submit">Add</button>
          </form>
        </div>

        <div class="ef-form-card borrow">
          <h3>Borrow from emergency fund</h3>
          <p class="fine-print">This reduces the selected account's balance and records the same amount as a variable expense named “Emergency Fund Borrowed” for the selected month.</p>
          <form id="emergency-borrow-form" class="inline-form">
            <input name="date" type="date" value="${WR.ui.escapeText(new Date().toISOString().slice(0, 10))}" required>
            <select name="account" required>${emergencyFundAccountOptions()}</select>
            <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount borrowed" required>
            <input name="note" placeholder="Reason (optional)">
            <button type="submit" class="secondary">Record borrowed amount</button>
          </form>
        </div>

        <div class="ef-form-card transfer">
          <h3>Move funds</h3>
          <p class="fine-print">Move money between your emergency fund accounts without changing the combined balance.</p>
          <form id="emergency-transfer-form" class="inline-form">
            <input name="date" type="date" value="${WR.ui.escapeText(new Date().toISOString().slice(0, 10))}" required>
            <select name="fromAccount" required>${emergencyFundAccountOptions()}</select>
            <select name="toAccount" required>${emergencyFundAccountOptions()}</select>
            <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount moved" required>
            <input name="note" placeholder="Optional note">
            <button type="submit" class="secondary">Move funds</button>
          </form>
        </div>

        <div class="ef-form-card">
          <h3>Manage accounts</h3>
          <p class="fine-print">Rename an account by editing its name. Accounts with activity can't be removed.</p>
          <ul class="ef-account-manage">
            ${EMERGENCY_FUND_ACCOUNTS.map((a) => {
              const inUse = sorted.some((item) => accountOf(item) === a.id);
              return `<li>
                <input class="ef-account-rename" data-id="${WR.ui.escapeText(a.id)}" value="${escapeEf(a.label)}" aria-label="Account name" maxlength="60">
                <button type="button" class="link-btn ef-account-remove" data-id="${WR.ui.escapeText(a.id)}" ${inUse || EMERGENCY_FUND_ACCOUNTS.length <= 1 ? 'disabled title="Has activity or is the only account"' : ''}>Remove</button>
              </li>`;
            }).join('')}
          </ul>
          <form id="ef-account-add-form" class="inline-form">
            <input name="label" placeholder="New account name" maxlength="60" required>
            <button type="submit">Add account</button>
          </form>
        </div>
      </div>
    `);

    const saveAccounts = async (accounts) => {
      profile.emergencyFundAccounts = accounts;
      await WR.repos.userProfile.update(profile);
      renderEmergencyFund(container);
    };
    container.querySelectorAll('.ef-account-rename').forEach((input) => {
      input.addEventListener('change', async () => {
        const label = input.value.trim();
        if (!label) { input.value = emergencyFundAccountLabel(input.dataset.id); return; }
        await saveAccounts(EMERGENCY_FUND_ACCOUNTS.map((a) => (a.id === input.dataset.id ? { ...a, label } : a)));
      });
    });
    container.querySelectorAll('.ef-account-remove').forEach((button) => {
      button.addEventListener('click', async () => {
        if (!confirm(`Remove "${emergencyFundAccountLabel(button.dataset.id)}"?`)) return;
        await saveAccounts(EMERGENCY_FUND_ACCOUNTS.filter((a) => a.id !== button.dataset.id));
      });
    });
    container.querySelector('#ef-account-add-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const label = event.currentTarget.elements.label.value.trim();
      if (!label) return;
      await saveAccounts([...EMERGENCY_FUND_ACCOUNTS, { id: WR.models.newId(), label }]);
    });

    container.querySelector('#emergency-target-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      profile.emergencyFundTargetAmount = Number(event.currentTarget.elements.target.value);
      await WR.repos.userProfile.update(profile);
      renderEmergencyFund(container);
    });

    container.querySelector('#emergency-fund-month')?.addEventListener('change', (event) => {
      WR.ui._emergencyFundMonth = event.target.value;
      renderEmergencyFund(container);
    });

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const row = await WR.repos.emergencyFundContributions.getById(id);
          if (!row) return;
          const field = input.dataset.field;
          row[field] = field === 'amount' ? parseFloat(input.value) || 0 : input.value;
          if (field === 'amount' && row.amount >= 0) row.returned = false;
          await WR.repos.emergencyFundContributions.update(row);
          WR.ui.flashSaved(input);
          WR.ui.refreshIntegrityNotice();
          if (field === 'amount') renderEmergencyFund(container);
        });
      });
    });

    container.querySelectorAll('.toggle-emergency-return').forEach((button) => {
      button.addEventListener('click', async () => {
        const row = await WR.repos.emergencyFundContributions.getById(button.dataset.id);
        if (!row) return;
        row.returned = !row.returned;
        await WR.repos.emergencyFundContributions.update(row);
        await WR.ui.refreshIntegrityNotice();
        renderEmergencyFund(container);
      });
    });

    container.querySelectorAll('.delete-emergency').forEach((button) => {
      button.addEventListener('click', async () => {
        if (!confirm('Delete this emergency contribution?')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.emergencyFundContributions,
          id: button.dataset.id,
          entityLabel: 'Emergency contribution',
          afterChange: async () => {
            await WR.ui.refreshIntegrityNotice();
            await renderEmergencyFund(container);
          },
        });
      });
    });

    container.querySelector('#emergency-add-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      await WR.repos.emergencyFundContributions.add(WR.models.createEmergencyFundContribution({
        date: form.date.value,
        account: form.account.value,
        amount: Math.max(0, parseFloat(form.amount.value) || 0),
        note: form.note.value.trim() || undefined,
      }));
      WR.ui.refreshIntegrityNotice();
      renderEmergencyFund(container);
    });

    container.querySelector('#emergency-borrow-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const amount = Math.max(0, parseFloat(form.amount.value) || 0);
      if (!amount) return;
      const account = form.account.value;
      const accountTotal = (totalsByAccount.find((a) => a.id === account) || { total: 0 }).total;
      if (amount > accountTotal) {
        WR.ui.notify(`You can borrow up to ${profile.baseCurrency} ${WR.ui.fmt(accountTotal)} from ${emergencyFundAccountLabel(account)}.`, 'error');
        return;
      }
      const date = form.date.value;
      const note = form.note.value.trim();
      await WR.repos.emergencyFundContributions.add(WR.models.createEmergencyFundContribution({
        date,
        account,
        amount: -amount,
        note: note ? `Borrowed: ${note}` : 'Borrowed from emergency fund',
        returned: false,
      }));
      await WR.repos.budgetLines.add(WR.models.createBudgetLine({
        month: date.slice(0, 7),
        type: 'variable',
        name: 'Emergency Fund Borrowed',
        budgetAmount: amount,
        actualAmount: amount,
        currency: profile.baseCurrency,
      }));
      WR.ui.refreshIntegrityNotice();
      WR.ui.notify('Borrowed amount recorded and added to variable expenses.', 'success');
      renderEmergencyFund(container);
    });

    container.querySelector('#emergency-transfer-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const fromAccount = form.fromAccount.value;
      const toAccount = form.toAccount.value;
      const amount = Math.max(0, parseFloat(form.amount.value) || 0);
      if (fromAccount === toAccount) {
        WR.ui.notify('Choose two different accounts to move funds.', 'error');
        return;
      }
      const sourceTotal = (totalsByAccount.find((a) => a.id === fromAccount) || { total: 0 }).total;
      if (!amount || amount > sourceTotal) {
        WR.ui.notify(`You can move up to ${profile.baseCurrency} ${WR.ui.fmt(sourceTotal)} from ${emergencyFundAccountLabel(fromAccount)}.`, 'error');
        return;
      }
      const transferId = WR.models.newId();
      const date = form.date.value;
      const note = form.note.value.trim();
      const description = note ? `Transfer: ${note}` : 'Transfer between emergency fund accounts';
      await WR.repos.emergencyFundContributions.add(WR.models.createEmergencyFundContribution({
        date,
        account: fromAccount,
        amount: -amount,
        note: `${description} to ${emergencyFundAccountLabel(toAccount)}`,
        transferId,
        transferDirection: 'out',
      }));
      await WR.repos.emergencyFundContributions.add(WR.models.createEmergencyFundContribution({
        date,
        account: toAccount,
        amount,
        note: `${description} from ${emergencyFundAccountLabel(fromAccount)}`,
        transferId,
        transferDirection: 'in',
      }));
      WR.ui.refreshIntegrityNotice();
      WR.ui.notify('Funds moved successfully.', 'success');
      renderEmergencyFund(container);
    });
  }

  async function renderDayToDay(container) {
    WR.ui.syncBudgetMonth();
    const [profile, accounts, transactions, expenseCategories, emergencyFundContributions, storedCycles, payAdvances] = await Promise.all([
      WR.ui.getOrCreateProfile(),
      WR.repos.dayToDayAccounts.getAll(),
      WR.repos.dayToDayTransactions.getAll(),
      WR.repos.expenseCategories.getAll(),
      WR.repos.emergencyFundContributions.getAll(),
      WR.repos.payCycles.getAll(),
      WR.repos.payAdvances.getAll(),
    ]);
    const budgetSnapshot = await WR.ui.buildSnapshot(WR.ui._dayMonth || WR.ui.currentBudgetMonth());
    const payCycles = budgetSnapshot.payCycles;
    const month = WR.ui._dayMonth || WR.ui.currentBudgetMonth();
    const year = Number(month.slice(0, 4));
    const today = new Date().toISOString().slice(0, 10);
    const dates = WR.ui.payCycleDates(month);
    const transactionDate = today >= dates.start && today < dates.endExclusive ? today : dates.start;
    WR.ui._dayYear = year;
    WR.ui._dayMonth = month;
    const defaultCategories = ['Alcohol', 'Eating out', 'Transport', 'Bank charges', 'Additional groceries'];
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    const categoryNames = [];
    [...defaultCategories, ...expenseCategories.map((category) => category.name), ...transactions.map((transaction) => transaction.category)]
      .map((category) => String(category || '').trim())
      .filter(Boolean)
      .forEach((category) => {
        if (!categoryNames.some((name) => name.toLowerCase() === category.toLowerCase())) categoryNames.push(category);
      });
    const categoryOptions = (selectedCategory) => {
      const selected = String(selectedCategory || '').trim();
      const options = categoryNames.map((category) => `<option value="${escapeHtml(category)}" ${category.toLowerCase() === selected.toLowerCase() ? 'selected' : ''}>${escapeHtml(category)}</option>`).join('');
      return `<option value="" ${selected ? '' : 'selected'}>None</option>${options}`;
    };
    const monthTx = transactions.filter((item) => item.kind !== 'add' && item.date >= dates.start && item.date < dates.endExclusive).sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const payBudget = WR.ui.calculatePayCycleBudget(accounts, transactions, payCycles, payAdvances, month, 25, undefined, budgetSnapshot.paydayFunding.budget);
    const spent = payBudget.spent;
    const balanceBeforeMonth = budgetSnapshot.paydayFunding.budget;
    const current = payBudget.remaining;
    payBudget.remainingPct = WR.ui.calculateBudgetRemainingPercentage(balanceBeforeMonth, current);
    const spendByCategory = new Map();
    monthTx.filter((item) => item.kind !== 'add').forEach((item) => {
      const category = String(item.category || '').trim() || 'Uncategorised';
      spendByCategory.set(category, (spendByCategory.get(category) || 0) + (Number(item.amount) || 0));
    });
    const categorySpend = Array.from(spendByCategory, ([category, amount]) => ({ category, amount })).sort((left, right) => right.amount - left.amount);
    const topSpend = categorySpend[0] || null;
    const previousMonth = WR.ui.previousMonthKey(month);
    const emergencyFundAddedLastMonth = emergencyFundContributions.some((item) => String(item.date || '').slice(0, 7) === previousMonth && (Number(item.amount) || 0) > 0);
    const reductionAmount = topSpend ? Math.max(1, Math.round(topSpend.amount * 0.1)) : 0;
    const reductionDestination = emergencyFundAddedLastMonth ? 'your day-to-day buffer' : 'your emergency fund';
    const reductionContext = emergencyFundAddedLastMonth
      ? `You added to your emergency fund last month, so keeping this reduction in ${reductionDestination} will improve cash flow.`
      : `Last month had no emergency fund contribution, so this is a good place to direct the freed-up money.`;
    const reductionCard = topSpend ? `
      <section class="day-suggestion-card">
        <h2>Spending suggestion</h2>
        <p>Reduce ${escapeHtml(topSpend.category)} by about ${profile.baseCurrency} ${WR.ui.fmt(reductionAmount)} this month and direct it to ${reductionDestination}.</p>
        <p class="fine-print">${escapeHtml(reductionContext)} ${escapeHtml(topSpend.category)} is currently your highest day-to-day category at ${profile.baseCurrency} ${WR.ui.fmt(topSpend.amount)}.</p>
      </section>` : '';
    const categoryCards = categorySpend.map((item, index) => {
      const share = spent > 0 ? (item.amount / spent) * 100 : 0;
      return `
        <article class="day-category-row ${index === 0 ? 'top-spend' : ''}" role="listitem">
          <h3>${escapeHtml(item.category)}</h3>
          <div class="day-category-meter" aria-hidden="true"><span style="--share: ${share.toFixed(2)}%"></span></div>
          <span class="amount">${profile.baseCurrency} ${WR.ui.fmt(item.amount)}</span>
          <span class="share">${share.toFixed(0)}%</span>
        </article>`;
    }).join('');

    const dateCounts = new Map();
    monthTx.forEach((item) => dateCounts.set(item.date, (dateCounts.get(item.date) || 0) + 1));
    const rows = monthTx.map((item, index) => `
      ${index === 0 || item.date !== monthTx[index - 1].date ? `<tr class="day-date-group"><th colspan="5" scope="rowgroup">${escapeHtml(item.date)}<span>${dateCounts.get(item.date)} transaction${dateCounts.get(item.date) === 1 ? '' : 's'}</span></th></tr>` : ''}
      <tr data-id="${WR.ui.escapeText(item.id)}"${WR.ui._dayEditingId === item.id ? ' class="is-editing"' : ''}>
        <td data-label="Date"><input class="cell" data-field="date" type="date" value="${escapeHtml(item.date)}"></td>
        <td data-label="Description"><span class="day-mobile-value day-mobile-description">${escapeHtml(item.description || 'Transaction')}</span><input class="cell" data-field="description" value="${escapeHtml(item.description || '')}"></td>
        <td data-label="Category"><span class="day-mobile-value day-mobile-category">${escapeHtml(item.category || 'Uncategorised')}</span><select class="cell" data-field="category">${categoryOptions(item.category)}</select></td>
        <td data-label="Amount (${profile.baseCurrency})"><div class="day-amount"><span class="day-mobile-value day-mobile-amount" aria-label="${escapeHtml(profile.baseCurrency)} ${WR.ui.fmt(item.amount)}">${WR.ui.fmt(item.amount)}</span><input class="cell" data-field="amount" type="number" step="0.01" min="0" value="${WR.ui.escapeText(item.amount)}"></div></td>
        <td><button type="button" class="day-row-toggle" aria-expanded="${WR.ui._dayEditingId === item.id}" aria-label="${WR.ui._dayEditingId === item.id ? 'Close editor for' : 'Edit'} ${escapeHtml(item.description || 'transaction')}" title="Edit transaction">${WR.ui._dayEditingId === item.id ? 'Done' : 'Edit'}</button><button class="link-btn delete-day" data-id="${WR.ui.escapeText(item.id)}">Delete</button></td>
      </tr>`).join('');

    WR.ui.setHTML(container, `
      <h1>Transactions</h1>
      <div class="toolbar"><label>Month: <input id="day-month" type="month" value="${WR.ui.escapeText(month)}"></label></div>

      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Balance at start of month</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(balanceBeforeMonth)}</span></div>
        <div class="stat"><span class="stat-label">Money spent</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(spent)}</span></div>
        <div class="stat"><span class="stat-label">Current balance</span><span class="stat-value ${current < 0 ? 'negative' : ''}">${profile.baseCurrency} ${WR.ui.fmt(current)}</span></div>
        <div class="stat"><span class="stat-label">Transactions this month</span><span class="stat-value">${monthTx.length}</span></div>
      </div>
      <div class="day-category-meter" role="progressbar" aria-label="Budget remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(payBudget.remainingPct)}"><span style="--share: ${payBudget.remainingPct}%"></span></div><p class="fine-print">${Math.round(payBudget.remainingPct)}% remaining</p>

      ${reductionCard}

      <section>
        <h2>Where your money is going</h2>
        <div class="day-category-list" role="list">${categoryCards || '<p class="empty">No spending recorded for this month yet.</p>'}</div>
      </section>

      <h3>Add category</h3>
      <form id="day-category-form" class="inline-form">
        <input name="categoryName" placeholder="New category" required>
        <button type="submit" class="secondary">Add category</button>
      </form>

      <section class="day-activity" aria-labelledby="day-activity-title">
      <div class="day-activity-heading"><h2 id="day-activity-title">Activity</h2><span>${monthTx.length} transaction${monthTx.length === 1 ? '' : 's'}</span></div>
      <table class="data-table day-ledger">
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount (${profile.baseCurrency})</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="empty">No day-to-day transactions yet.</td></tr>'}</tbody>
      </table>
      </section>

      <h3>Add spending</h3>
      <form id="day-add-form" class="inline-form">
        <input name="date" type="date" value="${WR.ui.escapeText(transactionDate)}" required>
        <input name="description" placeholder="Description" required>
        <select name="category">${categoryOptions()}</select>
        <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" required>
        <button type="submit">Add</button>
      </form>
    `);

    document.getElementById('day-month').addEventListener('change', (event) => {
      WR.ui._dayMonth = event.target.value;
      WR.ui._dayEditingId = null;
      renderDayToDay(container);
    });

    document.getElementById('day-category-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const name = form.categoryName.value.trim();
      if (!name) return;
      if (!categoryNames.some((category) => category.toLowerCase() === name.toLowerCase())) {
        await WR.repos.expenseCategories.add(WR.models.createExpenseCategory({ name, type: 'variable', essential: false }));
        WR.ui.notify('Day-to-day category added.', 'success');
      }
      renderDayToDay(container);
    });

    container.querySelectorAll('.day-row-toggle').forEach(button => button.addEventListener('click', () => {
      const row = button.closest('tr');
      const expanded = row.classList.toggle('is-editing');
      if (expanded) container.querySelectorAll('.day-ledger tr.is-editing').forEach(other => {
        if (other === row) return;
        other.classList.remove('is-editing');
        const toggle = other.querySelector('.day-row-toggle');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', `Edit ${other.querySelector('[data-field="description"]').value || 'transaction'}`);
        toggle.textContent = 'Edit';
      });
      WR.ui._dayEditingId = expanded ? row.dataset.id : null;
      button.setAttribute('aria-expanded', String(expanded));
      button.setAttribute('aria-label', `${expanded ? 'Close editor for' : 'Edit'} ${row.querySelector('[data-field="description"]').value || 'transaction'}`);
      button.textContent = expanded ? 'Done' : 'Edit';
    }));

    container.querySelectorAll('.day-ledger tbody tr[data-id]').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const row = await WR.repos.dayToDayTransactions.getById(id);
          if (!row || row.kind === 'add') return;
          if (row.paydayAdvanceId) { WR.ui.notify('Remove the advance link on Income before editing this transaction.', 'error'); renderDayToDay(container); return; }
          const field = input.dataset.field;
          if (field === 'amount') {
            row.amount = Math.max(0, parseFloat(input.value) || 0);
            input.value = row.amount;
          } else {
            row[field] = input.value;
          }
          row.year = Number(String(row.date || '').slice(0, 4)) || year;
          await WR.repos.dayToDayTransactions.update(row);
          WR.ui.flashSaved(input);
          renderDayToDay(container);
        });
      });
    });

    container.querySelectorAll('.delete-day').forEach((button) => {
      button.addEventListener('click', async () => {
        const existing = await WR.repos.dayToDayTransactions.getById(button.dataset.id);
        if (existing?.paydayAdvanceId) { WR.ui.notify('Remove the advance link on Income before deleting this transaction.', 'error'); return; }
        if (!confirm('Delete this day-to-day transaction?')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.dayToDayTransactions,
          id: button.dataset.id,
          entityLabel: 'Day-to-day transaction',
          afterChange: async () => { await renderDayToDay(container); },
        });
      });
    });

    document.getElementById('day-add-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const date = form.date.value;
      await WR.repos.dayToDayTransactions.add(WR.models.createDayToDayTransaction({
        year: Number(date.slice(0, 4)),
        date,
        kind: 'spend',
        description: form.description.value.trim(),
        category: form.category.value.trim() || undefined,
        amount: Math.max(0, parseFloat(form.amount.value) || 0),
      }));
      renderDayToDay(container);
    });
  }

  async function renderInsights(container) {
    const month = WR.ui._insightsMonth || WR.ui.currentMonthKey();
    WR.ui._insightsMonth = month;
    const snapshot = await WR.ui.buildSnapshot(month);

    const info = [
      `Month selected: ${snapshot.monthLabel}`,
      `Annual income tracked for ${snapshot.selectedYear}: ${snapshot.profile.baseCurrency} ${WR.ui.fmt(snapshot.annualSummary.totalIncome)}`,
      `Emergency fund total: ${snapshot.profile.baseCurrency} ${WR.ui.fmt(snapshot.emergencyFundBalance)}`,
      `Current day-to-day balance: ${snapshot.profile.baseCurrency} ${WR.ui.fmt(snapshot.dayToDaySummary.currentBalance)}`,
    ];
    const trends = [];
    if (snapshot.discretionarySpendChangePct !== null) {
      trends.push(`Variable/discretionary spending changed by ${(snapshot.discretionarySpendChangePct * 100).toFixed(1)}% compared with the previous month.`);
    }
    trends.push(`Financial health score is ${snapshot.healthScore.score}/100 this month.`);

    const suggestions = snapshot.recommendations.length
      ? snapshot.recommendations.map((item) => `${WR.ui.escapeText(item.title)}: ${item.reason}`)
      : ['No high-priority actions. Continue tracking monthly activity for richer insights.'];

    WR.ui.setHTML(container, `
      <h1>Financial Insights</h1>
      <div class="toolbar"><label>Month: <input type="month" id="insights-month" value="${WR.ui.escapeText(month)}"></label></div>
      <section><h2>Information</h2><div class="assistant-answer">${info.map((line) => `<p>${line}</p>`).join('')}</div></section>
      <section><h2>Trends</h2><div class="assistant-answer">${trends.map((line) => `<p>${line}</p>`).join('')}</div></section>
      <section><h2>Suggestions</h2><div class="assistant-answer">${suggestions.map((line) => `<p>${line}</p>`).join('')}</div></section>
    `);

    document.getElementById('insights-month').addEventListener('change', (event) => {
      WR.ui._insightsMonth = event.target.value;
      renderInsights(container);
    });
  }

  WR.ui.renderIncome = renderIncome;
  WR.ui.renderFixedExpenses = renderFixedExpenses;
  WR.ui.renderEmergencyFund = renderEmergencyFund;
  WR.ui.renderDayToDay = renderDayToDay;
  WR.ui.renderInsights = renderInsights;
})();
// Debts view: manage debts (inline-editable), then run the
// avalanche/snowball/hybrid prioritisation engine with an adjustable extra
// payment. Editing a debt only re-renders the payoff projection section,
// not the whole table \u2014 so the row you're editing keeps focus.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const CURRENCIES = ['ZAR', 'USD', 'EUR', 'GBP'];

  function currencyOptions(selected) {
    return CURRENCIES.map((c) => `<option value="${WR.ui.escapeText(c)}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  }

  function paymentFrequencyOptions(selected) {
    return ['weekly', 'biweekly', 'monthly', 'quarterly', 'yearly']
      .map((frequency) => `<option value="${WR.ui.escapeText(frequency)}" ${frequency === selected ? 'selected' : ''}>${frequency}</option>`)
      .join('');
  }

  function computePaymentsRemaining(debt) {
    const projection = WR.financial.simulateDebtPayoff([debt], 0);
    return projection.reachedSafetyCap ? null : projection.months;
  }

  function estimateCompletionDate(paymentsRemaining) {
    if (paymentsRemaining === null || paymentsRemaining < 0) return '';
    const start = new Date();
    start.setDate(1);
    start.setMonth(start.getMonth() + paymentsRemaining);
    return start.toISOString().slice(0, 10);
  }
  function trackedPaymentForMonth(debt, month) {
    const frequency = debt.paymentFrequency || 'monthly';
    if (frequency === 'quarterly' || frequency === 'yearly') {
      const startMonth = String(debt.startDate || `${month.slice(0, 4)}-01`).slice(0, 7);
      const elapsed = (Number(month.slice(0, 4)) - Number(startMonth.slice(0, 4))) * 12
        + Number(month.slice(5, 7)) - Number(startMonth.slice(5, 7));
      if (elapsed < 0 || elapsed % (frequency === 'quarterly' ? 3 : 12) !== 0) return 0;
      return Math.max(0, Number(debt.minPayment) || 0);
    }
    return WR.financial.monthlyMinPayment(debt);
  }

  function debtInBaseCurrency(debt, exchangeRates, baseCurrency) {
    const currency = debt.currency || baseCurrency;
    const current = WR.financial.convertCurrency(debt.currentBalance, currency, baseCurrency, exchangeRates);
    const original = WR.financial.convertCurrency(debt.originalBalance || debt.currentBalance, currency, baseCurrency, exchangeRates);
    const minimum = WR.financial.convertCurrency(debt.minPayment, currency, baseCurrency, exchangeRates);
    if (!current.converted || !original.converted || !minimum.converted) return null;
    return { ...debt, currentBalance: current.value, originalBalance: original.value, minPayment: minimum.value };
  }

  function computePayoffHtml(debts, strategy, extra, profile, exchangeRates) {
    if (debts.length === 0) return '<p class="empty">Add a debt to see a payoff projection.</p>';

    const unconverted = [];
    const convertedDebts = debts.flatMap((debt) => {
      const converted = debtInBaseCurrency(debt, exchangeRates, profile.baseCurrency);
      if (!converted) {
        unconverted.push(debt.name);
        return [];
      }
      return [converted];
    });
    const warning = unconverted.length ? `<p class="warning">${unconverted.length} debt(s) excluded: add their exchange rates in Settings before including them in this projection.</p>` : '';
    if (!convertedDebts.length) return `${warning}<p class="empty">No debts with a usable balance and currency rate to project.</p>`;
    let orderedDebts = [];
    if (strategy === 'avalanche') orderedDebts = WR.financial.orderDebtsAvalanche(convertedDebts);
    else if (strategy === 'snowball') orderedDebts = WR.financial.orderDebtsSnowball(convertedDebts);
    else orderedDebts = WR.financial.orderDebtsHybrid(convertedDebts);

    const saved = WR.financial.calculateInterestSaved(orderedDebts, extra);
    const orderList = saved.withExtra.payoffOrder
      .map((p) => `<li><span>${String(p.name).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char])}</span><strong>${p.monthsToPayoff === null ? 'Over 50 years' : `${p.monthsToPayoff} months`}</strong></li>`)
      .join('');

    return `
      ${warning}
      <div class="payoff-metrics">
        <div><span>Debt-free in</span><strong>${saved.withExtra.reachedSafetyCap ? 'Over 50 years' : `${saved.withExtra.months} months`}</strong></div>
        <div><span>Projected interest</span><strong>${saved.withExtra.reachedSafetyCap ? 'Not available' : `${profile.baseCurrency} ${WR.ui.fmt(saved.withExtra.totalInterestPaid)}`}</strong></div>
        <div><span>Time saved vs minimums</span><strong>${saved.withExtra.reachedSafetyCap || saved.withoutExtra.reachedSafetyCap ? 'Not comparable' : `${Math.max(0, saved.monthsSaved)} months`}</strong></div>
        <div><span>Interest saved vs minimums</span><strong>${saved.withExtra.reachedSafetyCap || saved.withoutExtra.reachedSafetyCap ? 'Not comparable' : `${profile.baseCurrency} ${WR.ui.fmt(Math.max(0, saved.interestSaved))}`}</strong></div>
      </div>
      <h3>Payment priority: ${strategy}</h3><ol class="payoff-order">${orderList}</ol>
      <p class="fine-print">Monthly estimate from current balances, annual interest rates and monthly-equivalent minimums. No new borrowing or rate changes are included.</p>
      ${saved.withExtra.reachedSafetyCap ? '<p class="warning">This plan does not clear the debt within 50 years. Raise the extra monthly payment or review the minimums.</p>' : ''}
      ${!saved.withExtra.reachedSafetyCap && saved.withoutExtra.reachedSafetyCap ? '<p class="fine-print">Minimum payments alone do not clear the debt within 50 years, so savings against that baseline cannot be calculated.</p>' : ''}
    `;
  }

  function computeDebtOverviewHtml(debts, exchangeRates, profile) {
    if (debts.length === 0) return '';
    const base = profile.baseCurrency;

    let totalCurrent = 0;
    let totalOriginal = 0;
    const unconvertedNames = [];
    const convertedDebts = [];
    debts.forEach((d) => {
      const converted = debtInBaseCurrency(d, exchangeRates, base);
      if (!converted) { unconvertedNames.push(d.name); return; }
      totalCurrent += converted.currentBalance;
      totalOriginal += converted.originalBalance;
      convertedDebts.push(converted);
    });

    const remainingPct = totalOriginal > 0 ? (totalCurrent / totalOriginal) * 100 : 0;
    const isHighRemaining = remainingPct > 50;

    const strategy = WR.ui._debtStrategy || 'avalanche';
    const extra = WR.ui._debtExtra != null ? WR.ui._debtExtra : 0;
    let orderedDebts = [];
    if (strategy === 'avalanche') orderedDebts = WR.financial.orderDebtsAvalanche(convertedDebts);
    else if (strategy === 'snowball') orderedDebts = WR.financial.orderDebtsSnowball(convertedDebts);
    else orderedDebts = WR.financial.orderDebtsHybrid(convertedDebts);

    const minimumsOnly = WR.financial.simulateDebtPayoff(orderedDebts, 0);
    const currentPlan = WR.financial.simulateDebtPayoff(orderedDebts, extra);

    const timeLeftLabel = currentPlan.reachedSafetyCap
      ? 'Not within 50 years'
      : `${Math.floor(currentPlan.months / 12)}y ${currentPlan.months % 12}m`;

    let statement = '';
    if (minimumsOnly.reachedSafetyCap) {
      statement = 'At minimum payments alone, this debt will not be cleared within 50 years. Consider a larger monthly payment.';
    } else if (extra <= 0 && minimumsOnly.months > 60) {
      statement = `Paying only the minimums will take about ${Math.round(minimumsOnly.months / 12)} years. Adding an extra monthly payment could clear this debt much sooner.`;
    } else if (isHighRemaining) {
      statement = 'You still owe over half of your original debt \u2014 consider increasing your monthly payment or reviewing your payoff plan.';
    }

    return `
      <div class="stat-grid debt-overview">
        <div class="stat"><span class="stat-label">${unconvertedNames.length ? 'Debt with rates' : 'Total Debt'}</span><span class="stat-value">${convertedDebts.length ? `${base} ${WR.ui.fmt(totalCurrent)}` : 'No rate available'}</span></div>
        <div class="stat"><span class="stat-label">Debt Remaining</span><span class="stat-value ${isHighRemaining ? 'negative' : ''}">${convertedDebts.length ? `${remainingPct.toFixed(0)}%` : '—'}</span></div>
        <div class="stat"><span class="stat-label">Time Left (current plan)</span><span class="stat-value">${convertedDebts.length ? timeLeftLabel : '—'}</span></div>
      </div>
      ${statement ? `<p class="warning">${statement}</p>` : ''}
      ${unconvertedNames.length > 0 ? `<p class="warning">${unconvertedNames.length} debt(s) excluded from this subtotal and projection. Add exchange rates in Settings.</p>` : ''}
    `;
  }

  async function refreshPayoffSection(container) {
    const [debts, exchangeRates] = await Promise.all([
      WR.repos.debts.getAll(),
      WR.repos.exchangeRates.getAll(),
    ]);
    const profile = await WR.ui.getOrCreateProfile();

    const overview = container.querySelector('.debt-overview-wrap');
    if (overview) WR.ui.setHTML(overview, computeDebtOverviewHtml(debts, exchangeRates, profile));
