        <button id="run-integrity-btn" class="secondary">Run data check now</button>
        <p id="integrity-result" class="fine-print"></p>
      </section>

      <section>
        <h2>Methodology</h2>
        <p class="fine-print">WealthRoute is deterministic: formulas calculate outcomes and the assistant explains existing numbers only.</p>
        <ul>
          <li>Monthly surplus = income - fixed expenses - variable expenses - minimum debt payments.</li>
          <li>Emergency cover = liquid emergency-ready funds divided by essential monthly expenses.</li>
          <li>Financial health score blends cash flow, emergency cover, debt burden, savings rate, and net-worth trend.</li>
          <li>Forecasts are scenarios, not guarantees.</li>
        </ul>
      </section>

      <section>
        <h2>Privacy & Ownership</h2>
        <p class="fine-print">Your financial records stay in this browser's local storage/IndexedDB. No automatic cloud sync is performed by this app version.</p>
        <p class="fine-print">You own your data. Export backups regularly and keep them securely.</p>
      </section>

      <section>
        <h2>Release Notes</h2>
        <p class="fine-print">Version ${APP_VERSION}</p>
        <ul>
          <li>Improved interface polish and mobile spacing.</li>
          <li>Added startup and on-demand integrity checks.</li>
          <li>Added stronger confirmation flow for restore/reset.</li>
          <li>Added installable PWA metadata and offline shell caching.</li>
        </ul>
      </section>

      <section>
        <h2>Live Updates & Wealth Assistant (optional)</h2>
        <p class="fine-print">
          Add your deployed Cloudflare Worker URL (for example, https://wealthroute-api.your-subdomain.workers.dev). The browser sends no API key:
          the Worker holds your Gemini key as a Cloudflare secret and handles assistant questions and optional live-rate requests. Gemini has a
          free developer tier; responses are general educational information, not personalised financial advice.
        </p>
        <form id="worker-url-form" class="inline-form">
          <input type="url" id="worker-url-input" placeholder="https://your-worker.workers.dev" value="${workerUrl}">
          <button type="submit">Save endpoint</button>
          <button type="button" id="clear-worker-url-btn" class="secondary">Clear endpoint</button>
        </form>
      </section>
    `;

    async function renderCategories() {
      const categories = await WR.repos.expenseCategories.getAll();
      document.getElementById('categories-list').innerHTML = categories.length
        ? `<table class="data-table"><thead><tr><th>Name</th><th>Type</th><th>Essential</th><th></th></tr></thead><tbody>${categories
            .map(
              (c) =>
                `<tr><td>${c.name}</td><td>${c.type}</td><td>${c.essential ? 'Yes' : 'No'}</td><td><button class="link-btn delete-category" data-id="${c.id}">Delete</button></td></tr>`,
            )
            .join('')}</tbody></table>`
        : '<p class="empty">No categories yet \u2014 add one below.</p>';
      document.querySelectorAll('.delete-category').forEach((btn) =>
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this category? Transactions already tagged with it keep their tag, but it will no longer appear in the picker.')) return;
          await WR.ui.removeWithUndo({
            repo: WR.repos.expenseCategories,
            id: btn.dataset.id,
            entityLabel: 'Category',
            afterChange: async () => { await renderCategories(); },
          });
        }),
      );
    }
    renderCategories();

    document.getElementById('category-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const category = WR.models.createExpenseCategory({
        name: form.name.value,
        type: form.type.value,
        essential: form.essential.checked,
      });
      await WR.repos.expenseCategories.add(category);
      form.reset();
      form.essential.checked = true;
      renderCategories();
    });

    async function renderRates() {
      const rates = await WR.repos.exchangeRates.getAll();
      document.getElementById('rates-list').innerHTML = rates.length
        ? `<ul>${rates.map((r) => `<li>1 ${r.fromCurrency} = ${r.rate} ${r.toCurrency}${r.source ? ` <span class="fine-print">(${r.source}, ${r.date})</span>` : ''} <button class="link-btn delete-rate" data-id="${r.id}">Delete</button></li>`).join('')}</ul>`
        : '<p class="empty">No exchange rates yet.</p>';
      document.querySelectorAll('.delete-rate').forEach((btn) =>
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this exchange rate?')) return;
          await WR.ui.removeWithUndo({
            repo: WR.repos.exchangeRates,
            id: btn.dataset.id,
            entityLabel: 'Exchange rate',
            afterChange: async () => { await renderRates(); },
          });
        }),
      );
    }
    renderRates();

    async function fetchLiveRate(from, to) {
      const endpoint = localStorage.getItem('wr_worker_url') || '';
      const rateUrl = endpoint
        ? `${endpoint.replace(/\/$/, '')}/rates?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`
        : `https://api.frankfurter.app/latest?amount=1&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
      const res = await fetch(rateUrl);
      if (!res.ok) throw new Error(`Rate service returned ${res.status}`);
      const data = await res.json();
      const rate = data && data.rates && data.rates[to];
      if (!rate) throw new Error('No rate returned for that currency pair.');
      return { rate, date: data.date || new Date().toISOString().slice(0, 10), source: 'Frankfurter/ECB' };
    }

    document.getElementById('fetch-rate-btn').addEventListener('click', async (e) => {
      const form = e.target.closest('form');
      const from = form.fromCurrency.value.trim().toUpperCase();
      const to = form.toCurrency.value.trim().toUpperCase();
      if (!/^[A-Z]{3}$/.test(from) || !/^[A-Z]{3}$/.test(to)) {
        WR.ui.notify('Enter valid 3-letter currency codes first (e.g. USD, ZAR).', 'error');
        return;
      }
      const btn = e.target;
      btn.disabled = true;
      btn.textContent = 'Fetching\u2026';
      try {
        const liveRate = await fetchLiveRate(from, to);
        form.rate.value = liveRate.rate;
        form.dataset.rateDate = liveRate.date;
        form.dataset.rateSource = liveRate.source;
        WR.ui.notify(`Live rate fetched: 1 ${from} = ${liveRate.rate} ${to} (${liveRate.source}, ${liveRate.date}).`, 'success');
      } catch (err) {
        // Offline or the rate service is unreachable: fall back to the most recent rate on file.
        const rates = await WR.repos.exchangeRates.getAll();
        const fallback = WR.financial.convertCurrency(1, from, to, rates);
        if (fallback.converted) {
          form.rate.value = fallback.value;
          WR.ui.notify(`No live rate available (${err.message}) \u2014 using last saved rate: 1 ${from} = ${fallback.value} ${to}.`, 'error');
        } else {
          WR.ui.notify(`Couldn't fetch a live rate (${err.message}) and no previous rate is saved for ${from}/${to}. Enter it manually.`, 'error');
        }
      } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch live rate';
      }
    });

    document.getElementById('refresh-rates-btn').addEventListener('click', async (e) => {
      const btn = e.target;
      const rates = await WR.repos.exchangeRates.getAll();
      if (!rates.length) {
        WR.ui.notify('Add an exchange rate before refreshing.', 'error');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Refreshing\u2026';
      let updated = 0;
      try {
        for (const savedRate of rates) {
          const liveRate = await fetchLiveRate(savedRate.fromCurrency, savedRate.toCurrency);
          await WR.repos.exchangeRates.update({ ...savedRate, ...liveRate });
          updated += 1;
        }
        await renderRates();
        WR.ui.notify(`Refreshed ${updated} saved exchange rate${updated === 1 ? '' : 's'}.`, 'success');
      } catch (err) {
        await renderRates();
        WR.ui.notify(`Refreshed ${updated} rate${updated === 1 ? '' : 's'} before the update failed: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Refresh saved rates';
      }
    });

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const updated = {
        ...profile,
        displayName: form.displayName.value.trim(),
        baseCurrency: form.baseCurrency.value,
        country: form.country.value,
        emergencyFundTargetMonths: parseFloat(form.emergencyFundTargetMonths.value) || 3,
        assumedInvestmentReturn: (parseFloat(form.assumedInvestmentReturn.value) || 8) / 100,
        riskProfile: form.riskProfile.value,
      };
      await WR.repos.userProfile.update(updated);
      WR.ui.notify('Profile saved.', 'success');
    });

    document.getElementById('rate-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const rate = WR.models.createExchangeRate({
        fromCurrency: form.fromCurrency.value.toUpperCase(),
        toCurrency: form.toCurrency.value.toUpperCase(),
        rate: parseFloat(form.rate.value),
        date: form.dataset.rateDate || new Date().toISOString().slice(0, 10),
        source: form.dataset.rateSource || 'Manual',
      });
      await WR.repos.exchangeRates.add(rate);
      form.reset();
      delete form.dataset.rateDate;
      delete form.dataset.rateSource;
      WR.ui.notify('Exchange rate added.', 'success');
      renderRates();
    });

    document.getElementById('export-backup-btn').addEventListener('click', exportBackup);

    document.getElementById('restore-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!(await hardConfirm('replace your current data with this backup'))) {
        WR.ui.notify('Restore canceled.', 'error');
        e.target.value = '';
        return;
      }
      try {
        const text = await file.text();
        await importBackup(text);
        WR.ui.notify('Backup restored.', 'success');
        WR.ui.refreshIntegrityNotice();
        renderSettings(container);
      } catch (err) {
        WR.ui.notify(`Restore failed: ${err.message}`, 'error');
      } finally {
        e.target.value = '';
      }
    });

    document.getElementById('reset-btn').addEventListener('click', async () => {
      if (!(await hardConfirm('delete all WealthRoute data in this browser'))) {
        WR.ui.notify('Delete canceled.', 'error');
        return;
      }
      await resetAllData();
      WR.ui.notify('All data deleted.', 'success');
      WR.ui.refreshIntegrityNotice();
      renderSettings(container);
    });

    document.getElementById('worker-url-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const url = document.getElementById('worker-url-input').value.trim().replace(/\/$/, '');
      if (url && !/^https:\/\//i.test(url)) {
        WR.ui.notify('Enter an HTTPS Worker URL.', 'error');
        return;
      }
      localStorage.setItem('wr_worker_url', url);
      WR.ui.notify('Worker endpoint saved.', 'success');
    });
    document.getElementById('clear-worker-url-btn').addEventListener('click', () => {
      localStorage.removeItem('wr_worker_url');
      document.getElementById('worker-url-input').value = '';
      WR.ui.notify('Worker endpoint cleared.', 'success');
    });

    document.getElementById('run-integrity-btn').addEventListener('click', async () => {
      const warnings = await WR.ui.getIntegrityWarnings();
      const target = document.getElementById('integrity-result');
      target.textContent = warnings.length ? warnings.join(' ') : 'No issues detected.';
      WR.ui.refreshIntegrityNotice();
    });
  }

  WR.ui.renderSettings = renderSettings;
  WR.ui.exportBackup = exportBackup;
  WR.ui.importBackup = importBackup;
  WR.ui.resetAllData = resetAllData;
})();
// Wealth Assistant sends a small calculated snapshot to the user's Cloudflare
// Worker. The Worker holds the provider key, so no secret is shipped to the
// browser. The model cannot change stored data.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  function escapeHtml(text) {
    const element = document.createElement('div');
    element.textContent = String(text || '');
    return element.innerHTML;
  }

  function formatAssistantAnswer(answer) {
    const inline = (text) => escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return String(answer || '')
      .split(/\r?\n/)
      .map((line) => {
        if (/^###\s+/.test(line)) return `<h3>${inline(line.replace(/^###\s+/, ''))}</h3>`;
        if (/^##\s+/.test(line)) return `<h2>${inline(line.replace(/^##\s+/, ''))}</h2>`;
        if (/^#\s+/.test(line)) return `<h2>${inline(line.replace(/^#\s+/, ''))}</h2>`;
        if (/^[-*]\s+/.test(line)) return `<p>• ${inline(line.replace(/^[-*]\s+/, ''))}</p>`;
        return line.trim() ? `<p>${inline(line)}</p>` : '';
      })
      .join('');
  }

  function snapshotForPrompt(s) {
    // A trimmed, explicitly-labelled version of the snapshot \u2014 numbers only,
    // no raw transaction-level detail, so the model has exactly what it
    // needs to explain the dashboard and nothing it could use to invent
    // detail that isn't there.
    return {
      month: s.month,
      baseCurrency: s.profile.baseCurrency,
      monthlyIncome: s.income,
      monthlyExpenses: s.cashflow.totalExpenses,
      availableSurplus: s.availableSurplus,
      savingsRate: s.savingsRate,
      totalDebt: s.totalDebt,
      debtToIncomeRatio: s.debtToIncomeRatio,
      highestInterestDebt: s.highestInterestDebt
        ? { name: s.highestInterestDebt.name, interestRate: s.highestInterestDebt.interestRate, balance: s.highestInterestDebt.currentBalance }
        : null,
      emergencyFundMonths: s.emergencyFundMonths,
      emergencyFundTargetMonths: s.emergencyFundTargetMonths,
      netWorth: s.netWorth.netWorth,
      totalAssets: s.netWorth.totalAssets,
      totalLiabilities: s.netWorth.totalLiabilities,
      assumedInvestmentReturn: s.assumedInvestmentReturn,
      investmentReadiness: s.investmentReadiness,
      financialHealthScore: s.healthScore.score,
      currentRecommendations: s.recommendations.map((r) => ({ title: r.title, priority: r.priority, reason: r.reason })),
    };
  }

  async function askAssistant(workerUrl, question, snapshot) {
    const response = await fetch(`${workerUrl.replace(/\/$/, '')}/assistant`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        question,
        snapshot: snapshotForPrompt(snapshot),
      }),
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API error ${response.status}: ${errText}`);
    }
    const data = await response.json();
    if (!data.answer) throw new Error('Assistant returned no answer.');
    return data.answer;
  }

  async function renderAssistant(container) {
    const workerUrl = localStorage.getItem('wr_worker_url') || '';
    const chats = (await WR.repos.assistantChats.getAll()).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    const historyRows = chats.slice(0, 20).map((chat) => `
      <tr data-id="${chat.id}">
        <td>${new Date(chat.createdAt).toLocaleDateString('en-ZA', { day: '2-digit', month: 'short' })}</td>
        <td class="history-question" title="${escapeHtml(chat.question)}">${escapeHtml(chat.question)}</td>
        <td><button type="button" class="link-btn open-chat" data-id="${chat.id}">Open</button></td>
      </tr>`).join('');

    container.innerHTML = `
      <h1>Wealth Assistant</h1>
      ${
        workerUrl
          ? `<div class="assistant-workspace">
               <div class="assistant-main">
                 <p class="fine-print">Answers use only the numbers already shown on your Dashboard. General information, not personalised financial advice.</p>
                 <form id="ask-form" class="stacked-form assistant-chat">
                   <textarea id="question-input" rows="3" placeholder="Ask about your cash flow, debt, emergency fund, or next financial priority." required></textarea>
                   <button type="submit">Ask Wealth Assistant</button>
                 </form>
                 <div id="answer-area" class="assistant-status" aria-live="polite"></div>
               </div>
               <aside class="assistant-history">
                 <h2>Recent conversations</h2>
                 <table><thead><tr><th>Date</th><th>Question</th><th></th></tr></thead>
                   <tbody>${historyRows || '<tr><td colspan="3" class="empty">Your previous questions appear here.</td></tr>'}</tbody>
                 </table>
               </aside>
             </div>`
          : `<p class="empty">No Worker endpoint configured. Add your Cloudflare Worker URL in Settings to enable the assistant.</p>`
      }
    `;

    if (!workerUrl) return;

    container.querySelectorAll('.open-chat').forEach((button) => {
      button.addEventListener('click', () => {
        const chat = chats.find((item) => item.id === button.dataset.id);
        if (!chat) return;
        document.getElementById('question-input').value = chat.question;
        document.getElementById('answer-area').innerHTML = `<div class="assistant-answer">${formatAssistantAnswer(chat.answer)}</div>`;
      });
    });

    document.getElementById('ask-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('question-input').value.trim();
      if (!question) return;
      const answerArea = document.getElementById('answer-area');
      answerArea.innerHTML = '<p class="loading">Thinking\u2026</p>';
      try {
        const snapshot = await WR.ui.buildSnapshot();
        const answer = await askAssistant(workerUrl, question, snapshot);
        await WR.repos.assistantChats.add(WR.models.createAssistantChat({
          question,
          answer,
          createdAt: new Date().toISOString(),
          month: snapshot.month,
        }));
        await renderAssistant(container);
        document.getElementById('question-input').value = question;
        document.getElementById('answer-area').innerHTML = `<div class="assistant-answer">${formatAssistantAnswer(answer)}</div>`;
      } catch (err) {
        answerArea.innerHTML = `<p class="warning">Something went wrong: ${err.message}</p>`;
      }
    });
  }

  WR.ui.renderAssistant = renderAssistant;
  WR.ui._askAssistant = askAssistant; // exposed for testing snapshotForPrompt indirectly
  WR.ui._snapshotForPrompt = snapshotForPrompt;
  WR.ui._formatAssistantAnswer = formatAssistantAnswer;
})();
// Hash-based router. No history API complexity needed for a single-page
// local app \u2014 #/dashboard, #/transactions, etc. map directly to render
// functions.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const ROUTES = {
    '#/dashboard': 'renderDashboard',
    '#/income': 'renderIncome',
    '#/fixed-expenses': 'renderFixedExpenses',
    '#/savings': 'renderSavings',
    '#/emergency-fund': 'renderEmergencyFund',
    '#/day-to-day': 'renderDayToDay',
    '#/transactions': 'renderTransactions',
    '#/debts': 'renderDebts',
    '#/assets': 'renderAssets',
    '#/investments': 'renderInvestments',
    '#/insights': 'renderInsights',
    '#/forecast': 'renderForecast',
    '#/reports': 'renderReports',
    '#/excel': 'renderExcel',
    '#/assistant': 'renderAssistant',
    '#/settings': 'renderSettings',
  };

  async function handleRoute() {
    const hash = window.location.hash || '#/dashboard';
    const renderFnName = ROUTES[hash] || 'renderDashboard';
    WR.ui.setActiveNav(ROUTES[hash] ? hash : '#/dashboard');

    const content = document.getElementById('content');
    try {
      await WR.ui[renderFnName](content);
      if (WR.ui.enhanceResponsiveContent) WR.ui.enhanceResponsiveContent(content);
    } catch (err) {
      content.innerHTML = `<p class="warning">Something went wrong loading this page: ${err.message}</p>`;
      console.error(err);
    }
  }

  function initRouter() {
    window.addEventListener('hashchange', handleRoute);
    if (!window.location.hash) window.location.hash = '#/dashboard';
    handleRoute();
  }

  WR.ui.initRouter = initRouter;
})();
document.addEventListener('DOMContentLoaded', () => {
  WR.ui.renderShell();
  WR.ui.initRouter();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch((err) => {
      console.warn('Service worker registration failed', err);
    });
  }
});

    </script>
