  const MONTH_ABBR = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function updateDebtPaidOffDate(debt, previousBalance) {
    const currentBalance = Number(debt.currentBalance) || 0;
    if (currentBalance <= 0.01 && previousBalance > 0.01 && !debt.paidOffDate) {
      debt.paidOffDate = new Date().toISOString().slice(0, 10);
    } else if (currentBalance > 0.01) {
      delete debt.paidOffDate;
    }
  }

  function computeDebtCalendarHtml(debts, payments, profile, year) {
    const ongoingDebts = debts.filter((debt) => (Number(debt.currentBalance) || 0) > 0.01 || payments.some((payment) => payment.debtId === debt.id && String(payment.month).startsWith(String(year))));
    if (ongoingDebts.length === 0) return '';
    const cards = ongoingDebts
      .map((d) => {
        const paidTotal = payments
          .filter((p) => p.debtId === d.id)
          .reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
        const months = MONTH_ABBR
          .map((label, i) => {
            const monthKey = `${year}-${String(i + 1).padStart(2, '0')}`;
            const isPaid = payments.some((p) => p.debtId === d.id && p.month === monthKey);
            const due = Number(d.currentBalance) > 0.01 && trackedPaymentForMonth(d, monthKey) > 0;
            return `<button type="button" class="month-btn ${isPaid ? 'paid' : ''}" aria-pressed="${isPaid}" aria-label="${WR.ui.escapeText(d.name)}: ${label} ${year}, ${isPaid ? 'paid' : 'unpaid'}" data-debt-id="${d.id}" data-month="${monthKey}" ${!due && !isPaid ? 'disabled title="No payment due this month"' : ''}>${label}</button>`;
          })
          .join('');
        return `
      <div class="debt-calendar-card">
        <h4>${WR.ui.escapeText(d.name)}</h4>
        <div class="debt-calendar-grid">${months}</div>
        <div class="debt-calendar-stats">
          <span>Debt paid: <strong>${d.currency || profile.baseCurrency} ${WR.ui.fmt(paidTotal)}</strong></span>
          <span>Debt left: <strong>${d.currency || profile.baseCurrency} ${WR.ui.fmt(d.currentBalance)}</strong></span>
        </div>
      </div>`;
      })
      .join('');

    return `
      <h2>Monthly Payment Tracker</h2>
      <p class="fine-print">Mark a payment when it clears. Weekly and biweekly amounts use a monthly equivalent; quarterly and yearly installments are due from the start month.</p>
      <div class="toolbar">
        <label>Year:
          <select id="debt-calendar-year">${WR.ui.yearsAroundCurrent(3, 3).map((y) => `<option value="${WR.ui.escapeText(y)}" ${y === year ? 'selected' : ''}>${y}</option>`).join('')}</select>
        </label>
      </div>
      <div class="debt-calendar-list">${cards}</div>
    `;
  }

  async function setDebtPaymentStatus(debtId, month, paid) {
    const user = WR.account.getCurrentUser();
    if (!user) throw new Error('Sign in to record a payment.');
    const api = WR.account.getFirestoreApi();
    const db = WR.account.getDb();
    const profile = await WR.ui.getOrCreateProfile();
    const paymentId = `monthly-${debtId}-${month}`;
    const ledger = await api.getDocsFromServer(api.query(api.collection(db, 'users', user.uid, 'debtPayments'), api.where('debtId', '==', debtId)));
    const ids = [...new Set([paymentId, ...ledger.docs.filter((document) => document.data().month === month).map((document) => document.id)])];
    const debtRef = api.doc(db, 'users', user.uid, 'debts', debtId);
    const paymentRefs = ids.map((id) => api.doc(db, 'users', user.uid, 'debtPayments', id));
    await api.runTransaction(db, async (transaction) => {
      const debtSnapshot = await transaction.get(debtRef);
      const paymentSnapshots = await Promise.all(paymentRefs.map((ref) => transaction.get(ref)));
      if (!debtSnapshot.exists()) throw new Error('This debt no longer exists.');
      const debt = debtSnapshot.data();
      const previousBalance = Number(debt.currentBalance) || 0;
      const existing = paymentSnapshots.filter((snapshot) => snapshot.exists());
      if (paid && !existing.length) {
        const amount = Math.min(previousBalance, trackedPaymentForMonth(debt, month));
        if (amount <= 0) throw new Error('No payment is due for this debt in that month.');
        transaction.set(paymentRefs[0], { id: paymentId, debtId, month, amount, currency: debt.currency || profile.baseCurrency });
        debt.currentBalance = Math.round((previousBalance - amount) * 100) / 100;
      } else if (!paid && existing.length) {
        debt.currentBalance = Math.round((previousBalance + existing.reduce((sum, snapshot) => sum + Number(snapshot.data().amount), 0)) * 100) / 100;
        paymentSnapshots.forEach((snapshot, index) => { if (snapshot.exists()) transaction.delete(paymentRefs[index]); });
      }
      debt.billStatuses = { ...debt.billStatuses, [month]: paid ? 'paid' : 'unpaid' };
      updateDebtPaidOffDate(debt, previousBalance);
      transaction.set(debtRef, Object.fromEntries(Object.entries(debt).filter(([, value]) => value !== undefined)));
    });
    await Promise.all([
      api.getDocsFromServer(api.collection(db, 'users', user.uid, 'debts')),
      api.getDocsFromServer(api.collection(db, 'users', user.uid, 'debtPayments')),
    ]);
  }

  async function toggleDebtPayment(debtId, month, container, button) {
    if (button) button.disabled = true;
    try {
      const payments = await WR.repos.debtPayments.getAll();
      await setDebtPaymentStatus(debtId, month, !payments.some((payment) => payment.debtId === debtId && payment.month === month));
      await renderDebts(container);
    } catch (error) {
      WR.ui.notify(error.message || 'Unable to record this payment.', 'error');
      if (button) button.disabled = false;
    }
  }

  function calculateMoneyOwed(entry) {
    const principal = Math.max(0, Number(entry.amount) || 0);
    const interest = Math.round(principal * Math.max(0, Number(entry.interestRatePct) || 0)) / 100;
    const total = Math.round((principal + interest) * 100) / 100;
    const repaid = Math.round((entry.repayments || []).reduce((sum, payment) => sum + (Number(payment.amount) || 0), 0) * 100) / 100;
    return { principal, interest, total, repaid, remaining: Math.max(0, Math.round((total - repaid) * 100) / 100) };
  }

  async function renderMoneyOwed(container) {
    const [entries, profile, accounts, pots] = await Promise.all([
      WR.repos.moneyOwed.getAll(), WR.ui.getOrCreateProfile(),
      WR.repos.dayToDayAccounts.getAll(), WR.repos.savingsPots.getAll(),
    ]);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    const today = new Date().toISOString().slice(0, 10);

      ...(profile.emergencyFundAccounts || []).map((account) => account.label || account.name),
      ...pots.filter((pot) => !pot.archived).map((pot) => pot.name),
      ...entries.map((entry) => entry.sourceAccount),
    ].filter(Boolean))];

    const fields = (entry = {}) => `
      <div class="money-owed-fields">

        <label>Type<select name="kind"><option value="loan" ${entry.kind !== 'shared-bill' ? 'selected' : ''}>Money lent</option><option value="shared-bill" ${entry.kind === 'shared-bill' ? 'selected' : ''}>Bill paid for someone</option></select></label>
        <label>Amount owed before interest<input name="amount" type="number" min="0.01" step="0.01" value="${WR.ui.escapeText(entry.amount ?? '')}" required></label>
        <label>Currency<select name="currency">${currencyOptions(entry.currency || profile.baseCurrency)}</select></label>
        <label>One-off interest (%)<input name="interestRatePct" type="number" min="0" step="0.01" value="${WR.ui.escapeText(entry.interestRatePct || 0)}"></label>
        <label>Source account<input name="sourceAccount" list="money-owed-accounts" value="${esc(entry.sourceAccount)}" maxlength="120" required></label>
        <label>Date lent / bill paid<input name="date" type="date" value="${esc(entry.date || today)}" required></label>
        <label>Repayment due (optional)<input name="dueDate" type="date" value="${esc(entry.dueDate)}"></label>
        <label>Reason / notes<textarea name="note" rows="2" maxlength="1000">${esc(entry.note)}</textarea></label>
      </div>`;
    const cards = (list) => list.map((entry) => {

      return `<article class="money-owed-card" data-owed-id="${esc(entry.id)}">
        <h3>${esc(entry.borrower)}</h3>
        <p class="fine-print">${entry.kind === 'shared-bill' ? 'Bill paid for someone' : 'Money lent'} · ${esc(entry.date)} · ${esc(entry.sourceAccount)}</p>
        ${entry.note ? `<p>${esc(entry.note)}</p>` : ''}
        <div class="stat-grid">
          <div class="stat"><span class="stat-label">Outstanding</span><strong class="stat-value">${money(entry, balance.remaining)}</strong></div>
          <div class="stat"><span class="stat-label">Repaid</span><strong>${money(entry, balance.repaid)}</strong></div>
        </div>
        <p class="fine-print">Principal: ${money(entry, balance.principal)} · Interest: ${money(entry, balance.interest)} (${Number(entry.interestRatePct) || 0}% one-off)</p>
        ${entry.dueDate ? `<p class="fine-print">${balance.remaining > 0 && entry.dueDate < today ? 'Overdue' : 'Due'}: ${esc(entry.dueDate)}</p>` : ''}
        ${balance.remaining > 0 ? `<form data-owed-action="repayment">
          <div class="money-owed-fields">
            <label>Repayment amount<input name="amount" type="number" min="0.01" max="${balance.remaining}" step="0.01" value="${WR.ui.escapeText(balance.remaining)}" required></label>
            <label>Repayment date<input name="date" type="date" value="${WR.ui.escapeText(today)}" required></label>
          </div><button type="submit">Record repayment</button>
        </form>` : '<p class="fine-print">Fully repaid</p>'}
        ${(entry.repayments || []).length ? `<details><summary>Repayment history (${entry.repayments.length})</summary><ul class="money-owed-history">${entry.repayments.map((payment) => `<li><span>${esc(payment.date)} · ${money(entry, payment.amount)}</span><button type="button" class="secondary" data-remove-repayment="${esc(payment.id)}">Remove repayment</button></li>`).join('')}</ul></details>` : ''}
        <details class="card-edit"><summary>Edit entry</summary><form data-owed-action="edit">${fields(entry)}<button type="submit">Save changes</button></form></details>
        <div class="toolbar"><button type="button" class="link-btn" data-delete-owed="${esc(entry.id)}">Delete entry</button></div>
      </article>`;
    }).join('');
    const outstanding = entries.filter((entry) => calculateMoneyOwed(entry).remaining > 0);
    const settled = entries.filter((entry) => calculateMoneyOwed(entry).remaining === 0);
    const totals = new Map();
    outstanding.forEach((entry) => {
      const currency = entry.currency || profile.baseCurrency;
      totals.set(currency, (totals.get(currency) || 0) + calculateMoneyOwed(entry).remaining);
    });
    WR.ui.setHTML(container, `
      <h2>Money owed to me</h2>
      <div class="stat-grid">${[...totals].map(([currency, total]) => `<div class="stat"><span class="stat-label">Outstanding (${esc(currency)})</span><strong class="stat-value">${esc(currency)} ${WR.ui.fmt(total)}</strong></div>`).join('')}</div>
      <div class="money-owed-grid">${cards(outstanding) || '<p class="empty">No money outstanding.</p>'}</div>
      ${settled.length ? `<details><summary>Fully repaid (${settled.length})</summary><div class="money-owed-grid">${cards(settled)}</div></details>` : ''}
      <datalist id="money-owed-accounts">${accountNames.map((name) => `<option value="${esc(name)}"></option>`).join('')}</datalist>
      <details class="form-panel" ${entries.length ? '' : 'open'}><summary>Add money owed to me</summary><form data-owed-action="add">${fields()}<button type="submit">Add entry</button></form></details>`);

    container.querySelectorAll('form[data-owed-action]').forEach((form) => {

        try {
          const value = (name) => form.elements.namedItem(name).value;
          const id = form.closest('[data-owed-id]')?.dataset.owedId;

          if (id && !existing) throw new Error('This entry no longer exists.');
          if (form.dataset.owedAction === 'repayment') {
            const amount = Number(value('amount'));
            if (!Number.isFinite(amount) || amount <= 0 || amount > calculateMoneyOwed(existing).remaining) throw new Error('Repayment must be greater than zero and no more than the outstanding amount.');
            if (!value('date') || value('date') < existing.date) throw new Error('Repayment date cannot be before the date lent.');
            await WR.repos.moneyOwed.update({ ...existing, repayments: [...(existing.repayments || []), { id: crypto.randomUUID(), amount, date: value('date') }] });
          } else {
            const entry = { ...existing, id: existing?.id || crypto.randomUUID(), borrower: value('borrower').trim(), kind: value('kind'), amount: Number(value('amount')), currency: value('currency'), interestRatePct: Number(value('interestRatePct')), sourceAccount: value('sourceAccount').trim(), date: value('date'), dueDate: value('dueDate'), note: value('note').trim(), repayments: existing?.repayments || [] };
            if (!entry.borrower || !entry.sourceAccount || !Number.isFinite(entry.amount) || entry.amount <= 0 || !Number.isFinite(entry.interestRatePct) || entry.interestRatePct < 0) throw new Error('Enter a person, source account, positive amount, and valid interest rate.');

            if (entry.dueDate && entry.dueDate < entry.date) throw new Error('Repayment due date cannot be before the date lent.');
            const balance = calculateMoneyOwed(entry);
            if (!Number.isFinite(balance.total) || balance.total < balance.repaid) throw new Error('Total owed cannot be less than repayments already recorded.');
            await WR.repos.moneyOwed[existing ? 'update' : 'add'](entry);
          }
          await renderMoneyOwed(container);
          WR.ui.notify('Money owed updated.', 'success');
        } catch (error) {
          WR.ui.notify(error.message || 'Unable to save this entry.', 'error');
          button.disabled = false;
        }
      });
    });
    container.querySelectorAll('[data-delete-owed], [data-remove-repayment]').forEach((button) => {
      button.addEventListener('click', async () => {
        const removingPayment = !!button.dataset.removeRepayment;
        if (!confirm(removingPayment ? 'Remove this repayment and restore the outstanding amount?' : 'Delete this money owed entry and its repayment history?')) return;
        button.disabled = true;
        try {
          if (removingPayment) {
            const entry = await WR.repos.moneyOwed.getById(button.closest('[data-owed-id]').dataset.owedId);
            if (!entry) throw new Error('This entry no longer exists.');
            await WR.repos.moneyOwed.update({ ...entry, repayments: (entry.repayments || []).filter((payment) => payment.id !== button.dataset.removeRepayment) });
            await renderMoneyOwed(container);
          } else {
            await WR.ui.removeWithUndo({ repo: WR.repos.moneyOwed, id: button.dataset.deleteOwed, entityLabel: 'Money owed entry', afterChange: () => renderMoneyOwed(container) });
          }
        } catch (error) {
          WR.ui.notify(error.message || 'Unable to update this entry.', 'error');
          button.disabled = false;
        }
      });
    });
  }

  async function renderDebts(container) {
    const [debts, payments, exchangeRates] = await Promise.all([
      WR.repos.debts.getAll(),
      WR.repos.debtPayments.getAll(),
      WR.repos.exchangeRates.getAll(),
    ]);
    const profile = await WR.ui.getOrCreateProfile();

(function () {

  }

  /** Sums a list's currency-tagged value field into the base currency, tracking any that couldn't be converted. */
  function sumInBaseCurrency(items, valueField, exchangeRates, baseCurrency) {
    let total = 0;
    const unconvertedNames = [];
    items.forEach((item) => {
      const { value, converted } = WR.financial.convertCurrency(
        item[valueField],
        item.currency || baseCurrency,
        baseCurrency,
        exchangeRates,
      );
      total += value;
      if (!converted) unconvertedNames.push(item.name);
    });
    return { total, unconvertedNames };
  }

      WR.repos.investments.getAll(),
      WR.repos.exchangeRates.getAll(),
      WR.ui.getOrCreateProfile(),

    const { total, unconvertedNames } = sumInBaseCurrency([...assets, ...investments], 'currentValue', exchangeRates, profile.baseCurrency);

    return '\u{1F610}'; // 😐
  }

  function computeInvestmentSuggestions(investments, totalValue, totalContributions, gainPct) {
    const suggestions = [];
    if (investments.length === 0) {
      return suggestions;
    }

    const riskCategories = new Set(investments.map((inv) => inv.riskCategory || 'medium'));
    if (investments.length > 1 && riskCategories.size === 1) {
      suggestions.push('All your investments share the same risk category \u2014 diversifying across low, medium, and high risk assets can smooth out returns over time.');
    }

    const largest = investments.reduce((max, inv) => (inv.currentValue > (max?.currentValue || 0) ? inv : max), null);
    if (largest && totalValue > 0 && largest.currentValue / totalValue > 0.7) {
      suggestions.push(`${WR.ui.escapeText(largest.name)} makes up over 70% of your portfolio \u2014 consider spreading contributions to reduce concentration risk.`);
    }

    if (totalContributions > 0 && gainPct < 0) {
      suggestions.push('Your portfolio is currently below what you\u2019ve contributed \u2014 review underperforming holdings or consider low-cost diversified index funds/ETFs for steadier long-term growth.');
    } else if (totalContributions > 0 && gainPct >= 0 && gainPct <= 5) {
      suggestions.push('Growth is modest so far \u2014 if your risk tolerance and timeline allow, exploring higher-growth options like equity ETFs could improve long-term returns.');
    } else if (totalContributions > 0 && gainPct > 15) {
      suggestions.push('Strong growth so far \u2014 consider rebalancing periodically to lock in gains and keep your risk mix on target.');
    }

    if (suggestions.length === 0) {
      suggestions.push('Your portfolio looks reasonably balanced \u2014 keep contributing consistently and review it periodically.');
    }
    return suggestions;
  }

(function () {

    WR.ui.setHTML(container, `
      <h1>Excel</h1>

        <h2>Import</h2>
        <p class="fine-print">Works with any spreadsheet \u2014 you'll map its columns to WealthRoute fields before anything is imported. Nothing is saved until you confirm.</p>

      </section>

      <section>
        <h2>Export</h2>
        <p class="fine-print">Downloads all current WealthRoute data as a new workbook (one sheet per data type). This does not reproduce the original 16-sheet template layout \u2014 it exports WealthRoute's own data model.</p>
        <button id="export-btn">Export to Excel</button>
      </section>
    `);

    WR.excel.loadXlsx().catch(() => {});

    document.getElementById('export-btn').addEventListener('click', async () => {
      await WR.excel.loadXlsx().catch(() => {});
      if (typeof XLSX === 'undefined') {
        alert('Excel library failed to load \u2014 check your internet connection and reload the page.');
        return;
      }
      await WR.excel.exportWorkbook();
    });

    document.getElementById('excel-file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await WR.excel.loadXlsx().catch(() => {});
      if (typeof XLSX === 'undefined') {
        alert('Excel library failed to load \u2014 check your internet connection and reload the page.');
        return;
      }
      const buffer = await file.arrayBuffer();
      state.workbook = WR.excel.parseWorkbook(buffer);
      const sheetNames = WR.excel.getSheetNames(state.workbook);
      renderSheetPicker(sheetNames);
    });

    function renderSheetPicker(sheetNames) {
      const workflow = document.getElementById('import-workflow');
      WR.ui.setHTML(workflow, `
        <div class="toolbar">
          <label>Sheet: <select id="sheet-picker">${sheetNames.map((n) => `<option value="${WR.ui.escapeText(n)}">${n}</option>`).join('')}</select></label>
          <label>Header row: <input type="number" id="header-row-input" min="1" value="1" style="width:4.5em"></label>
        </div>
        <p class="fine-print">If a sheet has its column headers somewhere other than the first row \u2014 common in sheets with a title or multiple tables \u2014 set the header row number above and the columns will refresh.</p>
        <div id="mapping-area"></div>
      `);
      document.getElementById('sheet-picker').addEventListener('change', (e) => {
        document.getElementById('header-row-input').value = 1;
        loadSheet(e.target.value, 0);
      });
      document.getElementById('header-row-input').addEventListener('change', (e) => {
        const rowNum = Math.max(1, parseInt(e.target.value, 10) || 1);
        e.target.value = rowNum;
        loadSheet(state.sheetName, rowNum - 1); // convert 1-indexed display to 0-indexed
      });
      loadSheet(sheetNames[0], 0);
    }

    function loadSheet(sheetName, headerRowIndex) {
      state.sheetName = sheetName;
      state.headerRowIndex = headerRowIndex;
      const { headers, rows } = WR.excel.readSheetRows(state.workbook, sheetName, headerRowIndex);
      state.headers = headers;
      state.rawRows = rows;

      const mappingArea = document.getElementById('mapping-area');
      if (rows.length === 0) {
        WR.ui.setHTML(mappingArea, `<p class="warning">No data rows found below this header row \u2014 try a different header row number.</p>`);
        return;
      }

      WR.ui.setHTML(mappingArea, `
        ${fieldMappingForm(headers)}
        <button id="preview-btn">Preview</button>
        <div id="preview-area"></div>
      `);
      document.getElementById('preview-btn').addEventListener('click', renderPreview);
    }

    function currentMapping() {
      return {
        mapping: { name: document.getElementById('map-name').value, amount: document.getElementById('map-amount').value },
        constants: {
          type: document.getElementById('map-type-constant').value,
          month: document.getElementById('map-month-constant').value,
        },
      };
    }

    function renderPreview() {
      const { mapping, constants } = currentMapping();

      if (!mapping.name || !mapping.amount) {
        WR.ui.setHTML(document.getElementById('preview-area'), '<p class="warning">Map both a Name/Description column and an Amount column before previewing.</p>');
        return;
      }

      const mapped = WR.excel.applyMapping(state.rawRows, mapping, constants);
      const withProblems = mapped.map((row) => ({ row, problems: WR.excel.validateImportRow(row) }));
      const validCount = withProblems.filter((r) => r.problems.length === 0).length;

      const rowsHtml = withProblems
        .slice(0, 25)
        .map(
          ({ row, problems }) => `
        <tr class="${problems.length ? 'invalid-row' : ''}">
          <td>${row.name ?? ''}</td>
          <td class="num">${row.amount ?? ''}</td>
          <td>${row.type ?? ''}</td>
          <td>${row.month ?? ''}</td>
          <td>${problems.join('; ')}</td>
        </tr>`,
        )
        .join('');

      WR.ui.setHTML(document.getElementById('preview-area'), `
        <p><strong>${validCount}</strong> of <strong>${mapped.length}</strong> rows are valid and will be imported. Showing first 25 rows below.</p>
        <table class="data-table">
          <thead><tr><th>Name</th><th>Amount</th><th>Type</th><th>Month</th><th>Problems</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <button id="confirm-import-btn" ${validCount === 0 ? 'disabled' : ''}>Confirm Import (${validCount} rows)</button>
        <p id="import-result"></p>
      `);

      document.getElementById('confirm-import-btn').addEventListener('click', async () => {
        const result = await WR.excel.importBudgetLines(mapped);
        document.getElementById('import-result').textContent =
          `Imported ${result.imported.length} rows. Skipped ${result.rejected.length} invalid rows.`;
      });
    }
  }

  WR.ui.renderExcel = renderExcel;
})();

(function () {
  const APP_VERSION = '3.0.0';

  function hardConfirm(actionLabel) {
    return new Promise((resolve) => {
      const token = prompt(`Type CONFIRM to ${actionLabel}.`);
      resolve(token === 'CONFIRM');
    });
  }

  async function buildBackupPayload() {
    const stores = {};
    for (const [name, repo] of Object.entries(WR.repos)) {
      stores[name] = await repo.getAll();
    }
    return {
      format: 'wealthroute-backup',
      formatVersion: 1,
      appVersion: APP_VERSION,
      exportedAt: new Date().toISOString(),
      stores,
    };
  }

  async function exportBackup() {
    const backup = await buildBackupPayload();
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wealthroute-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  async function importBackup(jsonText) {
    const backup = JSON.parse(jsonText);
    if (!backup || typeof backup !== 'object' || Array.isArray(backup)) throw new Error('Invalid backup format.');
    if (backup.format === 'wealthroute-backup' && backup.formatVersion !== 1) {
      throw new Error('This backup version is not supported.');
    }
    const data = backup.format === 'wealthroute-backup' ? backup.stores : backup;
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('Backup has no data stores.');
    const repositoryNames = Object.keys(WR.repos);
    if (!repositoryNames.some((name) => Object.prototype.hasOwnProperty.call(data, name))) {
      throw new Error('This is not a WealthRoute backup.');
    }

    for (const [name, repo] of Object.entries(WR.repos)) {
      const records = data[name] === undefined ? [] : data[name];
      if (!Array.isArray(records)) throw new Error(`Invalid ${name} data.`);
      for (const item of records) {
        if (!item || typeof item !== 'object' || Array.isArray(item) || typeof item.id !== 'string' || !item.id) {
          throw new Error(`Invalid record in ${name}.`);
        }
      }
    }

    for (const [name, repo] of Object.entries(WR.repos)) {
      await repo.clear();
      for (const item of data[name] || []) await repo.add(item);
    }
  }

  async function resetAllData() {
    for (const repo of Object.values(WR.repos)) await repo.clear();
  }

    async function fetchLiveRate(from, to) {
      const endpoint = localStorage.getItem('wr_worker_url') || '';
      const rateUrl = endpoint
        ? `${endpoint.replace(/\/$/, '')}/rates?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`
        : `https://api.frankfurter.app/latest?amount=1&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
      const res = await fetch(rateUrl);
      if (!res.ok) throw new Error(`Rate service returned ${res.status}`);
      const data = await res.json();
      const rate = data && data.rates && data.rates[to];
      if (!rate) throw new Error('No rate returned for that currency pair.');
      return { rate, date: data.date || new Date().toISOString().slice(0, 10), source: 'Frankfurter/ECB' };
    }

  function waitForFirstUser() {
    return firstUserPromise;
  }

  function onAuthChange(callback) {
    onChangeCallback = callback;
  }

  function getCurrentUser() {
    return currentUser;
  }

  /** Exposed so WR.createRepository (Firestore-backed) can build collection/
   * document references without re-initializing Firebase itself. */
  function getDb() {
    return db;
  }

  function getFirestoreApi() {
    return firestoreApi;
  }

  function getUsername() {
    return cachedUsername;
  }

  /** Loads (or refreshes) the cached username for the current user from the
   * users/{uid} profile doc. Safe to call even if no profile exists yet. */
  async function loadProfile() {
    if (!currentUser) { cachedUsername = null; return null; }
    try {
      const snap = await firestoreApi.getDoc(firestoreApi.doc(db, 'users', currentUser.uid));
      cachedUsername = snap.exists() ? snap.data().username || null : null;
    } catch (err) {
      console.warn('Loading profile failed', err);
    }
    return cachedUsername;
  }

  function normalizeUsername(username) {
    const trimmed = (username || '').trim();
    const lower = trimmed.toLowerCase();
    if (!/^[a-z0-9_]{3,20}$/.test(lower)) {
      throw new Error('Username must be 3-20 characters: letters, numbers, and underscores only.');
    }
    return { display: trimmed, lower };
  }

  async function isUsernameAvailable(usernameLower) {
    const snap = await firestoreApi.getDoc(firestoreApi.doc(db, 'usernames', usernameLower));
    return !snap.exists() || (currentUser && snap.data().uid === currentUser.uid);
  }

  /** Atomically claims a username for a uid, releasing any previous claim by
   * that same uid. Throws if the username is taken by someone else. */
  async function claimUsername(uid, username, email) {
    const { display, lower } = normalizeUsername(username);
    const usernameRef = firestoreApi.doc(db, 'usernames', lower);
    const userRef = firestoreApi.doc(db, 'users', uid);
    await firestoreApi.runTransaction(db, async (tx) => {
      const [usernameSnap, userSnap] = await Promise.all([tx.get(usernameRef), tx.get(userRef)]);
      if (usernameSnap.exists() && usernameSnap.data().uid !== uid) {
        throw new Error('That username is already taken.');
      }
      const previousLower = userSnap.exists() ? userSnap.data().usernameLower : null;
      if (previousLower && previousLower !== lower) {
        tx.delete(firestoreApi.doc(db, 'usernames', previousLower));
      }
      tx.set(usernameRef, { uid });
      tx.set(userRef, { username: display, usernameLower: lower, email: email || null }, { merge: true });
    });
    cachedUsername = display;
    return display;
  }

  /** For the Settings/Profile page: change the signed-in user's username. */
  async function updateUsername(username) {
    if (!currentUser) throw new Error('Not signed in.');
    return claimUsername(currentUser.uid, username, currentUser.email);
  }

  async function sendPasswordReset(email) {
    const destination = String(email || currentUser?.email || '').trim();
    if (!destination) throw new Error('Enter your email address.');
    await ensureInit();
    try {
      await authApi.sendPasswordResetEmail(auth, destination);
    } catch (error) {
      if (error.code !== 'auth/user-not-found') throw error;
    }

  function usesPasswordProvider() {
    return !!currentUser && currentUser.providerData.some((p) => p.providerId === 'password');
  }

  async function signUp(email, password, username) {
    await ensureInit();
    preserveSignupScreen = false;
    const { lower } = normalizeUsername(username);
    if (!(await isUsernameAvailable(lower))) throw new Error('That username is already taken.');
    signupInProgress = true;
    let createdUser = null;
    try {
      const cred = await authApi.createUserWithEmailAndPassword(auth, email, password);
      createdUser = cred.user;
      await claimUsername(createdUser.uid, username, email);
    } catch (error) {
      if (createdUser) {
        preserveSignupScreen = true;
        try {
          await authApi.deleteUser(createdUser);
          currentUser = null;
          cachedUsername = null;
        } catch (cleanupError) {
          await authApi.signOut(auth);
          throw Object.assign(new Error('Account setup failed and the email may be registered. Try logging in or contact support.'), { code: 'account/setup-failed' });
        }
      }
      throw error;
    } finally {
      signupInProgress = false;
    }
    currentUser = createdUser;
    if (onChangeCallback) onChangeCallback(createdUser);
    return createdUser;
  }

  async function signIn(email, password) {
    await ensureInit();
    preserveSignupScreen = false;
    const cred = await authApi.signInWithEmailAndPassword(auth, email, password);
    await loadProfile();
    return cred.user;
  }

  async function signInWithGoogle() {
    await ensureInit();
    const provider = new authApi.GoogleAuthProvider();
    const cred = await authApi.signInWithPopup(auth, provider);
    await loadProfile();
    if (!cachedUsername) {
      WR.ui.notify('Welcome! Choose a username in Settings \u2192 Profile to finish setting up your account.', 'error');
    }
    return cred.user;
  }

  async function signOutUser() {
    await ensureInit();
    await authApi.signOut(auth);
    // Wipe Firestore's offline cache so the next person on this browser can't see this account's data.
    try {
      await firestoreApi.terminate(db);
      await firestoreApi.clearIndexedDbPersistence(db);
    } catch (err) {
      console.warn('Could not clear offline cache', err);
    }
    window.location.reload();
  }

  WR.account.isConfigured = isConfigured;
  WR.account.ensureInit = ensureInit;
  WR.account.waitForFirstUser = waitForFirstUser;
  WR.account.onAuthChange = onAuthChange;
  WR.account.getCurrentUser = getCurrentUser;
  WR.account.getDb = getDb;
  WR.account.getFirestoreApi = getFirestoreApi;
  WR.account.getUsername = getUsername;
  WR.account.updateUsername = updateUsername;
  WR.account.isUsernameAvailable = isUsernameAvailable;
  WR.account.sendPasswordReset = sendPasswordReset;
  WR.account.usesPasswordProvider = usesPasswordProvider;
  WR.account.signUp = signUp;
  WR.account.signIn = signIn;
  WR.account.signInWithGoogle = signInWithGoogle;
  WR.account.signOut = signOutUser;
})();

(function () {
  function authErrorMessage(error, isSignup) {
    const messages = {
      'auth/user-not-found': 'No account found with this email. Check the address or sign up.',
      'auth/invalid-credential': 'Email or password is incorrect. Check your details, or sign up if you are new.',
      'auth/wrong-password': 'Email or password is incorrect. Check your details, or sign up if you are new.',
      'auth/email-already-in-use': 'An account with this email already exists. Log in instead.',
      'auth/weak-password': 'Choose a stronger password of at least 6 characters.',
      'auth/invalid-email': 'Enter a valid email address.',
      'auth/network-request-failed': 'Connection failed. Check your internet and try again.',
      'auth/too-many-requests': 'Too many attempts. Wait a little before trying again.',
      'auth/popup-blocked': 'Allow the sign-in popup in your browser and try again.',
      'auth/popup-closed-by-user': 'Sign-in was cancelled. Try again when ready.',
      'auth/operation-not-allowed': 'Sign-up is temporarily unavailable. Please try again later.',
      'permission-denied': 'Account setup could not finish. Please try again later.',
      'account/setup-failed': 'Account setup could not finish. Your email may be registered; try logging in or report the issue.',
    };
    if (messages[error?.code]) return messages[error.code];
    if (!error?.code && /^Username must be|^That username is already taken\.$/.test(error?.message || '')) return error.message;
    return isSignup ? 'Account creation failed. Please try again.' : 'Could not log in. Please try again.';
  }

  function renderAuthScreen() {

            ${isReset ? '' : `<button type="button" id="auth-google-btn" class="auth-google-btn">${googleIcon()} Continue with Google</button>

              <label>Email

              <button type="submit" id="auth-submit-btn">${isReset ? 'Send reset link' : isSignup ? 'Sign up' : 'Log in'}</button>

            ${!isSignup && !isReset ? '<button type="button" id="auth-forgot-btn" class="link-btn">Forgot password?</button>' : ''}

            <p class="auth-switch">

        errorEl.textContent = '';
        const email = document.getElementById('auth-email-input').value.trim();
        const password = document.getElementById('auth-password-input')?.value || '';
        const usernameInput = document.getElementById('auth-username-input');
        submitBtn.disabled = true;
        submitBtn.textContent = isReset ? 'Sending\u2026' : isSignup ? 'Creating account\u2026' : 'Logging in\u2026';
        try {
          if (isReset) {

            submitBtn.textContent = 'Send reset link';

          if (isSignup) await WR.account.signUp(email, password, usernameInput.value);
          else await WR.account.signIn(email, password);

      });

      document.getElementById('auth-google-btn')?.addEventListener('click', async () => {
        errorEl.textContent = '';

      document.getElementById('auth-switch-btn').addEventListener('click', () => {
        mode = isReset || isSignup ? 'login' : 'signup';
        render();

    }

    render();
  }

(function () {
  function escapeHtml(text) {
    const element = document.createElement('div');
    element.textContent = String(text || '');
    return element.innerHTML;
  }

  function formatAssistantAnswer(answer) {
    const inline = (text) => escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return String(answer || '')
      .split(/\r?\n/)
      .map((line) => {
        if (/^###\s+/.test(line)) return `<h3>${inline(line.replace(/^###\s+/, ''))}</h3>`;
        if (/^##\s+/.test(line)) return `<h2>${inline(line.replace(/^##\s+/, ''))}</h2>`;
        if (/^#\s+/.test(line)) return `<h2>${inline(line.replace(/^#\s+/, ''))}</h2>`;
        if (/^[-*]\s+/.test(line)) return `<p>• ${inline(line.replace(/^[-*]\s+/, ''))}</p>`;
        return line.trim() ? `<p>${inline(line)}</p>` : '';
      })
      .join('');
  }

  function snapshotForPrompt(s) {
    // A trimmed, explicitly-labelled version of the snapshot \u2014 numbers only,
    // no raw transaction-level detail, so the model has exactly what it
    // needs to explain the dashboard and nothing it could use to invent
    // detail that isn't there.
    return {
      month: s.month,
      baseCurrency: s.profile.baseCurrency,
      monthlyIncome: s.income,
      monthlyExpenses: s.cashflow.totalExpenses,
      availableSurplus: s.availableSurplus,
      savingsRate: s.savingsRate,
      totalDebt: s.totalDebt,
      debtToIncomeRatio: s.debtToIncomeRatio,
      highestInterestDebt: s.highestInterestDebt
        ? { name: s.highestInterestDebt.name, interestRate: s.highestInterestDebt.interestRate, balance: s.highestInterestDebt.currentBalance }
        : null,
      emergencyFundMonths: s.emergencyFundMonths,
      emergencyFundTargetMonths: s.emergencyFundTargetMonths,
      netWorth: s.netWorth.netWorth,
      totalAssets: s.netWorth.totalAssets,
      totalLiabilities: s.netWorth.totalLiabilities,
      assumedInvestmentReturn: s.assumedInvestmentReturn,
      investmentReadiness: s.investmentReadiness,
      financialHealthScore: s.healthScore.score,
      currentRecommendations: s.recommendations.map((r) => ({ title: r.title, priority: r.priority, reason: r.reason })),
    };
  }

  async function askAssistant(workerUrl, question, snapshot) {
    const response = await fetch(`${workerUrl.replace(/\/$/, '')}/assistant`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        question,
        snapshot: snapshotForPrompt(snapshot),
      }),
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API error ${response.status}: ${errText}`);
    }
    const data = await response.json();
    if (!data.answer) throw new Error('Assistant returned no answer.');
    return data.answer;
  }

  async function renderAssistant(container) {
    const workerUrl = localStorage.getItem('wr_worker_url') || '';
    const chats = (await WR.repos.assistantChats.getAll()).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    const historyRows = chats.slice(0, 20).map((chat) => `
      <tr data-id="${WR.ui.escapeText(chat.id)}">
        <td>${new Date(chat.createdAt).toLocaleDateString('en-ZA', { day: '2-digit', month: 'short' })}</td>
        <td class="history-question" title="${escapeHtml(chat.question)}">${escapeHtml(chat.question)}</td>
        <td><button type="button" class="link-btn open-chat" data-id="${WR.ui.escapeText(chat.id)}">Open</button></td>
      </tr>`).join('');

    WR.ui.setHTML(container, `
      <h1>Wealth Assistant</h1>
      ${
        workerUrl
          ? `<div class="assistant-workspace">
               <div class="assistant-main">
                 <p class="fine-print">Answers use only the numbers already shown on your Dashboard. General information, not personalised financial advice.</p>
                 <form id="ask-form" class="stacked-form assistant-chat">
                   <textarea id="question-input" rows="3" placeholder="Ask about your cash flow, debt, emergency fund, or next financial priority." required></textarea>
                   <button type="submit">Ask Wealth Assistant</button>
                 </form>
                 <div id="answer-area" class="assistant-status" aria-live="polite"></div>
               </div>
               <aside class="assistant-history">
                 <h2>Recent conversations</h2>
                 <table><thead><tr><th>Date</th><th>Question</th><th></th></tr></thead>
                   <tbody>${historyRows || '<tr><td colspan="3" class="empty">Your previous questions appear here.</td></tr>'}</tbody>
                 </table>
               </aside>
             </div>`
          : `<p class="empty">No Worker endpoint configured. Add your Cloudflare Worker URL in Settings to enable the assistant.</p>`
      }
    `);

    if (!workerUrl) return;

    container.querySelectorAll('.open-chat').forEach((button) => {
      button.addEventListener('click', () => {
        const chat = chats.find((item) => item.id === button.dataset.id);
        if (!chat) return;
        document.getElementById('question-input').value = chat.question;
        WR.ui.setHTML(document.getElementById('answer-area'), `<div class="assistant-answer">${formatAssistantAnswer(chat.answer)}</div>`);
      });
    });

    document.getElementById('ask-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('question-input').value.trim();
      if (!question) return;
      const answerArea = document.getElementById('answer-area');
      WR.ui.setHTML(answerArea, '<p class="loading">Thinking\u2026</p>');
      try {
        const snapshot = await WR.ui.buildSnapshot();
        const answer = await askAssistant(workerUrl, question, snapshot);
        await WR.repos.assistantChats.add(WR.models.createAssistantChat({
          question,
          answer,
          createdAt: new Date().toISOString(),
          month: snapshot.month,
        }));
        await renderAssistant(container);
        document.getElementById('question-input').value = question;
        WR.ui.setHTML(document.getElementById('answer-area'), `<div class="assistant-answer">${formatAssistantAnswer(answer)}</div>`);
      } catch (err) {
        WR.ui.setHTML(answerArea, `<p class="warning">Something went wrong: ${err.message}</p>`);
      }
    });
  }

  WR.ui.renderAssistant = renderAssistant;
  WR.ui._askAssistant = askAssistant; // exposed for testing snapshotForPrompt indirectly
  WR.ui._snapshotForPrompt = snapshotForPrompt;
  WR.ui._formatAssistantAnswer = formatAssistantAnswer;
})();

        <label>Current amount<input name="current" type="number" min="0" step="0.01" placeholder="0.00" value="${WR.ui.escapeText(savingsTotal)}" required></label>
        <label>Target amount<input name="target" type="number" min="0.01" step="0.01" placeholder="0.00" required></label>
        <div class="form-panel-actions"><button>Add goal</button></div></form></div></section>`);
    const syncCurrentInput = (form) => {
      const pot = potsById[form.elements.potId.value];
      form.elements.current.disabled = Boolean(pot);
      form.elements.current.required = !pot;
      if (pot) form.elements.current.value = amount(pot.currentAmount);
    };
    container.querySelectorAll('#create-goal, .goal-edit').forEach((form) => {
      form.elements.potId.addEventListener('change', () => syncCurrentInput(form));
    });
    container.querySelector('#create-goal').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const potId = form.elements.potId.value || undefined;
      const currentAmount = potId && potsById[potId] ? amount(potsById[potId].currentAmount) : amount(form.elements.current.value);
      await WR.repos.financialGoals.add({ id: WR.models.newId(), name: form.elements.name.value.trim(), potId, initialAmount: currentAmount, currentAmount, targetAmount: amount(form.elements.target.value) });
      renderGoals(container);
    });
    container.querySelectorAll('.goal-edit').forEach((form) => form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const goal = await WR.repos.financialGoals.getById(form.dataset.id);
      if (!goal) return;
      const potId = form.elements.potId.value || undefined;
      const pot = potId ? potsById[potId] : null;
      Object.assign(goal, { name: form.elements.name.value.trim(), potId, currentAmount: pot ? amount(pot.currentAmount) : amount(form.elements.current.value), targetAmount: amount(form.elements.target.value) });
      await WR.repos.financialGoals.update(goal);
      renderGoals(container);
    }));
  }

  async function transferSavings(sourceId, destinationId, value, month) {
    if (value <= 0) throw new Error('Enter a transfer amount greater than zero.');
    const api = WR.account.getFirestoreApi();
    const db = WR.account.getDb();
    const uid = WR.account.getCurrentUser().uid;
    const sourceStore = sourceId.startsWith('general:') ? 'budgetLines' : 'savingsPots';
    const sourceKey = sourceId.startsWith('general:') ? sourceId.slice(8) : sourceId;
    const sourceRef = api.doc(db, 'users', uid, sourceStore, sourceKey);
    const destinationRef = api.doc(db, 'users', uid, 'savingsPots', destinationId);
    await api.runTransaction(db, async (transaction) => {
      const sourceSnap = await transaction.get(sourceRef);
      const destinationSnap = await transaction.get(destinationRef);
      if (!sourceSnap.exists() || !destinationSnap.exists()) throw new Error('The source or destination no longer exists.');
      const source = sourceSnap.data();
      const destination = destinationSnap.data();
      const field = sourceStore === 'budgetLines' ? 'actualAmount' : 'currentAmount';
      if (sourceStore === 'budgetLines' && source.type !== 'savings') throw new Error('Only general savings can be transferred.');
      if (sourceStore === 'budgetLines' && source.month > month) throw new Error('Future savings cannot fund an earlier month.');
      if (source.archived || destination.archived) throw new Error('Archived pots cannot be used for transfers.');
      if (amount(source[field]) < value) throw new Error('Insufficient funds in the selected source.');
      transaction.update(sourceRef, { [field]: amount(source[field]) - value });
      transaction.update(destinationRef, { currentAmount: amount(destination.currentAmount) + value });
    });
  }

  async function renderSavingsPots(container) {
    const [pots, profile] = await Promise.all([WR.repos.savingsPots.getAll(), WR.ui.getOrCreateProfile()]);
    const month = WR.ui._savingsMonth || WR.ui.currentMonthKey();
    const active = pots.filter((pot) => !pot.archived);
    const activeBalance = active.reduce((sum, pot) => sum + amount(pot.currentAmount), 0);
    const currency = profile.baseCurrency;
    const potCard = (pot, archived) => {
      const saved = amount(pot.currentAmount);
      const target = amount(pot.targetAmount);
      return `<article class="goal-card pot-card${archived ? ' is-archived' : ''}"><div class="goal-card-header"><h3>${escape(pot.name)}</h3><span class="pct-badge">${progress(saved, target)}%</span></div>
        <div class="pot-amounts"><span class="pot-saved">${currency} ${WR.ui.fmt(saved)}</span><span class="pot-target">of ${currency} ${WR.ui.fmt(target)}</span></div>
        ${meter(saved, target)}
        <p class="pot-remaining">${target - saved > 0 ? `${currency} ${WR.ui.fmt(target - saved)} to go` : 'Target reached'}</p>
        ${archived ? `<div class="card-edit-actions"><button class="restore-pot secondary" data-id="${WR.ui.escapeText(pot.id)}">Restore pot</button></div>` : `
        <details class="card-edit"><summary>Edit pot</summary>
          <form class="pot-edit card-edit-form" data-id="${WR.ui.escapeText(pot.id)}"><label class="span-2">Name<input name="name" value="${escape(pot.name)}" required></label>
          <label>Target<input name="target" type="number" min="0.01" step="0.01" value="${WR.ui.escapeText(target)}" required></label>
          <label>Saved in this pot<input name="current" type="number" min="0" step="0.01" value="${WR.ui.escapeText(saved)}" required></label>
          <div class="card-edit-actions span-2"><button>Save changes</button><button type="button" class="secondary archive-pot" data-id="${WR.ui.escapeText(pot.id)}">Archive pot</button></div></form>
        </details>`}</article>`;
    };
    WR.ui.setHTML(container, `<h2>Savings Pots</h2><div class="savings-overview">
      <div><span>Active savings pots</span><strong>${currency} ${WR.ui.fmt(activeBalance)}</strong></div></div>
      <div class="goal-grid">${active.map((pot) => potCard(pot, false)).join('') || '<p class="empty">No active savings pots. Create one below to start tracking money you will not touch.</p>'}</div>
      <div class="form-panels">
        <div class="form-panel"><h3>Create a pot</h3><form id="create-pot" class="form-panel-grid">
          <label class="span-2">Pot name<input name="name" placeholder="e.g. Holiday, School fees" required></label>
          <label>Target amount<input name="target" type="number" min="0.01" step="0.01" placeholder="0.00" required></label>
          <label>Already saved<input name="current" type="number" min="0" step="0.01" placeholder="0.00" value="0" required></label>
          <div class="form-panel-actions"><button>Add pot</button></div></form></div>
        <div class="form-panel"><h3>Transfer between pots</h3><form id="transfer-pot" class="form-panel-grid">
          <label>From<select name="source" required>
            <option value="">Choose a pot\u2026</option>${active.filter((pot) => amount(pot.currentAmount) > 0).map((pot) => `<option value="${WR.ui.escapeText(pot.id)}">${escape(pot.name)} \u00b7 ${currency} ${WR.ui.fmt(pot.currentAmount)}</option>`).join('')}</select></label>
          <label>To<select name="destination" required><option value="">Choose a pot\u2026</option>${active.map((pot) => `<option value="${WR.ui.escapeText(pot.id)}">${escape(pot.name)}</option>`).join('')}</select></label>
          <label class="span-2">Amount<input name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></label>
          <div class="form-panel-actions"><button>Transfer</button></div></form></div>
      </div>
      <details class="archived-pots"><summary>Archived pots (${pots.length - active.length})</summary><div class="goal-grid">${pots.filter((pot) => pot.archived).map((pot) => potCard(pot, true)).join('') || '<p class="empty">No archived pots.</p>'}</div></details>`);
    container.querySelector('#create-pot').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      await WR.repos.savingsPots.add({ id: WR.models.newId(), name: form.elements.name.value.trim(), targetAmount: amount(form.elements.target.value), currentAmount: amount(form.elements.current.value), archived: false });
      renderSavingsPots(container);
    });
    container.querySelectorAll('.pot-edit').forEach((form) => form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const pot = await WR.repos.savingsPots.getById(form.dataset.id);
      if (!pot) return;
      Object.assign(pot, { name: form.elements.name.value.trim(), targetAmount: amount(form.elements.target.value), currentAmount: amount(form.elements.current.value) });
      await WR.repos.savingsPots.update(pot);
      renderSavingsPots(container);
    }));
    container.querySelectorAll('.archive-pot, .restore-pot').forEach((button) => button.addEventListener('click', async () => {
      const pot = await WR.repos.savingsPots.getById(button.dataset.id);
      if (!pot) return;
      pot.archived = button.classList.contains('archive-pot');
      await WR.repos.savingsPots.update(pot);
      renderSavingsPots(container);
    }));
    container.querySelector('#transfer-pot').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      if (form.elements.source.value === form.elements.destination.value) return WR.ui.notify('Choose different pots.', 'error');
      try {
        await transferSavings(form.elements.source.value, form.elements.destination.value, amount(form.elements.amount.value), month);
        WR.ui.notify('Savings transferred.', 'success');
        await renderSavingsPage(container.closest('#content'));
      } catch (error) { WR.ui.notify(error.message, 'error'); }
    });
  }

  async function renderSavingsPage(container) {
    WR.ui.setHTML(container, '<h1>Savings</h1><p class="fine-print">Only active savings pots are included in the savings total. Emergency funds are shown separately.</p><section class="feature-section" id="savings-pots"></section><section class="feature-section" id="emergency-savings"></section>');
    await renderSavingsPots(container.querySelector('#savings-pots'));
    await WR.ui.renderEmergencyFund(container.querySelector('#emergency-savings'));
  }

  async function renderWealth(container) {
    WR.ui.setHTML(container, '<h1>Wealth</h1><div id="wealth-summary"></div><section class="feature-section" id="wealth-investments"></section><section class="feature-section" id="wealth-assets"></section>');
    await WR.ui.renderInvestments(container.querySelector('#wealth-investments'));
    await WR.ui.renderAssets(container.querySelector('#wealth-assets'));
  }

  WR.ui.renderGoals = renderGoals;
  WR.ui.renderSavingsPage = renderSavingsPage;
  WR.ui.renderWealth = renderWealth;
})();
// Hash-based router. No history API complexity needed for a single-page
// local app \u2014 #/dashboard, #/transactions, etc. map directly to render
// functions.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const ROUTES = {
    '#/dashboard': 'renderDashboard',
    '#/income': 'renderIncome',
    '#/fixed-expenses': 'renderFixedExpenses',
    '#/savings': 'renderSavingsPage',
    '#/emergency-fund': 'renderSavingsPage',
    '#/day-to-day': 'renderDayToDay',
    '#/transactions': 'renderDayToDay',
    '#/variable-expenses': 'renderTransactions',
    '#/debts': 'renderDebts',
    '#/assets': 'renderWealth',
    '#/investments': 'renderWealth',
    '#/wealth': 'renderWealth',
    '#/goals': 'renderGoals',
    '#/insights': 'renderInsights',
    '#/forecast': 'renderForecast',
    '#/reports': 'renderReports',
    '#/excel': 'renderExcel',
    '#/assistant': 'renderAssistant',
    '#/settings': 'renderSettings',
  };

  const SKELETON_HTML = `
    <div class="skeleton" aria-busy="true" aria-label="Loading">
      <div class="skeleton-line skeleton-title"></div>
      <div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>
      <div class="skeleton-card skeleton-wide"></div>
      <div class="skeleton-line"></div><div class="skeleton-line skeleton-short"></div>
    </div>`;
  let lastRoutedHash = null;
  let navigationId = 0;
  let routerInitialized = false;

  async function handleRoute() {
    if (!window.location.hash || window.location.hash === '#') {
      window.location.hash = '#/dashboard';
      return;
    }
    const hash = window.location.hash || '#/dashboard';
    const renderFnName = ROUTES[hash] || 'renderDashboard';
    WR.ui.setActiveNav(ROUTES[hash] ? hash : '#/dashboard');

    const previousContent = document.getElementById('content');
    if (!previousContent) return;
    const requestId = ++navigationId;
    const newView = hash !== lastRoutedHash || !previousContent.dataset.routeView;
    const content = newView ? previousContent.cloneNode(false) : previousContent;
    content.dataset.routeView = 'true';
    if (newView) previousContent.replaceWith(content);
    content.classList.toggle('settings-page', hash === '#/settings');
    // Only on navigation; background re-renders of the same page keep the current content.
    if (hash !== lastRoutedHash || !content.children.length) WR.ui.setHTML(content, SKELETON_HTML);
    lastRoutedHash = hash;
    try {
      await WR.ui[renderFnName](content);
      if (requestId !== navigationId || !content.isConnected) return;
      if (WR.ui.enhanceResponsiveContent) WR.ui.enhanceResponsiveContent(content);
    } catch (err) {
      if (requestId !== navigationId || !content.isConnected || err.name === 'AbortError') return;
      if (err && err.name === 'VersionError') {
        WR.ui.setHTML(content, `
          <p class="warning">${err.message}</p>
          <button id="version-error-reload-btn">Reload app</button>
        `);
        document.getElementById('version-error-reload-btn').addEventListener('click', async () => {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((reg) => reg.unregister()));
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          window.location.reload();
        });
      } else {
        WR.ui.setHTML(content, `<p class="warning">Something went wrong loading this page: ${err.message}</p>`);
        console.error(err);
      }
    }
  }

  function initRouter() {
    if (!routerInitialized) {
      window.addEventListener('hashchange', handleRoute);
      routerInitialized = true;
    }
    if (!window.location.hash || window.location.hash === '#') {
      window.location.hash = '#/dashboard';
      return;
    }
    handleRoute();
  }

  WR.ui.initRouter = initRouter;
  WR.ui.reRenderCurrentRoute = handleRoute;
})();
function resetViewportZoom() {
  const meta = document.querySelector('meta[name="viewport"]');
  if (!meta) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const original = meta.getAttribute('content').replace(/,\s*maximum-scale=1/g, '');
  meta.setAttribute('content', original);
  window.scrollTo(0, 0);
}

function bootApp() {
  if (!window.location.hash || window.location.hash === '#') {
    window.location.hash = '#/dashboard';
  }
  resetViewportZoom();
  WR.ui.renderShell();
  WR.ui.initRouter();
  if (!WR.ui._paydayWatcher) {
    const refreshPayday = () => {
      if (!WR.account.getCurrentUser() || document.visibilityState !== 'visible') return;
      if (WR.ui.syncBudgetMonth()) WR.ui.buildSnapshot(WR.ui.currentBudgetMonth()).then(() => WR.ui.reRenderCurrentRoute()).catch(error => WR.ui.notify(error.message, 'error'));
    };
    WR.ui.syncBudgetMonth();
    WR.ui._paydayWatcher = setInterval(refreshPayday, 60000);
    document.addEventListener('visibilitychange', refreshPayday);
  }
}

function renderSplashScreen() {
  WR.ui.setHTML(document.getElementById('app'), `
    <div class="app-splash" aria-live="polite" aria-busy="true">
      <div class="app-splash-card">
        <svg class="splash-mark" width="64" height="64" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M2 18 C 7 18, 7 8, 12 8 S 17 18, 22 18" stroke-width="1.6" stroke-dasharray="1 3.2" stroke-linecap="round"></path>
          <circle cx="22" cy="18" r="2"></circle>
        </svg>
        <div class="splash-name">WealthRoute</div>
        <div class="splash-status">Preparing your dashboard</div>
        <div class="splash-bar"><span></span></div>
      </div>
    </div>
  `);
}

function showUpdateBanner() {
  if (document.getElementById('update-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.className = 'update-banner';
  banner.setAttribute('role', 'status');
  WR.ui.setHTML(banner, `
    <span>A new version of WealthRoute is available.</span>
    <button type="button" id="update-banner-refresh">Refresh</button>
    <button type="button" id="update-banner-dismiss" class="update-banner-close" aria-label="Dismiss">×</button>
  `);
  document.body.appendChild(banner);
  document.getElementById('update-banner-refresh').addEventListener('click', () => window.location.reload());
  document.getElementById('update-banner-dismiss').addEventListener('click', () => banner.remove());
}

function hideSplashScreen() {
  const splash = document.querySelector('.app-splash');
  if (!splash) return;
  splash.classList.add('is-hiding');
  setTimeout(() => {
    splash.remove();
  }, 320);
}

document.addEventListener('DOMContentLoaded', async () => {
  renderSplashScreen();
  const splashStartedAt = performance.now();
  if ('serviceWorker' in navigator) {
    // First-ever install also fires controllerchange, which isn't an "update".
    const hadController = Boolean(navigator.serviceWorker.controller);
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController) showUpdateBanner();
    });
    navigator.serviceWorker.register('./service-worker.js')
      .then((reg) => {
        reg.update().catch(() => {});
        setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      })
      .catch((err) => {
        console.warn('Service worker registration failed', err);
      });
  }
  // Asks the browser not to auto-evict IndexedDB under storage pressure \u2014
  // Firestore's own offline cache uses IndexedDB internally, so this still helps.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  if (!WR.account.isConfigured()) {
    // Firestore is now the only data store the app knows how to use, so without
    // a Firebase project wired up there's genuinely nothing to show.
    WR.ui.setHTML(document.getElementById('app'), `
      <div class="auth-screen">
        <div class="auth-card">
          <div class="auth-brand">WealthRoute</div>
          <h1>Setup required</h1>
          <p class="auth-subtitle">This build has no Firebase project configured, so there's no account system to store data in. Contact whoever deployed this app.</p>
        </div>
      </div>
    `);
    return;
  }

  try {
    await WR.account.ensureInit();
  } catch (err) {
    console.error('Account init failed', err);
    WR.ui.setHTML(document.getElementById('app'), `
      <div class="auth-screen">
        <div class="auth-card">
          <div class="auth-brand">WealthRoute</div>
          <h1>Couldn't connect</h1>
          <p class="auth-subtitle">${err.message || 'Something went wrong starting the app. Check your connection and reload.'}</p>
        </div>
      </div>
    `);
    return;
  }

  const initialUser = await WR.account.waitForFirstUser();
  const elapsed = performance.now() - splashStartedAt;
  const remaining = 260 - elapsed;
  if (remaining > 0) await new Promise((resolve) => setTimeout(resolve, remaining));
  hideSplashScreen();
  if (initialUser) bootApp();
  else WR.ui.renderAuthScreen();

  // Single global listener from here on: flips the whole app between the
  // auth screen and the real shell as sign-in state changes, and keeps the
  // topbar/current page in sync (e.g. the Dashboard greeting picking up a
  // username that finishes loading a moment after sign-in resolves).
  WR.account.onAuthChange((user) => {
    if (user) {
      if (!document.getElementById('nav')) {
        bootApp();
        return;
      }
      WR.ui.renderNavAccount();
      WR.ui.reRenderCurrentRoute();
    } else {
      WR.ui.renderAuthScreen();
    }
  });
});

    </script>
  </body>
