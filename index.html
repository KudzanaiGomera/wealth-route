<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WealthRoute</title>
    <meta name="theme-color" content="#0e6b57" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
/* WealthRoute design tokens. A "private ledger" feel: warm paper or deep
   ink backdrop, a literary serif for the numbers that matter, deep emerald
   as the one accent that does real work, gold reserved for medium-priority
   signal so it doesn't compete with the primary accent. */

:root {
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  --bg: #f6f4ee;
  --panel: #ffffff;
  --panel-alt: #fbfaf5;
  --text: #171a19;
  --muted: #5b6560;
  --border: #e3e0d3;
  --accent: #0e6b57;
  --accent-contrast: #ffffff;
  --gold: #a9781f;
  --danger: #a6332b;
  --success: #2e7d4f;
  --shadow: 0 1px 2px rgba(23, 26, 25, 0.04);

  --chart-1: #0e6b57;
  --chart-2: #a9781f;
  --chart-3: #5b6560;
  --chart-4: #7c9c93;
  --chart-5: #c4a468;
}

:root[data-theme="dark"] {
  --bg: #101615;
  --panel: #171f1d;
  --panel-alt: #1c2422;
  --text: #e8ece9;
  --muted: #93a19a;
  --border: #283330;
  --accent: #34b493;
  --accent-contrast: #06120e;
  --gold: #dcab52;
  --danger: #e2685f;
  --success: #59c48a;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);

  --chart-1: #34b493;
  --chart-2: #dcab52;
  --chart-3: #93a19a;
  --chart-4: #6c9186;
  --chart-5: #c9ac72;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  background:
    radial-gradient(circle at 8% 10%, color-mix(in srgb, var(--accent) 12%, transparent) 0, transparent 35%),
    radial-gradient(circle at 90% 0%, color-mix(in srgb, var(--gold) 12%, transparent) 0, transparent 28%),
    var(--bg);
  color: var(--text);
  transition: background-color 0.15s ease, color 0.15s ease;
}

/* ---------- Top bar ---------- */

.topbar {
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border-bottom: 1px solid var(--border);
  padding: 0.85rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: nowrap;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(8px);
}
.brand {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  letter-spacing: 0.01em;
}
.brand-mark { flex-shrink: 0; }
.brand-mark path { stroke: var(--accent); }
.brand-mark circle { fill: var(--accent); }

#nav {
  display: flex;
  gap: 0.2rem;
  flex-wrap: nowrap;
  flex-direction: column;
  position: absolute;
  right: 1rem;
  top: calc(100% + 0.45rem);
  min-width: 230px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 0.4rem;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-4px);
  transition: opacity 0.16s ease, transform 0.16s ease;
}
#nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.88rem;
  padding: 0.45rem 0.55rem;
  border-bottom: none;
  border-radius: 7px;
}
#nav a.active {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  font-weight: 600;
}
#nav a:hover { background: var(--panel-alt); }
#nav .nav-section-title {
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.35rem 0.55rem 0.2rem;
}
#nav .nav-divider {
  height: 1px;
  background: var(--border);
  margin: 0.3rem 0.2rem;
}
#nav a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.topbar.nav-open #nav {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.nav-controls {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: auto;
}

.nav-jump {
  height: 2.1rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-alt);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.83rem;
  padding: 0 0.85rem;
  min-width: 190px;
}

.nav-toggle {
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel-alt);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.nav-toggle-bars {
  width: 0.9rem;
  height: 0.7rem;
  display: grid;
  align-content: space-between;
}

.nav-toggle-bars span {
  display: block;
  height: 2px;
  border-radius: 2px;
  background: var(--text);
}

.theme-toggle {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text);
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--accent); }

#content { max-width: 980px; margin: 0 auto; padding: 1.75rem 1.5rem 3rem; }
#content > section { animation: sectionIn 220ms ease-out; }

.global-notice {
  max-width: 980px;
  margin: 0.75rem auto 0;
  padding: 0 1.5rem;
}
.global-notice .notice-card {
  border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border));
  background: color-mix(in srgb, var(--danger) 9%, var(--panel));
  border-radius: 10px;
  padding: 0.8rem 1rem;
  font-size: 0.86rem;
}

.toast-stack {
  position: fixed;
  right: 1rem;
  bottom: 1rem;
  display: grid;
  gap: 0.5rem;
  z-index: 60;
}
.toast {
  min-width: 220px;
  max-width: 360px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 0.65rem 0.75rem;
  box-shadow: var(--shadow);
  font-size: 0.84rem;
}
.toast.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.65rem;
}
.toast-action {
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.22rem 0.6rem;
  cursor: pointer;
  white-space: nowrap;
}
.toast.success { border-color: color-mix(in srgb, var(--success) 40%, var(--border)); }
.toast.error { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }

@keyframes sectionIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Type scale ---------- */

h1 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 500; margin: 0 0 0.25rem; }
h2 { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 500; margin: 1.75rem 0 0.6rem; }
h3 { font-size: 0.95rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
.month-label { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.9rem; }

/* ---------- Dashboard hero ---------- */

.hero { margin-bottom: 0.5rem; }
.greeting { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.2rem; }
.position-summary-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.9fr;
  gap: 1rem;
  margin: 0.3rem 0 1rem;
  align-items: stretch;
}
.dashboard-card {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  box-shadow: var(--shadow);
}
.dashboard-card h2 {
  margin-top: 0;
}
.hero-headline {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.75rem 2rem;
  box-shadow: var(--shadow);
  margin: 1rem 0 1.25rem;
}
.hero-headline .stat-label { font-size: 0.85rem; }
.hero-headline .hero-value {
  display: block;
  font-family: var(--font-serif);
  font-size: 2.75rem;
  line-height: 1.15;
  margin-top: 0.15rem;
}
.hero-headline .hero-value.negative { color: var(--danger); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.65rem; margin: 1rem 0; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 0.9rem; }
.stat-label { display: block; font-size: 0.78rem; color: var(--muted); }
.stat-value { display: block; font-family: var(--font-serif); font-size: 1.3rem; margin-top: 0.2rem; }
.stat-value.negative { color: var(--danger); }

/* ---------- Health score ---------- */

.health-score {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.1rem 1.25rem;
  margin: 1.25rem 0;
}
.health-score h2 { margin-top: 0; }
.score-breakdown { display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: 0.83rem; color: var(--muted); margin: 0.5rem 0; }
.fine-print { font-size: 0.8rem; color: var(--muted); }

/* ---------- Recommendations ---------- */

.recommendations { margin: 1.5rem 0; }
.rec-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--muted);
  border-radius: 8px;
  padding: 0.95rem 1.1rem;
  margin-bottom: 0.7rem;
}
.rec-card.p-high { border-left-color: var(--danger); border-left-width: 4px; }
.rec-card.p-medium { border-left-color: var(--gold); }
.rec-card.p-low { border-left-color: var(--success); }
.rec-head { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.45rem; }
.rec-index { color: var(--muted); font-family: var(--font-serif); }
.rec-title { font-weight: 600; flex: 1; }
.badge {
  font-size: 0.72rem;
  padding: 0.1rem 0.55rem;
  border-radius: 999px;
  border: 1px solid currentColor;
  font-weight: 600;
}
.badge.p-high { color: var(--danger); }
.badge.p-medium { color: var(--gold); }
.badge.p-low { color: var(--success); }
.rec-card p { margin: 0.3rem 0; font-size: 0.9rem; color: var(--text); }
.rec-card p strong { color: var(--muted); font-weight: 600; }

/* ---------- Charts ---------- */

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
.chart-block { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; box-shadow: var(--shadow); }
.chart-block svg { max-width: 100%; height: auto; }
.chart-block svg text { fill: var(--muted); font-family: var(--font-sans); }

.summary-charts {
  display: grid;
  grid-template-columns: repeat(2, minmax(280px, 1fr));
  gap: 1rem;
  margin: 1rem 0 1.25rem;
}

.pie-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  box-shadow: var(--shadow);
}

.pie-layout {
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 0.8rem;
  align-items: center;
}

.pie-legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.35rem;
  font-size: 0.82rem;
}

.pie-legend li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.legend-label {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

.legend-dot {
  width: 0.62rem;
  height: 0.62rem;
  border-radius: 999px;
  display: inline-block;
}

.legend-value {
  font-family: var(--font-serif);
}

/* ---------- Tables ---------- */

.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  margin: 0.75rem 0;
}
.data-table { width: 100%; border-collapse: collapse; background: var(--panel); border: none; border-radius: 0; overflow: visible; margin: 0; min-width: 640px; }
.data-table th, .data-table td { padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.88rem; }
.data-table th { background: var(--panel-alt); font-weight: 600; color: var(--muted); font-size: 0.8rem; }
.data-table th.sortable { cursor: pointer; user-select: none; }
.data-table th.sortable:hover { color: var(--accent); }
.data-table tr:last-child td { border-bottom: none; }
.data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table .empty { color: var(--muted); text-align: center; padding: 1.25rem; }
.data-table td input.cell, .data-table td select.cell { width: 100%; border: 1px solid transparent; background: transparent; color: var(--text); font-size: 0.85rem; padding: 0.2rem; font-family: var(--font-sans); transition: background-color 0.5s ease; }
.data-table td input.cell:focus, .data-table td select.cell:focus { border-color: var(--accent); background: var(--panel-alt); }
.data-table td input.cell.just-saved, .data-table td select.cell.just-saved { background: color-mix(in srgb, var(--success) 22%, transparent); }
.invalid-row { background: color-mix(in srgb, var(--danger) 10%, var(--panel)); }

/* ---------- Forms ---------- */

.inline-form, .stacked-form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.75rem 0; }
.stacked-form { flex-direction: column; align-items: flex-start; }
.inline-form input, .inline-form select, .stacked-form input, .stacked-form select, textarea {
  padding: 0.42rem 0.55rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.88rem;
  background: var(--panel);
  color: var(--text);
  font-family: var(--font-sans);
}
button {
  padding: 0.48rem 0.95rem;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: var(--accent-contrast);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
}
button:hover { filter: brightness(1.08); }
button.secondary { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); }
button.danger { background: var(--danger); color: #fff; }
.link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.85rem; padding: 0; font-weight: 500; }
.link-btn:hover { text-decoration: underline; }

.toolbar { display: flex; gap: 1rem; align-items: center; margin: 0.75rem 0; flex-wrap: wrap; }
.mapping-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.5rem; margin: 0.75rem 0; }
.file-label { display: inline-block; }

.warning { color: var(--danger); }
.loading { color: var(--muted); }
.assistant-answer { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; line-height: 1.55; box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

@media (max-width: 900px) {
  .topbar { padding: 0.7rem 1rem; gap: 0.85rem; }
  .nav-jump { display: none; }
  #nav {
    right: 0.7rem;
    left: 0.7rem;
    top: calc(100% + 0.35rem);
    min-width: 0;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
  }
  #content { padding: 1.1rem 0.9rem 2.4rem; }
  .position-summary-grid { grid-template-columns: 1fr; }
  .hero-headline { padding: 1.25rem 1.4rem; }
  .hero-headline .hero-value { font-size: 2.25rem; }
}

@media (max-width: 680px) {
  h1 { font-size: 1.35rem; }
  h2 { font-size: 1.08rem; }
  .toolbar { flex-direction: column; align-items: stretch; gap: 0.5rem; }
  .toolbar > * { width: 100%; }
  .inline-form { flex-direction: column; align-items: stretch; }
  .inline-form input, .inline-form select, .inline-form button, .stacked-form input, .stacked-form select, .stacked-form button, textarea { width: 100%; }
  .stat-grid { grid-template-columns: 1fr; }
  .score-breakdown { flex-direction: column; gap: 0.25rem; }
  .data-table { min-width: 560px; }
  .summary-charts { grid-template-columns: 1fr; }
  .pie-layout { grid-template-columns: 1fr; }
}

@media (min-width: 901px) {
  .nav-toggle { display: none; }
}

    <script>
// IndexedDB schema and migration layer.

window.WR = window.WR || {};

(function () {
  const DB_NAME = 'wealthroute';
  const DB_VERSION = 2;

  /** @type {Promise<IDBDatabase>|null} */
  let dbPromise = null;

  function ensureStore(db, name, options, indexes) {
    const store = db.objectStoreNames.contains(name)
      ? null
      : db.createObjectStore(name, options || { keyPath: 'id' });
    if (!store || !indexes || !indexes.length) return;
    indexes.forEach((indexDef) => {
      if (!store.indexNames.contains(indexDef.name)) {
        store.createIndex(indexDef.name, indexDef.keyPath, indexDef.options || undefined);
      }
    });
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        ensureStore(db, 'userProfile', { keyPath: 'id' });
        ensureStore(db, 'incomeSources', { keyPath: 'id' });
        ensureStore(db, 'fixedExpenses', { keyPath: 'id' });
        ensureStore(db, 'expenseCategories', { keyPath: 'id' });
        ensureStore(db, 'budgetLines', { keyPath: 'id' }, [{ name: 'by-month', keyPath: 'month' }]);
        ensureStore(db, 'debts', { keyPath: 'id' });
        ensureStore(db, 'debtPayments', { keyPath: 'id' }, [{ name: 'by-debt', keyPath: 'debtId' }]);
        ensureStore(db, 'emergencyFundContributions', { keyPath: 'id' });
        ensureStore(db, 'dayToDayAccounts', { keyPath: 'id' });
        ensureStore(db, 'dayToDayTransactions', { keyPath: 'id' });
        ensureStore(db, 'assets', { keyPath: 'id' });
        ensureStore(db, 'investments', { keyPath: 'id' });
        ensureStore(db, 'netWorthSnapshots', { keyPath: 'id' }, [{ name: 'by-date', keyPath: 'date' }]);
        ensureStore(db, 'exchangeRates', { keyPath: 'id' });
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function getDB() {
    if (!dbPromise) dbPromise = openDatabase();
    return dbPromise;
  }

  function resetConnection() {
    dbPromise = null;
  }

  function deleteDatabase() {
    dbPromise = null;
    return new Promise((resolve, reject) => {
      const req = indexedDB.deleteDatabase(DB_NAME);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
      req.onblocked = () => resolve();
    });
  }

  WR.db = { getDB, resetConnection, deleteDatabase, DB_NAME, DB_VERSION };
})();
// Generic CRUD repository over a single IndexedDB object store. Every entity
// in the data model gets one of these via WR.createRepository(storeName).
// Index-backed queries (e.g. "budget lines for a given month") live in
// repositories.js instead, since they're store-specific.

window.WR = window.WR || {};

(function () {
  /**
   * @param {IDBRequest} request
   * @returns {Promise<any>}
   */
  function requestToPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  /**
   * @param {string} storeName
   */
  function createRepository(storeName) {
    return {
      async getAll() {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readonly');
        return requestToPromise(tx.objectStore(storeName).getAll());
      },
      /** @param {string} id */
      async getById(id) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readonly');
        return requestToPromise(tx.objectStore(storeName).get(id));
      },
      /** @param {{id: string}} item */
      async add(item) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).put(item));
        return item.id;
      },
      /** @param {{id: string}} item */
      async update(item) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).put(item));
        return item.id;
      },
      /** @param {string} id */
      async remove(id) {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).delete(id));
      },
      async clear() {
        const db = await WR.db.getDB();
        const tx = db.transaction(storeName, 'readwrite');
        await requestToPromise(tx.objectStore(storeName).clear());
      },
    };
  }

  WR.createRepository = createRepository;
})();
// One repository per entity, plus the index-backed queries the generic
// repository can't express on its own.

window.WR = window.WR || {};

(function () {
  /** @param {IDBRequest} request */
  function requestToPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);

   * Simulates paying off a set of debts month by month. Every open debt
   * always gets at least its minimum payment; all extra payment (plus any
   * minimums freed up as debts get fully paid off) goes to whichever debt
   * is first, still open, in `orderedDebts`.
   *
   * @param {Array} orderedDebts - pre-sorted by avalanche/snowball/hybrid
   * @param {number} extraMonthlyPayment - beyond the sum of all minimums
   * @returns {{
   *   months: number, totalInterestPaid: number,
   *   payoffOrder: Array<{name: string, monthsToPayoff: number|null}>,
   *   reachedSafetyCap: boolean
   * }}
   */
  function simulatePayoff(orderedDebts, extraMonthlyPayment) {
    const balances = orderedDebts.map((d) => ({
      name: d.name,
      balance: d.currentBalance,
      monthlyRate: d.interestRate / 12,
      minPayment: d.minPayment,
      paidOffMonth: null,
    }));

    let month = 0;
    let totalInterestPaid = 0;
    let extraPool = extraMonthlyPayment;

    while (balances.some((b) => b.balance > 0.01) && month < MAX_MONTHS) {
      month += 1;

      balances.forEach((b) => {
        if (b.balance > 0) {
          const interest = b.balance * b.monthlyRate;
          b.balance += interest;
          totalInterestPaid += interest;
        }
      });

      balances.forEach((b) => {
        if (b.balance > 0) {
          b.balance -= Math.min(b.minPayment, b.balance);
        }
      });

      let pool = extraPool;
      for (const b of balances) {
        if (b.balance > 0 && pool > 0) {
          const payment = Math.min(pool, b.balance);
          b.balance -= payment;
          pool -= payment;
        }
      }

      balances.forEach((b) => {
        if (b.balance <= 0.01 && b.paidOffMonth === null) {
          b.paidOffMonth = month;
          extraPool += b.minPayment; // rollover: freed-up minimum joins next month's extra pool
        }
      });
    }

    return {
      months: month,
      totalInterestPaid,
      payoffOrder: balances.map((b) => ({ name: b.name, monthsToPayoff: b.paidOffMonth })),
      reachedSafetyCap: month >= MAX_MONTHS,
    };
  }

  /**
   * Answers "what happens if I pay an extra RX/month" by comparing total
   * interest paid and total months with vs without the extra payment.
   */
  function calculateInterestSaved(orderedDebts, extraMonthlyPayment) {
    const withoutExtra = simulatePayoff(orderedDebts, 0);
    const withExtra = simulatePayoff(orderedDebts, extraMonthlyPayment);
    return {
      interestSaved: withoutExtra.totalInterestPaid - withExtra.totalInterestPaid,
      monthsSaved: withoutExtra.months - withExtra.months,
      withoutExtra,
      withExtra,
    };
  }

  Object.assign(WR.financial, {
    orderDebtsAvalanche: orderAvalanche,
    orderDebtsSnowball: orderSnowball,
    orderDebtsHybrid: orderHybrid,
    simulateDebtPayoff: simulatePayoff,
    calculateInterestSaved,
  });
})();
// Investment readiness. Deliberately answers "am I ready to invest?" before
// anything about what to invest in — matching the brief's explicit decision
// order (debt and emergency fund come first when they're the better use of
// money). Every outcome carries its reasons; never a bare verdict.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * @param {Object} inputs
   * @param {number} inputs.emergencyFundMonths
   * @param {number} inputs.emergencyFundTargetMonths
   * @param {number|null} inputs.highestDebtInterestRate - fraction, or null if debt-free
   * @param {number} inputs.assumedInvestmentReturn - fraction, e.g. 0.08 (configurable assumption, never guaranteed)
   * @param {number} inputs.availableSurplus - monthly
   * @returns {{ readiness: string, reasons: string[] }}
   */
  function assessInvestmentReadiness(inputs) {
    const {
      emergencyFundMonths,
      emergencyFundTargetMonths,
      highestDebtInterestRate,
      assumedInvestmentReturn,
      availableSurplus,
    } = inputs;

    const target = emergencyFundTargetMonths > 0 ? emergencyFundTargetMonths : 3;

    if (emergencyFundMonths < target * 0.5) {
      return {
        readiness: 'build_emergency_fund',
        reasons: [
          `Your emergency fund covers ${emergencyFundMonths.toFixed(1)} months of essential expenses, ` +
            `less than half of your ${target}-month target.`,
          'An emergency fund below this level means an unexpected expense would likely force you into new debt — building this up protects any investment gains you make later.',
        ],
      };
    }

    if (highestDebtInterestRate !== null && highestDebtInterestRate > assumedInvestmentReturn) {
      return {
        readiness: 'focus_on_debt',
        reasons: [
          `Your highest-interest debt costs ${(highestDebtInterestRate * 100).toFixed(1)}% a year, ` +
            `more than the ${(assumedInvestmentReturn * 100).toFixed(1)}% assumed investment return.`,
          'Paying this down is a guaranteed return equal to its interest rate — investing instead only makes sense once your most expensive debt costs less than you expect to earn.',
        ],
      };
    }

    if (emergencyFundMonths < target) {
      return {
        readiness: 'start_investing_conservatively',
        reasons: [
          `Your emergency fund covers ${emergencyFundMonths.toFixed(1)} of your ${target}-month target — ` +
            'past the halfway point, but not fully there yet.',
          'Debt is not more expensive than your assumed return, so starting conservatively while still finishing the emergency fund is reasonable.',
        ],
      };
    }

    if (availableSurplus <= 0) {
      return {
        readiness: 'review_cash_flow',
        reasons: [
          'There is no monthly surplus currently available to invest.',
          'Review spending before committing to new investment contributions — investing money you don\u2019t actually have available each month isn\u2019t sustainable.',
        ],
      };
    }

    return {
      readiness: 'ready_to_invest',
      reasons: [
        `Your emergency fund meets your ${target}-month target and your debt is not more expensive than your assumed investment return.`,
        `You have a monthly surplus of ${availableSurplus.toFixed(2)} available to allocate toward long-term investing.`,
      ],
    };
  }

  Object.assign(WR.financial, { assessInvestmentReadiness });
})();
// Multi-year forecasting. Every number here is a projection built from
// assumptions the caller supplies (growth rates, contribution amounts) —
// never presented as guaranteed, per the brief's safety principle. The UI
// layer is responsible for labelling this clearly as "projected", not "will".

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Projects net worth forward month by month, then returns one snapshot
   * per year. Debt accrues interest and is paid down by a fixed monthly
   * payment (floored at 0, doesn't go negative); investments grow by an
   * assumed annual return and receive a fixed monthly contribution.
   * Everything else that makes up net worth today (property, vehicles, etc.)
   * is held constant — this engine doesn't project asset appreciation for
   * anything except tagged investments, on purpose, since guessing at house
   * price growth is exactly the kind of unfounded certainty the brief warns
   * against.
   *
   * @param {Object} params
   * @param {number} params.currentNetWorth
   * @param {number} params.currentDebtTotal
   * @param {number} params.currentInvestmentTotal
   * @param {number} params.monthlyDebtPayment
   * @param {number} params.monthlyInvestmentContribution
   * @param {number} params.debtInterestAnnual - weighted average, fraction
   * @param {number} params.investmentReturnAnnual - assumed, fraction, never guaranteed
   * @param {number} years
   * @returns {Array<{ year: number, netWorth: number, debtBalance: number, investmentBalance: number }>}
   */
  function forecastNetWorth(params, years) {
    const {
      currentNetWorth,
      currentDebtTotal,
      currentInvestmentTotal,
      monthlyDebtPayment,
      monthlyInvestmentContribution,
      debtInterestAnnual,
      investmentReturnAnnual,
    } = params;

    // Everything else that makes up net worth today, held constant.
    const otherAssetsBaseline = currentNetWorth - currentInvestmentTotal + currentDebtTotal;

    let debtBalance = currentDebtTotal;
    let investmentBalance = currentInvestmentTotal;
    const monthlyDebtRate = debtInterestAnnual / 12;
    const monthlyInvestmentRate = investmentReturnAnnual / 12;

    const snapshots = [];
    const totalMonths = years * 12;

    for (let month = 1; month <= totalMonths; month += 1) {
      if (debtBalance > 0) {
        debtBalance += debtBalance * monthlyDebtRate;
        debtBalance = Math.max(0, debtBalance - monthlyDebtPayment);
      }
      investmentBalance = investmentBalance * (1 + monthlyInvestmentRate) + monthlyInvestmentContribution;

      if (month % 12 === 0) {
        snapshots.push({
          year: month / 12,
          netWorth: otherAssetsBaseline + investmentBalance - debtBalance,
          debtBalance,
          investmentBalance,
        });
      }
    }

    return snapshots;
  }

  Object.assign(WR.financial, { forecastNetWorth });
})();
// Pure aggregation functions powering the Reports view: totals grouped by
// month across the whole budget-line history, and spending grouped by
// expense category. No storage calls, no DOM \u2014 same "engine calculates,
// UI displays" separation as the rest of the financial engine.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Groups every budget line by month and sums each type, producing one
   * row per month the user has ever entered data for, sorted chronologically.
   * @param {Array} allBudgetLines
   * @returns {Array<{month:string, income:number, fixed:number, variable:number, savings:number, debtPayments:number}>}
   */
  function aggregateMonthlyTotals(allBudgetLines) {
    const byMonth = {};
    allBudgetLines.forEach((line) => {
      if (!byMonth[line.month]) {
        byMonth[line.month] = { month: line.month, income: 0, fixed: 0, variable: 0, savings: 0, debtPayments: 0 };
      }
      const bucket = byMonth[line.month];
      if (line.type === 'income') bucket.income += line.actualAmount;
      else if (line.type === 'fixed') bucket.fixed += line.actualAmount;
      else if (line.type === 'variable') bucket.variable += line.actualAmount;
      else if (line.type === 'savings') bucket.savings += line.actualAmount;
      else if (line.type === 'debtPayment') bucket.debtPayments += line.actualAmount;
    });
    return Object.values(byMonth).sort((a, b) => (a.month < b.month ? -1 : 1));
  }

  /**
   * Sums fixed+variable spending by expense category name for whichever
   * budget lines are passed in (caller filters to a month or range first).
   * Uncategorised spending is grouped under "Uncategorised" rather than
   * dropped, so the total always reconciles with actual spending.
   * @param {Array} budgetLines
   * @param {Array} expenseCategories
   * @returns {Array<{label:string, value:number}>} sorted highest spend first
   */
  function aggregateSpendingByCategory(budgetLines, expenseCategories) {
    const categoryById = new Map(expenseCategories.map((c) => [c.id, c]));
    const totals = {};
    budgetLines
      .filter((l) => l.type === 'fixed' || l.type === 'variable')
      .forEach((l) => {
        const category = l.categoryId ? categoryById.get(l.categoryId) : null;
        const label = category ? category.name : 'Uncategorised';
        totals[label] = (totals[label] || 0) + l.actualAmount;
      });
    return Object.entries(totals)
      .map(([label, value]) => ({ label, value }))
      .sort((a, b) => b.value - a.value);
  }

  Object.assign(WR.financial, { aggregateMonthlyTotals, aggregateSpendingByCategory });
})();
// Recommendation rules engine. Each rule is a plain object with a
// `condition` function and a `build` function that produces the

// "What Should I Do Now?" panel; it never changes any stored financial

window.WR = window.WR || {};
WR.recommendations = WR.recommendations || {};

(function () {
  const PRIORITY_RANK = { high: 0, medium: 1, low: 2 };

        financialImpact: 'Extra payments here earn a guaranteed return equal to the interest rate \u2014 higher and more certain than investing while this debt remains.',
        suggestedAction: s.availableSurplus > 0

        numbers: { balance: s.highestInterestDebt.currentBalance, interestRate: s.highestInterestDebt.interestRate },
        assumptions: [`Assumed investment return: ${(s.assumedInvestmentReturn * 100).toFixed(1)}%/year \u2014 adjust this in Settings.`],
      }),

    {
      id: 'emergency-fund-critical',
      priority: 'high',
      condition: (s) => s.emergencyFundMonths < s.emergencyFundTargetMonths * 0.5,
      build: (s) => ({

        reason: `Your emergency fund covers ${s.emergencyFundMonths.toFixed(1)} months of essential expenses, under half of your ${s.emergencyFundTargetMonths}-month target.`,
        financialImpact: 'An unexpected expense at this level would likely have to be covered by new debt.',
        suggestedAction: 'Prioritise emergency savings over new investment contributions until you reach at least half your target.',
        numbers: { emergencyFundMonths: s.emergencyFundMonths, target: s.emergencyFundTargetMonths },
        assumptions: [],
      }),
    },
    {
      id: 'emergency-fund-building',
      priority: 'medium',
      condition: (s) =>
        s.emergencyFundMonths >= s.emergencyFundTargetMonths * 0.5 && s.emergencyFundMonths < s.emergencyFundTargetMonths,
      build: (s) => ({

        reason: `You're at ${s.emergencyFundMonths.toFixed(1)} of your ${s.emergencyFundTargetMonths}-month target \u2014 past the halfway point.`,
        financialImpact: 'Closing this gap further reduces the chance a surprise expense forces you into debt.',
        suggestedAction: 'Continue current contributions, or increase them if the high-interest debt items above are resolved.',
        numbers: { emergencyFundMonths: s.emergencyFundMonths, target: s.emergencyFundTargetMonths },

    {
      id: 'discretionary-spend-increase',

      build: (s) => ({
        title: 'Discretionary spending has increased',
        reason: `Discretionary spending is up ${(s.discretionarySpendChangePct * 100).toFixed(0)}% compared with your recent average.`,
        financialImpact: 'If this continues, it reduces the surplus available for debt, savings, or investing.',
        suggestedAction: 'Review recent discretionary transactions to see whether this reflects a one-off or an ongoing change.',
        numbers: { changePct: s.discretionarySpendChangePct, discretionary: s.essentialVsDiscretionary.discretionary },
        assumptions: [],
      }),
    },
    {
      id: 'investment-opportunity',
      priority: 'low',
      condition: (s) => s.investmentReadiness.readiness === 'ready_to_invest' && s.availableSurplus > 0,
      build: (s) => ({

        reason: s.investmentReadiness.reasons.join(' '),
        financialImpact: `You have an unallocated monthly surplus of ${s.availableSurplus.toFixed(2)}.`,
        suggestedAction: 'Once debt and emergency fund priorities above are addressed, direct some of this surplus toward long-term investing.',
        numbers: { availableSurplus: s.availableSurplus },
        assumptions: ['Investment returns are never guaranteed \u2014 see the Investments section for your own return assumptions.'],
      }),
    },
  ];

  /**
   * Evaluates every rule against a FinancialSnapshot and returns the

   * @param {FinancialSnapshot} snapshot

  function generateRecommendations(snapshot) {
    return RULES.filter((rule) => rule.condition(snapshot))
      .map((rule) => ({ id: rule.id, priority: rule.priority, ...rule.build(snapshot) }))

})();
// Excel import/export, built on SheetJS (loaded via CDN in index.html as
// the global `XLSX`). Deliberately uses a generic column-mapping approach
// rather than hardcoded cell ranges tied to one exact workbook layout —
// hardcoded ranges break the moment a row shifts; column mapping survives
// minor structural differences and works with any spreadsheet, not just
// the exact source workbook this project started from.
//
// Workflow: parse workbook -> list sheets -> user picks a sheet + maps its
// columns to WealthRoute fields -> preview -> confirm -> import as
// BudgetLine records for the current month.

window.WR = window.WR || {};
WR.excel = WR.excel || {};

(function () {
  /**
   * Parses an uploaded file (ArrayBuffer) into a SheetJS workbook.
   * @param {ArrayBuffer} arrayBuffer
   */
  function parseWorkbook(arrayBuffer) {
    return XLSX.read(arrayBuffer, { type: 'array' });
  }

  /** @param {object} workbook */
  function getSheetNames(workbook) {
    return workbook.SheetNames;
  }

  /**
   * Reads one sheet as an array of row objects, plus the header list for
   * building a mapping UI. `headerRowIndex` (0-indexed) lets the caller
   * point at whichever row actually holds column headers \u2014 not every
   * spreadsheet has them in row 1 (this workbook's own month sheets, for
   * example, have several header rows partway down the sheet). Blank
   * header cells get a synthetic "Column X" label rather than being
   * silently dropped, so every column stays mappable.
   * @param {object} workbook
   * @param {string} sheetName
   * @param {number} [headerRowIndex] - 0-indexed row number, defaults to 0 (row 1)
   */
  function readSheetRows(workbook, sheetName, headerRowIndex) {
    const startRow = headerRowIndex || 0;
    const sheet = workbook.Sheets[sheetName];
    const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, range: startRow, defval: '' });

    const headerCells = aoa[0] || [];
    const headers = headerCells.map((h, i) =>
      h === '' || h === undefined || h === null ? `Column ${XLSX.utils.encode_col(i)}` : String(h),
    );

    const rows = aoa.slice(1)
      .filter((rowArr) => rowArr.some((cell) => cell !== '' && cell !== undefined)) // skip fully blank rows
      .map((rowArr) => {
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = rowArr[i] !== undefined ? rowArr[i] : '';
        });
        return obj;
      });

    return { headers, rows };
  }

  /**
   * Validates a single mapped row before import. Returns a list of problems
   * (empty = valid) rather than throwing, so the caller can show every issue
   * in the preview instead of stopping at the first bad row.
   * @param {Object} row - already mapped to { name, amount, type, month, categoryId }
   */
  function validateImportRow(row) {
    const problems = [];
    if (!row.name || String(row.name).trim() === '') problems.push('Missing name/description');
    if (row.amount === undefined || row.amount === '' || Number.isNaN(Number(row.amount))) {
      problems.push('Missing or invalid amount');
    }
    if (!['income', 'fixed', 'variable', 'savings', 'debtPayment'].includes(row.type)) {
      problems.push(`Invalid type "${row.type}"`);
    }
    if (!/^\d{4}-\d{2}$/.test(row.month || '')) problems.push('Month must be in YYYY-MM format');
    return problems;
  }

  /**
   * Parses a spreadsheet cell into a number, handling currency symbols,
   * thousands separators, and accounting-style negatives like "(500.00)"
   * (parentheses meaning negative, common in exported financial data).
   * @param {*} raw
   */
  function parseAmount(raw) {
    const str = String(raw ?? '').trim();
    const isParenNegative = /^\(.*\)$/.test(str);
    const cleaned = str.replace(/[^\d.-]/g, '');
    const value = parseFloat(cleaned);
    if (Number.isNaN(value)) return NaN;
    return isParenNegative ? -Math.abs(value) : value;
  }

  /**
   * Applies a column mapping to raw sheet rows, producing WealthRoute
   * BudgetLine-shaped records (not yet saved). `mapping` keys are
   * WealthRoute field names, values are the source column header to read
   * from each raw row. `constants` supplies fields not present as columns
   * (e.g. a fixed month or type for the whole import).
   *
   * @param {Array<Object>} rawRows
   * @param {{name?: string, amount?: string, type?: string, month?: string, currency?: string}} mapping
   * @param {{type?: string, month?: string, currency?: string}} constants
   */
  function applyMapping(rawRows, mapping, constants) {
    return rawRows.map((raw) => {
      const name = mapping.name ? raw[mapping.name] : undefined;
      const amountRaw = mapping.amount ? raw[mapping.amount] : undefined;
      const amount = typeof amountRaw === 'number' ? amountRaw : parseAmount(amountRaw);
      const type = constants.type || (mapping.type ? raw[mapping.type] : undefined);
      const month = constants.month || (mapping.month ? raw[mapping.month] : undefined);
      const currency = constants.currency || (mapping.currency ? raw[mapping.currency] : 'ZAR');

      return { name, amount, type, month, currency };
    });
  }

  /**
   * Imports validated rows as BudgetLine records via the repository layer.
   * Rows that fail validation are skipped and returned separately, rather
   * than silently importing bad data.
   * @param {Array<Object>} mappedRows
   */
  async function importBudgetLines(mappedRows) {
    const imported = [];
    const rejected = [];

    for (const row of mappedRows) {
      const problems = validateImportRow(row);
      if (problems.length > 0) {
        rejected.push({ row, problems });
        continue;
      }
      const line = WR.models.createBudgetLine({
        month: row.month,
        type: row.type,
        name: row.name,
        budgetAmount: Number(row.amount),
        actualAmount: Number(row.amount),
        currency: row.currency || 'ZAR',
      });
      await WR.repos.budgetLines.add(line);
      imported.push(line);
    }

    return { imported, rejected };
  }

  /**
   * Exports all current data as a multi-sheet workbook: one sheet per
   * entity. This intentionally does not attempt to reproduce the exact
   * 16-sheet source template (Annual Overview + 12 month sheets + Networth
   * + Goal/Habit trackers) — it exports WealthRoute's own normalised data
   * model instead, which is what round-trips cleanly.
   */
  async function exportWorkbook() {
    const [budgetLines, debts, assets, investments, netWorthSnapshots] = await Promise.all([
      WR.repos.budgetLines.getAll(),
      WR.repos.debts.getAll(),
      WR.repos.assets.getAll(),
      WR.repos.investments.getAll(),
      WR.repos.netWorthSnapshots.getAll(),
    ]);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(budgetLines), 'Budget Lines');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(debts), 'Debts');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assets), 'Assets');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(investments), 'Investments');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(netWorthSnapshots), 'Net Worth History');

    XLSX.writeFile(wb, `wealthroute-export-${new Date().toISOString().slice(0, 10)}.xlsx`);
  }

  WR.excel = {
    parseWorkbook,
    getSheetNames,
    readSheetRows,
    validateImportRow,
    parseAmount,
    applyMapping,
    importBudgetLines,
    exportWorkbook,
  };
})();
// Hand-rolled SVG charts. No charting library — the whole point of this
// project is staying dependency-light, and bar/line charts don't need one.

window.WR = window.WR || {};
WR.charts = WR.charts || {};

(function () {
  const PALETTE = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)', 'var(--chart-1)'];

  function escapeXml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
  }

  /**
   * @param {Array<{label: string, value: number}>} data
   * @param {{width?: number, height?: number, color?: string}} [options]
   */
  function barChart(data, options) {
    const opts = options || {};
    const width = opts.width || 480;
    const height = opts.height || 240;
    const padding = 32;
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;

    if (data.length === 0) {
      return `<svg width="${width}" height="${height}"><text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="#888">No data</text></svg>`;
    }

    const maxVal = Math.max(...data.map((d) => d.value), 0.01);
    const barWidth = chartW / data.length;

    const bars = data
      .map((d, i) => {
        const barH = (Math.max(d.value, 0) / maxVal) * chartH;
        const x = padding + i * barWidth + barWidth * 0.15;
        const y = padding + (chartH - barH);
        const w = barWidth * 0.7;
        const color = opts.color || PALETTE[i % PALETTE.length];
        return `
          <rect x="${x}" y="${y}" width="${w}" height="${barH}" fill="${color}" rx="2"></rect>
          <text x="${x + w / 2}" y="${height - padding + 14}" text-anchor="middle" font-size="10" fill="#444">${escapeXml(d.label)}</text>
          <text x="${x + w / 2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="#222">${d.value.toFixed(0)}</text>
        `;
      })
      .join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
  }

  /**
   * @param {Array<{label: string, value: number}>} data - ordered chronologically
   * @param {{width?: number, height?: number, color?: string}} [options]
   */
  function lineChart(data, options) {
    const opts = options || {};
    const width = opts.width || 480;
    const height = opts.height || 240;
    const padding = 32;
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;

    if (data.length === 0) {
      return `<svg width="${width}" height="${height}"><text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="#888">No data</text></svg>`;
    }

    const values = data.map((d) => d.value);
    const maxVal = Math.max(...values);
    const minVal = Math.min(...values, 0);
    const range = maxVal - minVal || 1;
    const stepX = data.length > 1 ? chartW / (data.length - 1) : 0;
    const color = opts.color || PALETTE[0];

    const points = data.map((d, i) => {
      const x = padding + i * stepX;
      const y = padding + chartH - ((d.value - minVal) / range) * chartH;
      return { x, y, label: d.label, value: d.value };
    });

    const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const dots = points
      .map(
        (p) =>
          `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"><title>${escapeXml(p.label)}: ${p.value.toFixed(2)}</title></circle>`,
      )
      .join('');
    const labels = points
      .map((p, i) => (i % Math.ceil(points.length / 8 || 1) === 0
        ? `<text x="${p.x.toFixed(1)}" y="${height - padding + 14}" text-anchor="middle" font-size="9" fill="#444">${escapeXml(p.label)}</text>`
        : ''))
      .join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2"></path>
      ${dots}
      ${labels}
    </svg>`;
  }

  /**
   * @param {Array<{label: string, value: number}>} data
   * @param {{size?: number, innerRadius?: number}} [options]
   */
  function pieChart(data, options) {
    const opts = options || {};
    const size = opts.size || 180;
    const radius = size / 2 - 8;
    const innerRadius = opts.innerRadius || radius * 0.58;
    const cx = size / 2;
    const cy = size / 2;

    const valid = (data || []).filter((d) => Number(d.value) > 0);
    const total = valid.reduce((sum, d) => sum + Number(d.value || 0), 0);
    if (!valid.length || total <= 0) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--border)" stroke-width="14"></circle><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--muted)">No data</text></svg>`;
    }

    const arcs = [];
    let start = -Math.PI / 2;
    valid.forEach((item, i) => {
      const angle = (Number(item.value) / total) * Math.PI * 2;
      const end = start + angle;
      const x1 = cx + Math.cos(start) * radius;
      const y1 = cy + Math.sin(start) * radius;
      const x2 = cx + Math.cos(end) * radius;
      const y2 = cy + Math.sin(end) * radius;
      const large = angle > Math.PI ? 1 : 0;
      const color = PALETTE[i % PALETTE.length];
      arcs.push(`<path d="M ${cx} ${cy} L ${x1.toFixed(3)} ${y1.toFixed(3)} A ${radius} ${radius} 0 ${large} 1 ${x2.toFixed(3)} ${y2.toFixed(3)} Z" fill="${color}"></path>`);
      start = end;
    });

    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${arcs.join('')}<circle cx="${cx}" cy="${cy}" r="${innerRadius}" fill="var(--panel)"></circle><text x="${cx}" y="${cy - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">Total</text><text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="14" fill="var(--text)">${total.toFixed(0)}</text></svg>`;
  }

  WR.charts = { barChart, lineChart, pieChart };
})();

(function () {
  const STORAGE_KEY = 'wr_theme';

  function getStoredTheme() {
    return localStorage.getItem(STORAGE_KEY);
  }

  function getSystemTheme() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    updateToggleIcon(theme);
  }

  function updateToggleIcon(theme) {
    const btn = document.getElementById('theme-toggle-btn');
    if (!btn) return;
    // Sun icon when in dark mode (click to go light), moon icon when in
    // light mode (click to go dark) \u2014 the icon shown is the destination.
    btn.innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
    btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }

  const SUN_ICON =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
  const MOON_ICON =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';

  function initTheme() {
    applyTheme(getStoredTheme() || getSystemTheme());
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || getSystemTheme();
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(STORAGE_KEY, next);
    applyTheme(next);
  }

  WR.ui.initTheme = initTheme;
  WR.ui.toggleTheme = toggleTheme;
  WR.ui.updateToggleIcon = updateToggleIcon;

  // Runs immediately at script load, not on DOMContentLoaded \u2014
  // document.documentElement already exists by the time this executes, and
  // setting the attribute this early avoids a flash of the wrong theme
  // before the rest of the page renders. The toggle button doesn't exist
  // yet at this point; updateToggleIcon() is called again once the shell
  // (with the button) is rendered.
  applyTheme(getStoredTheme() || getSystemTheme());
})();
// Builds the FinancialSnapshot consumed by the dashboard, the health score,
// and the recommendations engine. This is the one place raw stored records
// get turned into computed financial state — every other view reads from
// this rather than recomputing things its own way.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  function currentMonthKey(date) {
    const d = date || new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function monthName(monthNumber) {
    return new Date(2000, monthNumber - 1, 1).toLocaleString('en-ZA', { month: 'long' });
  }

  function yearsAroundCurrent(before, after) {
    const nowYear = new Date().getFullYear();
    const list = [];
    for (let y = nowYear - (before || 2); y <= nowYear + (after || 2); y += 1) list.push(y);
    return list;
  }

  function previousMonthKey(monthKey) {
    const [y, m] = monthKey.split('-').map(Number);
    const d = new Date(y, m - 2, 1); // m is 1-indexed, so m-2 steps back one month
    return currentMonthKey(d);
  }

  async function getOrCreateProfile() {
    const profiles = await WR.repos.userProfile.getAll();
    if (profiles.length > 0) return profiles[0];
    const profile = WR.models.createUserProfile({
      baseCurrency: 'ZAR',
      country: 'South Africa',
      emergencyFundTargetMonths: 3,
      riskProfile: 'moderate',
    });
    await WR.repos.userProfile.add(profile);
    return profile;
  }

  function monthlyAmountFromFrequency(amount, frequency) {
    const value = Number(amount) || 0;
    if (frequency === 'weekly') return value * 52 / 12;
    if (frequency === 'biweekly') return value * 26 / 12;
    if (frequency === 'quarterly') return value / 3;
    if (frequency === 'yearly' || frequency === 'annual') return value / 12;
    return value;
  }

  function isActiveForMonth(record, monthKey) {
    const start = record.startMonth || `${record.year || monthKey.slice(0, 4)}-01`;
    const end = record.endMonth || `${record.year || monthKey.slice(0, 4)}-12`;
    return String(monthKey) >= String(start) && String(monthKey) <= String(end);
  }

  function calculateDayToDaySummary(account, transactions, year) {
    const opening = Number(account?.startingBalance) || 0;
    const inAmount = transactions
      .filter((tx) => Number(tx.year) === Number(year) && tx.kind === 'add')
      .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
    const spent = transactions
      .filter((tx) => Number(tx.year) === Number(year) && tx.kind !== 'add')
      .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
    return {
      opening,
      added: inAmount,
      spent,
      currentBalance: opening + inAmount - spent,
      totalTransactions: transactions.filter((tx) => Number(tx.year) === Number(year)).length,
    };
  }

  /**
   * @param {string} [monthKey] - 'YYYY-MM', defaults to the current month
   */
  async function buildSnapshot(monthKey) {
    const month = monthKey || currentMonthKey();
    const prevMonth = previousMonthKey(month);
    const selectedYear = Number(month.slice(0, 4));
    const selectedMonthNumber = Number(month.slice(5, 7));

    const [allBudgetLines, debts, assets, investments, exchangeRates, expenseCategories, netWorthHistory, profile, incomeSources, fixedExpenses, emergencyFundContributions, dayToDayAccounts, dayToDayTransactions] =
      await Promise.all([
        WR.repos.budgetLines.getAll(),
        WR.repos.debts.getAll(),
        WR.repos.assets.getAll(),
        WR.repos.investments.getAll(),
        WR.repos.exchangeRates.getAll(),
        WR.repos.expenseCategories.getAll(),
        WR.queries.getNetWorthHistory(),
        getOrCreateProfile(),
        WR.repos.incomeSources.getAll(),
        WR.repos.fixedExpenses.getAll(),
        WR.repos.emergencyFundContributions.getAll(),
        WR.repos.dayToDayAccounts.getAll(),
        WR.repos.dayToDayTransactions.getAll(),
      ]);

    const monthBudgetLines = allBudgetLines.filter((line) => line.month === month);
    const prevMonthBudgetLines = allBudgetLines.filter((line) => line.month === prevMonth);

    const recurringIncomeLines = incomeSources
      .filter((source) => Number(source.year || selectedYear) === selectedYear && isActiveForMonth(source, month))
      .map((source) => ({
        type: 'income',
        name: source.name,
        categoryId: source.categoryId,
        budgetAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
      }));

    const recurringFixedLines = fixedExpenses
      .filter((expense) => isActiveForMonth(expense, month))
      .map((expense) => ({
        type: 'fixed',
        name: expense.name,
        categoryId: expense.categoryId,
        budgetAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
      }));

    const budgetLines = monthBudgetLines
      .filter((line) => line.type !== 'income' && line.type !== 'fixed')
      .concat(recurringIncomeLines)
      .concat(recurringFixedLines);

    const prevRecurringIncomeLines = incomeSources
      .filter((source) => Number(source.year || Number(prevMonth.slice(0, 4))) === Number(prevMonth.slice(0, 4)) && isActiveForMonth(source, prevMonth))
      .map((source) => ({
        type: 'income',
        name: source.name,
        categoryId: source.categoryId,
        budgetAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'),
      }));
    const prevRecurringFixedLines = fixedExpenses
      .filter((expense) => isActiveForMonth(expense, prevMonth))
      .map((expense) => ({
        type: 'fixed',
        name: expense.name,
        categoryId: expense.categoryId,
        budgetAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
        actualAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly'),
      }));
    const prevBudgetLines = prevMonthBudgetLines
      .filter((line) => line.type !== 'income' && line.type !== 'fixed')
      .concat(prevRecurringIncomeLines)
      .concat(prevRecurringFixedLines);

    const F = WR.financial;
    const cashflow = F.calculateCashFlowSummary(budgetLines);
    const split = F.calculateEssentialVsDiscretionary(budgetLines, expenseCategories);
    const prevSplit = F.calculateEssentialVsDiscretionary(prevBudgetLines, expenseCategories);

    const totalDebt = F.calculateTotalDebt(debts);
    const debtToIncomeRatio = F.calculateDebtToIncomeRatio(debts, cashflow.income);
    const highestInterestDebt = F.getHighestInterestDebt(debts);

    const liquidAssets = F.calculateLiquidAssets(assets);
    // Fall back to fixed expenses as a rough proxy for "essential monthly
    // expenses" when no categories have been tagged essential yet.
    const essentialMonthlyExpenses = split.essential > 0 ? split.essential : cashflow.fixedExpenses;
    const emergencyFundMonths = F.calculateEmergencyFundMonths(liquidAssets, essentialMonthlyExpenses);

    const netWorth = F.calculateNetWorth(assets, investments, debts, exchangeRates, profile.baseCurrency);

    const assumedInvestmentReturn = profile.assumedInvestmentReturn || 0.08;

    const investmentReadiness = F.assessInvestmentReadiness({
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      highestDebtInterestRate: highestInterestDebt ? highestInterestDebt.interestRate : null,
      assumedInvestmentReturn,
      availableSurplus: cashflow.availableSurplus,
    });

    const healthScore = F.calculateFinancialHealthScore({
      income: cashflow.income,
      availableSurplus: cashflow.availableSurplus,
      savingsRate: cashflow.savingsRate,
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      debtToIncomeRatio,
      netWorthHistory,
    });

    let discretionarySpendChangePct = null;
    if (prevSplit.discretionary > 0) {
      discretionarySpendChangePct = (split.discretionary - prevSplit.discretionary) / prevSplit.discretionary;
    }

    const annualMonths = Array.from({ length: 12 }, (_, index) => `${selectedYear}-${String(index + 1).padStart(2, '0')}`);
    const annualRows = annualMonths.map((monthId) => {
      const monthLines = allBudgetLines.filter((line) => line.month === monthId && line.type !== 'income' && line.type !== 'fixed');
      const monthIncome = incomeSources
        .filter((source) => Number(source.year || selectedYear) === selectedYear && isActiveForMonth(source, monthId))
        .map((source) => ({ type: 'income', actualAmount: monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly') }));
      const monthFixed = fixedExpenses
        .filter((expense) => isActiveForMonth(expense, monthId))
        .map((expense) => ({ type: 'fixed', actualAmount: monthlyAmountFromFrequency(expense.amount, expense.frequency || 'monthly') }));
      const fullLines = monthLines.concat(monthIncome).concat(monthFixed);
      const monthCashflow = F.calculateCashFlowSummary(fullLines);
      return { month: monthId, cashflow: monthCashflow };
    });

    const annualSummary = annualRows.reduce((summary, row) => {
      summary.totalIncome += row.cashflow.income;
      summary.totalFixedExpenses += row.cashflow.fixedExpenses;
      summary.totalVariableExpenses += row.cashflow.variableExpenses;
      summary.totalSaved += row.cashflow.savings;
      summary.totalDebtPaid += row.cashflow.debtPayments;
      return summary;
    }, {
      totalIncome: 0,
      totalSaved: 0,
      totalInvested: 0,
      totalFixedExpenses: 0,
      totalVariableExpenses: 0,
      totalDebtPaid: 0,
    });
    annualSummary.totalInvested = annualSummary.totalSaved;

    const emergencyFundBalance = emergencyFundContributions.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    const dayToDayAccount = dayToDayAccounts.find((item) => Number(item.year) === selectedYear) || null;
    const dayToDaySummary = calculateDayToDaySummary(dayToDayAccount, dayToDayTransactions, selectedYear);

    const snapshot = {
      month,
      monthLabel: `${monthName(selectedMonthNumber)} ${selectedYear}`,
      selectedYear,
      profile,
      cashflow,
      income: cashflow.income,
      availableSurplus: cashflow.availableSurplus,
      savingsRate: cashflow.savingsRate,
      essentialVsDiscretionary: split,
      discretionarySpendChangePct,
      totalDebt,
      debtToIncomeRatio,
      highestInterestDebt,
      emergencyFundMonths,
      emergencyFundTargetMonths: profile.emergencyFundTargetMonths,
      netWorth,
      assumedInvestmentReturn,
      investmentReadiness,
      healthScore,
      annualSummary,
      annualMonths: annualRows,
      emergencyFundBalance,
      emergencyFundContributions,
      incomeSources,
      fixedExpenses,
      dayToDaySummary,
      dayToDayAccount,
      dayToDayTransactions,
      debts,
      assets,
      investments,
      allBudgetLines,
      expenseCategories,
      netWorthHistory,
      budgetLines,
    };

    snapshot.recommendations = WR.recommendations.generateRecommendations(snapshot);
    return snapshot;
  }

  WR.ui.currentMonthKey = currentMonthKey;
  WR.ui.previousMonthKey = previousMonthKey;
  WR.ui.monthName = monthName;
  WR.ui.yearsAroundCurrent = yearsAroundCurrent;
  WR.ui.getOrCreateProfile = getOrCreateProfile;
  WR.ui.buildSnapshot = buildSnapshot;
})();

  /**
   * Briefly flashes an element to confirm an inline edit actually saved \u2014
   * cell edits save silently otherwise, with no visual confirmation.

  function flashSaved(element) {
    if (!element) return;

  function notify(message, tone) {

    toast.textContent = message;
    stack.appendChild(toast);
    setTimeout(() => {
      if (toast.parentNode) toast.parentNode.removeChild(toast);

  function notifyUndo(message, onUndo, options) {

    const opts = options || {};

    const toast = document.createElement('div');
    toast.className = 'toast row';

    const text = document.createElement('span');
    text.textContent = message;

    const button = document.createElement('button');
    button.className = 'toast-action';
    button.type = 'button';
    button.textContent = opts.undoLabel || 'Undo';

    toast.appendChild(text);
    toast.appendChild(button);
    stack.appendChild(toast);

    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    };

    const timer = setTimeout(close, timeoutMs);
    button.addEventListener('click', async () => {
      clearTimeout(timer);
      close();
      try {
        await onUndo();
        notify(opts.undoSuccessMessage || 'Restored.', 'success');

// Transactions / Budget view: manage income, fixed, variable, savings and
// debt-payment lines for a selected month. Every cell is directly editable,
// sortable by column, category-taggable, and confirms before deleting.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const TYPE_LABELS = {
    income: 'Income',
    fixed: 'Fixed expense',
    variable: 'Variable expense',
    savings: 'Savings/Investment',
    debtPayment: 'Debt payment',
  };

  const SORTABLE_COLUMNS = [
    { field: 'type', label: 'Type' },
    { field: 'name', label: 'Name' },
    { field: 'categoryName', label: 'Category' },
    { field: 'budgetAmount', label: 'Budget' },
    { field: 'actualAmount', label: 'Actual' },
    { field: 'diff', label: 'Diff' },
  ];

  function typeOptions(selected) {
    return Object.entries(TYPE_LABELS)
      .map(([v, l]) => `<option value="${v}" ${v === selected ? 'selected' : ''}>${l}</option>`)
      .join('');
  }

  function categoryOptions(categories, selectedId) {
    return (
      `<option value="">\u2014 none \u2014</option>` +
      categories.map((c) => `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name}</option>`).join('')
    );
  }

  function sortLines(lines, categoriesById, sort) {
    const withDerived = lines.map((l) => ({
      ...l,
      categoryName: l.categoryId && categoriesById[l.categoryId] ? categoriesById[l.categoryId].name : '',
      diff: l.actualAmount - l.budgetAmount,
    }));
    withDerived.sort((a, b) => {
      const av = a[sort.field];
      const bv = b[sort.field];
      const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
      return sort.dir === 'asc' ? cmp : -cmp;
    });
    return withDerived;
  }

  async function renderTransactions(container) {
    const month = WR.ui._transactionsMonth || WR.ui.currentMonthKey();
    WR.ui._transactionsMonth = month;
    const sort = WR.ui._transactionsSort || { field: 'type', dir: 'asc' };
    WR.ui._transactionsSort = sort;

    const [lines, profile, categories] = await Promise.all([
      WR.queries.getBudgetLinesByMonth(month),
      WR.ui.getOrCreateProfile(),
      WR.repos.expenseCategories.getAll(),
    ]);
    const categoriesById = Object.fromEntries(categories.map((c) => [c.id, c]));

    const sortedLines = sortLines(lines, categoriesById, sort);

    const headerCells = SORTABLE_COLUMNS.map(
      (col) =>
        `<th class="sortable" data-sort-field="${col.field}">${col.label}${sort.field === col.field ? (sort.dir === 'asc' ? ' \u2191' : ' \u2193') : ''}</th>`,
    ).join('');

    const rows = sortedLines
      .map(
        (l) => `
      <tr data-id="${l.id}">
        <td><select class="cell" data-field="type">${typeOptions(l.type)}</select></td>
        <td><input class="cell" data-field="name" value="${l.name}"></td>
        <td><select class="cell" data-field="categoryId">${categoryOptions(categories, l.categoryId)}</select></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="budgetAmount" value="${l.budgetAmount}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="actualAmount" value="${l.actualAmount}"></td>
        <td class="num diff-cell">${WR.ui.fmt(l.diff)}</td>
        <td><button class="link-btn delete-line" data-id="${l.id}">Delete</button></td>
      </tr>`,
      )
      .join('');

    container.innerHTML = `
      <h1>Transactions</h1>
      <div class="toolbar">
        <label>Month:
          <input type="month" id="month-picker" value="${month}">
        </label>
      </div>
      <p class="fine-print">Edit any cell \u2014 changes save immediately. Click a column header to sort. Categories are managed in Settings.</p>

      <table class="data-table">
        <thead><tr>${headerCells}<th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="empty">No lines yet for this month \u2014 add one below.</td></tr>'}</tbody>
      </table>

      <h3>Add a line</h3>
      <form id="add-line-form" class="inline-form">
        <select name="type" required>${typeOptions()}</select>
        <input name="name" placeholder="Name (e.g. Salary, Rent)" required>
        <select name="categoryId">${categoryOptions(categories)}</select>
        <input name="budgetAmount" type="number" step="0.01" min="0" placeholder="Budget" required>
        <input name="actualAmount" type="number" step="0.01" min="0" placeholder="Actual" required>
        <button type="submit">Add</button>
      </form>
    `;

    document.getElementById('month-picker').addEventListener('change', (e) => {
      WR.ui._transactionsMonth = e.target.value;
      renderTransactions(container);
    });

    container.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        const field = th.dataset.sortField;
        if (sort.field === field) {
          sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          WR.ui._transactionsSort = { field, dir: 'asc' };
        }
        renderTransactions(container);
      });
    });

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const line = await WR.repos.budgetLines.getById(id);
          if (!line) return;
          const field = input.dataset.field;
          if (field === 'budgetAmount' || field === 'actualAmount') {
            line[field] = Math.max(0, parseFloat(input.value) || 0);
            input.value = line[field];
          } else if (field === 'categoryId') {
            line.categoryId = input.value || undefined;
          } else {
            line[field] = input.value;
          }
          await WR.repos.budgetLines.update(line);
          WR.ui.flashSaved(input);

          const diffCell = tr.querySelector('.diff-cell');
          if (diffCell) diffCell.textContent = WR.ui.fmt(line.actualAmount - line.budgetAmount);
        });
      });
    });

    container.querySelectorAll('.delete-line').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this transaction? This cannot be undone.')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.budgetLines,
          id: btn.dataset.id,
          entityLabel: 'Transaction',
          afterChange: async () => { await renderTransactions(container); },
        });
      });
    });

    document.getElementById('add-line-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const line = WR.models.createBudgetLine({
        month,
        type: form.type.value,
        name: form.name.value,
        categoryId: form.categoryId.value || undefined,
        budgetAmount: Math.max(0, parseFloat(form.budgetAmount.value) || 0),
        actualAmount: Math.max(0, parseFloat(form.actualAmount.value) || 0),
        currency: profile.baseCurrency,
      });
      await WR.repos.budgetLines.add(line);
      renderTransactions(container);
    });
  }

  WR.ui.renderTransactions = renderTransactions;
})();

    container.innerHTML = `

      <div class="toolbar"><label>Year: <select id="income-year">${WR.ui.yearsAroundCurrent(3, 4).map((y) => `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`).join('')}</select></label></div>
      <table class="data-table">

// Debts view: manage debts (inline-editable), then run the
// avalanche/snowball/hybrid prioritisation engine with an adjustable extra
// payment. Editing a debt only re-renders the payoff projection section,
// not the whole table \u2014 so the row you're editing keeps focus.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const CURRENCIES = ['ZAR', 'USD', 'EUR', 'GBP'];

  function currencyOptions(selected) {
    return CURRENCIES.map((c) => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  }

  const PAYMENT_FREQUENCY_TO_MONTHS = {
    weekly: 12 / 52,
    biweekly: 12 / 26,
    monthly: 1,
    quarterly: 3,
    yearly: 12,
  };

  function paymentFrequencyOptions(selected) {
    return Object.keys(PAYMENT_FREQUENCY_TO_MONTHS)
      .map((frequency) => `<option value="${frequency}" ${frequency === selected ? 'selected' : ''}>${frequency}</option>`)
      .join('');
  }

  function computePaymentsRemaining(debt) {
    const perCycle = Math.max(0, Number(debt.minPayment) || 0);
    if (perCycle <= 0) return null;
    const monthsPerPayment = PAYMENT_FREQUENCY_TO_MONTHS[debt.paymentFrequency || 'monthly'] || 1;
    const monthlyEquivalent = perCycle / monthsPerPayment;
    if (monthlyEquivalent <= 0) return null;
    return Math.ceil((Number(debt.currentBalance) || 0) / monthlyEquivalent);
  }

  function estimateCompletionDate(debt, paymentsRemaining) {
    if (!paymentsRemaining || paymentsRemaining < 0) return '';
    const monthsPerPayment = PAYMENT_FREQUENCY_TO_MONTHS[debt.paymentFrequency || 'monthly'] || 1;
    const start = debt.startDate ? new Date(`${debt.startDate}T00:00:00`) : new Date();
    const monthsToAdd = Math.ceil(paymentsRemaining * monthsPerPayment);
    start.setMonth(start.getMonth() + monthsToAdd);
    return start.toISOString().slice(0, 10);
  }

  function computePayoffHtml(debts, strategy, extra, profile) {
    if (debts.length === 0) return '<p class="empty">Add a debt to see a payoff projection.</p>';

    let orderedDebts = [];
    if (strategy === 'avalanche') orderedDebts = WR.financial.orderDebtsAvalanche(debts);
    else if (strategy === 'snowball') orderedDebts = WR.financial.orderDebtsSnowball(debts);
    else orderedDebts = WR.financial.orderDebtsHybrid(debts);

    const saved = WR.financial.calculateInterestSaved(orderedDebts, extra);
    const orderList = saved.withExtra.payoffOrder
      .map((p, i) => `<li>${i + 1}. ${p.name} \u2014 paid off in ${p.monthsToPayoff ?? '50+ years (capped)'} months</li>`)
      .join('');

    return `
      <p><strong>Payoff order (${strategy}):</strong></p>
      <ol>${orderList}</ol>
      <p>Total time to debt-free: <strong>${saved.withExtra.months} months</strong> ${saved.monthsSaved > 0 ? `(${saved.monthsSaved} months sooner than paying only minimums)` : ''}</p>
      <p>Total interest paid: <strong>${profile.baseCurrency} ${WR.ui.fmt(saved.withExtra.totalInterestPaid)}</strong> ${saved.interestSaved > 0 ? `(${profile.baseCurrency} ${WR.ui.fmt(saved.interestSaved)} saved vs. minimums only)` : ''}</p>
      ${saved.withExtra.reachedSafetyCap ? '<p class="warning">This extra payment amount is not enough to ever clear the balance at the current interest rate \u2014 try a larger amount.</p>' : ''}
    `;
  }

  async function refreshPayoffSection(container) {
    const debts = await WR.repos.debts.getAll();
    const profile = await WR.ui.getOrCreateProfile();
    const strategy = WR.ui._debtStrategy || 'avalanche';
    const extra = WR.ui._debtExtra != null ? WR.ui._debtExtra : 0;
    const section = container.querySelector('.payoff-results');
    if (section) section.innerHTML = computePayoffHtml(debts, strategy, extra, profile);
  }

  async function renderDebts(container) {
    const [debts, payments] = await Promise.all([
      WR.repos.debts.getAll(),
      WR.repos.debtPayments.getAll(),
    ]);
    const profile = await WR.ui.getOrCreateProfile();
    const strategy = WR.ui._debtStrategy || 'avalanche';
    const extra = WR.ui._debtExtra != null ? WR.ui._debtExtra : 0;

    const rows = debts
      .map(
        (d) => {
          const paymentsRemaining = computePaymentsRemaining(d);
          const expectedCompletionDate = d.expectedCompletionDate || estimateCompletionDate(d, paymentsRemaining);
          const paidTotal = payments
            .filter((payment) => payment.debtId === d.id)
            .reduce((sum, payment) => sum + (Number(payment.amount) || 0), 0);

          return `
      <tr data-id="${d.id}">
        <td><input class="cell" data-field="name" value="${d.name}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="originalBalance" value="${d.originalBalance || d.currentBalance}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="currentBalance" value="${d.currentBalance}"></td>
        <td><select class="cell" data-field="currency">${currencyOptions(d.currency || profile.baseCurrency)}</select></td>

          <select id="strategy-picker">

            <option value="snowball" ${strategy === 'snowball' ? 'selected' : ''}>Snowball (smallest balance first)</option>

    container.querySelectorAll('tbody tr').forEach((tr) => {

          const debt = await WR.repos.debts.getById(id);
          if (!debt) return;
          const field = input.dataset.field;
          if (field === 'interestRatePct') {
            debt.interestRate = Math.max(0, parseFloat(input.value) || 0) / 100;
          } else if (field === 'name' || field === 'currency' || field === 'paymentFrequency' || field === 'startDate' || field === 'expectedCompletionDate') {
            debt[field] = input.value;

// Forecast view: multi-year net worth projection. Every number here is
