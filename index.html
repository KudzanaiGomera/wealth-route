  WR.ui.renderTransactions = renderTransactions;
  WR.ui.renderSavings = renderSavings;
})();
// Dedicated pages for recurring income/fixed expenses, emergency fund,
// day-to-day money, and financial insights.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const RECURRING_FREQUENCIES = ['weekly', 'biweekly', 'monthly', 'quarterly', 'yearly'];

  function recurringFrequencyOptions(selected) {
    return RECURRING_FREQUENCIES
      .map((frequency) => `<option value="${WR.ui.escapeText(frequency)}" ${frequency === selected ? 'selected' : ''}>${frequency}</option>`)
      .join('');
  }

  function categoryOptions(categories, selectedId, type) {
    const filtered = (categories || []).filter((category) => !type || category.type === type);
    return `<option value="">— none —</option>${filtered.map((category) => `<option value="${WR.ui.escapeText(category.id)}" ${category.id === selectedId ? 'selected' : ''}>${WR.ui.escapeText(category.name)}</option>`).join('')}`;
  }

  function isMonthRangeValid(startMonth, endMonth) {
    if (!startMonth || !endMonth) return true;
    return String(startMonth) <= String(endMonth);
  }

  async function savePayCycle(month, fields) {
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)) throw new Error('Choose a valid budget month.');
    const value = input => {
      const number = Number(input);
      if (!Number.isFinite(number) || number < 0) throw new Error('Amounts must be zero or greater.');
      return Math.round(number * 100) / 100;
    };
    const payDate = WR.ui.payCycleDates(month).start;
    if (fields.confirmed && payDate > new Date().toISOString().slice(0, 10)) throw new Error('A future payday can only be saved as a plan.');
    let allocations = (fields.allocations || []).map(item => ({ potId: String(item.potId || ''), amount: value(item.amount) }));
    if (allocations.some(item => !item.potId || item.amount <= 0)) throw new Error('Choose a pot and a positive amount for each savings allocation.');
    const api = WR.account.getFirestoreApi();
    const db = WR.account.getDb();
    const uid = WR.account.getCurrentUser()?.uid;
    if (!uid) throw new Error('Not signed in.');
    const cycleRef = api.doc(db, 'users', uid, 'payCycles', month);
    await api.runTransaction(db, async transaction => {
      const previous = await transaction.get(cycleRef);
      const old = previous.exists() ? previous.data() : {};
      let incomeChange;
      let profileChange;
      if (fields.incomeTable) {
        const settings = fields.incomeTable;
        const sourceIds = [...new Set([...settings.sources.map(source => source.id), ...(settings.sourceId ? [settings.sourceId] : [])])];
        const sources = await Promise.all(sourceIds.map(async id => {
          const ref = api.doc(db, 'users', uid, 'incomeSources', id);
          const snapshot = await transaction.get(ref);
          let source = snapshot.exists() ? snapshot.data() : settings.newSource;
          if (!source || source.id !== id) return null;
          if (id === settings.sourceId && settings.sourceFields) {
            source = { ...source, ...settings.sourceFields };
            incomeChange = { ref, source };
          }
          if (id === settings.sourceId && settings.removeSource) { incomeChange = { ref, remove: true }; return null; }
          if (id === settings.sourceId && settings.newSource && !snapshot.exists()) incomeChange = { ref, source };
          return source;
        }));
        const active = sources.filter(source => source && Number(source.year || month.slice(0, 4)) === Number(month.slice(0, 4)) && WR.ui.isActiveForMonth(source, month));
        if (settings.autoUseBuffer != null) {
          const ref = api.doc(db, 'users', uid, 'userProfile', settings.profileId);
          const snapshot = await transaction.get(ref);
          if (!snapshot.exists()) throw new Error('Profile no longer exists.');
          profileChange = { ref, profile: { ...snapshot.data(), autoUseBuffer: !!settings.autoUseBuffer } };
        }
        const adjustments = { ...(old.sourceAdjustments || {}) };
        if (!old.sourceAdjustments && active[0]) adjustments[active[0].id] = { advanceAmount: Number(old.advanceAmount) || 0, savingsAmount: old.savingsAmount ?? (old.allocations || []).reduce((sum, item) => sum + Number(item.amount), 0) };
        if (settings.sourceId && settings.adjustment) adjustments[settings.sourceId] = { ...(adjustments[settings.sourceId] || { advanceAmount: 0, savingsAmount: 0 }), ...settings.adjustment };
        Object.keys(adjustments).forEach(id => {
          const adjustment = adjustments[id];
          adjustments[id] = { advanceAmount: value(adjustment.advanceAmount || 0), savingsAmount: value(adjustment.savingsAmount ?? (adjustment.allocations || []).reduce((sum, item) => sum + Number(item.amount), 0)) };
        });
        const advanceAmount = active.reduce((sum, source) => sum + value(adjustments[source.id]?.advanceAmount || 0), 0);
        const savingsAmount = active.reduce((sum, source) => sum + value(adjustments[source.id]?.savingsAmount || 0), 0);
        allocations = [];
        let availableBuffer = old.rolloverApplied ? Number(old.rolloverAvailable) || 0 : settings.availableBuffer;
        let bufferAmount = value(settings.bufferAmount ?? old.bufferAmount ?? 0);
        if (settings.addFunds) {
          if (month !== WR.ui.currentBudgetMonth()) throw new Error('Add new funds to the current budget month.');
          if (!settings.addFunds.id) throw new Error('Missing funds entry ID.');
          if (old.bufferDeposits?.[settings.addFunds.id]) return;
          const amount = value(settings.addFunds.amount);
          if (amount <= 0) throw new Error('Enter an amount greater than zero.');
          if (settings.openingBuffer != null) throw new Error('Add funds separately from balance corrections.');
          availableBuffer = Math.round((availableBuffer + amount) * 100) / 100;
          fields.bufferDeposits = { ...(old.bufferDeposits || {}), [settings.addFunds.id]: { amount, date: new Date().toISOString().slice(0, 10) } };
        }
        if (settings.openingBuffer != null || settings.addFunds) {
          if (payDate > new Date().toISOString().slice(0, 10)) throw new Error('Correct the opening buffer after this pay cycle starts.');
          if (settings.openingBuffer != null) {
            const corrected = Number(settings.openingBuffer);
            if (!Number.isFinite(corrected)) throw new Error('Enter a valid buffer amount.');
            availableBuffer = Math.round(corrected * 100) / 100;
          }
          const profileRef = api.doc(db, 'users', uid, 'userProfile', settings.profileId);
          const profileSnapshot = await transaction.get(profileRef);
          const automatic = profileSnapshot.exists() && profileSnapshot.data().autoUseBuffer;
          bufferAmount = automatic ? Math.max(0, availableBuffer) : Math.min(bufferAmount, Math.max(0, availableBuffer));
          Object.assign(fields, { rolloverApplied: true, rolloverAvailable: availableBuffer, shortfallAmount: Math.max(0, -availableBuffer) });
        }
        if (bufferAmount > Math.max(0, availableBuffer)) throw new Error('Buffer exceeds the available balance.');
        Object.assign(fields, { expectedIncome: active.reduce((sum, source) => sum + WR.ui.monthlyAmountFromFrequency(source.amount, source.frequency || 'monthly'), 0), advanceAmount, savingsAmount, bufferAmount, sourceAdjustments: adjustments, confirmed: payDate <= new Date().toISOString().slice(0, 10) });
      }
      const next = { ...old, id: month, month, payDate, expectedIncome: value(fields.expectedIncome), advanceAmount: value(fields.advanceAmount ?? old.advanceAmount ?? 0), bufferAmount: value(fields.bufferAmount ?? old.bufferAmount ?? 0), fixedAmount: value(fields.fixedAmount), variableAmount: value(fields.variableAmount), debtAmount: value(fields.debtAmount), allocations, confirmed: !!fields.confirmed };
      if (fields.incomeTable) {
        next.mode = 'income-table';
        next.savingsAmount = value(fields.savingsAmount);
        if (fields.rolloverApplied) Object.assign(next, { rolloverApplied: true, rolloverAvailable: fields.rolloverAvailable, shortfallAmount: fields.shortfallAmount });
        if (fields.incomeTable.openingBuffer != null) next.bufferCorrected = true;
        if (fields.bufferDeposits) next.bufferDeposits = fields.bufferDeposits;
        if (old.allocations?.length && !old.legacySavingsAllocations) next.legacySavingsAllocations = old.allocations;
      }
      if (fields.sourceAdjustments) next.sourceAdjustments = fields.sourceAdjustments;
      if (WR.ui.calculatePayCycleFunding(next).salary < 0) throw new Error('Advances exceed the expected salary. Correct the salary or advances first.');
      if (WR.ui.calculatePayCycleFunding(next).savings > WR.ui.calculatePayCycleFunding(next).salary) throw new Error('Savings allocations exceed the salary arriving on payday.');
      const deltas = new Map();
      if (old.confirmed && !fields.incomeTable) (old.allocations || []).forEach(item => deltas.set(item.potId, (deltas.get(item.potId) || 0) - Number(item.amount)));
      if (next.confirmed) allocations.forEach(item => deltas.set(item.potId, (deltas.get(item.potId) || 0) + item.amount));
      const potIds = [...new Set([...deltas.keys(), ...allocations.map(item => item.potId)])];
      const pots = await Promise.all(potIds.map(async potId => {
        const ref = api.doc(db, 'users', uid, 'savingsPots', potId);
        const snapshot = await transaction.get(ref);
        if (!snapshot.exists()) throw new Error('A linked savings pot no longer exists.');
        const pot = snapshot.data();
        const delta = Math.round((deltas.get(potId) || 0) * 100) / 100;
        const balance = Math.round(((Number(pot.currentAmount) || 0) + delta) * 100) / 100;
        if (balance < 0) throw new Error('Cannot reverse savings already moved or spent. Restore the money to that pot first.');
        if (pot.archived && (delta > 0 || (!old.confirmed && allocations.some(item => item.potId === potId)))) throw new Error('Choose an active savings pot.');
        return { ref, delta, balance };
      }));
      pots.filter(pot => pot.delta !== 0).forEach(pot => transaction.update(pot.ref, { currentAmount: pot.balance }));
      transaction.set(cycleRef, next);
      if (profileChange) transaction.set(profileChange.ref, profileChange.profile);
      if (incomeChange?.remove) transaction.delete(incomeChange.ref);
      else if (incomeChange) transaction.set(incomeChange.ref, incomeChange.source);
    });
  }

  async function saveIncomeBudget(month, settings = {}) {
    const [snapshot, sources] = await Promise.all([WR.ui.buildSnapshot(month), WR.repos.incomeSources.getAll()]);
    const debtAmount = WR.financial.calculateTotalMinPayments(snapshot.debts, snapshot.exchangeRates, snapshot.profile.baseCurrency);
    await savePayCycle(month, { fixedAmount: snapshot.cashflow.fixedExpenses, variableAmount: snapshot.cashflow.variableExpenses, debtAmount, incomeTable: { sources, availableBuffer: snapshot.payCycleBudget.carryOver, profileId: snapshot.profile.id, ...settings } });
  }
  WR.ui.saveIncomeBudget = saveIncomeBudget;

  async function savePayAdvance(id, fields, remove = false) {
    const validDate = input => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(input || '')) return false;
      const parsed = new Date(`${input}T12:00:00Z`);
      return !Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0, 10) === input;
    };
    if (!remove && (!validDate(fields.receivedDate) || !validDate(fields.payDate) || fields.payDate.slice(-2) !== '25' || fields.receivedDate >= fields.payDate || fields.receivedDate > new Date().toISOString().slice(0, 10) || !Number.isFinite(Number(fields.amount)) || Number(fields.amount) <= 0)) throw new Error('Enter a positive advance received before its future payday on the 25th.');
    const api = WR.account.getFirestoreApi();
    const db = WR.account.getDb();
    const uid = WR.account.getCurrentUser()?.uid;
    if (!uid) throw new Error('Not signed in.');
    const ref = api.doc(db, 'users', uid, 'payAdvances', id);
    await api.runTransaction(db, async transaction => {
      const snapshot = await transaction.get(ref);
      if (!remove && snapshot.exists()) return;
      if (remove && !snapshot.exists()) return;
      const record = remove ? snapshot.data() : { id, amount: Math.round(Number(fields.amount) * 100) / 100, receivedDate: fields.receivedDate, payDate: fields.payDate, transactionId: fields.transactionId || '' };
      const payday = new Date(`${record.payDate}T12:00:00`);
      const month = WR.ui.currentBudgetMonth(payday);
      const cycleRef = api.doc(db, 'users', uid, 'payCycles', month);
      const cycleSnapshot = await transaction.get(cycleRef);
      const cycle = cycleSnapshot.exists() ? cycleSnapshot.data() : { id: month, month, payDate: record.payDate, allocations: [], confirmed: false };
      if (cycle.confirmed) throw new Error('Unconfirm that payday before changing its advances.');
      let linkedRef;
      let linked;
      if (record.transactionId) {
        linkedRef = api.doc(db, 'users', uid, 'dayToDayTransactions', record.transactionId);
        const linkedSnapshot = await transaction.get(linkedRef);
        if (!linkedSnapshot.exists()) throw new Error('The linked transaction no longer exists.');
        linked = linkedSnapshot.data();
        if (!remove && (linked.kind !== 'add' || linked.date !== record.receivedDate || Math.round(Number(linked.amount) * 100) !== Math.round(record.amount * 100) || linked.paydayAdvanceId)) throw new Error('The linked Add money entry must have the same date and amount and must not already be linked.');
      }
      const advanceAmount = Math.round(((Number(cycle.advanceAmount) || 0) + (remove ? -1 : 1) * record.amount) * 100) / 100;
      transaction.set(cycleRef, { ...cycle, advanceAmount: Math.max(0, advanceAmount) });
      if (linkedRef) transaction.set(linkedRef, { ...linked, paydayAdvanceId: remove ? '' : id });
      if (remove) transaction.delete(ref); else transaction.set(ref, record);
    });
  }

  async function renderPaydayIncome(container) {
    const [profile, cycles, advances, pots, transactions] = await Promise.all([WR.ui.getOrCreateProfile(), WR.repos.payCycles.getAll(), WR.repos.payAdvances.getAll(), WR.repos.savingsPots.getAll(), WR.repos.dayToDayTransactions.getAll()]);
    const month = WR.ui._paydayMonth || WR.ui.currentBudgetMonth();
    WR.ui._paydayMonth = month;
    const snapshot = await WR.ui.buildSnapshot(month);
    const saved = cycles.find(item => item.month === month);
    const cycle = { expectedIncome: snapshot.paydayFunding.salary + (Number(saved?.advanceAmount) || 0), fixedAmount: snapshot.cashflow.fixedExpenses, variableAmount: snapshot.budgetLines.filter(item => item.type === 'variable').reduce((sum, item) => sum + Math.max(Number(item.budgetAmount) || 0, Number(item.actualAmount) || 0), 0), debtAmount: snapshot.cashflow.debtPayments, allocations: [], ...saved };
    const funding = WR.ui.calculatePayCycleFunding(cycle);
    const currency = WR.ui.escapeText(profile.baseCurrency);
    const escape = WR.ui.escapeText;
    const today = new Date().toISOString().slice(0, 10);
    const now = new Date();
    const upcomingMonth = WR.ui.currentMonthKey(new Date(now.getFullYear(), now.getMonth() + (now.getDate() >= 25 ? 2 : 1), 1));
    const nextPayday = WR.ui.payCycleDates(upcomingMonth).start;
    const options = selected => `<option value="">Choose a pot</option>${pots.filter(pot => !pot.archived || pot.id === selected).map(pot => `<option value="${escape(pot.id)}" ${pot.id === selected ? 'selected' : ''}>${escape(pot.name)}${pot.archived ? ' (archived)' : ''}</option>`).join('')}`;
    WR.ui.setHTML(container, `

      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Salary arriving on payday</span><span class="stat-value">${currency} ${WR.ui.fmt(funding.salary)}</span></div>
        <div class="stat"><span class="stat-label">Savings from payday</span><span class="stat-value">${currency} ${WR.ui.fmt(funding.savings)}</span></div>
        <div class="stat"><span class="stat-label">Budgeted for the month${cycle.confirmed ? '' : ' (planned)'}</span><span class="stat-value ${funding.budget < 0 ? 'negative' : ''}">${currency} ${WR.ui.fmt(funding.budget)}</span></div>
      </div>
      <form id="payday-form" class="form-panel-grid">

        <label>Advance already taken<input value="${escape(cycle.advanceAmount || 0)}" readonly></label>
        <label>Fixed expenses reserved<input name="fixedAmount" type="number" min="0" step="0.01" value="${escape(cycle.fixedAmount)}" required></label>
        <label>Variable expenses reserved<input name="variableAmount" type="number" min="0" step="0.01" value="${escape(cycle.variableAmount)}" required></label>
        <label>Debt payments reserved<input name="debtAmount" type="number" min="0" step="0.01" value="${escape(cycle.debtAmount)}" required></label>
        <div class="span-2"><h3>Savings from payday</h3>
          ${(cycle.allocations || []).map((item, index) => `<div class="inline-form payday-allocation" data-index="${index}"><label>Savings pot<select name="potId">${options(item.potId)}</select></label><label>Amount<input name="allocationAmount" type="number" min="0.01" step="0.01" value="${escape(item.amount)}" required></label><label class="payday-check"><input name="removeAllocation" type="checkbox">Remove allocation</label></div>`).join('')}
          <div class="inline-form"><label>Additional savings pot<select name="newPotId">${options('')}</select></label><label>Amount<input name="newAllocationAmount" type="number" min="0.01" step="0.01" placeholder="0.00"></label></div>
        </div>
        <label class="span-2 payday-check"><span><input name="confirmed" type="checkbox" ${cycle.confirmed ? 'checked' : ''}>Pay received and listed savings transferred</span></label>
        <div class="form-panel-actions"><button type="submit">Save payday budget</button></div>
        <p class="fine-print span-2">Confirm only after payday. Use expected income before advances, not a deposit already reduced by advances. Do not also add this payday budget manually in Transactions. Reserved expenses are separate from everyday spending. Unconfirming reverses this funding and its linked savings.</p>
      </form>
      <h3>Wage advances</h3>
      <form id="payday-advance-form" class="form-panel-grid">
        <label>Amount received<input name="amount" type="number" min="0.01" step="0.01" required></label>
        <label>Received date<input name="receivedDate" type="date" value="${today}" max="${today}" required></label>
        <label>Taken from payday<input name="payDate" type="date" value="${nextPayday}" required></label>
        <label>Already recorded in Transactions<select name="transactionId"><option value="">No, add to available money automatically</option>${transactions.filter(item => item.kind === 'add' && !item.paydayAdvanceId).map(item => `<option value="${escape(item.id)}">${escape(item.date)} - ${currency} ${WR.ui.fmt(item.amount)} - ${escape(item.description || '')}</option>`).join('')}</select></label>
        <div class="form-panel-actions"><button type="submit">Record advance</button></div>
      </form>
      <table class="data-table"><thead><tr><th>Received</th><th>Future payday</th><th>Advance (${currency})</th><th></th></tr></thead><tbody>${advances.slice().sort((left, right) => right.receivedDate.localeCompare(left.receivedDate)).map(item => `<tr><td>${escape(item.receivedDate)}</td><td>${escape(item.payDate)}</td><td>${WR.ui.fmt(item.amount)}</td><td><button class="link-btn remove-pay-advance" data-id="${escape(item.id)}">Remove</button></td></tr>`).join('') || '<tr><td colspan="4" class="empty">No wage advances recorded.</td></tr>'}</tbody></table>

      try {
        const allocations = [...form.querySelectorAll('.payday-allocation')].filter(row => !row.querySelector('[name="removeAllocation"]').checked).map(row => ({ potId: row.querySelector('[name="potId"]').value, amount: row.querySelector('[name="allocationAmount"]').value }));
        if (form.elements.newPotId.value || form.elements.newAllocationAmount.value) allocations.push({ potId: form.elements.newPotId.value, amount: form.elements.newAllocationAmount.value });
        await savePayCycle(month, { expectedIncome: form.elements.expectedIncome.value, fixedAmount: form.elements.fixedAmount.value, variableAmount: form.elements.variableAmount.value, debtAmount: form.elements.debtAmount.value, allocations, confirmed: form.elements.confirmed.checked });
        WR.ui.notify('Payday budget and linked savings updated.', 'success');

  const DEFAULT_EMERGENCY_FUND_ACCOUNTS = [
    { id: 'moneyclub', label: 'MoneyClub Emergency Fund' },
    { id: 'fnb', label: 'FNB Emergency Fund' },
  ];
  const escapeEf = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  function getEmergencyFundAccounts(profile) {
    return Array.isArray(profile.emergencyFundAccounts) && profile.emergencyFundAccounts.length
      ? profile.emergencyFundAccounts : DEFAULT_EMERGENCY_FUND_ACCOUNTS;
  }

  async function saveEmergencyBorrowing(account, entry) {
    const cents = Math.round(Number(entry.amount) * 100);
    const date = String(entry.date || '');
    const parsed = new Date(`${date}T12:00:00Z`);
    if (!entry.id || !Number.isSafeInteger(cents) || cents <= 0) throw new Error('Enter an amount greater than zero.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0, 10) !== date || date > new Date().toISOString().slice(0, 10)) throw new Error('Choose a valid date that is not in the future.');
    const [profile, entries] = await Promise.all([WR.ui.getOrCreateProfile(), WR.repos.emergencyFundContributions.getAll()]);
    if (entries.some(item => item.id === entry.id)) return;
    const accounts = getEmergencyFundAccounts(profile);
    if (!accounts.some(item => item.id === account)) throw new Error('Choose an emergency fund account.');
    const balance = entries.filter(item => (item.account || accounts[0].id) === account)
      .reduce((sum, item) => sum + Math.round(((Number(item.amount) || 0) + WR.financial.calculateEmergencyBorrowing(item).repaid) * 100), 0);
    if (cents > balance) throw new Error('Insufficient savings in this emergency fund account.');
    await saveEmergencyFundEntries([{ id: entry.id, account, date, amount: -cents / 100, note: String(entry.note || '').trim(), returned: false, repayments: [] }]);
  }

  Object.assign(WR.ui, { getEmergencyFundAccounts, saveEmergencyBorrowing });

  async function saveEmergencyFundEntries(entries) {
    const user = WR.account.getCurrentUser();
    if (!user) throw new Error('Not signed in.');
    const api = WR.account.getFirestoreApi();
    const db = WR.account.getDb();
    const clean = item => Object.fromEntries(Object.entries(item).filter(([, value]) => value !== undefined));
    await api.runTransaction(db, async transaction => {
      entries.forEach(entry => transaction.set(api.doc(db, 'users', user.uid, 'emergencyFundContributions', entry.id), clean(entry)));
    });
  }

  async function saveEmergencyRepayment(loanId, payment) {
    const cents = Math.round(Number(payment.amount) * 100);
    const date = String(payment.date || '');
    const parsed = new Date(`${date}T12:00:00Z`);
    if (!payment.id || !Number.isSafeInteger(cents) || cents <= 0) throw new Error('Enter an amount greater than zero.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0, 10) !== date || date > new Date().toISOString().slice(0, 10)) throw new Error('Choose a valid date that is not in the future.');
    const uid = WR.account.getCurrentUser()?.uid;
    if (!uid) throw new Error('Not signed in.');
    const api = WR.account.getFirestoreApi();
    const db = WR.account.getDb();
    const ref = api.doc(db, 'users', uid, 'emergencyFundContributions', loanId);
    await api.runTransaction(db, async transaction => {
      const snapshot = await transaction.get(ref);
      if (!snapshot.exists()) throw new Error('This borrowing record no longer exists.');
      const loan = snapshot.data();
      if (loan.transferId || Number(loan.amount) >= 0) throw new Error('Choose an emergency fund borrowing record.');
      if ((loan.repayments || []).some(entry => entry.id === payment.id)) return;
      if (date < loan.date) throw new Error('Repayment date cannot be before the borrowing date.');
      const remaining = Math.round(WR.financial.calculateEmergencyBorrowing(loan).remaining * 100);
      if (cents > remaining) throw new Error('Repayment exceeds the outstanding amount.');
      transaction.update(ref, {
        repayments: [...(loan.repayments || []), { id: payment.id, amount: cents / 100, date }],
        returned: cents === remaining,
      });
    });
  }

  WR.ui.saveEmergencyRepayment = saveEmergencyRepayment;

  function normalizeTransactionImportDate(raw, format) {
    const text = String(raw ?? '').trim();
    const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ].*)?$/);
    let year;
    let month;
    let day;
    if (iso) [, year, month, day] = iso;
    else {
      const numeric = text.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
      if (!numeric) return '';
      const first = Number(numeric[1]);
      const second = Number(numeric[2]);
      const inferredFormat = first > 12 ? 'dmy' : second > 12 ? 'mdy' : format;
      if (inferredFormat === 'mdy') [month, day, year] = numeric.slice(1);
      else [day, month, year] = numeric.slice(1);
    }
    const numbers = [Number(year), Number(month), Number(day)];
    const parsed = new Date(Date.UTC(numbers[0], numbers[1] - 1, numbers[2]));
    if (parsed.getUTCFullYear() !== numbers[0] || parsed.getUTCMonth() !== numbers[1] - 1 || parsed.getUTCDate() !== numbers[2]) return '';
    return `${String(numbers[0]).padStart(4, '0')}-${String(numbers[1]).padStart(2, '0')}-${String(numbers[2]).padStart(2, '0')}`;
  }

  function transactionImportDuplicateKey(item) {
    const description = String(item.description || '').trim().toLocaleLowerCase().replace(/\s+/g, ' ');
    return `${item.date}|${description}|${Math.round(Number(item.amount) * 100)}`;
  }

  function prepareTransactionImportRows(rawRows, mapping, options, existingTransactions) {
    const seen = new Set((existingTransactions || []).map((item) => transactionImportDuplicateKey({
      date: item.date,
      description: item.description,
      amount: item.amount,
    })));
    return (rawRows || []).map((raw, index) => {
      const date = normalizeTransactionImportDate(raw[mapping.date], options.dateFormat || 'dmy');
      const description = String(raw[mapping.description] ?? '').trim();
      const category = mapping.category ? String(raw[mapping.category] ?? '').trim() : '';
      const parsedAmount = WR.excel.parseAmount(raw[mapping.amount]);
      const isSpendingSign = Number.isFinite(parsedAmount) && (options.spendSign === 'negative' ? parsedAmount < 0 : parsedAmount > 0);
      const amount = isSpendingSign ? Math.round(Math.abs(parsedAmount) * 100) / 100 : 0;
      const typeText = mapping.type ? String(raw[mapping.type] ?? '').trim() : '';
      const possibleTransfer = /\b(?:transfer|top[\s-]?up|own account|internal move)\b/i.test(`${typeText} ${description}`);
      const notSpend = /\b(?:income|deposit|refund|salary|payday|advance)\b/i.test(`${typeText} ${description}`) || !isSpendingSign;
      const problems = [];
      if (!date) problems.push('Check date and date format');
      if (!description) problems.push('Add a description');
      if (!Number.isFinite(parsedAmount) || parsedAmount === 0) problems.push('Amount must be a valid non-zero number');
      const candidate = { index, date, description, category, amount, possibleTransfer, notSpend, problems };
      candidate.duplicate = !problems.length && seen.has(transactionImportDuplicateKey(candidate));
      if (!problems.length && !candidate.duplicate) seen.add(transactionImportDuplicateKey(candidate));
      candidate.include = !problems.length && !candidate.duplicate && !possibleTransfer && !notSpend;
      return candidate;
    });
  }

  function findRecurringSpendPatterns(transactions, month) {
    const [year, monthNumber] = String(month || '').split('-').map(Number);
    if (!year || !monthNumber) return [];
    const cutoff = new Date(Date.UTC(year, monthNumber - 7, 1)).toISOString().slice(0, 10);
    const groups = new Map();
    (transactions || []).forEach((transaction) => {
      const date = String(transaction.date || '');
      const amount = Number(transaction.amount);
      const description = String(transaction.description || '').trim();
      if (transaction.kind === 'add' || date < cutoff || date.slice(0, 7) > month || !description || !Number.isFinite(amount) || amount <= 0) return;
      const key = `${description.toLocaleLowerCase().replace(/\s+/g, ' ')}|${String(transaction.category || '').trim().toLocaleLowerCase()}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push({ ...transaction, date, amount, description });
    });
    return [...groups.values()].flatMap((rows) => {
      const byMonth = new Map();
      rows.sort((left, right) => left.date.localeCompare(right.date)).forEach((row) => {
        const key = row.date.slice(0, 7);
        if (!byMonth.has(key)) byMonth.set(key, row);
      });
      const monthlyRows = [...byMonth.values()];
      if (monthlyRows.length < 3) return [];
      const gaps = monthlyRows.slice(1).map((row, index) => (Date.parse(`${row.date}T00:00:00Z`) - Date.parse(`${monthlyRows[index].date}T00:00:00Z`)) / 86400000);
      if (gaps.some((gap) => gap < 23 || gap > 40)) return [];
      const amounts = monthlyRows.map((row) => row.amount);
      const averageAmount = amounts.reduce((sum, amount) => sum + amount, 0) / amounts.length;
      if (averageAmount <= 0 || (Math.max(...amounts) - Math.min(...amounts)) / averageAmount > 0.25) return [];
      const latest = monthlyRows[monthlyRows.length - 1];
      return [{
        description: latest.description,
        category: latest.category || 'Uncategorised',
        averageAmount: Math.round(averageAmount * 100) / 100,
        occurrences: monthlyRows.length,
        lastDate: latest.date,
      }];
    }).sort((left, right) => right.occurrences - left.occurrences || right.averageAmount - left.averageAmount).slice(0, 5);
  }

  async function renderDayToDay(container) {
    WR.ui.syncBudgetMonth();
    const [profile, accounts, transactions, expenseCategories, emergencyFundContributions, storedCycles, payAdvances] = await Promise.all([
      WR.ui.getOrCreateProfile(),
      WR.repos.dayToDayAccounts.getAll(),
      WR.repos.dayToDayTransactions.getAll(),
      WR.repos.expenseCategories.getAll(),
      WR.repos.emergencyFundContributions.getAll(),
      WR.repos.payCycles.getAll(),
      WR.repos.payAdvances.getAll(),
    ]);
    const budgetSnapshot = await WR.ui.buildSnapshot(WR.ui._dayMonth || WR.ui.currentBudgetMonth());
    const payCycles = budgetSnapshot.payCycles;
    const month = WR.ui._dayMonth || WR.ui.currentBudgetMonth();
    const year = Number(month.slice(0, 4));
    const localDate = new Date();
    const today = `${localDate.getFullYear()}-${String(localDate.getMonth() + 1).padStart(2, '0')}-${String(localDate.getDate()).padStart(2, '0')}`;
    const dates = WR.ui.payCycleDates(month);
    const transactionDate = today >= dates.start && today < dates.endExclusive ? today : dates.start;
    const draftOwner = WR.account?.getCurrentUser()?.uid || 'local';
    if (WR.ui._dayDraftOwner !== draftOwner) {
      WR.ui._dayDraft = null;
      WR.ui._dayLastCategory = '';
      WR.ui._daySaving = false;
      WR.ui._dayDraftOwner = draftOwner;
    }
    const categoryKey = `wr_day_category_${draftOwner}`;
    let lastCategory = WR.ui._dayLastCategory || '';
    try { lastCategory = lastCategory || localStorage.getItem(categoryKey) || ''; } catch {}
    const draft = WR.ui._dayDraft || { date: transactionDate, description: '', category: lastCategory, amount: '' };
    WR.ui._dayYear = year;
    WR.ui._dayMonth = month;
    const defaultCategories = ['Alcohol', 'Eating out', 'Transport', 'Bank charges', 'Additional groceries'];
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    const categoryNames = [];
    [...defaultCategories, lastCategory, ...expenseCategories.map((category) => category.name), ...transactions.map((transaction) => transaction.category)]
      .map((category) => String(category || '').trim())
      .filter(Boolean)
      .forEach((category) => {
        if (!categoryNames.some((name) => name.toLowerCase() === category.toLowerCase())) categoryNames.push(category);
      });
    const categoryOptions = (selectedCategory) => {
      const selected = String(selectedCategory || '').trim();
      const options = categoryNames.map((category) => `<option value="${escapeHtml(category)}" ${category.toLowerCase() === selected.toLowerCase() ? 'selected' : ''}>${escapeHtml(category)}</option>`).join('');
      return `<option value="" ${selected ? '' : 'selected'}>None</option>${options}`;
    };
    let transactionImportState = null;
    const monthTx = transactions.filter((item) => item.kind !== 'add' && item.date >= dates.start && item.date < dates.endExclusive).sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const dateFrom = WR.ui._dayDateFrom || '';
    const dateTo = WR.ui._dayDateTo || '';
    const visibleTransactions = monthTx.filter((item) => (!dateFrom || item.date >= dateFrom) && (!dateTo || item.date <= dateTo));
    const payBudget = WR.ui.calculatePayCycleBudget(accounts, transactions, payCycles, payAdvances, month, 25, undefined, budgetSnapshot.paydayFunding.budget);
    const spent = payBudget.spent;
    const balanceBeforeMonth = budgetSnapshot.paydayFunding.budget;
    const current = payBudget.remaining;
    payBudget.remainingPct = WR.ui.calculateBudgetRemainingPercentage(balanceBeforeMonth, current);
    const spendByCategory = new Map();
    monthTx.filter((item) => item.kind !== 'add').forEach((item) => {
      const category = String(item.category || '').trim() || 'Uncategorised';
      spendByCategory.set(category, (spendByCategory.get(category) || 0) + (Number(item.amount) || 0));
    });
    const categorySpend = Array.from(spendByCategory, ([category, amount]) => ({ category, amount })).sort((left, right) => right.amount - left.amount);
    const topSpend = categorySpend[0] || null;
    const previousMonth = WR.ui.previousMonthKey(month);
    const emergencyFundAddedLastMonth = emergencyFundContributions.some((item) => String(item.date || '').slice(0, 7) === previousMonth && (Number(item.amount) || 0) > 0);
    const reductionAmount = topSpend ? Math.max(1, Math.round(topSpend.amount * 0.1)) : 0;
    const reductionDestination = emergencyFundAddedLastMonth ? 'your day-to-day buffer' : 'your emergency fund';
    const reductionContext = emergencyFundAddedLastMonth
      ? `You added to your emergency fund last month, so keeping this reduction in ${reductionDestination} will improve cash flow.`
      : `Last month had no emergency fund contribution, so this is a good place to direct the freed-up money.`;
    const reductionCard = topSpend ? `
      <details class="day-disclosure">
        <summary>Spending suggestion</summary>
        <p>Reduce ${escapeHtml(topSpend.category)} by about ${profile.baseCurrency} ${WR.ui.fmt(reductionAmount)} this month and direct it to ${reductionDestination}.</p>
        <p class="fine-print">${escapeHtml(reductionContext)} ${escapeHtml(topSpend.category)} is currently your highest day-to-day category at ${profile.baseCurrency} ${WR.ui.fmt(topSpend.amount)}.</p>
      </details>` : '';
    const recurringPatterns = findRecurringSpendPatterns(transactions, month);
    const recurringCard = recurringPatterns.length ? `
      <section class="day-disclosure" aria-labelledby="recurring-spend-title">
        <h2 id="recurring-spend-title">Possible recurring charges</h2>
        <p class="fine-print">These suggestions match at least three recent monthly charges with similar amounts. Nothing is added to your budget automatically.</p>
        <ul class="bill-list">${recurringPatterns.map(item => `<li><div><strong>${escapeHtml(item.description)}</strong><span>${escapeHtml(item.category)} · ${item.occurrences} monthly charges · last seen ${escapeHtml(item.lastDate)}</span></div><strong>${profile.baseCurrency} ${WR.ui.fmt(item.averageAmount)} average</strong></li>`).join('')}</ul>
        <p><a class="link-btn" href="#/fixed-expenses">Review Fixed Expenses</a></p>
      </section>` : '';
    const categoryCards = categorySpend.map((item, index) => {
      const share = spent > 0 ? (item.amount / spent) * 100 : 0;
      return `
        <article class="day-category-row ${index === 0 ? 'top-spend' : ''}" role="listitem">
          <h3>${escapeHtml(item.category)}</h3>
          <div class="day-category-meter" aria-hidden="true"><span style="--share: ${share.toFixed(2)}%"></span></div>
          <span class="amount">${profile.baseCurrency} ${WR.ui.fmt(item.amount)}</span>
          <span class="share">${share.toFixed(0)}%</span>
        </article>`;

      Papa.parse(file, {

            WR.ui.setHTML(importConfig, '<p class="warning">This file has more than 5,000 rows. Split it into smaller files and preview each separately.</p>');
            return;
          }
          transactionImportState = { headers, rawRows };
          const amountHeader = matchingHeader(headers, ['amount', 'debit', 'withdrawal', 'expense', 'transaction amount']);
          const dateHeader = matchingHeader(headers, ['date', 'transaction date', 'posting date', 'posted date', 'value date']);
          const descriptionHeader = matchingHeader(headers, ['description', 'details', 'transaction description', 'merchant', 'payee', 'narration', 'memo']);

          const numericAmounts = rawRows.map(row => WR.excel.parseAmount(row[amountHeader])).filter(Number.isFinite);

          WR.ui.setHTML(importConfig, `
            ${result.errors?.length ? `<p class="warning">${result.errors.length} CSV formatting warning(s). Check the preview before importing.</p>` : ''}

                ${columnSelect('description', 'Description column', headers, descriptionHeader)}
                ${columnSelect('amount', 'Amount column', headers, amountHeader)}
                ${columnSelect('category', 'Category column (optional)', headers, categoryHeader, true)}
                ${columnSelect('type', 'Transaction type column (optional)', headers, typeHeader, true)}

                <label>Expenses appear as<select data-import-sign><option value="negative" ${spendSign === 'negative' ? 'selected' : ''}>Negative amounts</option><option value="positive" ${spendSign === 'positive' ? 'selected' : ''}>Positive amounts</option></select></label>
              </div>
              <button type="submit">Review rows</button>
              <p class="fine-print">Dates in YYYY-MM-DD format are detected automatically. Ambiguous numeric dates use the selected format.</p>

            const statusText = row => row.problems.length ? row.problems.join('; ')

            const previewRows = prepared.map(row => `
              <article class="transaction-import-row" data-import-index="${row.index}" data-possible-transfer="${row.possibleTransfer}">

              <div class="transaction-import-preview">

            importPreview.querySelector('#day-import-commit').addEventListener('click', async buttonEvent => {
              const button = buttonEvent.currentTarget;

              if (!selectedRows.length) { status.textContent = 'Select at least one row to import.'; return; }
              if (selectedRows.length > 450) { status.textContent = 'Select no more than 450 rows for one atomic import.'; return; }

              status.textContent = 'Checking selected rows against the latest transactions...';

                const existing = await WR.repos.dayToDayTransactions.getAll({ fresh: true });

                const imported = checked.map(row => WR.models.createDayToDayTransaction({
                  year: Number(row.date.slice(0, 4)),

                await WR.repos.dayToDayTransactions.addMany(imported);
                if (container.isConnected) await renderDayToDay(container);
                WR.ui.notifyUndo(`${imported.length} transaction(s) imported.`, async () => {
                  await WR.repos.dayToDayTransactions.removeMany(imported.map(item => item.id));

                status.textContent = error.message || 'Import failed. No rows were added.';
                button.disabled = false;

      WR.ui._dayLastCategory = category;

      WR.ui.notify('Spending saved.', 'success');

  function summarizeTransactionPeriod(transactions, start, endExclusive) {
    const rows = (transactions || []).filter(item => item.kind !== 'add' && item.date >= start && item.date < endExclusive);
    const byCategory = new Map();
    let spent = 0;
    rows.forEach(item => {
      const amount = Number(item.amount) || 0;
      spent += amount;
      const category = String(item.category || '').trim() || 'Uncategorised';
      byCategory.set(category, (byCategory.get(category) || 0) + amount);
    });
    const topCategory = [...byCategory].sort((left, right) => right[1] - left[1])[0] || null;
    return { count: rows.length, spent: Math.round(spent * 100) / 100, topCategory: topCategory ? { name: topCategory[0], amount: Math.round(topCategory[1] * 100) / 100 } : null };
  }

  async function renderInsights(container) {
    const month = WR.ui._insightsMonth || WR.ui.currentMonthKey();
    WR.ui._insightsMonth = month;
    const [snapshot, transactions] = await Promise.all([WR.ui.buildSnapshot(month), WR.repos.dayToDayTransactions.getAll()]);
    const period = WR.ui.payCycleDates(month);
    const previousPeriod = WR.ui.payCycleDates(WR.ui.previousMonthKey(month));
    const currentReview = summarizeTransactionPeriod(transactions, period.start, period.endExclusive);
    const previousReview = summarizeTransactionPeriod(transactions, previousPeriod.start, previousPeriod.endExclusive);
    const spendChange = previousReview.count ? Math.round((currentReview.spent - previousReview.spent) * 100) / 100 : null;
    const reviewNudge = !currentReview.count
      ? 'No spending is recorded in this cycle yet.'
      : currentReview.spent > snapshot.paydayFunding.budget
        ? `Recorded spending is ${snapshot.profile.baseCurrency} ${WR.ui.fmt(currentReview.spent - snapshot.paydayFunding.budget)} over the everyday budget. Check for duplicate or uncategorised entries.`
        : spendChange === null
          ? 'This is the first cycle with recorded activity. Compare again next payday.'
          : spendChange === 0
            ? 'Recorded spending is unchanged from the previous cycle.'

// Debts view: manage debts (inline-editable), then run the
// avalanche/snowball/hybrid prioritisation engine with an adjustable extra
// payment. Editing a debt only re-renders the payoff projection section,
// not the whole table \u2014 so the row you're editing keeps focus.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const CURRENCIES = ['ZAR', 'USD', 'EUR', 'GBP'];

  function currencyOptions(selected) {
    return CURRENCIES.map((c) => `<option value="${WR.ui.escapeText(c)}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  }

  function paymentFrequencyOptions(selected) {
    return ['weekly', 'biweekly', 'monthly', 'quarterly', 'yearly']
      .map((frequency) => `<option value="${WR.ui.escapeText(frequency)}" ${frequency === selected ? 'selected' : ''}>${frequency}</option>`)
      .join('');
  }

  function computePaymentsRemaining(debt) {
    const projection = WR.financial.simulateDebtPayoff([debt], 0);
    return projection.reachedSafetyCap ? null : projection.months;
  }

  function estimateCompletionDate(paymentsRemaining) {
    if (paymentsRemaining === null || paymentsRemaining < 0) return '';
    const start = new Date();
    start.setDate(1);
    start.setMonth(start.getMonth() + paymentsRemaining);
    return start.toISOString().slice(0, 10);
  }
  function trackedPaymentForMonth(debt, month) {
    const frequency = debt.paymentFrequency || 'monthly';
    if (frequency === 'quarterly' || frequency === 'yearly') {
      const startMonth = String(debt.startDate || `${month.slice(0, 4)}-01`).slice(0, 7);
      const elapsed = (Number(month.slice(0, 4)) - Number(startMonth.slice(0, 4))) * 12
        + Number(month.slice(5, 7)) - Number(startMonth.slice(5, 7));
      if (elapsed < 0 || elapsed % (frequency === 'quarterly' ? 3 : 12) !== 0) return 0;
      return Math.max(0, Number(debt.minPayment) || 0);
    }
    return WR.financial.monthlyMinPayment(debt);
  }

  function debtInBaseCurrency(debt, exchangeRates, baseCurrency) {
    const currency = debt.currency || baseCurrency;
    const current = WR.financial.convertCurrency(debt.currentBalance, currency, baseCurrency, exchangeRates);
    const original = WR.financial.convertCurrency(debt.originalBalance || debt.currentBalance, currency, baseCurrency, exchangeRates);
    const minimum = WR.financial.convertCurrency(debt.minPayment, currency, baseCurrency, exchangeRates);
    if (!current.converted || !original.converted || !minimum.converted) return null;
    return { ...debt, currentBalance: current.value, originalBalance: original.value, minPayment: minimum.value };
  }

  function computePayoffHtml(debts, strategy, extra, profile, exchangeRates) {
    if (debts.length === 0) return '<p class="empty">Add a debt to see a payoff projection.</p>';

    const unconverted = [];
    const convertedDebts = debts.flatMap((debt) => {
      const converted = debtInBaseCurrency(debt, exchangeRates, profile.baseCurrency);
      if (!converted) {
        unconverted.push(debt.name);
        return [];
      }
      return [converted];
    });
    const warning = unconverted.length ? `<p class="warning">${unconverted.length} debt(s) excluded: add their exchange rates in Settings before including them in this projection.</p>` : '';
    if (!convertedDebts.length) return `${warning}<p class="empty">No debts with a usable balance and currency rate to project.</p>`;
    let orderedDebts = [];
    if (strategy === 'avalanche') orderedDebts = WR.financial.orderDebtsAvalanche(convertedDebts);
    else if (strategy === 'snowball') orderedDebts = WR.financial.orderDebtsSnowball(convertedDebts);
    else orderedDebts = WR.financial.orderDebtsHybrid(convertedDebts);

    const saved = WR.financial.calculateInterestSaved(orderedDebts, extra);
    const orderList = saved.withExtra.payoffOrder
      .map((p) => `<li><span>${String(p.name).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char])}</span><strong>${p.monthsToPayoff === null ? 'Over 50 years' : `${p.monthsToPayoff} months`}</strong></li>`)
      .join('');

    return `
      ${warning}
      <div class="payoff-metrics">
        <div><span>Debt-free in</span><strong>${saved.withExtra.reachedSafetyCap ? 'Over 50 years' : `${saved.withExtra.months} months`}</strong></div>
        <div><span>Projected interest</span><strong>${saved.withExtra.reachedSafetyCap ? 'Not available' : `${profile.baseCurrency} ${WR.ui.fmt(saved.withExtra.totalInterestPaid)}`}</strong></div>
        <div><span>Time saved vs minimums</span><strong>${saved.withExtra.reachedSafetyCap || saved.withoutExtra.reachedSafetyCap ? 'Not comparable' : `${Math.max(0, saved.monthsSaved)} months`}</strong></div>
        <div><span>Interest saved vs minimums</span><strong>${saved.withExtra.reachedSafetyCap || saved.withoutExtra.reachedSafetyCap ? 'Not comparable' : `${profile.baseCurrency} ${WR.ui.fmt(Math.max(0, saved.interestSaved))}`}</strong></div>
      </div>
      <h3>Payment priority: ${strategy}</h3><ol class="payoff-order">${orderList}</ol>
      <p class="fine-print">Monthly estimate from current balances, annual interest rates and monthly-equivalent minimums. No new borrowing or rate changes are included.</p>
      ${saved.withExtra.reachedSafetyCap ? '<p class="warning">This plan does not clear the debt within 50 years. Raise the extra monthly payment or review the minimums.</p>' : ''}
      ${!saved.withExtra.reachedSafetyCap && saved.withoutExtra.reachedSafetyCap ? '<p class="fine-print">Minimum payments alone do not clear the debt within 50 years, so savings against that baseline cannot be calculated.</p>' : ''}
    `;
  }

  function computeDebtOverviewHtml(debts, exchangeRates, profile) {
    if (debts.length === 0) return '';
    const base = profile.baseCurrency;

    let totalCurrent = 0;
    let totalOriginal = 0;
    const unconvertedNames = [];
    const convertedDebts = [];
    debts.forEach((d) => {
      const converted = debtInBaseCurrency(d, exchangeRates, base);
      if (!converted) { unconvertedNames.push(d.name); return; }
      totalCurrent += converted.currentBalance;
      totalOriginal += converted.originalBalance;
      convertedDebts.push(converted);
    });

    const remainingPct = totalOriginal > 0 ? (totalCurrent / totalOriginal) * 100 : 0;
    const isHighRemaining = remainingPct > 50;

    const strategy = WR.ui._debtStrategy || 'avalanche';
    const extra = WR.ui._debtExtra != null ? WR.ui._debtExtra : 0;
    let orderedDebts = [];
    if (strategy === 'avalanche') orderedDebts = WR.financial.orderDebtsAvalanche(convertedDebts);
    else if (strategy === 'snowball') orderedDebts = WR.financial.orderDebtsSnowball(convertedDebts);
    else orderedDebts = WR.financial.orderDebtsHybrid(convertedDebts);

    const minimumsOnly = WR.financial.simulateDebtPayoff(orderedDebts, 0);
    const currentPlan = WR.financial.simulateDebtPayoff(orderedDebts, extra);

    const timeLeftLabel = currentPlan.reachedSafetyCap
      ? 'Not within 50 years'
      : `${Math.floor(currentPlan.months / 12)}y ${currentPlan.months % 12}m`;

    let statement = '';
    if (minimumsOnly.reachedSafetyCap) {
      statement = 'At minimum payments alone, this debt will not be cleared within 50 years. Consider a larger monthly payment.';
    } else if (extra <= 0 && minimumsOnly.months > 60) {
      statement = `Paying only the minimums will take about ${Math.round(minimumsOnly.months / 12)} years. Adding an extra monthly payment could clear this debt much sooner.`;
    } else if (isHighRemaining) {
      statement = 'You still owe over half of your original debt \u2014 consider increasing your monthly payment or reviewing your payoff plan.';
    }

    return `
      <div class="stat-grid debt-overview">
        <div class="stat"><span class="stat-label">${unconvertedNames.length ? 'Debt with rates' : 'Total Debt'}</span><span class="stat-value">${convertedDebts.length ? `${base} ${WR.ui.fmt(totalCurrent)}` : 'No rate available'}</span></div>
        <div class="stat"><span class="stat-label">Debt Remaining</span><span class="stat-value ${isHighRemaining ? 'negative' : ''}">${convertedDebts.length ? `${remainingPct.toFixed(0)}%` : '—'}</span></div>
        <div class="stat"><span class="stat-label">Time Left (current plan)</span><span class="stat-value">${convertedDebts.length ? timeLeftLabel : '—'}</span></div>
      </div>
      ${statement ? `<p class="warning">${statement}</p>` : ''}
      ${unconvertedNames.length > 0 ? `<p class="warning">${unconvertedNames.length} debt(s) excluded from this subtotal and projection. Add exchange rates in Settings.</p>` : ''}
    `;
  }

  async function refreshPayoffSection(container) {
    const [debts, exchangeRates] = await Promise.all([
      WR.repos.debts.getAll(),
      WR.repos.exchangeRates.getAll(),
    ]);
    const profile = await WR.ui.getOrCreateProfile();
    const strategy = WR.ui._debtStrategy || 'avalanche';
    const extra = WR.ui._debtExtra != null ? WR.ui._debtExtra : 0;
    const section = container.querySelector('.payoff-results');
    if (section) WR.ui.setHTML(section, computePayoffHtml(debts, strategy, extra, profile, exchangeRates));
    const overview = container.querySelector('.debt-overview-wrap');
    if (overview) WR.ui.setHTML(overview, computeDebtOverviewHtml(debts, exchangeRates, profile));
  }

  const MONTH_ABBR = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function updateDebtPaidOffDate(debt, previousBalance) {
    const currentBalance = Number(debt.currentBalance) || 0;
    if (currentBalance <= 0.01 && previousBalance > 0.01 && !debt.paidOffDate) {
      debt.paidOffDate = new Date().toISOString().slice(0, 10);
    } else if (currentBalance > 0.01) {
      delete debt.paidOffDate;
    }
  }

  function computeDebtCalendarHtml(debts, payments, profile, year) {
    const ongoingDebts = debts.filter((debt) => (Number(debt.currentBalance) || 0) > 0.01 || payments.some((payment) => payment.debtId === debt.id && String(payment.month).startsWith(String(year))));
    if (ongoingDebts.length === 0) return '';
    const cards = ongoingDebts
      .map((d) => {
        const paidTotal = payments
          .filter((p) => p.debtId === d.id)
          .reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
        const months = MONTH_ABBR
          .map((label, i) => {
            const monthKey = `${year}-${String(i + 1).padStart(2, '0')}`;
            const isPaid = payments.some((p) => p.debtId === d.id && p.month === monthKey);
            const due = Number(d.currentBalance) > 0.01 && trackedPaymentForMonth(d, monthKey) > 0;
            return `<button type="button" class="month-btn ${isPaid ? 'paid' : ''}" aria-pressed="${isPaid}" aria-label="${WR.ui.escapeText(d.name)}: ${label} ${year}, ${isPaid ? 'paid' : 'unpaid'}" data-debt-id="${d.id}" data-month="${monthKey}" ${!due && !isPaid ? 'disabled title="No payment due this month"' : ''}>${label}</button>`;
          })
          .join('');
        return `
      <div class="debt-calendar-card">
        <h4>${WR.ui.escapeText(d.name)}</h4>
        <div class="debt-calendar-grid">${months}</div>
        <div class="debt-calendar-stats">
          <span>Debt paid: <strong>${d.currency || profile.baseCurrency} ${WR.ui.fmt(paidTotal)}</strong></span>
          <span>Debt left: <strong>${d.currency || profile.baseCurrency} ${WR.ui.fmt(d.currentBalance)}</strong></span>
        </div>
      </div>`;
      })
      .join('');

    return `
      <h2>Monthly Payment Tracker</h2>
      <p class="fine-print">Mark a payment when it clears. Weekly and biweekly amounts use a monthly equivalent; quarterly and yearly installments are due from the start month.</p>
      <div class="toolbar">
        <label>Year:
          <select id="debt-calendar-year">${WR.ui.yearsAroundCurrent(3, 3).map((y) => `<option value="${WR.ui.escapeText(y)}" ${y === year ? 'selected' : ''}>${y}</option>`).join('')}</select>
        </label>
      </div>
      <div class="debt-calendar-list">${cards}</div>
    `;
  }

  async function setDebtPaymentStatus(debtId, month, paid) {
    const user = WR.account.getCurrentUser();
    if (!user) throw new Error('Sign in to record a payment.');
    const api = WR.account.getFirestoreApi();
    const db = WR.account.getDb();
    const profile = await WR.ui.getOrCreateProfile();
    const paymentId = `monthly-${debtId}-${month}`;
    const ledger = await api.getDocsFromServer(api.query(api.collection(db, 'users', user.uid, 'debtPayments'), api.where('debtId', '==', debtId)));
    const ids = [...new Set([paymentId, ...ledger.docs.filter((document) => document.data().month === month).map((document) => document.id)])];
    const debtRef = api.doc(db, 'users', user.uid, 'debts', debtId);
    const paymentRefs = ids.map((id) => api.doc(db, 'users', user.uid, 'debtPayments', id));
    await api.runTransaction(db, async (transaction) => {
      const debtSnapshot = await transaction.get(debtRef);
      const paymentSnapshots = await Promise.all(paymentRefs.map((ref) => transaction.get(ref)));
      if (!debtSnapshot.exists()) throw new Error('This debt no longer exists.');
      const debt = debtSnapshot.data();
      const previousBalance = Number(debt.currentBalance) || 0;
      const existing = paymentSnapshots.filter((snapshot) => snapshot.exists());
      if (paid && !existing.length) {
        const amount = Math.min(previousBalance, trackedPaymentForMonth(debt, month));
        if (amount <= 0) throw new Error('No payment is due for this debt in that month.');
        transaction.set(paymentRefs[0], { id: paymentId, debtId, month, amount, currency: debt.currency || profile.baseCurrency });
        debt.currentBalance = Math.round((previousBalance - amount) * 100) / 100;
      } else if (!paid && existing.length) {
        debt.currentBalance = Math.round((previousBalance + existing.reduce((sum, snapshot) => sum + Number(snapshot.data().amount), 0)) * 100) / 100;
        paymentSnapshots.forEach((snapshot, index) => { if (snapshot.exists()) transaction.delete(paymentRefs[index]); });
      }
      debt.billStatuses = { ...debt.billStatuses, [month]: paid ? 'paid' : 'unpaid' };
      updateDebtPaidOffDate(debt, previousBalance);
      transaction.set(debtRef, Object.fromEntries(Object.entries(debt).filter(([, value]) => value !== undefined)));
    });
    await Promise.all([
      api.getDocsFromServer(api.collection(db, 'users', user.uid, 'debts')),
      api.getDocsFromServer(api.collection(db, 'users', user.uid, 'debtPayments')),
    ]);
  }

  async function toggleDebtPayment(debtId, month, container, button) {
    if (button) button.disabled = true;
    try {
      const payments = await WR.repos.debtPayments.getAll();
      await setDebtPaymentStatus(debtId, month, !payments.some((payment) => payment.debtId === debtId && payment.month === month));
      await renderDebts(container);
    } catch (error) {
      WR.ui.notify(error.message || 'Unable to record this payment.', 'error');
      if (button) button.disabled = false;
    }
  }

  function calculateMoneyOwed(entry) {
    const principal = Math.max(0, Number(entry.amount) || 0);
    const interest = Math.round(principal * Math.max(0, Number(entry.interestRatePct) || 0)) / 100;
    const total = Math.round((principal + interest) * 100) / 100;
    const repaid = Math.round((entry.repayments || []).reduce((sum, payment) => sum + (Number(payment.amount) || 0), 0) * 100) / 100;
    return { principal, interest, total, repaid, remaining: Math.max(0, Math.round((total - repaid) * 100) / 100) };
  }

  async function renderMoneyOwed(container) {

        <label>Amount owed before interest<input name="amount" type="number" min="0.01" step="0.01" value="${WR.ui.escapeText(entry.amount ?? '')}" required></label>
        <label>Currency<select name="currency">${currencyOptions(entry.currency || profile.baseCurrency)}</select></label>
        <label>One-off interest (%)<input name="interestRatePct" type="number" min="0" step="0.01" value="${WR.ui.escapeText(entry.interestRatePct || 0)}"></label>
        <label>Source account<input name="sourceAccount" list="money-owed-accounts" value="${esc(entry.sourceAccount)}" maxlength="120" required></label>
        <label>Date lent / bill paid<input name="date" type="date" value="${esc(entry.date || today)}" required></label>
        <label>Repayment due (optional)<input name="dueDate" type="date" value="${esc(entry.dueDate)}"></label>

    const cards = (list) => list.map((entry) => {

          <div class="stat"><span class="stat-label">Outstanding</span><strong class="stat-value">${money(entry, balance.remaining)}</strong></div>

        ${entry.dueDate ? `<p class="fine-print">${balance.remaining > 0 && entry.dueDate < today ? 'Overdue' : 'Due'}: ${esc(entry.dueDate)}</p>` : ''}
        ${balance.remaining > 0 ? `<form data-owed-action="repayment">
          <div class="money-owed-fields">
            <label>Repayment amount<input name="amount" type="number" min="0.01" max="${balance.remaining}" step="0.01" value="${WR.ui.escapeText(balance.remaining)}" required></label>
            <label>Repayment date<input name="date" type="date" value="${WR.ui.escapeText(today)}" required></label>
          </div><button type="submit">Record repayment</button>
        </form>` : '<p class="fine-print">Fully repaid</p>'}
        ${(entry.repayments || []).length ? `<details><summary>Repayment history (${entry.repayments.length})</summary><ul class="money-owed-history">${entry.repayments.map((payment) => `<li><span>${esc(payment.date)} · ${money(entry, payment.amount)}</span><button type="button" class="secondary" data-remove-repayment="${esc(payment.id)}">Remove repayment</button></li>`).join('')}</ul></details>` : ''}
        <details class="card-edit"><summary>Edit entry</summary><form data-owed-action="edit">${fields(entry)}<button type="submit">Save changes</button></form></details>

    const totals = new Map();

    WR.ui.setHTML(container, `

      <div class="money-owed-grid">${cards(outstanding) || '<p class="empty">No money outstanding.</p>'}</div>
      ${settled.length ? `<details><summary>Fully repaid (${settled.length})</summary><div class="money-owed-grid">${cards(settled)}</div></details>` : ''}
      <datalist id="money-owed-accounts">${accountNames.map((name) => `<option value="${esc(name)}"></option>`).join('')}</datalist>
      <details class="form-panel" ${entries.length ? '' : 'open'}><summary>Add money owed to me</summary><form data-owed-action="add">${fields()}<button type="submit">Add entry</button></form></details>`);

    container.querySelectorAll('form[data-owed-action]').forEach((form) => {
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        try {
          const value = (name) => form.elements.namedItem(name).value;
          const id = form.closest('[data-owed-id]')?.dataset.owedId;
          const existing = id ? await WR.repos.moneyOwed.getById(id) : null;
          if (id && !existing) throw new Error('This entry no longer exists.');
          if (form.dataset.owedAction === 'repayment') {
            const amount = Number(value('amount'));
            if (!Number.isFinite(amount) || amount <= 0 || amount > calculateMoneyOwed(existing).remaining) throw new Error('Repayment must be greater than zero and no more than the outstanding amount.');
            if (!value('date') || value('date') < existing.date) throw new Error('Repayment date cannot be before the date lent.');
            await WR.repos.moneyOwed.update({ ...existing, repayments: [...(existing.repayments || []), { id: crypto.randomUUID(), amount, date: value('date') }] });
          } else {
            const entry = { ...existing, id: existing?.id || crypto.randomUUID(), borrower: value('borrower').trim(), kind: value('kind'), amount: Number(value('amount')), currency: value('currency'), interestRatePct: Number(value('interestRatePct')), sourceAccount: value('sourceAccount').trim(), date: value('date'), dueDate: value('dueDate'), note: value('note').trim(), repayments: existing?.repayments || [] };
            if (!entry.borrower || !entry.sourceAccount || !Number.isFinite(entry.amount) || entry.amount <= 0 || !Number.isFinite(entry.interestRatePct) || entry.interestRatePct < 0) throw new Error('Enter a person, source account, positive amount, and valid interest rate.');
            if (existing?.repayments?.length && entry.currency !== existing.currency) throw new Error('Remove existing repayments before changing the currency.');
            if (!entry.date || entry.repayments.some((payment) => payment.date < entry.date)) throw new Error('Date lent cannot be after a recorded repayment.');
            if (entry.dueDate && entry.dueDate < entry.date) throw new Error('Repayment due date cannot be before the date lent.');
            const balance = calculateMoneyOwed(entry);
            if (!Number.isFinite(balance.total) || balance.total < balance.repaid) throw new Error('Total owed cannot be less than repayments already recorded.');
            await WR.repos.moneyOwed[existing ? 'update' : 'add'](entry);
          }
          await renderMoneyOwed(container);
          WR.ui.notify('Money owed updated.', 'success');
        } catch (error) {
          WR.ui.notify(error.message || 'Unable to save this entry.', 'error');
          button.disabled = false;
        }
      });
    });
    container.querySelectorAll('[data-delete-owed], [data-remove-repayment]').forEach((button) => {
      button.addEventListener('click', async () => {
        const removingPayment = !!button.dataset.removeRepayment;
        button.disabled = true;
        try {
          if (removingPayment) {
            const entry = await WR.repos.moneyOwed.getById(button.closest('[data-owed-id]').dataset.owedId);
            if (!entry) throw new Error('This entry no longer exists.');
            const repayment = (entry.repayments || []).find(payment => payment.id === button.dataset.removeRepayment);
            if (!repayment) throw new Error('This repayment no longer exists.');
            await WR.repos.moneyOwed.update({ ...entry, repayments: (entry.repayments || []).filter((payment) => payment.id !== repayment.id) });

              const latest = await WR.repos.moneyOwed.getById(entry.id);
              if (!latest) await WR.repos.moneyOwed.add(entry);
              else if (!(latest.repayments || []).some(payment => payment.id === repayment.id)) {
                await WR.repos.moneyOwed.update({ ...latest, repayments: [...(latest.repayments || []), repayment] });
              }
              await renderMoneyOwed(container);
            }, { undoSuccessMessage: 'Repayment restored.' });
          } else {
            await WR.ui.removeWithUndo({ repo: WR.repos.moneyOwed, id: button.dataset.deleteOwed, entityLabel: 'Money owed entry', afterChange: () => renderMoneyOwed(container) });
          }
        } catch (error) {
          WR.ui.notify(error.message || 'Unable to update this entry.', 'error');
          button.disabled = false;
        }
      });
    });
  }

  function sortRecords(records, sort, fields) {
    const activeSort = sort && fields.includes(sort.field) ? sort : { field: fields[0], dir: 'asc' };
    return [...records].sort((left, right) => {
      const a = left[activeSort.field] ?? '';
      const b = right[activeSort.field] ?? '';
      const comparison = typeof a === 'number' || typeof b === 'number'
        ? (Number(a) || 0) - (Number(b) || 0)
        : String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
      return activeSort.dir === 'desc' ? -comparison : comparison;
    });
  }

  function recordSortHeader(label, field, sort) {
    const active = sort.field === field;
    const direction = active ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
    const indicator = active ? (sort.dir === 'asc' ? '\u2191' : '\u2193') : '\u2195';
    return `<th aria-sort="${direction}"><button type="button" class="table-sort" data-sort-field="${field}" aria-label="Sort by ${WR.ui.escapeText(label)}${active ? `, currently ${direction}` : ''}">${WR.ui.escapeText(label)} <span aria-hidden="true">${indicator}</span></button></th>`;
  }

  function bindRecordTableControls(container, searchStateKey, sortStateKey, render) {
    const search = container.querySelector('[data-record-search]');
    if (search) {
      const rows = [...container.querySelectorAll('tr[data-search-text]')];
      const count = container.querySelector('[data-search-count]');
      const empty = container.querySelector('[data-search-empty]');
      const updateSearch = () => {
        const query = search.value.trim().toLocaleLowerCase();
        WR.ui[searchStateKey] = search.value;
        let visible = 0;
        rows.forEach((row) => {
          row.hidden = query !== '' && !row.dataset.searchText.toLocaleLowerCase().includes(query);
          if (!row.hidden) visible += 1;
        });
        if (count) count.textContent = `Showing ${visible} of ${rows.length} records.`;
        if (empty) empty.hidden = rows.length === 0 || visible !== 0;
      };
      search.addEventListener('input', updateSearch);
      updateSearch();
    }

    container.querySelectorAll('.table-sort').forEach((button) => {
      button.addEventListener('click', async () => {
        const current = WR.ui[sortStateKey] || { field: button.dataset.sortField, dir: 'asc' };
        WR.ui[sortStateKey] = current.field === button.dataset.sortField
          ? { field: current.field, dir: current.dir === 'asc' ? 'desc' : 'asc' }
          : { field: button.dataset.sortField, dir: 'asc' };
        const field = button.dataset.sortField;
        await render(container);
        [...container.querySelectorAll(`.table-sort[data-sort-field="${field}"]`)]
          .find((candidate) => !candidate.closest('[hidden]'))?.focus();
      });
    });
  }

})();
// Assets and Investments views. Both inline-editable, matching the pattern

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {

  function sumInBaseCurrency(items, valueField, exchangeRates, baseCurrency) {
    let total = 0;

    items.forEach((item) => {

        item[valueField],
        item.currency || baseCurrency,
        baseCurrency,
        exchangeRates,
      );
      total += value;
      if (!converted) unconvertedNames.push(item.name);

    return { total, unconvertedNames };
  }

  function computeInvestmentSuggestions(investments, totalValue, totalContributions, gainPct) {
    const suggestions = [];
    if (investments.length === 0) {
      return suggestions;
    }

    const riskCategories = new Set(investments.map((inv) => inv.riskCategory || 'medium'));
    if (investments.length > 1 && riskCategories.size === 1) {
      suggestions.push('All your investments share the same risk category \u2014 diversifying across low, medium, and high risk assets can smooth out returns over time.');
    }

    const largest = investments.reduce((max, inv) => (inv.currentValue > (max?.currentValue || 0) ? inv : max), null);
    if (largest && totalValue > 0 && largest.currentValue / totalValue > 0.7) {
      suggestions.push(`${WR.ui.escapeText(largest.name)} makes up over 70% of your portfolio \u2014 consider spreading contributions to reduce concentration risk.`);
    }

    if (totalContributions > 0 && gainPct < 0) {
      suggestions.push('Your portfolio is currently below what you\u2019ve contributed \u2014 review underperforming holdings or consider low-cost diversified index funds/ETFs for steadier long-term growth.');
    } else if (totalContributions > 0 && gainPct >= 0 && gainPct <= 5) {
      suggestions.push('Growth is modest so far \u2014 if your risk tolerance and timeline allow, exploring higher-growth options like equity ETFs could improve long-term returns.');
    } else if (totalContributions > 0 && gainPct > 15) {
      suggestions.push('Strong growth so far \u2014 consider rebalancing periodically to lock in gains and keep your risk mix on target.');
    }

    if (suggestions.length === 0) {
      suggestions.push('Your portfolio looks reasonably balanced \u2014 keep contributing consistently and review it periodically.');
    }
    return suggestions;
  }

(function () {
  let state = { workbook: null, sheetName: null, headerRowIndex: 0, headers: [], rawRows: [] };

  function fieldMappingForm(headers) {
    const options = (selected) =>
      `<option value="">\u2014 not mapped \u2014</option>` +
      headers.map((h) => `<option value="${WR.ui.escapeText(h)}" ${h === selected ? 'selected' : ''}>${h}</option>`).join('');

    return `
      <div class="mapping-grid">
        <label>Name / Description column: <select id="map-name">${options()}</select></label>
        <label>Amount column: <select id="map-amount">${options()}</select></label>
        <label>Type for all rows:
          <select id="map-type-constant">
            <option value="income">Income</option>
            <option value="fixed">Fixed expense</option>
            <option value="variable">Variable expense</option>
            <option value="savings">Savings/Investment</option>
            <option value="debtPayment">Debt payment</option>
          </select>
        </label>
        <label>Month for all rows: <input type="month" id="map-month-constant" value="${WR.ui.escapeText(WR.ui.currentMonthKey())}"></label>
      </div>
    `;
  }

  async function renderExcel(container) {
    WR.ui.setHTML(container, `
      <h1>Excel</h1>

      <section>
        <h2>Import</h2>
        <p class="fine-print">Works with any spreadsheet \u2014 you'll map its columns to WealthRoute fields before anything is imported. Nothing is saved until you confirm.</p>
        <input type="file" id="excel-file-input" accept=".xlsx,.xls,.csv">
        <div id="import-workflow"></div>
      </section>

      <section>
        <h2>Export</h2>
        <p class="fine-print">Downloads all current WealthRoute data as a new workbook (one sheet per data type). This does not reproduce the original 16-sheet template layout \u2014 it exports WealthRoute's own data model.</p>
        <button id="export-btn">Export to Excel</button>
      </section>
    `);

    WR.excel.loadXlsx().catch(() => {});

    document.getElementById('export-btn').addEventListener('click', async () => {
      await WR.excel.loadXlsx().catch(() => {});
      if (typeof XLSX === 'undefined') {
        alert('Excel library failed to load \u2014 check your internet connection and reload the page.');
        return;
      }
      await WR.excel.exportWorkbook();
    });

    document.getElementById('excel-file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await WR.excel.loadXlsx().catch(() => {});
      if (typeof XLSX === 'undefined') {
        alert('Excel library failed to load \u2014 check your internet connection and reload the page.');
        return;
      }
      const buffer = await file.arrayBuffer();
      state.workbook = WR.excel.parseWorkbook(buffer);
      const sheetNames = WR.excel.getSheetNames(state.workbook);
      renderSheetPicker(sheetNames);
    });

    function renderSheetPicker(sheetNames) {
      const workflow = document.getElementById('import-workflow');
      WR.ui.setHTML(workflow, `
        <div class="toolbar">
          <label>Sheet: <select id="sheet-picker">${sheetNames.map((n) => `<option value="${WR.ui.escapeText(n)}">${n}</option>`).join('')}</select></label>
          <label>Header row: <input type="number" id="header-row-input" min="1" value="1" style="width:4.5em"></label>
        </div>
        <p class="fine-print">If a sheet has its column headers somewhere other than the first row \u2014 common in sheets with a title or multiple tables \u2014 set the header row number above and the columns will refresh.</p>
        <div id="mapping-area"></div>
      `);
      document.getElementById('sheet-picker').addEventListener('change', (e) => {
        document.getElementById('header-row-input').value = 1;
        loadSheet(e.target.value, 0);
      });
      document.getElementById('header-row-input').addEventListener('change', (e) => {
        const rowNum = Math.max(1, parseInt(e.target.value, 10) || 1);
        e.target.value = rowNum;
        loadSheet(state.sheetName, rowNum - 1); // convert 1-indexed display to 0-indexed
      });
      loadSheet(sheetNames[0], 0);
    }

    function loadSheet(sheetName, headerRowIndex) {
      state.sheetName = sheetName;
      state.headerRowIndex = headerRowIndex;
      const { headers, rows } = WR.excel.readSheetRows(state.workbook, sheetName, headerRowIndex);
      state.headers = headers;
      state.rawRows = rows;

      const mappingArea = document.getElementById('mapping-area');
      if (rows.length === 0) {
        WR.ui.setHTML(mappingArea, `<p class="warning">No data rows found below this header row \u2014 try a different header row number.</p>`);
        return;
      }

      WR.ui.setHTML(mappingArea, `
        ${fieldMappingForm(headers)}
        <button id="preview-btn">Preview</button>
        <div id="preview-area"></div>
      `);
      document.getElementById('preview-btn').addEventListener('click', renderPreview);
    }

    function currentMapping() {
      return {
        mapping: { name: document.getElementById('map-name').value, amount: document.getElementById('map-amount').value },
        constants: {
          type: document.getElementById('map-type-constant').value,
          month: document.getElementById('map-month-constant').value,
        },
      };
    }

    function renderPreview() {
      const { mapping, constants } = currentMapping();

      if (!mapping.name || !mapping.amount) {
        WR.ui.setHTML(document.getElementById('preview-area'), '<p class="warning">Map both a Name/Description column and an Amount column before previewing.</p>');
        return;
      }

      const mapped = WR.excel.applyMapping(state.rawRows, mapping, constants);
      const withProblems = mapped.map((row) => ({ row, problems: WR.excel.validateImportRow(row) }));
      const validCount = withProblems.filter((r) => r.problems.length === 0).length;

      const rowsHtml = withProblems
        .slice(0, 25)
        .map(
          ({ row, problems }) => `
        <tr class="${problems.length ? 'invalid-row' : ''}">
          <td>${row.name ?? ''}</td>
          <td class="num">${row.amount ?? ''}</td>
          <td>${row.type ?? ''}</td>
          <td>${row.month ?? ''}</td>
          <td>${problems.join('; ')}</td>
        </tr>`,
        )
        .join('');

      WR.ui.setHTML(document.getElementById('preview-area'), `
        <p><strong>${validCount}</strong> of <strong>${mapped.length}</strong> rows are valid and will be imported. Showing first 25 rows below.</p>
        <table class="data-table">
          <thead><tr><th>Name</th><th>Amount</th><th>Type</th><th>Month</th><th>Problems</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <button id="confirm-import-btn" ${validCount === 0 ? 'disabled' : ''}>Confirm Import (${validCount} rows)</button>
        <p id="import-result"></p>
      `);

      document.getElementById('confirm-import-btn').addEventListener('click', async () => {
        const result = await WR.excel.importBudgetLines(mapped);
        document.getElementById('import-result').textContent =
          `Imported ${result.imported.length} rows. Skipped ${result.rejected.length} invalid rows.`;
      });
    }
  }

  WR.ui.renderExcel = renderExcel;
})();
