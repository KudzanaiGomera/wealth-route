// Transactions / Budget view: manage income, fixed, variable, savings and
// debt-payment lines for a selected month. Every cell is directly editable,
// sortable by column, category-taggable, and confirms before deleting.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const TYPE_LABELS = {
    income: 'Income',
    fixed: 'Fixed expense',
    variable: 'Variable expense',
    savings: 'Savings/Investment',
    debtPayment: 'Debt payment',
  };

  const SORTABLE_COLUMNS = [
    { field: 'type', label: 'Type' },
    { field: 'name', label: 'Name' },
    { field: 'categoryName', label: 'Category' },
    { field: 'budgetAmount', label: 'Budget' },
    { field: 'actualAmount', label: 'Actual' },
    { field: 'diff', label: 'Diff' },
  ];

  function typeOptions(selected) {
    return Object.entries(TYPE_LABELS)
      .map(([v, l]) => `<option value="${v}" ${v === selected ? 'selected' : ''}>${l}</option>`)
      .join('');
  }

  function categoryOptions(categories, selectedId) {
    return (
      `<option value="">\u2014 none \u2014</option>` +
      categories.map((c) => `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name}</option>`).join('')
    );
  }

  function sortLines(lines, categoriesById, sort) {
    const withDerived = lines.map((l) => ({
      ...l,
      categoryName: l.categoryId && categoriesById[l.categoryId] ? categoriesById[l.categoryId].name : '',
      diff: l.actualAmount - l.budgetAmount,
    }));
    withDerived.sort((a, b) => {
      const av = a[sort.field];
      const bv = b[sort.field];
      const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
      return sort.dir === 'asc' ? cmp : -cmp;
    });
    return withDerived;
  }

  async function renderTransactions(container) {
    const month = WR.ui._transactionsMonth || WR.ui.currentMonthKey();
    WR.ui._transactionsMonth = month;
    const sort = WR.ui._transactionsSort || { field: 'type', dir: 'asc' };
    WR.ui._transactionsSort = sort;

    const [lines, profile, categories] = await Promise.all([
      WR.queries.getBudgetLinesByMonth(month),
      WR.ui.getOrCreateProfile(),
      WR.repos.expenseCategories.getAll(),
    ]);
    const categoriesById = Object.fromEntries(categories.map((c) => [c.id, c]));

    const sortedLines = sortLines(lines, categoriesById, sort);

    const headerCells = SORTABLE_COLUMNS.map(
      (col) =>
        `<th class="sortable" data-sort-field="${col.field}">${col.label}${sort.field === col.field ? (sort.dir === 'asc' ? ' \u2191' : ' \u2193') : ''}</th>`,
    ).join('');

    const rows = sortedLines
      .map(
        (l) => `
      <tr data-id="${l.id}">
        <td><select class="cell" data-field="type">${typeOptions(l.type)}</select></td>
        <td><input class="cell" data-field="name" value="${l.name}"></td>
        <td><select class="cell" data-field="categoryId">${categoryOptions(categories, l.categoryId)}</select></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="budgetAmount" value="${l.budgetAmount}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="actualAmount" value="${l.actualAmount}"></td>
        <td class="num diff-cell">${WR.ui.fmt(l.diff)}</td>
        <td><button class="link-btn delete-line" data-id="${l.id}">Delete</button></td>
      </tr>`,
      )
      .join('');

    container.innerHTML = `
      <h1>Transactions</h1>
      <div class="toolbar">
        <label>Month:
          <input type="month" id="month-picker" value="${month}">
        </label>
      </div>
      <p class="fine-print">Edit any cell \u2014 changes save immediately. Click a column header to sort. Categories are managed in Settings.</p>

      <table class="data-table">
        <thead><tr>${headerCells}<th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="empty">No lines yet for this month \u2014 add one below.</td></tr>'}</tbody>
      </table>

      <h3>Add a line</h3>
      <form id="add-line-form" class="inline-form">
        <select name="type" required>${typeOptions()}</select>
        <input name="name" placeholder="Name (e.g. Salary, Rent)" required>
        <select name="categoryId">${categoryOptions(categories)}</select>
        <input name="budgetAmount" type="number" step="0.01" min="0" placeholder="Budget" required>
        <input name="actualAmount" type="number" step="0.01" min="0" placeholder="Actual" required>
        <button type="submit">Add</button>
      </form>
    `;

    document.getElementById('month-picker').addEventListener('change', (e) => {
      WR.ui._transactionsMonth = e.target.value;
      renderTransactions(container);
    });

    container.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        const field = th.dataset.sortField;
        if (sort.field === field) {
          sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          WR.ui._transactionsSort = { field, dir: 'asc' };
        }
        renderTransactions(container);
      });
    });

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const line = await WR.repos.budgetLines.getById(id);
          if (!line) return;
          const field = input.dataset.field;
          if (field === 'budgetAmount' || field === 'actualAmount') {
            line[field] = Math.max(0, parseFloat(input.value) || 0);
            input.value = line[field];
          } else if (field === 'categoryId') {
            line.categoryId = input.value || undefined;
          } else {
            line[field] = input.value;
          }
          await WR.repos.budgetLines.update(line);
          WR.ui.flashSaved(input);

          const diffCell = tr.querySelector('.diff-cell');
          if (diffCell) diffCell.textContent = WR.ui.fmt(line.actualAmount - line.budgetAmount);
        });
      });
    });

    container.querySelectorAll('.delete-line').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this transaction? This cannot be undone.')) return;
        await WR.repos.budgetLines.remove(btn.dataset.id);
        renderTransactions(container);
      });
    });

    document.getElementById('add-line-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const line = WR.models.createBudgetLine({
        month,
        type: form.type.value,
        name: form.name.value,
        categoryId: form.categoryId.value || undefined,
        budgetAmount: Math.max(0, parseFloat(form.budgetAmount.value) || 0),
        actualAmount: Math.max(0, parseFloat(form.actualAmount.value) || 0),
        currency: profile.baseCurrency,
      });
      await WR.repos.budgetLines.add(line);
      renderTransactions(container);
    });
  }

  WR.ui.renderTransactions = renderTransactions;
})();
// Debts view: manage debts (inline-editable), then run the
// avalanche/snowball/hybrid prioritisation engine with an adjustable extra
// payment. Editing a debt only re-renders the payoff projection section,
// not the whole table \u2014 so the row you're editing keeps focus.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const CURRENCIES = ['ZAR', 'USD', 'EUR', 'GBP'];

  function currencyOptions(selected) {
    return CURRENCIES.map((c) => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  }

  function computePayoffHtml(debts, strategy, extra, profile) {
    if (debts.length === 0) return '<p class="empty">Add a debt to see a payoff projection.</p>';

    let orderedDebts = [];
    if (strategy === 'avalanche') orderedDebts = WR.financial.orderDebtsAvalanche(debts);
    else if (strategy === 'snowball') orderedDebts = WR.financial.orderDebtsSnowball(debts);
    else orderedDebts = WR.financial.orderDebtsHybrid(debts);

    const saved = WR.financial.calculateInterestSaved(orderedDebts, extra);
    const orderList = saved.withExtra.payoffOrder
      .map((p, i) => `<li>${i + 1}. ${p.name} \u2014 paid off in ${p.monthsToPayoff ?? '50+ years (capped)'} months</li>`)
      .join('');

    return `
      <p><strong>Payoff order (${strategy}):</strong></p>
      <ol>${orderList}</ol>
      <p>Total time to debt-free: <strong>${saved.withExtra.months} months</strong> ${saved.monthsSaved > 0 ? `(${saved.monthsSaved} months sooner than paying only minimums)` : ''}</p>
      <p>Total interest paid: <strong>${profile.baseCurrency} ${WR.ui.fmt(saved.withExtra.totalInterestPaid)}</strong> ${saved.interestSaved > 0 ? `(${profile.baseCurrency} ${WR.ui.fmt(saved.interestSaved)} saved vs. minimums only)` : ''}</p>
      ${saved.withExtra.reachedSafetyCap ? '<p class="warning">This extra payment amount is not enough to ever clear the balance at the current interest rate \u2014 try a larger amount.</p>' : ''}
    `;
  }

  async function refreshPayoffSection(container) {
    const debts = await WR.repos.debts.getAll();
    const profile = await WR.ui.getOrCreateProfile();
    const strategy = WR.ui._debtStrategy || 'avalanche';
    const extra = WR.ui._debtExtra != null ? WR.ui._debtExtra : 0;
    const section = container.querySelector('.payoff-results');
    if (section) section.innerHTML = computePayoffHtml(debts, strategy, extra, profile);
  }

  async function renderDebts(container) {
    const debts = await WR.repos.debts.getAll();
    const profile = await WR.ui.getOrCreateProfile();
    const strategy = WR.ui._debtStrategy || 'avalanche';
    const extra = WR.ui._debtExtra != null ? WR.ui._debtExtra : 0;

    const rows = debts
      .map(
        (d) => `
      <tr data-id="${d.id}">
        <td><input class="cell" data-field="name" value="${d.name}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="currentBalance" value="${d.currentBalance}"></td>
        <td><select class="cell" data-field="currency">${currencyOptions(d.currency || profile.baseCurrency)}</select></td>
        <td><input class="cell num" type="number" step="0.1" min="0" data-field="interestRatePct" value="${(d.interestRate * 100).toFixed(2)}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="minPayment" value="${d.minPayment}"></td>
        <td><button class="link-btn delete-debt" data-id="${d.id}">Delete</button></td>
      </tr>`,
      )
      .join('');

    container.innerHTML = `
      <h1>Debts</h1>
      <p class="fine-print">Edit any cell \u2014 changes save immediately and update the payoff projection below.</p>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Balance</th><th>Currency</th><th>Interest rate %/yr</th><th>Min. payment</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">No debts recorded.</td></tr>'}</tbody>
      </table>

      <h3>Add a debt</h3>
      <form id="add-debt-form" class="inline-form">
        <input name="name" placeholder="Name (e.g. Credit Card)" required>
        <input name="currentBalance" type="number" step="0.01" min="0" placeholder="Current balance" required>
        <select name="currency">${currencyOptions(profile.baseCurrency)}</select>
        <input name="interestRate" type="number" step="0.1" min="0" placeholder="Interest rate % / year" required>
        <input name="minPayment" type="number" step="0.01" min="0" placeholder="Minimum payment" required>
        <button type="submit">Add</button>
      </form>

      <h2>Payoff Strategy</h2>
      <div class="toolbar">
        <label>Strategy:
          <select id="strategy-picker">
            <option value="avalanche" ${strategy === 'avalanche' ? 'selected' : ''}>Avalanche (highest interest first)</option>
            <option value="snowball" ${strategy === 'snowball' ? 'selected' : ''}>Snowball (smallest balance first)</option>
            <option value="hybrid" ${strategy === 'hybrid' ? 'selected' : ''}>Hybrid</option>
          </select>
        </label>
        <label>Extra monthly payment:
          <input type="number" id="extra-payment" step="10" min="0" value="${extra}">
        </label>
      </div>
      <div class="payoff-results">${computePayoffHtml(debts, strategy, extra, profile)}</div>
    `;

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const debt = await WR.repos.debts.getById(id);
          if (!debt) return;
          const field = input.dataset.field;
          if (field === 'interestRatePct') {
            debt.interestRate = Math.max(0, parseFloat(input.value) || 0) / 100;
          } else if (field === 'name' || field === 'currency') {
            debt[field] = input.value;
          } else {
            debt[field] = Math.max(0, parseFloat(input.value) || 0);
            input.value = debt[field];
          }
          await WR.repos.debts.update(debt);
          WR.ui.flashSaved(input);
          // Only the payoff projection needs to update \u2014 not the whole
          // table \u2014 so the row being edited doesn't lose focus.
          refreshPayoffSection(container);
        });

    container.querySelectorAll('.delete-debt').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this debt? This cannot be undone.')) return;
        await WR.repos.debts.remove(btn.dataset.id);

// Assets and Investments views. Both inline-editable, matching the pattern

// Forecast view: multi-year net worth projection. Every number here is
// explicitly labelled as a projection, never a promise.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  async function renderForecast(container) {
    const snapshot = await WR.ui.buildSnapshot();
    const params = WR.ui._forecastParams || {
      monthlyDebtPayment: Math.max(snapshot.cashflow.debtPayments, 0),
      monthlyInvestmentContribution: Math.max(snapshot.cashflow.savings, 0),
      debtInterestAnnual: snapshot.debts.length
        ? WR.financial.calculateWeightedAverageInterestRate(snapshot.debts)
        : 0,
      investmentReturnAnnual: snapshot.assumedInvestmentReturn,
      years: 10,
    };
    WR.ui._forecastParams = params;

    const forecast = WR.financial.forecastNetWorth(
      {
        currentNetWorth: snapshot.netWorth.netWorth,
        currentDebtTotal: snapshot.totalDebt,
        currentInvestmentTotal: snapshot.investments.reduce((sum, i) => sum + i.currentValue, 0),
        monthlyDebtPayment: params.monthlyDebtPayment,
        monthlyInvestmentContribution: params.monthlyInvestmentContribution,
        debtInterestAnnual: params.debtInterestAnnual,
        investmentReturnAnnual: params.investmentReturnAnnual,
      },
      params.years,
    );

    const chart = WR.charts.lineChart(
      forecast.map((f) => ({ label: `Yr ${f.year}`, value: f.netWorth })),
      { width: 500, height: 260 },
    );

    const rows = forecast
      .map(
        (f) => `<tr><td>Year ${f.year}</td><td class="num">${WR.ui.fmt(f.netWorth)}</td><td class="num">${WR.ui.fmt(f.debtBalance)}</td><td class="num">${WR.ui.fmt(f.investmentBalance)}</td></tr>`,
      )
      .join('');

    container.innerHTML = `
      <h1>Forecast</h1>
      <p class="fine-print">Projections based on the assumptions below \u2014 not guarantees. Actual results will differ. Anything except tagged investments (property, vehicles, etc.) is held constant, since projecting their future value would be pure speculation.</p>

      <form id="forecast-form" class="inline-form">
        <label>Years: <input type="number" name="years" value="${params.years}" min="1" max="20"></label>
        <label>Monthly debt payment: <input type="number" name="monthlyDebtPayment" value="${params.monthlyDebtPayment}" step="10"></label>
        <label>Debt interest rate %/yr: <input type="number" name="debtInterestAnnual" value="${(params.debtInterestAnnual * 100).toFixed(1)}" step="0.1"></label>
        <label>Monthly investment contribution: <input type="number" name="monthlyInvestmentContribution" value="${params.monthlyInvestmentContribution}" step="10"></label>
        <label>Assumed investment return %/yr: <input type="number" name="investmentReturnAnnual" value="${(params.investmentReturnAnnual * 100).toFixed(1)}" step="0.1"></label>

// Reports view: trend charts the Dashboard doesn't cover \u2014 income/expenses
// across every month on record, essential vs discretionary trend, net worth

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  async function renderReports(container) {
    container.innerHTML = '<p class="loading">Building your reports\u2026</p>';

    const [allBudgetLines, categories, netWorthHistory, profile] = await Promise.all([
      WR.repos.budgetLines.getAll(),
      WR.repos.expenseCategories.getAll(),
      WR.queries.getNetWorthHistory(),
      WR.ui.getOrCreateProfile(),
    ]);

    const monthly = WR.financial.aggregateMonthlyTotals(allBudgetLines);
    const currency = profile.baseCurrency;

    if (monthly.length === 0 && netWorthHistory.length === 0) {
      container.innerHTML = `
        <h1>Reports</h1>
        <p class="empty">No data yet \u2014 add some transactions on the Transactions tab, or record a net worth snapshot from the Dashboard, and reports will appear here.</p>
      `;
      return;
    }

    const incomeExpenseChart = WR.charts.barChart(
      monthly.flatMap((m) => [
        { label: `${m.month} In`, value: m.income },
        { label: `${m.month} Exp`, value: m.fixed + m.variable },
      ]),
      { width: 620, height: 240 },
    );

    const essentialDiscretionary = monthly.map((m) => {
      const linesForMonth = allBudgetLines.filter((l) => l.month === m.month);
      const split = WR.financial.calculateEssentialVsDiscretionary(linesForMonth, categories);
      return { month: m.month, ...split };
    });
    const spendSplitChart = WR.charts.barChart(
      essentialDiscretionary.flatMap((m) => [
        { label: `${m.month} Ess`, value: m.essential },
        { label: `${m.month} Disc`, value: m.discretionary },
      ]),
      { width: 620, height: 240 },
    );

    const assetsChart = WR.charts.lineChart(
      netWorthHistory.map((h) => ({ label: h.date, value: h.totalAssets })),
      { width: 460, height: 220 },
    );
    const liabilitiesChart = WR.charts.lineChart(
      netWorthHistory.map((h) => ({ label: h.date, value: h.totalLiabilities })),
      { width: 460, height: 220 },
    );

    const latestMonth = monthly.length ? monthly[monthly.length - 1].month : null;
    const latestMonthLines = latestMonth ? allBudgetLines.filter((l) => l.month === latestMonth) : [];
    const categorySpend = WR.financial.aggregateSpendingByCategory(latestMonthLines, categories);
    const categoryChart = WR.charts.barChart(
      categorySpend.map((c) => ({ label: c.label, value: c.value })),
      { width: 620, height: 240 },
    );

    container.innerHTML = `
      <h1>Reports</h1>
      <p class="fine-print">Built from every month you've entered data for \u2014 the more months you track, the more these trends tell you.</p>

      <h2>Income vs Expenses by Month</h2>
      <div class="chart-block">${monthly.length ? incomeExpenseChart : '<p class="empty">No transactions recorded yet.</p>'}</div>

      <h2>Essential vs Discretionary Spending by Month</h2>
      <p class="fine-print">Tag expense categories as essential/discretionary in Settings to make this accurate \u2014 untagged spending counts as discretionary.</p>
      <div class="chart-block">${monthly.length ? spendSplitChart : '<p class="empty">No transactions recorded yet.</p>'}</div>

      <h2>Spending by Category (${latestMonth || 'no data'})</h2>
      <div class="chart-block">${categorySpend.length ? categoryChart : '<p class="empty">No fixed/variable expenses recorded for the latest month.</p>'}</div>

      <h2>Assets &amp; Liabilities Over Time</h2>
      <div class="charts">
        <div class="chart-block"><h3>Total Assets (${currency})</h3>${assetsChart}</div>
        <div class="chart-block"><h3>Total Liabilities (${currency})</h3>${liabilitiesChart}</div>
      </div>
      <p class="fine-print">Record a net worth snapshot from the Dashboard each time your numbers change to build this history.</p>
    `;
  }

  WR.ui.renderReports = renderReports;
})();
// Spreadsheet editor: every budget line, across every month, in one
// editable table. Edits write directly to the same IndexedDB store the
// dashboard reads from \u2014 there's no separate "spreadsheet data" to keep in
// sync, by design (see Sprint 0 notes on the spreadsheet/model sync problem).

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const TYPES = ['income', 'fixed', 'variable', 'savings', 'debtPayment'];

  function categoryOptions(categories, selectedId) {
    return (
      `<option value="">\u2014 none \u2014</option>` +
      categories.map((c) => `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name}</option>`).join('')
    );
  }

  async function renderSpreadsheet(container) {
    const [allLines, profile, categories] = await Promise.all([
      WR.repos.budgetLines.getAll(),
      WR.ui.getOrCreateProfile(),
      WR.repos.expenseCategories.getAll(),
    ]);
    const lines = allLines.sort((a, b) => (a.month < b.month ? 1 : -1) || a.type.localeCompare(b.type));

    const rows = lines
      .map(
        (l) => `
      <tr data-id="${l.id}">
        <td><input type="month" class="cell" data-field="month" value="${l.month}"></td>
        <td>
          <select class="cell" data-field="type">
            ${TYPES.map((t) => `<option value="${t}" ${t === l.type ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </td>
        <td><input class="cell" data-field="name" value="${l.name}"></td>
        <td><select class="cell" data-field="categoryId">${categoryOptions(categories, l.categoryId)}</select></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="budgetAmount" value="${l.budgetAmount}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="actualAmount" value="${l.actualAmount}"></td>
        <td><button class="link-btn delete-row" data-id="${l.id}">Delete</button></td>
      </tr>`,
      )
      .join('');

    container.innerHTML = `
      <h1>Spreadsheet</h1>
      <p class="fine-print">Edit any cell \u2014 changes save immediately and the Dashboard updates to match.</p>
      <table class="data-table spreadsheet">
        <thead><tr><th>Month</th><th>Type</th><th>Name</th><th>Category</th><th>Budget</th><th>Actual</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="empty">No budget lines yet.</td></tr>'}</tbody>
      </table>

      <h3>Add a row</h3>
      <form id="add-row-form" class="inline-form">
        <input type="month" name="month" value="${WR.ui.currentMonthKey()}" required>
        <select name="type">${TYPES.map((t) => `<option value="${t}">${t}</option>`).join('')}</select>
        <input name="name" placeholder="Name" required>
        <select name="categoryId">${categoryOptions(categories)}</select>
        <input name="budgetAmount" type="number" step="0.01" min="0" placeholder="Budget" required>
        <input name="actualAmount" type="number" step="0.01" min="0" placeholder="Actual" required>
        <button type="submit">Add</button>
      </form>
    `;

    // Save on change, per cell \u2014 no separate "save" button, matching the
    // "spreadsheet and financial model stay synchronised" requirement.
    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const line = await WR.repos.budgetLines.getById(id);
          if (!line) return;
          const field = input.dataset.field;
          if (field === 'budgetAmount' || field === 'actualAmount') {
            line[field] = Math.max(0, parseFloat(input.value) || 0);
            input.value = line[field];
          } else if (field === 'categoryId') {
            line.categoryId = input.value || undefined;
          } else {
            line[field] = input.value;
          }
          await WR.repos.budgetLines.update(line);
          WR.ui.flashSaved(input);
        });
      });
    });

    container.querySelectorAll('.delete-row').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this row? This cannot be undone.')) return;
        await WR.repos.budgetLines.remove(btn.dataset.id);
        renderSpreadsheet(container);
      });
    });

    document.getElementById('add-row-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const line = WR.models.createBudgetLine({
        month: form.month.value,
        type: form.type.value,
        name: form.name.value,
        categoryId: form.categoryId.value || undefined,
        budgetAmount: Math.max(0, parseFloat(form.budgetAmount.value) || 0),
        actualAmount: Math.max(0, parseFloat(form.actualAmount.value) || 0),
        currency: profile.baseCurrency,
      });
      await WR.repos.budgetLines.add(line);
      renderSpreadsheet(container);
    });
  }

  WR.ui.renderSpreadsheet = renderSpreadsheet;
})();

      <section>
        <h2>Export</h2>
        <p class="fine-print">Downloads all current WealthRoute data as a new workbook (one sheet per data type). This does not reproduce the original 16-sheet template layout \u2014 it exports WealthRoute's own data model.</p>
        <button id="export-btn">Export to Excel</button>
      </section>
    `;

    document.getElementById('export-btn').addEventListener('click', async () => {
      if (typeof XLSX === 'undefined') {
        alert('Excel library failed to load \u2014 check your internet connection and reload the page.');
        return;
      }
      await WR.excel.exportWorkbook();
    });

      if (typeof XLSX === 'undefined') {

        return;

      const buffer = await file.arrayBuffer();
      state.workbook = WR.excel.parseWorkbook(buffer);
      const sheetNames = WR.excel.getSheetNames(state.workbook);
      renderSheetPicker(sheetNames);
    });

    function renderSheetPicker(sheetNames) {
      const workflow = document.getElementById('import-workflow');
      workflow.innerHTML = `
        <div class="toolbar">
          <label>Sheet: <select id="sheet-picker">${sheetNames.map((n) => `<option value="${n}">${n}</option>`).join('')}</select></label>
          <label>Header row: <input type="number" id="header-row-input" min="1" value="1" style="width:4.5em"></label>
        </div>
        <p class="fine-print">If a sheet has its column headers somewhere other than the first row \u2014 common in sheets with a title or multiple tables \u2014 set the header row number above and the columns will refresh.</p>
        <div id="mapping-area"></div>
      `;
      document.getElementById('sheet-picker').addEventListener('change', (e) => {
        document.getElementById('header-row-input').value = 1;
        loadSheet(e.target.value, 0);
      });
      document.getElementById('header-row-input').addEventListener('change', (e) => {
        const rowNum = Math.max(1, parseInt(e.target.value, 10) || 1);
        e.target.value = rowNum;
        loadSheet(state.sheetName, rowNum - 1); // convert 1-indexed display to 0-indexed
      });
      loadSheet(sheetNames[0], 0);
    }

    function loadSheet(sheetName, headerRowIndex) {
      state.sheetName = sheetName;
      state.headerRowIndex = headerRowIndex;
      const { headers, rows } = WR.excel.readSheetRows(state.workbook, sheetName, headerRowIndex);
      state.headers = headers;
      state.rawRows = rows;

      const mappingArea = document.getElementById('mapping-area');
      if (rows.length === 0) {
        mappingArea.innerHTML = `<p class="warning">No data rows found below this header row \u2014 try a different header row number.</p>`;
        return;
      }

      mappingArea.innerHTML = `
        ${fieldMappingForm(headers)}
        <button id="preview-btn">Preview</button>
        <div id="preview-area"></div>
      `;
      document.getElementById('preview-btn').addEventListener('click', renderPreview);
    }

    function currentMapping() {
      return {
        mapping: { name: document.getElementById('map-name').value, amount: document.getElementById('map-amount').value },
        constants: {
          type: document.getElementById('map-type-constant').value,
          month: document.getElementById('map-month-constant').value,
        },
      };
    }

    function renderPreview() {
      const { mapping, constants } = currentMapping();

      if (!mapping.name || !mapping.amount) {
        document.getElementById('preview-area').innerHTML =
          '<p class="warning">Map both a Name/Description column and an Amount column before previewing.</p>';
        return;
      }

      const mapped = WR.excel.applyMapping(state.rawRows, mapping, constants);
      const withProblems = mapped.map((row) => ({ row, problems: WR.excel.validateImportRow(row) }));
      const validCount = withProblems.filter((r) => r.problems.length === 0).length;

      const rowsHtml = withProblems
        .slice(0, 25)
        .map(
          ({ row, problems }) => `
        <tr class="${problems.length ? 'invalid-row' : ''}">
          <td>${row.name ?? ''}</td>
          <td class="num">${row.amount ?? ''}</td>
          <td>${row.type ?? ''}</td>
          <td>${row.month ?? ''}</td>
          <td>${problems.join('; ')}</td>
        </tr>`,
        )
        .join('');

      document.getElementById('preview-area').innerHTML = `
        <p><strong>${validCount}</strong> of <strong>${mapped.length}</strong> rows are valid and will be imported. Showing first 25 rows below.</p>
        <table class="data-table">
          <thead><tr><th>Name</th><th>Amount</th><th>Type</th><th>Month</th><th>Problems</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <button id="confirm-import-btn" ${validCount === 0 ? 'disabled' : ''}>Confirm Import (${validCount} rows)</button>
        <p id="import-result"></p>
      `;

      document.getElementById('confirm-import-btn').addEventListener('click', async () => {
        const result = await WR.excel.importBudgetLines(mapped);
        document.getElementById('import-result').textContent =
          `Imported ${result.imported.length} rows. Skipped ${result.rejected.length} invalid rows.`;
      });
    }
  }

  WR.ui.renderExcel = renderExcel;
})();
// Settings view: base currency, country, emergency fund target, assumed
// investment return, JSON backup/restore/reset, and the optional AI
// assistant API key (stored locally only, never sent anywhere but
// Anthropic's API when you actually use the assistant).

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  async function exportBackup() {
    const data = {};
    for (const [name, repo] of Object.entries(WR.repos)) {
      data[name] = await repo.getAll();
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wealthroute-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function importBackup(jsonText) {
    const data = JSON.parse(jsonText);
    for (const [name, repo] of Object.entries(WR.repos)) {
      if (Array.isArray(data[name])) {
        await repo.clear();
        for (const item of data[name]) await repo.add(item);
      }
    }
  }

  async function resetAllData() {
    for (const repo of Object.values(WR.repos)) await repo.clear();
  }

  async function renderSettings(container) {
    const profile = await WR.ui.getOrCreateProfile();
    const apiKey = localStorage.getItem('wr_anthropic_api_key') || '';

    container.innerHTML = `
      <h1>Settings</h1>

      <section>
        <h2>Profile & Assumptions</h2>
        <form id="profile-form" class="stacked-form">
          <label>Display name (optional, shown in your Dashboard greeting only):
            <input name="displayName" value="${profile.displayName || ''}" placeholder="e.g. Kudzanai" maxlength="60">
          </label>
          <label>Base currency:
            <select name="baseCurrency">
              ${['ZAR', 'USD', 'EUR', 'GBP'].map((c) => `<option value="${c}" ${c === profile.baseCurrency ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
          </label>
          <label>Country: <input name="country" value="${profile.country}"></label>
          <label>Emergency fund target (months): <input name="emergencyFundTargetMonths" type="number" step="0.5" value="${profile.emergencyFundTargetMonths}"></label>
          <label>Assumed investment return (%/year): <input name="assumedInvestmentReturn" type="number" step="0.1" value="${((profile.assumedInvestmentReturn || 0.08) * 100).toFixed(1)}"></label>
          <label>Risk profile:
            <select name="riskProfile">
              ${['conservative', 'moderate', 'aggressive'].map((r) => `<option value="${r}" ${r === profile.riskProfile ? 'selected' : ''}>${r}</option>`).join('')}
            </select>
          </label>
          <button type="submit">Save</button>
        </form>
      </section>

      <section>
        <h2>Exchange Rates</h2>
        <p class="fine-print">Manually entered \u2014 no live rate lookup in this version. Needed if you hold assets in more than one currency.</p>
        <div id="rates-list"></div>
        <form id="rate-form" class="inline-form">
          <input name="fromCurrency" placeholder="From (e.g. USD)" maxlength="3" required>
          <input name="toCurrency" placeholder="To (e.g. ZAR)" maxlength="3" required>
          <input name="rate" type="number" step="0.0001" placeholder="Rate" required>
          <button type="submit">Add rate</button>
        </form>
      </section>

      <section>
        <h2>Expense Categories</h2>
        <p class="fine-print">
          Tag your fixed and variable expenses as essential or discretionary here, then assign them to
          transactions on the Transactions or Spreadsheet tabs. This drives the emergency fund calculation
          (essential expenses only) and the "discretionary spending increased" recommendation \u2014 without any
          categories tagged, those fall back to rough approximations.
        </p>
        <div id="categories-list"></div>
        <form id="category-form" class="inline-form">
          <input name="name" placeholder="Category name (e.g. Groceries, Rent)" required>
          <select name="type">
            <option value="fixed">Fixed</option>
            <option value="variable">Variable</option>
          </select>
          <label><input type="checkbox" name="essential" checked> Essential</label>
          <button type="submit">Add category</button>
        </form>
      </section>

      <section>
        <h2>Data Management</h2>
        <button id="export-backup-btn">Export backup (JSON)</button>
        <label class="file-label">Restore from backup:
          <input type="file" id="restore-input" accept=".json">
        </label>
        <button id="reset-btn" class="danger">Delete all data</button>
      </section>

      <section>
        <h2>Wealth Assistant (optional)</h2>
        <p class="fine-print">
          Off by default. This app has no server, so there's no safe place to store an API key on your behalf \u2014
          if you enable this, you're pasting in your own Anthropic API key, which is stored only in this browser's
          local storage and sent directly from your browser to Anthropic's API when you ask a question. This is not
          free \u2014 it uses your own Anthropic API usage/billing. Never share this key; anyone with it can use your
          API quota.
        </p>
        <form id="api-key-form" class="inline-form">
          <input type="password" id="api-key-input" placeholder="sk-ant-\u2026" value="${apiKey}">
          <button type="submit">Save key</button>
          <button type="button" id="clear-key-btn" class="secondary">Clear key</button>
        </form>
      </section>
    `;

    async function renderCategories() {
      const categories = await WR.repos.expenseCategories.getAll();
      document.getElementById('categories-list').innerHTML = categories.length
        ? `<table class="data-table"><thead><tr><th>Name</th><th>Type</th><th>Essential</th><th></th></tr></thead><tbody>${categories
            .map(
              (c) =>
                `<tr><td>${c.name}</td><td>${c.type}</td><td>${c.essential ? 'Yes' : 'No'}</td><td><button class="link-btn delete-category" data-id="${c.id}">Delete</button></td></tr>`,
            )
            .join('')}</tbody></table>`
        : '<p class="empty">No categories yet \u2014 add one below.</p>';
      document.querySelectorAll('.delete-category').forEach((btn) =>
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this category? Transactions already tagged with it keep their tag, but it will no longer appear in the picker.')) return;
          await WR.repos.expenseCategories.remove(btn.dataset.id);
          renderCategories();
        }),
      );
    }
    renderCategories();

    document.getElementById('category-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const category = WR.models.createExpenseCategory({
        name: form.name.value,
        type: form.type.value,
        essential: form.essential.checked,
      });
      await WR.repos.expenseCategories.add(category);
      form.reset();
      form.essential.checked = true;
      renderCategories();
    });

    async function renderRates() {
      const rates = await WR.repos.exchangeRates.getAll();
      document.getElementById('rates-list').innerHTML = rates.length
        ? `<ul>${rates.map((r) => `<li>1 ${r.fromCurrency} = ${r.rate} ${r.toCurrency} <button class="link-btn delete-rate" data-id="${r.id}">Delete</button></li>`).join('')}</ul>`
        : '<p class="empty">No exchange rates yet.</p>';
      document.querySelectorAll('.delete-rate').forEach((btn) =>
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this exchange rate?')) return;
          await WR.repos.exchangeRates.remove(btn.dataset.id);
          renderRates();
        }),
      );
    }
    renderRates();

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const updated = {
        ...profile,
        displayName: form.displayName.value.trim(),
        baseCurrency: form.baseCurrency.value,
        country: form.country.value,
        emergencyFundTargetMonths: parseFloat(form.emergencyFundTargetMonths.value) || 3,
        assumedInvestmentReturn: (parseFloat(form.assumedInvestmentReturn.value) || 8) / 100,
        riskProfile: form.riskProfile.value,
      };
      await WR.repos.userProfile.update(updated);
      alert('Saved.');
    });

    document.getElementById('rate-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const rate = WR.models.createExchangeRate({
        fromCurrency: form.fromCurrency.value.toUpperCase(),
        toCurrency: form.toCurrency.value.toUpperCase(),
        rate: parseFloat(form.rate.value),
        date: new Date().toISOString().slice(0, 10),
      });
      await WR.repos.exchangeRates.add(rate);
      form.reset();
      renderRates();
    });

    document.getElementById('export-backup-btn').addEventListener('click', exportBackup);

    document.getElementById('restore-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!confirm('This replaces all current data with the backup file. Continue?')) return;
      const text = await file.text();
      await importBackup(text);
      alert('Backup restored.');
      renderSettings(container);
    });

    document.getElementById('reset-btn').addEventListener('click', async () => {
      if (!confirm('This permanently deletes all WealthRoute data in this browser. This cannot be undone. Continue?')) return;
      await resetAllData();
      alert('All data deleted.');
      renderSettings(container);
    });

    document.getElementById('api-key-form').addEventListener('submit', (e) => {
      e.preventDefault();
      localStorage.setItem('wr_anthropic_api_key', document.getElementById('api-key-input').value.trim());
      alert('Key saved locally.');
    });
    document.getElementById('clear-key-btn').addEventListener('click', () => {
      localStorage.removeItem('wr_anthropic_api_key');
      document.getElementById('api-key-input').value = '';
      alert('Key cleared.');
    });
  }

  WR.ui.renderSettings = renderSettings;
  WR.ui.exportBackup = exportBackup;
  WR.ui.importBackup = importBackup;
  WR.ui.resetAllData = resetAllData;
})();
// Wealth Assistant: sends the already-computed FinancialSnapshot (not raw
// data, not permission to act) to Anthropic's API along with the user's
// question, using their own API key. The model only ever explains numbers
// the deterministic engine already produced \u2014 it cannot change any stored
// data, per the "AI explains, engine calculates" separation from the brief.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const MODEL = 'claude-sonnet-5';

  function snapshotForPrompt(s) {
    // A trimmed, explicitly-labelled version of the snapshot \u2014 numbers only,
    // no raw transaction-level detail, so the model has exactly what it
    // needs to explain the dashboard and nothing it could use to invent
    // detail that isn't there.
    return {
      month: s.month,
      baseCurrency: s.profile.baseCurrency,
      monthlyIncome: s.income,
      monthlyExpenses: s.cashflow.totalExpenses,
      availableSurplus: s.availableSurplus,
      savingsRate: s.savingsRate,
      totalDebt: s.totalDebt,
      debtToIncomeRatio: s.debtToIncomeRatio,
      highestInterestDebt: s.highestInterestDebt
        ? { name: s.highestInterestDebt.name, interestRate: s.highestInterestDebt.interestRate, balance: s.highestInterestDebt.currentBalance }
        : null,
      emergencyFundMonths: s.emergencyFundMonths,
      emergencyFundTargetMonths: s.emergencyFundTargetMonths,
      netWorth: s.netWorth.netWorth,
      totalAssets: s.netWorth.totalAssets,
      totalLiabilities: s.netWorth.totalLiabilities,
      assumedInvestmentReturn: s.assumedInvestmentReturn,
      investmentReadiness: s.investmentReadiness,
      financialHealthScore: s.healthScore.score,
      currentRecommendations: s.recommendations.map((r) => ({ title: r.title, priority: r.priority, reason: r.reason })),
    };
  }

  async function askAssistant(apiKey, question, snapshot) {
    const systemPrompt =
      'You are the Wealth Assistant inside WealthRoute, a personal finance app. ' +
      'You are given a JSON snapshot of numbers WealthRoute\u2019s own calculation engine already computed. ' +
      'Explain and answer using only these numbers \u2014 do not invent figures that are not present. ' +
      'You are not a licensed financial adviser; be clear this is general educational information, not personalised financial advice. ' +
      'Never state investment returns as guaranteed. Keep answers concise and concrete.';

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        system: systemPrompt,
        messages: [
          {
            role: 'user',
            content: `Financial snapshot:\n${JSON.stringify(snapshotForPrompt(snapshot), null, 2)}\n\nQuestion: ${question}`,
          },
        ],
      }),
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API error ${response.status}: ${errText}`);
    }
    const data = await response.json();
    return data.content
      .filter((block) => block.type === 'text')
      .map((block) => block.text)
      .join('\n');
  }

  async function renderAssistant(container) {
    const apiKey = localStorage.getItem('wr_anthropic_api_key') || '';

    container.innerHTML = `
      <h1>Wealth Assistant</h1>
      ${
        apiKey
          ? `<p class="fine-print">Answers use only the numbers already shown on your Dashboard. General information, not personalised financial advice.</p>
             <form id="ask-form" class="stacked-form">
               <textarea id="question-input" rows="2" placeholder="e.g. Should I pay debt or invest right now?" required></textarea>
               <button type="submit">Ask</button>
             </form>
             <div id="answer-area"></div>`
          : `<p class="empty">No API key configured. Add your own Anthropic API key in Settings to enable this \u2014 it's optional and off by default.</p>`
      }
    `;

    if (!apiKey) return;

    document.getElementById('ask-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = document.getElementById('question-input').value.trim();
      if (!question) return;
      const answerArea = document.getElementById('answer-area');
      answerArea.innerHTML = '<p class="loading">Thinking\u2026</p>';
      try {
        const snapshot = await WR.ui.buildSnapshot();
        const answer = await askAssistant(apiKey, question, snapshot);
        answerArea.innerHTML = `<div class="assistant-answer">${answer.replace(/\n/g, '<br>')}</div>`;
      } catch (err) {
        answerArea.innerHTML = `<p class="warning">Something went wrong: ${err.message}</p>`;
      }
    });
  }

  WR.ui.renderAssistant = renderAssistant;
  WR.ui._askAssistant = askAssistant; // exposed for testing snapshotForPrompt indirectly
  WR.ui._snapshotForPrompt = snapshotForPrompt;
})();
// Hash-based router. No history API complexity needed for a single-page
// local app \u2014 #/dashboard, #/transactions, etc. map directly to render
// functions.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const ROUTES = {
    '#/dashboard': 'renderDashboard',
    '#/transactions': 'renderTransactions',
    '#/debts': 'renderDebts',
    '#/assets': 'renderAssets',
    '#/investments': 'renderInvestments',
    '#/forecast': 'renderForecast',
    '#/reports': 'renderReports',
    '#/spreadsheet': 'renderSpreadsheet',
    '#/excel': 'renderExcel',
    '#/assistant': 'renderAssistant',
    '#/settings': 'renderSettings',
  };

  async function handleRoute() {
    const hash = window.location.hash || '#/dashboard';
    const renderFnName = ROUTES[hash] || 'renderDashboard';
    WR.ui.setActiveNav(ROUTES[hash] ? hash : '#/dashboard');

    const content = document.getElementById('content');
    try {
      await WR.ui[renderFnName](content);
    } catch (err) {
      content.innerHTML = `<p class="warning">Something went wrong loading this page: ${err.message}</p>`;
      console.error(err);
    }
  }

  function initRouter() {
    window.addEventListener('hashchange', handleRoute);
    if (!window.location.hash) window.location.hash = '#/dashboard';
    handleRoute();
  }

  WR.ui.initRouter = initRouter;
})();
document.addEventListener('DOMContentLoaded', () => {
  WR.ui.renderShell();
  WR.ui.initRouter();
});

    </script>
