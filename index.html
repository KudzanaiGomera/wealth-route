// Variable Expenses view: manage variable expenses for a selected month.
// Every cell is directly editable,
// sortable by column, category-taggable, and confirms before deleting.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const SORTABLE_COLUMNS = [
    { field: 'name', label: 'Name' },
    { field: 'categoryName', label: 'Category' },
    { field: 'budgetAmount', label: 'Budget' },
    { field: 'actualAmount', label: 'Actual' },
    { field: 'diff', label: 'Diff' },
  ];

  function categoryOptions(categories, selectedId) {
    return (
      `<option value="">\u2014 none \u2014</option>` +
      categories.map((c) => `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name}</option>`).join('')
    );
  }

  function sortLines(lines, categoriesById, sort) {
    const withDerived = lines.map((l) => ({
      ...l,
      categoryName: l.categoryId && categoriesById[l.categoryId] ? categoriesById[l.categoryId].name : '',
      diff: l.actualAmount - l.budgetAmount,
    }));
    withDerived.sort((a, b) => {
      const av = a[sort.field];
      const bv = b[sort.field];
      const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
      return sort.dir === 'asc' ? cmp : -cmp;
    });
    return withDerived;
  }

  async function renderTransactions(container) {
    const month = WR.ui._transactionsMonth || WR.ui.currentMonthKey();
    WR.ui._transactionsMonth = month;
    const sort = WR.ui._transactionsSort || { field: 'type', dir: 'asc' };
    WR.ui._transactionsSort = sort;

    const [lines, profile, categories] = await Promise.all([
      WR.queries.getBudgetLinesByMonth(month),
      WR.ui.getOrCreateProfile(),
      WR.repos.expenseCategories.getAll(),
    ]);
    const variableCategories = categories.filter((category) => category.type === 'variable');
    const categoriesById = Object.fromEntries(variableCategories.map((c) => [c.id, c]));

    const sortedLines = sortLines(lines.filter((line) => line.type === 'variable'), categoriesById, sort);
    const totalBudget = sortedLines.reduce((sum, l) => sum + l.budgetAmount, 0);
    const totalActual = sortedLines.reduce((sum, l) => sum + l.actualAmount, 0);

    const headerCells = SORTABLE_COLUMNS.map(
      (col) =>
        `<th class="sortable" data-sort-field="${col.field}">${col.label}${sort.field === col.field ? (sort.dir === 'asc' ? ' \u2191' : ' \u2193') : ''}</th>`,
    ).join('');

    const rows = sortedLines
      .map(
        (l) => `
      <tr data-id="${l.id}">
        <td><input class="cell" data-field="name" value="${l.name}"></td>
        <td><select class="cell" data-field="categoryId">${categoryOptions(variableCategories, l.categoryId)}</select></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="budgetAmount" value="${l.budgetAmount}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="actualAmount" value="${l.actualAmount}"></td>
        <td class="num diff-cell">${WR.ui.fmt(l.diff)}</td>
        <td><button class="link-btn delete-line" data-id="${l.id}">Delete</button></td>
      </tr>`,
      )
      .join('');

    container.innerHTML = `
      <h1>Variable Expenses</h1>
      <div class="toolbar">
        <label>Month:
          <input type="month" id="month-picker" value="${month}">
        </label>
      </div>
      <p class="fine-print">Plan and record variable expenses for the selected month. Changes save immediately.</p>

      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Total Budgeted</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(totalBudget)}</span></div>
        <div class="stat"><span class="stat-label">Total Actual</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(totalActual)}</span></div>
        <div class="stat"><span class="stat-label">Difference</span><span class="stat-value ${totalActual - totalBudget > 0 ? 'negative' : ''}">${profile.baseCurrency} ${WR.ui.fmt(totalActual - totalBudget)}</span></div>
      </div>

      <table class="data-table">
        <thead><tr>${headerCells}<th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">No variable expenses yet for this month \u2014 add one below.</td></tr>'}</tbody>
      </table>

      <h3>Add a line</h3>
      <form id="add-line-form" class="inline-form">
        <input name="name" placeholder="Name (e.g. Groceries)" required>
        <select name="categoryId">${categoryOptions(variableCategories)}</select>
        <input name="budgetAmount" type="number" step="0.01" min="0" placeholder="Budget" required>
        <input name="actualAmount" type="number" step="0.01" min="0" placeholder="Actual" required>
        <button type="submit">Add</button>
      </form>
    `;

    document.getElementById('month-picker').addEventListener('change', (e) => {
      WR.ui._transactionsMonth = e.target.value;
      renderTransactions(container);
    });

    container.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        const field = th.dataset.sortField;
        if (sort.field === field) {
          sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          WR.ui._transactionsSort = { field, dir: 'asc' };
        }
        renderTransactions(container);
      });
    });

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const line = await WR.repos.budgetLines.getById(id);
          if (!line) return;
          const field = input.dataset.field;
          if (field === 'budgetAmount' || field === 'actualAmount') {
            line[field] = Math.max(0, parseFloat(input.value) || 0);
            input.value = line[field];
          } else if (field === 'categoryId') {
            line.categoryId = input.value || undefined;
          } else {
            line[field] = input.value;
          }
          await WR.repos.budgetLines.update(line);
          WR.ui.flashSaved(input);

          const diffCell = tr.querySelector('.diff-cell');
          if (diffCell) diffCell.textContent = WR.ui.fmt(line.actualAmount - line.budgetAmount);
        });
      });
    });

    container.querySelectorAll('.delete-line').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this transaction? This cannot be undone.')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.budgetLines,
          id: btn.dataset.id,
          entityLabel: 'Transaction',
          afterChange: async () => { await renderTransactions(container); },
        });
      });
    });

    document.getElementById('add-line-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const line = WR.models.createBudgetLine({
        month,
        type: 'variable',
        name: form.name.value,
        categoryId: form.categoryId.value || undefined,
        budgetAmount: Math.max(0, parseFloat(form.budgetAmount.value) || 0),
        actualAmount: Math.max(0, parseFloat(form.actualAmount.value) || 0),
        currency: profile.baseCurrency,
      });
      await WR.repos.budgetLines.add(line);
      renderTransactions(container);
    });
  }

  async function renderSavings(container) {
    const month = WR.ui._savingsMonth || WR.ui.currentMonthKey();
    WR.ui._savingsMonth = month;

    const [lines, profile] = await Promise.all([
      WR.queries.getBudgetLinesByMonth(month),
      WR.ui.getOrCreateProfile(),
    ]);
    const savings = lines
      .filter((line) => line.type === 'savings')
      .sort((a, b) => a.name.localeCompare(b.name));
    const totalPlanned = savings.reduce((sum, l) => sum + l.budgetAmount, 0);
    const totalSaved = savings.reduce((sum, l) => sum + l.actualAmount, 0);

    const rows = savings.map((line) => `
      <tr data-id="${line.id}">
        <td><input class="cell" data-field="name" value="${line.name}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="budgetAmount" value="${line.budgetAmount}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="actualAmount" value="${line.actualAmount}"></td>
        <td class="num diff-cell">${WR.ui.fmt(line.actualAmount - line.budgetAmount)}</td>
        <td><button class="link-btn delete-saving" data-id="${line.id}">Delete</button></td>
      </tr>
    `).join('');

    container.innerHTML = `
      <h1>Savings</h1>
      <div class="toolbar">
        <label>Month:
          <input type="month" id="savings-month-picker" value="${month}">
        </label>
      </div>
      <p class="fine-print">Record planned and actual savings for each account or goal.</p>

      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Total Planned</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(totalPlanned)}</span></div>
        <div class="stat"><span class="stat-label">Total Saved</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(totalSaved)}</span></div>
      </div>

      <table class="data-table">
        <thead><tr><th>Name</th><th>Planned</th><th>Saved</th><th>Difference</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="empty">No savings recorded for this month.</td></tr>'}</tbody>
      </table>

      <h3>Add savings</h3>
      <form id="add-saving-form" class="inline-form">
        <input name="name" placeholder="Name (e.g. Emergency fund)" required>
        <input name="budgetAmount" type="number" step="0.01" min="0" placeholder="Planned" required>
        <input name="actualAmount" type="number" step="0.01" min="0" placeholder="Saved" required>
        <button type="submit">Add</button>
      </form>
    `;

    document.getElementById('savings-month-picker').addEventListener('change', (event) => {
      WR.ui._savingsMonth = event.target.value;
      renderSavings(container);
    });

    container.querySelectorAll('tbody tr[data-id]').forEach((row) => {
      row.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const line = await WR.repos.budgetLines.getById(row.dataset.id);
          if (!line) return;
          const field = input.dataset.field;
          line[field] = field === 'name' ? input.value : Math.max(0, parseFloat(input.value) || 0);
          input.value = line[field];
          await WR.repos.budgetLines.update(line);
          WR.ui.flashSaved(input);
          row.querySelector('.diff-cell').textContent = WR.ui.fmt(line.actualAmount - line.budgetAmount);
        });
      });
    });

    container.querySelectorAll('.delete-saving').forEach((button) => {
      button.addEventListener('click', async () => {
        if (!confirm('Delete this savings record?')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.budgetLines,
          id: button.dataset.id,
          entityLabel: 'Savings record',
          afterChange: async () => { await renderSavings(container); },
        });
      });
    });

    document.getElementById('add-saving-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      await WR.repos.budgetLines.add(WR.models.createBudgetLine({
        month,
        type: 'savings',
        name: form.name.value,
        budgetAmount: Math.max(0, parseFloat(form.budgetAmount.value) || 0),
        actualAmount: Math.max(0, parseFloat(form.actualAmount.value) || 0),
        currency: profile.baseCurrency,
      }));
      renderSavings(container);
    });
  }

  WR.ui.renderTransactions = renderTransactions;
  WR.ui.renderSavings = renderSavings;
})();
// Dedicated pages for recurring income/fixed expenses, emergency fund,
// day-to-day money, and financial insights.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const RECURRING_FREQUENCIES = ['weekly', 'biweekly', 'monthly', 'quarterly', 'yearly'];

  function recurringFrequencyOptions(selected) {
    return RECURRING_FREQUENCIES
      .map((frequency) => `<option value="${frequency}" ${frequency === selected ? 'selected' : ''}>${frequency}</option>`)
      .join('');
  }

  function categoryOptions(categories, selectedId, type) {
    const filtered = (categories || []).filter((category) => !type || category.type === type);
    return `<option value="">— none —</option>${filtered.map((category) => `<option value="${category.id}" ${category.id === selectedId ? 'selected' : ''}>${category.name}</option>`).join('')}`;
  }

  function isMonthRangeValid(startMonth, endMonth) {
    if (!startMonth || !endMonth) return true;
    return String(startMonth) <= String(endMonth);
  }

  async function renderIncome(container) {
    const [profile, incomes] = await Promise.all([
      WR.ui.getOrCreateProfile(),
      WR.repos.incomeSources.getAll(),
    ]);
    const year = WR.ui._incomeYear || new Date().getFullYear();
    WR.ui._incomeYear = year;

    const rows = incomes
      .filter((item) => Number(item.year || year) === year)
      .sort((a, b) => a.name.localeCompare(b.name))
      .map((item) => `
        <tr data-id="${item.id}">
          <td><input class="cell" data-field="name" value="${item.name || ''}"></td>
          <td><input class="cell num" data-field="amount" type="number" step="0.01" min="0" value="${item.amount || 0}"></td>
          <td><select class="cell" data-field="frequency">${recurringFrequencyOptions(item.frequency || 'monthly')}</select></td>
          <td><input class="cell" data-field="startMonth" type="month" value="${item.startMonth || `${year}-01`}"></td>
          <td><input class="cell" data-field="endMonth" type="month" value="${item.endMonth || `${year}-12`}"></td>
          <td><button class="link-btn delete-income" data-id="${item.id}">Delete</button></td>
        </tr>`)
      .join('');
    const totalIncome = incomes
      .filter((item) => Number(item.year || year) === year)
      .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

    container.innerHTML = `
      <h1>Income</h1>
      <p class="fine-print">Set recurring income for a year once. It is applied automatically in monthly and annual calculations.</p>
      <div class="toolbar"><label>Year: <select id="income-year">${WR.ui.yearsAroundCurrent(3, 4).map((y) => `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`).join('')}</select></label></div>
      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Total Income</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(totalIncome)}</span></div>
      </div>
      <table class="data-table">
        <thead><tr><th>Source</th><th>Amount (${profile.baseCurrency})</th><th>Frequency</th><th>Start month</th><th>End month</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">No income sources for this year.</td></tr>'}</tbody>
      </table>

      <h3>Add income source</h3>
      <form id="income-add-form" class="inline-form">
        <input name="name" placeholder="Salary, side business, rental" required>
        <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" required>
        <select name="frequency">${recurringFrequencyOptions('monthly')}</select>
        <input name="startMonth" type="month" value="${year}-01">
        <input name="endMonth" type="month" value="${year}-12">
        <button type="submit">Add</button>
      </form>
      <p id="income-form-message" class="warning"></p>
    `;

    document.getElementById('income-year').addEventListener('change', (event) => {
      WR.ui._incomeYear = Number(event.target.value);
      renderIncome(container);
    });

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;

        input.addEventListener('change', async () => {
          const income = await WR.repos.incomeSources.getById(id);
          if (!income) return;
          const field = input.dataset.field;
          if (field === 'amount') {
            income.amount = Math.max(0, parseFloat(input.value) || 0);
            input.value = income.amount;
          } else {
            income[field] = input.value;
          }
          income.year = year;
          income.currency = profile.baseCurrency;
          if (!isMonthRangeValid(income.startMonth, income.endMonth)) {
            WR.ui.notify('Income month range is invalid.', 'error');
            renderIncome(container);
            return;
          }
          await WR.repos.incomeSources.update(income);
          WR.ui.flashSaved(input);
        });
      });
    });

    container.querySelectorAll('.delete-income').forEach((button) => {
      button.addEventListener('click', async () => {
        if (!confirm('Delete this income source?')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.incomeSources,

          entityLabel: 'Income source',
          afterChange: async () => { await renderIncome(container); },
        });

    document.getElementById('income-add-form').addEventListener('submit', async (event) => {
      event.preventDefault();

        year,
        name: form.name.value.trim(),

        currency: profile.baseCurrency,

        <select name="frequency">${recurringFrequencyOptions('monthly')}</select>
        <select name="categoryId">${categoryOptions(categories, undefined, 'fixed')}</select>
        <input name="startMonth" type="month" value="${WR.ui.currentMonthKey()}">
        <input name="endMonth" type="month">
        <button type="submit">Add</button>
      </form>
      <p id="fixed-form-message" class="warning"></p>
    `;

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;

        input.addEventListener('change', async () => {

        if (!confirm('Delete this fixed expense?')) return;
        await WR.ui.removeWithUndo({

          entityLabel: 'Fixed expense',

  async function renderEmergencyFund(container) {
    const [profile, contributions] = await Promise.all([
      WR.ui.getOrCreateProfile(),
      WR.repos.emergencyFundContributions.getAll(),
    ]);
    const month = WR.ui._emergencyFundMonth || WR.ui.currentMonthKey();
    WR.ui._emergencyFundMonth = month;
    const sorted = contributions.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const countedAmount = (item) => {
      const amount = Number(item.amount) || 0;
      return item.returned && amount < 0 ? 0 : amount;
    };
    const total = sorted.reduce((sum, item) => sum + countedAmount(item), 0);
    const monthContributions = sorted.filter((item) => String(item.date || '').slice(0, 7) === month);
    const monthNet = monthContributions.reduce((sum, item) => sum + countedAmount(item), 0);

    const rows = monthContributions.map((item) => {
      const isBorrowed = (Number(item.amount) || 0) < 0;
      const returned = Boolean(item.returned);
      return `
      <tr data-id="${item.id}">
        <td><input class="cell" data-field="date" type="date" value="${item.date}"></td>
        <td><input class="cell" data-field="amount" type="number" step="0.01" value="${item.amount}"></td>
        <td><input class="cell" data-field="note" value="${item.note || ''}"></td>
        <td>${isBorrowed ? `<button class="link-btn toggle-emergency-return" data-id="${item.id}">${returned ? 'Unmark returned' : 'Mark returned'}</button>` : ''}</td>
        <td><button class="link-btn delete-emergency" data-id="${item.id}">Delete</button></td>
      </tr>`;
    }).join('');

    container.innerHTML = `
      <h1>Emergency Fund</h1>
      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Current emergency fund balance</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(total)}</span></div>
        <div class="stat"><span class="stat-label">Selected month net change</span><span class="stat-value ${monthNet < 0 ? 'negative' : ''}">${profile.baseCurrency} ${WR.ui.fmt(monthNet)}</span></div>
        <div class="stat"><span class="stat-label">Entries this month</span><span class="stat-value">${monthContributions.length}</span></div>
      </div>
      <div class="toolbar"><label>Month: <input id="emergency-fund-month" type="month" value="${month}"></label></div>
      <table class="data-table">
        <thead><tr><th>Date</th><th>Contribution (${profile.baseCurrency})</th><th>Note</th><th>Returned</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="empty">No emergency fund activity for this month.</td></tr>'}</tbody>
      </table>

      <h3>Add contribution</h3>
      <form id="emergency-add-form" class="inline-form">
        <input name="date" type="date" value="${new Date().toISOString().slice(0, 10)}" required>
        <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" required>
        <input name="note" placeholder="Optional note">
        <button type="submit">Add</button>
      </form>

      <h3>Borrow from emergency fund</h3>
      <p class="fine-print">This reduces the fund balance and records the same amount as a variable expense named “Emergency Fund Borrowed” for the selected month.</p>
      <form id="emergency-borrow-form" class="inline-form">
        <input name="date" type="date" value="${new Date().toISOString().slice(0, 10)}" required>
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount borrowed" required>
        <input name="note" placeholder="Reason (optional)">
        <button type="submit" class="secondary">Record borrowed amount</button>
      </form>
    `;

    document.getElementById('emergency-fund-month').addEventListener('change', (event) => {
      WR.ui._emergencyFundMonth = event.target.value;
      renderEmergencyFund(container);
    });

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const row = await WR.repos.emergencyFundContributions.getById(id);
          if (!row) return;
          const field = input.dataset.field;
          row[field] = field === 'amount' ? parseFloat(input.value) || 0 : input.value;
          if (field === 'amount' && row.amount >= 0) row.returned = false;
          await WR.repos.emergencyFundContributions.update(row);
          WR.ui.flashSaved(input);
          WR.ui.refreshIntegrityNotice();
        });
      });

    container.querySelectorAll('.toggle-emergency-return').forEach((button) => {
      button.addEventListener('click', async () => {
        const row = await WR.repos.emergencyFundContributions.getById(button.dataset.id);
        if (!row) return;
        row.returned = !row.returned;
        await WR.repos.emergencyFundContributions.update(row);
        await WR.ui.refreshIntegrityNotice();
        renderEmergencyFund(container);
      });
    });

    container.querySelectorAll('.delete-emergency').forEach((button) => {
      button.addEventListener('click', async () => {
        if (!confirm('Delete this emergency contribution?')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.emergencyFundContributions,
          id: button.dataset.id,
          entityLabel: 'Emergency contribution',

            await renderEmergencyFund(container);

    document.getElementById('emergency-add-form').addEventListener('submit', async (event) => {

  async function renderDayToDay(container) {
    const [profile, accounts, transactions, expenseCategories, emergencyFundContributions] = await Promise.all([
      WR.ui.getOrCreateProfile(),
      WR.repos.dayToDayAccounts.getAll(),
      WR.repos.dayToDayTransactions.getAll(),
      WR.repos.expenseCategories.getAll(),
      WR.repos.emergencyFundContributions.getAll(),
    ]);
    const month = WR.ui._dayMonth || WR.ui.currentMonthKey();
    const year = Number(month.slice(0, 4));
    WR.ui._dayYear = year;
    WR.ui._dayMonth = month;
    const defaultCategories = ['Alcohol', 'Eating out', 'Transport', 'Bank charges', 'Additional groceries'];
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    const categoryNames = [];
    [...defaultCategories, ...expenseCategories.map((category) => category.name), ...transactions.map((transaction) => transaction.category)]
      .map((category) => String(category || '').trim())
      .filter(Boolean)
      .forEach((category) => {
        if (!categoryNames.some((name) => name.toLowerCase() === category.toLowerCase())) categoryNames.push(category);
      });
    const categoryOptions = (selectedCategory) => {
      const selected = String(selectedCategory || '').trim();
      const options = categoryNames.map((category) => `<option value="${escapeHtml(category)}" ${category.toLowerCase() === selected.toLowerCase() ? 'selected' : ''}>${escapeHtml(category)}</option>`).join('');
      return `<option value="" ${selected ? '' : 'selected'}>None</option>${options}`;
    };
    const account = accounts.find((item) => Number(item.year) === year) || null;
    const monthTx = transactions.filter((item) => String(item.date || '').slice(0, 7) === month).sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const added = monthTx.filter((item) => item.kind === 'add').reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    const spent = monthTx.filter((item) => item.kind !== 'add').reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    const opening = Number(account?.startingBalance) || 0;
    const beforeMonth = transactions.filter((item) => Number(item.year) === year && String(item.date || '').slice(0, 7) < month);
    const balanceBeforeMonth = opening + beforeMonth.reduce((sum, item) => sum + (item.kind === 'add' ? 1 : -1) * (Number(item.amount) || 0), 0);
    const current = balanceBeforeMonth + added - spent;
    const spendByCategory = new Map();
    monthTx.filter((item) => item.kind !== 'add').forEach((item) => {
      const category = String(item.category || '').trim() || 'Uncategorised';
      spendByCategory.set(category, (spendByCategory.get(category) || 0) + (Number(item.amount) || 0));
    });
    const categorySpend = Array.from(spendByCategory, ([category, amount]) => ({ category, amount })).sort((left, right) => right.amount - left.amount);
    const topSpend = categorySpend[0] || null;
    const previousMonth = WR.ui.previousMonthKey(month);
    const emergencyFundAddedLastMonth = emergencyFundContributions.some((item) => String(item.date || '').slice(0, 7) === previousMonth && (Number(item.amount) || 0) > 0);
    const reductionAmount = topSpend ? Math.max(1, Math.round(topSpend.amount * 0.1)) : 0;
    const reductionDestination = emergencyFundAddedLastMonth ? 'your day-to-day buffer' : 'your emergency fund';
    const reductionContext = emergencyFundAddedLastMonth
      ? `You added to your emergency fund last month, so keeping this reduction in ${reductionDestination} will improve cash flow.`
      : `Last month had no emergency fund contribution, so this is a good place to direct the freed-up money.`;
    const reductionCard = topSpend ? `
      <section class="day-suggestion-card">
        <h2>Spending suggestion</h2>
        <p>Reduce ${escapeHtml(topSpend.category)} by about ${profile.baseCurrency} ${WR.ui.fmt(reductionAmount)} this month and direct it to ${reductionDestination}.</p>
        <p class="fine-print">${escapeHtml(reductionContext)} ${escapeHtml(topSpend.category)} is currently your highest day-to-day category at ${profile.baseCurrency} ${WR.ui.fmt(topSpend.amount)}.</p>
      </section>` : '';
    const categoryCards = categorySpend.map((item, index) => {
      const share = spent > 0 ? (item.amount / spent) * 100 : 0;
      return `
        <article class="day-category-card ${index === 0 ? 'top-spend' : ''}">
          <h3>${escapeHtml(item.category)}${index === 0 ? ' · Most spent' : ''}</h3>
          <span class="amount">${profile.baseCurrency} ${WR.ui.fmt(item.amount)}</span>
          <span class="share">${share.toFixed(0)}% of this month's day-to-day spending</span>
          <div class="day-category-meter" aria-hidden="true"><span style="--share: ${Math.max(3, share).toFixed(0)}%"></span></div>
        </article>`;
    }).join('');

    const rows = monthTx.map((item) => `
      <tr data-id="${item.id}">
        <td><input class="cell" data-field="date" type="date" value="${escapeHtml(item.date)}"></td>
        <td><select class="cell" data-field="kind"><option value="spend" ${item.kind !== 'add' ? 'selected' : ''}>Spend</option><option value="add" ${item.kind === 'add' ? 'selected' : ''}>Add money</option></select></td>
        <td><input class="cell" data-field="description" value="${escapeHtml(item.description || '')}"></td>
        <td><select class="cell" data-field="category">${categoryOptions(item.category)}</select></td>
        <td><input class="cell" data-field="note" value="${escapeHtml(item.note || '')}"></td>
        <td><input class="cell" data-field="amount" type="number" step="0.01" min="0" value="${item.amount}"></td>
        <td><button class="link-btn delete-day" data-id="${item.id}">Delete</button></td>
      </tr>`).join('');

    container.innerHTML = `
      <h1>Day-to-Day</h1>
      <p class="fine-print">Track daily account money separately from budget categories. Spend entries deduct from the current day-to-day balance.</p>
      <div class="toolbar"><label>Month: <input id="day-month" type="month" value="${month}"></label></div>

      <div class="stat-grid">
        <div class="stat"><span class="stat-label">Balance at start of month</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(balanceBeforeMonth)}</span></div>
        <div class="stat"><span class="stat-label">Money added</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(added)}</span></div>
        <div class="stat"><span class="stat-label">Money spent</span><span class="stat-value">${profile.baseCurrency} ${WR.ui.fmt(spent)}</span></div>
        <div class="stat"><span class="stat-label">Current balance</span><span class="stat-value ${current < 0 ? 'negative' : ''}">${profile.baseCurrency} ${WR.ui.fmt(current)}</span></div>
        <div class="stat"><span class="stat-label">Transactions this month</span><span class="stat-value">${monthTx.length}</span></div>
      </div>

      ${reductionCard}

      <section>
        <h2>Where your money is going</h2>
        <div class="day-category-grid">${categoryCards || '<p class="empty">No spending recorded for this month yet.</p>'}</div>
      </section>

      <h3>Starting balance</h3>
      <form id="day-balance-form" class="inline-form">
        <input name="startingBalance" type="number" step="0.01" min="0" value="${opening}">
        <button type="submit">Save starting balance</button>
      </form>

      <h3>Add category</h3>
      <form id="day-category-form" class="inline-form">
        <input name="name" placeholder="New category" required>
        <button type="submit" class="secondary">Add category</button>
      </form>

      <table class="data-table">
        <thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Category</th><th>Note</th><th>Amount (${profile.baseCurrency})</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="empty">No day-to-day transactions yet.</td></tr>'}</tbody>
      </table>

      <h3>Add day-to-day transaction</h3>
      <form id="day-add-form" class="inline-form">
        <input name="date" type="date" value="${new Date().toISOString().slice(0, 10)}" required>
        <select name="kind"><option value="spend">Spend</option><option value="add">Add money</option></select>
        <input name="description" placeholder="Description" required>
        <select name="category">${categoryOptions()}</select>
        <input name="note" placeholder="Optional note">
        <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" required>
        <button type="submit">Add</button>
      </form>
    `;

    document.getElementById('day-month').addEventListener('change', (event) => {
      WR.ui._dayMonth = event.target.value;
      renderDayToDay(container);
    });

    document.getElementById('day-balance-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const record = account || WR.models.createDayToDayAccount({ year, startingBalance: 0, currency: profile.baseCurrency });
      record.year = year;
      record.currency = profile.baseCurrency;
      record.startingBalance = Math.max(0, parseFloat(form.startingBalance.value) || 0);
      await WR.repos.dayToDayAccounts.update(record);
      renderDayToDay(container);
    });

    document.getElementById('day-category-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const name = form.name.value.trim();
      if (!name) return;
      if (!categoryNames.some((category) => category.toLowerCase() === name.toLowerCase())) {
        await WR.repos.expenseCategories.add(WR.models.createExpenseCategory({ name, type: 'variable', essential: false }));
        WR.ui.notify('Day-to-day category added.', 'success');
      }
      renderDayToDay(container);
    });

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const row = await WR.repos.dayToDayTransactions.getById(id);
          if (!row) return;
          const field = input.dataset.field;
          if (field === 'amount') {
            row.amount = Math.max(0, parseFloat(input.value) || 0);
            input.value = row.amount;
          } else {
            row[field] = input.value;
          }
          row.year = Number(String(row.date || '').slice(0, 4)) || year;
          await WR.repos.dayToDayTransactions.update(row);
          WR.ui.flashSaved(input);
          renderDayToDay(container);
        });
      });
    });

    container.querySelectorAll('.delete-day').forEach((button) => {
      button.addEventListener('click', async () => {
        if (!confirm('Delete this day-to-day transaction?')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.dayToDayTransactions,
          id: button.dataset.id,
          entityLabel: 'Day-to-day transaction',
          afterChange: async () => { await renderDayToDay(container); },
        });
      });
    });

    document.getElementById('day-add-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      const date = form.date.value;
      await WR.repos.dayToDayTransactions.add(WR.models.createDayToDayTransaction({
        year: Number(date.slice(0, 4)),
        date,
        kind: form.kind.value,
        description: form.description.value.trim(),
        category: form.category.value.trim() || undefined,
        note: form.note.value.trim() || undefined,
        amount: Math.max(0, parseFloat(form.amount.value) || 0),

      renderDayToDay(container);

})();
// Debts view: manage debts (inline-editable), then run the
// avalanche/snowball/hybrid prioritisation engine with an adjustable extra
// payment. Editing a debt only re-renders the payoff projection section,
// not the whole table \u2014 so the row you're editing keeps focus.

window.WR = window.WR || {};
WR.ui = WR.ui || {};

(function () {
  const CURRENCIES = ['ZAR', 'USD', 'EUR', 'GBP'];

  function currencyOptions(selected) {
    return CURRENCIES.map((c) => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  }

  const PAYMENT_FREQUENCY_TO_MONTHS = {
    weekly: 12 / 52,
    biweekly: 12 / 26,
    monthly: 1,
    quarterly: 3,
    yearly: 12,
  };

  function paymentFrequencyOptions(selected) {
    return Object.keys(PAYMENT_FREQUENCY_TO_MONTHS)
      .map((frequency) => `<option value="${frequency}" ${frequency === selected ? 'selected' : ''}>${frequency}</option>`)
      .join('');
  }

  function computePaymentsRemaining(debt) {
    const perCycle = Math.max(0, Number(debt.minPayment) || 0);
    if (perCycle <= 0) return null;
    const monthsPerPayment = PAYMENT_FREQUENCY_TO_MONTHS[debt.paymentFrequency || 'monthly'] || 1;
    const monthlyEquivalent = perCycle / monthsPerPayment;
    if (monthlyEquivalent <= 0) return null;
    return Math.ceil((Number(debt.currentBalance) || 0) / monthlyEquivalent);
  }

  function estimateCompletionDate(debt, paymentsRemaining) {
    if (!paymentsRemaining || paymentsRemaining < 0) return '';
    const monthsPerPayment = PAYMENT_FREQUENCY_TO_MONTHS[debt.paymentFrequency || 'monthly'] || 1;
    const start = debt.startDate ? new Date(`${debt.startDate}T00:00:00`) : new Date();
    const monthsToAdd = Math.ceil(paymentsRemaining * monthsPerPayment);
    start.setMonth(start.getMonth() + monthsToAdd);
    return start.toISOString().slice(0, 10);
  }

  function computePayoffHtml(debts, strategy, extra, profile) {
    if (debts.length === 0) return '<p class="empty">Add a debt to see a payoff projection.</p>';

    let orderedDebts = [];
    if (strategy === 'avalanche') orderedDebts = WR.financial.orderDebtsAvalanche(debts);
    else if (strategy === 'snowball') orderedDebts = WR.financial.orderDebtsSnowball(debts);
    else orderedDebts = WR.financial.orderDebtsHybrid(debts);

    const saved = WR.financial.calculateInterestSaved(orderedDebts, extra);
    const orderList = saved.withExtra.payoffOrder
      .map((p, i) => `<li>${i + 1}. ${p.name} \u2014 paid off in ${p.monthsToPayoff ?? '50+ years (capped)'} months</li>`)
      .join('');

    return `
      <p><strong>Payoff order (${strategy}):</strong></p>
      <ol>${orderList}</ol>
      <p>Total time to debt-free: <strong>${saved.withExtra.months} months</strong> ${saved.monthsSaved > 0 ? `(${saved.monthsSaved} months sooner than paying only minimums)` : ''}</p>
      <p>Total interest paid: <strong>${profile.baseCurrency} ${WR.ui.fmt(saved.withExtra.totalInterestPaid)}</strong> ${saved.interestSaved > 0 ? `(${profile.baseCurrency} ${WR.ui.fmt(saved.interestSaved)} saved vs. minimums only)` : ''}</p>
      ${saved.withExtra.reachedSafetyCap ? '<p class="warning">This extra payment amount is not enough to ever clear the balance at the current interest rate \u2014 try a larger amount.</p>' : ''}
    `;
  }

  function computeDebtOverviewHtml(debts, exchangeRates, profile) {
    if (debts.length === 0) return '';
    const base = profile.baseCurrency;

    let totalCurrent = 0;
    let totalOriginal = 0;
    const unconvertedNames = [];
    debts.forEach((d) => {
      const currency = d.currency || base;
      const current = WR.financial.convertCurrency(d.currentBalance, currency, base, exchangeRates);
      const original = WR.financial.convertCurrency(d.originalBalance || d.currentBalance, currency, base, exchangeRates);
      totalCurrent += current.value;
      totalOriginal += original.value;
      if (!current.converted) unconvertedNames.push(d.name);
    });

    const remainingPct = totalOriginal > 0 ? (totalCurrent / totalOriginal) * 100 : 0;
    const isHighRemaining = remainingPct > 50;

    const strategy = WR.ui._debtStrategy || 'avalanche';
    const extra = WR.ui._debtExtra != null ? WR.ui._debtExtra : 0;
    let orderedDebts = [];
    if (strategy === 'avalanche') orderedDebts = WR.financial.orderDebtsAvalanche(debts);
    else if (strategy === 'snowball') orderedDebts = WR.financial.orderDebtsSnowball(debts);
    else orderedDebts = WR.financial.orderDebtsHybrid(debts);

    const minimumsOnly = WR.financial.simulateDebtPayoff(orderedDebts, 0);
    const currentPlan = WR.financial.simulateDebtPayoff(orderedDebts, extra);

    const timeLeftLabel = currentPlan.reachedSafetyCap
      ? '50+ years (never at this rate)'
      : `${Math.floor(currentPlan.months / 12)}y ${currentPlan.months % 12}m`;

    let statement = '';
    if (minimumsOnly.reachedSafetyCap) {
      statement = 'At minimum payments alone, this debt will never be fully paid off \u2014 increase your monthly payment or consider a better repayment plan.';
    } else if (extra <= 0 && minimumsOnly.months > 60) {
      statement = `Paying only the minimums will take about ${Math.round(minimumsOnly.months / 12)} years. Adding an extra monthly payment could clear this debt much sooner.`;
    } else if (isHighRemaining) {
      statement = 'You still owe over half of your original debt \u2014 consider increasing your monthly payment or reviewing your payoff plan.';
    }

    return `
      <div class="stat-grid debt-overview">
        <div class="stat"><span class="stat-label">Total Debt</span><span class="stat-value">${base} ${WR.ui.fmt(totalCurrent)}</span></div>
        <div class="stat"><span class="stat-label">Debt Remaining</span><span class="stat-value ${isHighRemaining ? 'negative' : ''}">${remainingPct.toFixed(0)}%</span></div>
        <div class="stat"><span class="stat-label">Time Left (current plan)</span><span class="stat-value">${timeLeftLabel}</span></div>
      </div>
      ${statement ? `<p class="warning">${statement}</p>` : ''}
      ${unconvertedNames.length > 0 ? `<p class="fine-print">No exchange rate on file for: ${unconvertedNames.join(', ')} \u2014 shown at face value.</p>` : ''}
    `;
  }

  async function refreshPayoffSection(container) {
    const [debts, exchangeRates] = await Promise.all([
      WR.repos.debts.getAll(),
      WR.repos.exchangeRates.getAll(),
    ]);
    const profile = await WR.ui.getOrCreateProfile();
    const strategy = WR.ui._debtStrategy || 'avalanche';
    const extra = WR.ui._debtExtra != null ? WR.ui._debtExtra : 0;
    const section = container.querySelector('.payoff-results');
    if (section) section.innerHTML = computePayoffHtml(debts, strategy, extra, profile);
    const overview = container.querySelector('.debt-overview-wrap');
    if (overview) overview.innerHTML = computeDebtOverviewHtml(debts, exchangeRates, profile);
  }

  const MONTH_ABBR = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function computeDebtCalendarHtml(debts, payments, profile, year) {
    if (debts.length === 0) return '';
    const cards = debts
      .map((d) => {
        const paidTotal = payments
          .filter((p) => p.debtId === d.id)
          .reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
        const months = MONTH_ABBR
          .map((label, i) => {
            const monthKey = `${year}-${String(i + 1).padStart(2, '0')}`;
            const isPaid = payments.some((p) => p.debtId === d.id && p.month === monthKey);
            return `<button type="button" class="month-btn ${isPaid ? 'paid' : ''}" data-debt-id="${d.id}" data-month="${monthKey}">${label}</button>`;
          })
          .join('');
        return `
      <div class="debt-calendar-card">
        <h4>${d.name}</h4>
        <div class="debt-calendar-grid">${months}</div>
        <div class="debt-calendar-stats">
          <span>Debt paid: <strong>${d.currency || profile.baseCurrency} ${WR.ui.fmt(paidTotal)}</strong></span>
          <span>Debt left: <strong>${d.currency || profile.baseCurrency} ${WR.ui.fmt(d.currentBalance)}</strong></span>
        </div>
      </div>`;
      })
      .join('');

    return `
      <h2>Monthly Payment Tracker</h2>
      <p class="fine-print">Tick a month once you've paid it \u2014 this deducts the minimum payment from the balance and undoes it if you untick.</p>
      <div class="toolbar">
        <label>Year:
          <select id="debt-calendar-year">${WR.ui.yearsAroundCurrent(3, 3).map((y) => `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`).join('')}</select>
        </label>
      </div>
      <div class="debt-calendar-list">${cards}</div>
    `;
  }

  async function toggleDebtPayment(debtId, month, container) {
    const debt = await WR.repos.debts.getById(debtId);
    if (!debt) return;
    const allPayments = await WR.repos.debtPayments.getAll();
    const existing = allPayments.find((p) => p.debtId === debtId && p.month === month);
    if (existing) {
      await WR.repos.debtPayments.remove(existing.id);
      debt.currentBalance = Math.max(0, (Number(debt.currentBalance) || 0) + existing.amount);
    } else {
      const amount = Math.max(0, Number(debt.minPayment) || 0);
      if (amount <= 0) {
        alert('Set a minimum payment for this debt before marking months as paid.');
        return;
      }
      await WR.repos.debtPayments.add(WR.models.createDebtPayment({ debtId, month, amount }));
      debt.currentBalance = Math.max(0, (Number(debt.currentBalance) || 0) - amount);
    }
    await WR.repos.debts.update(debt);
    renderDebts(container);
  }

  async function renderDebts(container) {
    const [debts, payments, exchangeRates] = await Promise.all([

      WR.repos.debtPayments.getAll(),

        <td><input class="cell num" type="number" step="0.01" min="0" data-field="interestRatePct" value="${(d.interestRate * (interestPeriod === 'monthly' ? 100 / 12 : 100)).toFixed(2)}"></td>
        <td><input class="cell num" type="number" step="0.01" min="0" data-field="minPayment" value="${d.minPayment}"></td>
        <td><select class="cell" data-field="paymentFrequency">${paymentFrequencyOptions(d.paymentFrequency || 'monthly')}</select></td>
        <td><input class="cell" type="date" data-field="startDate" value="${d.startDate || ''}"></td>
        <td><input class="cell" type="date" data-field="expectedCompletionDate" value="${expectedCompletionDate}"></td>
        <td>${paymentsRemaining == null ? '—' : paymentsRemaining}</td>
        <td>${WR.ui.fmt(paidTotal)}</td>
        <td><button class="link-btn delete-debt" data-id="${d.id}">Delete</button></td>
      </tr>`;
        },
      )
      .join('');

    container.innerHTML = `
      <h1>Debts</h1>
      <p class="fine-print">Edit any cell \u2014 changes save immediately and update the payoff projection below.</p>
      <div class="debt-overview-wrap">${overviewHtml}</div>
      <div class="table-wrap">
        <table class="data-table debts-table">
          <thead><tr><th>Name</th><th>Original</th><th>Current</th><th>Currency</th><th>Interest rate <select id="debt-interest-period" class="table-header-select" aria-label="Interest rate period"><option value="yearly" ${interestPeriod === 'yearly' ? 'selected' : ''}>%/yr</option><option value="monthly" ${interestPeriod === 'monthly' ? 'selected' : ''}>%/mo</option></select></th><th>Min. payment</th><th>Frequency</th><th>Start date</th><th>Expected completion</th><th>Payments remaining</th><th>Total paid</th><th></th></tr></thead>
          <tbody>${rows || '<tr><td colspan="12" class="empty">No debts recorded.</td></tr>'}</tbody>
        </table>
      </div>

      ${calendarHtml}

      <h3>Add a debt</h3>
      <form id="add-debt-form" class="inline-form">
        <input name="name" placeholder="Name (e.g. Credit Card)" required>
        <input name="originalBalance" type="number" step="0.01" min="0" placeholder="Original balance" required>
        <input name="currentBalance" type="number" step="0.01" min="0" placeholder="Current balance" required>
        <select name="currency">${currencyOptions(profile.baseCurrency)}</select>
        <input name="interestRate" type="number" step="0.1" min="0" placeholder="Interest rate % / year" required>
        <input name="minPayment" type="number" step="0.01" min="0" placeholder="Minimum payment" required>
        <select name="paymentFrequency">${paymentFrequencyOptions('monthly')}</select>
        <input name="startDate" type="date" value="${new Date().toISOString().slice(0, 10)}">
        <input name="expectedCompletionDate" type="date">
        <button type="submit">Add</button>
      </form>

      <h2>Payoff Strategy</h2>
      <div class="toolbar">
        <label>Strategy:
          <select id="strategy-picker">
            <option value="avalanche" ${strategy === 'avalanche' ? 'selected' : ''}>Avalanche (highest interest first)</option>
            <option value="snowball" ${strategy === 'snowball' ? 'selected' : ''}>Snowball (smallest balance first)</option>
            <option value="hybrid" ${strategy === 'hybrid' ? 'selected' : ''}>Hybrid</option>
          </select>
        </label>
        <label>Extra monthly payment:
          <input type="number" id="extra-payment" step="10" min="0" value="${extra}">
        </label>
      </div>
      <div class="payoff-results">${computePayoffHtml(debts, strategy, extra, profile)}</div>
    `;

    container.querySelectorAll('tbody tr').forEach((tr) => {
      const id = tr.dataset.id;
      tr.querySelectorAll('.cell').forEach((input) => {
        input.addEventListener('change', async () => {
          const debt = await WR.repos.debts.getById(id);
          if (!debt) return;
          const field = input.dataset.field;
          if (field === 'interestRatePct') {
            const enteredRate = Math.max(0, parseFloat(input.value) || 0) / 100;
            debt.interestRate = interestPeriod === 'monthly' ? enteredRate * 12 : enteredRate;
          } else if (field === 'name' || field === 'currency' || field === 'paymentFrequency' || field === 'startDate' || field === 'expectedCompletionDate') {
            debt[field] = input.value;
          } else {
            debt[field] = Math.max(0, parseFloat(input.value) || 0);
            input.value = debt[field];
          }
          if (!debt.expectedCompletionDate) {
            const remaining = computePaymentsRemaining(debt);
            debt.expectedCompletionDate = estimateCompletionDate(debt, remaining);
          }
          await WR.repos.debts.update(debt);
          WR.ui.flashSaved(input);
          // Only the payoff projection needs to update \u2014 not the whole
          // table \u2014 so the row being edited doesn't lose focus.
          renderDebts(container);
        });
      });
    });

    container.querySelectorAll('.delete-debt').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this debt? This cannot be undone.')) return;
        await WR.ui.removeWithUndo({
          repo: WR.repos.debts,
          id: btn.dataset.id,
          entityLabel: 'Debt',
          afterChange: async () => { await renderDebts(container); },
        });
      });
    });

    document.getElementById('debt-interest-period').addEventListener('change', (e) => {
      WR.ui._debtInterestPeriod = e.target.value;
      renderDebts(container);
    });

    document.getElementById('add-debt-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const debt = WR.models.createDebt({
        name: form.name.value,
        originalBalance: Math.max(0, parseFloat(form.originalBalance.value) || 0),
        currentBalance: Math.max(0, parseFloat(form.currentBalance.value) || 0),
        currency: form.currency.value,
        interestRate: Math.max(0, parseFloat(form.interestRate.value) || 0) / 100,
        minPayment: Math.max(0, parseFloat(form.minPayment.value) || 0),
        paymentFrequency: form.paymentFrequency.value,
        startDate: form.startDate.value || undefined,
        expectedCompletionDate: form.expectedCompletionDate.value || undefined,
      });
      if (!debt.expectedCompletionDate) {
        debt.expectedCompletionDate = estimateCompletionDate(debt, computePaymentsRemaining(debt));
      }
      await WR.repos.debts.add(debt);
      renderDebts(container);
    });

    document.getElementById('strategy-picker').addEventListener('change', (e) => {
      WR.ui._debtStrategy = e.target.value;
      refreshPayoffSection(container);
    });
    document.getElementById('extra-payment').addEventListener('change', (e) => {
      WR.ui._debtExtra = Math.max(0, parseFloat(e.target.value) || 0);
      e.target.value = WR.ui._debtExtra;
      refreshPayoffSection(container);
    });

    const calendarYearPicker = document.getElementById('debt-calendar-year');
    if (calendarYearPicker) {
      calendarYearPicker.addEventListener('change', (e) => {
        WR.ui._debtCalendarYear = Number(e.target.value);
        renderDebts(container);
      });
    }
    container.querySelectorAll('.month-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        toggleDebtPayment(btn.dataset.debtId, btn.dataset.month, container);
      });
    });
  }

  WR.ui.renderDebts = renderDebts;
})();
// Assets and Investments views. Both inline-editable, matching the pattern

  /** Sums a list's currency-tagged value field into the base currency, tracking any that couldn't be converted. */
  function sumInBaseCurrency(items, valueField, exchangeRates, baseCurrency) {
    let total = 0;
    const unconvertedNames = [];
    items.forEach((item) => {
      const { value, converted } = WR.financial.convertCurrency(
        item[valueField],
        item.currency || baseCurrency,
        baseCurrency,
        exchangeRates,
      );
      total += value;
      if (!converted) unconvertedNames.push(item.name);
    });
    return { total, unconvertedNames };
  }

  }

  WR.ui.moodEmoji = moodEmoji;

  function computeInvestmentSuggestions(investments, totalValue, totalContributions, gainPct) {
    const suggestions = [];
    if (investments.length === 0) {
      return suggestions;
    }

    const riskCategories = new Set(investments.map((inv) => inv.riskCategory || 'medium'));
    if (investments.length > 1 && riskCategories.size === 1) {
      suggestions.push('All your investments share the same risk category \u2014 diversifying across low, medium, and high risk assets can smooth out returns over time.');
    }

    const largest = investments.reduce((max, inv) => (inv.currentValue > (max?.currentValue || 0) ? inv : max), null);
    if (largest && totalValue > 0 && largest.currentValue / totalValue > 0.7) {
      suggestions.push(`${largest.name} makes up over 70% of your portfolio \u2014 consider spreading contributions to reduce concentration risk.`);
    }

    if (totalContributions > 0 && gainPct < 0) {
      suggestions.push('Your portfolio is currently below what you\u2019ve contributed \u2014 review underperforming holdings or consider low-cost diversified index funds/ETFs for steadier long-term growth.');
    } else if (totalContributions > 0 && gainPct >= 0 && gainPct <= 5) {
      suggestions.push('Growth is modest so far \u2014 if your risk tolerance and timeline allow, exploring higher-growth options like equity ETFs could improve long-term returns.');
    } else if (totalContributions > 0 && gainPct > 15) {
      suggestions.push('Strong growth so far \u2014 consider rebalancing periodically to lock in gains and keep your risk mix on target.');
    }

    if (suggestions.length === 0) {
      suggestions.push('Your portfolio looks reasonably balanced \u2014 keep contributing consistently and review it periodically.');
    }
    return suggestions;
  }

  async function renderInvestments(container) {

    const totalGain = totalValue - totalContributions;

(function () {
  let state = { workbook: null, sheetName: null, headerRowIndex: 0, headers: [], rawRows: [] };

  function fieldMappingForm(headers) {
    const options = (selected) =>

  async function renderExcel(container) {
    container.innerHTML = `
      <h1>Excel</h1>

      <section>
        <h2>Import</h2>

        <div id="import-workflow"></div>
      </section>

      <section>
        <h2>Export</h2>
        <p class="fine-print">Downloads all current WealthRoute data as a new workbook (one sheet per data type). This does not reproduce the original 16-sheet template layout \u2014 it exports WealthRoute's own data model.</p>
        <button id="export-btn">Export to Excel</button>
      </section>
    `;

    document.getElementById('export-btn').addEventListener('click', async () => {
      if (typeof XLSX === 'undefined') {
        alert('Excel library failed to load \u2014 check your internet connection and reload the page.');
        return;
      }
      await WR.excel.exportWorkbook();
    });

    document.getElementById('excel-file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') {
        alert('Excel library failed to load \u2014 check your internet connection and reload the page.');
        return;
      }
      const buffer = await file.arrayBuffer();
      state.workbook = WR.excel.parseWorkbook(buffer);
      const sheetNames = WR.excel.getSheetNames(state.workbook);
      renderSheetPicker(sheetNames);
    });

    function renderSheetPicker(sheetNames) {
      const workflow = document.getElementById('import-workflow');
      workflow.innerHTML = `
        <div class="toolbar">
          <label>Sheet: <select id="sheet-picker">${sheetNames.map((n) => `<option value="${n}">${n}</option>`).join('')}</select></label>
          <label>Header row: <input type="number" id="header-row-input" min="1" value="1" style="width:4.5em"></label>
        </div>
        <p class="fine-print">If a sheet has its column headers somewhere other than the first row \u2014 common in sheets with a title or multiple tables \u2014 set the header row number above and the columns will refresh.</p>
        <div id="mapping-area"></div>
      `;
      document.getElementById('sheet-picker').addEventListener('change', (e) => {
        document.getElementById('header-row-input').value = 1;
        loadSheet(e.target.value, 0);
      });
      document.getElementById('header-row-input').addEventListener('change', (e) => {
        const rowNum = Math.max(1, parseInt(e.target.value, 10) || 1);
        e.target.value = rowNum;
        loadSheet(state.sheetName, rowNum - 1); // convert 1-indexed display to 0-indexed
      });
      loadSheet(sheetNames[0], 0);
    }

    function loadSheet(sheetName, headerRowIndex) {
      state.sheetName = sheetName;
      state.headerRowIndex = headerRowIndex;
      const { headers, rows } = WR.excel.readSheetRows(state.workbook, sheetName, headerRowIndex);
      state.headers = headers;
      state.rawRows = rows;

      const mappingArea = document.getElementById('mapping-area');
      if (rows.length === 0) {
        mappingArea.innerHTML = `<p class="warning">No data rows found below this header row \u2014 try a different header row number.</p>`;
        return;
      }

      mappingArea.innerHTML = `
        ${fieldMappingForm(headers)}
        <button id="preview-btn">Preview</button>
        <div id="preview-area"></div>
      `;
      document.getElementById('preview-btn').addEventListener('click', renderPreview);
    }

    function currentMapping() {
      return {
        mapping: { name: document.getElementById('map-name').value, amount: document.getElementById('map-amount').value },
        constants: {
          type: document.getElementById('map-type-constant').value,
          month: document.getElementById('map-month-constant').value,
        },
      };
    }

    function renderPreview() {
      const { mapping, constants } = currentMapping();

      if (!mapping.name || !mapping.amount) {
        document.getElementById('preview-area').innerHTML =
          '<p class="warning">Map both a Name/Description column and an Amount column before previewing.</p>';
        return;
      }

      const mapped = WR.excel.applyMapping(state.rawRows, mapping, constants);
      const withProblems = mapped.map((row) => ({ row, problems: WR.excel.validateImportRow(row) }));
      const validCount = withProblems.filter((r) => r.problems.length === 0).length;

      const rowsHtml = withProblems
        .slice(0, 25)
        .map(
          ({ row, problems }) => `
        <tr class="${problems.length ? 'invalid-row' : ''}">
          <td>${row.name ?? ''}</td>
          <td class="num">${row.amount ?? ''}</td>
          <td>${row.type ?? ''}</td>
          <td>${row.month ?? ''}</td>
          <td>${problems.join('; ')}</td>
        </tr>`,
        )
        .join('');

      document.getElementById('preview-area').innerHTML = `
        <p><strong>${validCount}</strong> of <strong>${mapped.length}</strong> rows are valid and will be imported. Showing first 25 rows below.</p>
        <table class="data-table">
          <thead><tr><th>Name</th><th>Amount</th><th>Type</th><th>Month</th><th>Problems</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <button id="confirm-import-btn" ${validCount === 0 ? 'disabled' : ''}>Confirm Import (${validCount} rows)</button>
        <p id="import-result"></p>
      `;

      document.getElementById('confirm-import-btn').addEventListener('click', async () => {
        const result = await WR.excel.importBudgetLines(mapped);
        document.getElementById('import-result').textContent =
          `Imported ${result.imported.length} rows. Skipped ${result.rejected.length} invalid rows.`;
      });
    }
  }

  WR.ui.renderExcel = renderExcel;
})();

(function () {
  const APP_VERSION = '1.0.0';

  function hardConfirm(actionLabel) {
    return new Promise((resolve) => {
      const token = prompt(`Type CONFIRM to ${actionLabel}.`);
      resolve(token === 'CONFIRM');
    });
  }

  async function exportBackup() {
    const stores = {};
    for (const [name, repo] of Object.entries(WR.repos)) {
      stores[name] = await repo.getAll();
    }
    const backup = {
      format: 'wealthroute-backup',
      formatVersion: 1,
      appVersion: APP_VERSION,
      exportedAt: new Date().toISOString(),
      stores,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wealthroute-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  async function importBackup(jsonText) {
    const backup = JSON.parse(jsonText);
    if (!backup || typeof backup !== 'object' || Array.isArray(backup)) throw new Error('Invalid backup format.');
    if (backup.format === 'wealthroute-backup' && backup.formatVersion !== 1) {
      throw new Error('This backup version is not supported.');
    }
    const data = backup.format === 'wealthroute-backup' ? backup.stores : backup;
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('Backup has no data stores.');
    const repositoryNames = Object.keys(WR.repos);
    if (!repositoryNames.some((name) => Object.prototype.hasOwnProperty.call(data, name))) {
      throw new Error('This is not a WealthRoute backup.');
    }

    for (const [name, repo] of Object.entries(WR.repos)) {
      const records = data[name] === undefined ? [] : data[name];
      if (!Array.isArray(records)) throw new Error(`Invalid ${name} data.`);
      for (const item of records) {
        if (!item || typeof item !== 'object' || Array.isArray(item) || typeof item.id !== 'string' || !item.id) {
          throw new Error(`Invalid record in ${name}.`);
        }
      }
    }

    for (const [name, repo] of Object.entries(WR.repos)) {
      await repo.clear();
      for (const item of data[name] || []) await repo.add(item);
    }
  }

    for (const repo of Object.values(WR.repos)) await repo.clear();
