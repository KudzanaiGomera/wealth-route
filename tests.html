// Test-harness auth: signs in anonymously against the same Firebase project
// index.html uses, so these tests exercise the real Firestore-backed storage
// layer (not a mock). Anonymous auth needs enabling once in Firebase Console
// -> Authentication -> Sign-in method -> Anonymous; no password to manage,
// and the existing Firestore rules (request.auth.uid == uid) already cover
// anonymous users since they still get a real uid. Each browser profile
// reuses the same anonymous user across test runs (Firebase Auth's default
// persistence), and every test below clears its own data via resetDB()
// first, so leftover state from a previous run never leaks into a test.

window.WR = window.WR || {};
WR.testAuth = {};

(function () {
  const FIREBASE_CONFIG = {
    apiKey: 'AIzaSyBGtuB9rwkdCCyhjqr_L7t6QJ_bqkEu3Xs',

// Firestore-backed data layer \u2014 mirrors index.html's real storage layer
// exactly (same users/{uid}/{storeName}/{id} shape, same interface), so these
// tests validate the actual persistence code path, not a stand-in for it.

window.WR = window.WR || {};

(function () {
  function requireContext() {
    const user = WR.testAuth.getCurrentUser();
    if (!user) throw new Error('Test auth not ready \u2014 call WR.testAuth.ensureInit() first.');
    return { uid: user.uid, api: WR.testAuth.getFirestoreApi(), db: WR.testAuth.getDb() };
  }

  /** @param {string} storeName */
  /** Firestore's setDoc() rejects any field whose value is undefined; drop them instead of erroring. */
  function stripUndefined(obj) {
    const out = {};
    for (const key of Object.keys(obj)) {
      if (obj[key] !== undefined) out[key] = obj[key];
    }
    return out;
  }

  function createRepository(storeName) {
    function collectionRef() {
      const { uid, api, db } = requireContext();
      return api.collection(db, 'users', uid, storeName);
    }
    function docRef(id) {
      const { uid, api, db } = requireContext();
      return api.doc(db, 'users', uid, storeName, id);
    }
    return {
      async getAll() {
        const { api } = requireContext();
        const snap = await api.getDocs(collectionRef());
        return snap.docs.map((d) => d.data());
      },
      /** @param {string} id */
      async getById(id) {
        const { api } = requireContext();
        const snap = await api.getDoc(docRef(id));
        return snap.exists() ? snap.data() : undefined;
      },
      /** @param {{id: string}} item */
      async add(item) {
        const { api } = requireContext();
        await api.setDoc(docRef(item.id), stripUndefined(item));
        return item.id;
      },
      /** @param {{id: string}} item */
      async update(item) {
        const { api } = requireContext();
        await api.setDoc(docRef(item.id), stripUndefined(item));
        return item.id;
      },
      /** @param {string} id */
      async remove(id) {
        const { api } = requireContext();
        await api.deleteDoc(docRef(id));
      },
      async clear() {
        const { api } = requireContext();
        const snap = await api.getDocs(collectionRef());
        await Promise.all(snap.docs.map((d) => api.deleteDoc(d.ref)));
      },
    };
  }

  WR.createRepository = createRepository;

  WR.repos = {
    userProfile: createRepository('userProfile'),
    incomeSources: createRepository('incomeSources'),
    expenseCategories: createRepository('expenseCategories'),
    fixedExpenses: createRepository('fixedExpenses'),
    emergencyFundContributions: createRepository('emergencyFundContributions'),
    dayToDayAccounts: createRepository('dayToDayAccounts'),
    dayToDayTransactions: createRepository('dayToDayTransactions'),
    budgetLines: createRepository('budgetLines'),
    debts: createRepository('debts'),
    debtPayments: createRepository('debtPayments'),
    assets: createRepository('assets'),
    investments: createRepository('investments'),
    netWorthSnapshots: createRepository('netWorthSnapshots'),
    exchangeRates: createRepository('exchangeRates'),
  };

  WR.queries = {
    /** All budget lines (income/fixed/variable/savings/debt) for a 'YYYY-MM' month. */
    async getBudgetLinesByMonth(month) {
      const { uid, api, db } = requireContext();
      const snap = await api.getDocs(api.query(api.collection(db, 'users', uid, 'budgetLines'), api.where('month', '==', month)));
      return snap.docs.map((d) => d.data());
    },

    /** All recorded payments made against a specific debt, across all months. */
    async getDebtPaymentsForDebt(debtId) {
      const { uid, api, db } = requireContext();
      const snap = await api.getDocs(api.query(api.collection(db, 'users', uid, 'debtPayments'), api.where('debtId', '==', debtId)));
      return snap.docs.map((d) => d.data());
    },

    /** Full net worth history, oldest first — powers the net worth trend chart. */
    async getNetWorthHistory() {
      const { uid, api, db } = requireContext();
      const snap = await api.getDocs(api.query(api.collection(db, 'users', uid, 'netWorthSnapshots'), api.orderBy('date')));
      return snap.docs.map((d) => d.data());
    },
  };
})();
// Core WealthRoute data model.
//
// No TypeScript here (per your call to drop the build step), but the JSDoc
// typedefs below still give autocomplete + inline type hints in VS Code and
// most editors, with zero compilation. Factory functions generate a new id
// so call sites never construct records by hand.
//
// Derived from Budget & Goal Tracker 2026.xlsx (Sprint 0 analysis), plus two
// additions the workbook doesn't have: NetWorthSnapshot (a time series, so
// trends/forecasting are possible) and ExchangeRate (fixes the workbook's
// unconverted-USD-assets gap). The workbook's "Goal Tracker" and "Habit
// Tracker" sheets are intentionally not modelled here.

window.WR = window.WR || {};

(function () {
  /** @returns {string} */
  function newId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    // Fallback for contexts where crypto.randomUUID isn't available
    // (some restricted file:// setups) — still unique enough for local use.
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  /**
   * @typedef {Object} UserProfile
   * @property {string} id
   * @property {string} [displayName] - purely cosmetic, shown in the Dashboard greeting
   * @property {string} baseCurrency - ISO 4217 code, e.g. 'ZAR'
   * @property {string} country
   * @property {number} emergencyFundTargetMonths
   * @property {'conservative'|'moderate'|'aggressive'} riskProfile
   */
  /** @param {Omit<UserProfile,'id'>} fields */
  function createUserProfile(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} IncomeSource
   * @property {string} id
   * @property {string} name
   * @property {number} amount
   * @property {string} currency
   * @property {'once'|'weekly'|'biweekly'|'monthly'|'annual'} frequency
   * @property {string} category
   * @property {boolean} recurring
   */
  /** @param {Omit<IncomeSource,'id'>} fields */
  function createIncomeSource(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} ExpenseCategory
   * @property {string} id
   * @property {string} name
   * @property {'fixed'|'variable'} type
   * @property {boolean} essential
   */
  /** @param {Omit<ExpenseCategory,'id'>} fields */
  function createExpenseCategory(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * One line item for one month. Mirrors the workbook's Budget / Actual /
   * Difference rows, normalised across all months into one store instead of
   * duplicated across 12 near-identical sheets.
   * @typedef {Object} BudgetLine
   * @property {string} id
   * @property {string} month - 'YYYY-MM'
   * @property {'income'|'fixed'|'variable'|'savings'|'debtPayment'} type
   * @property {string} [categoryId]
   * @property {string} name
   * @property {number} budgetAmount
   * @property {number} actualAmount
   * @property {string} currency
   */
  /** @param {Omit<BudgetLine,'id'>} fields */
  function createBudgetLine(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} Debt
   * @property {string} id
   * @property {string} name
   * @property {string} [type]
   * @property {number} [originalBalance]
   * @property {number} currentBalance
   * @property {string} [currency] - ISO 4217 code; falls back to base currency if omitted
   * @property {number} interestRate - fraction, e.g. 0.2 = 20%
   * @property {number} minPayment
   * @property {string} [dueDate]
   * @property {number} [priority] - lower = higher priority; set by the debt engine later
   */
  /** @param {Omit<Debt,'id'>} fields */
  function createDebt(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} DebtPayment
   * @property {string} id
   * @property {string} debtId
   * @property {string} month - 'YYYY-MM'
   * @property {number} amount
   */
  /** @param {Omit<DebtPayment,'id'>} fields */
  function createDebtPayment(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} Asset
   * @property {string} id
   * @property {string} name
   * @property {string} type
   * @property {string} currency
   * @property {number} currentValue
   * @property {number} [purchasePrice]
   * @property {string} [purchaseDate]
   * @property {'high'|'medium'|'low'} [liquidity]
   * @property {string} [notes]
   */
  /** @param {Omit<Asset,'id'>} fields */
  function createAsset(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} Investment
   * @property {string} id
   * @property {string} name
   * @property {string} type
   * @property {string} currency
   * @property {number} currentValue
   * @property {number} totalContributions
   * @property {number} [expectedReturnAssumption] - fraction, e.g. 0.08
   * @property {'low'|'medium'|'high'} [riskCategory]
   * @property {number} [horizonYears]
   */
  /** @param {Omit<Investment,'id'>} fields */
  function createInvestment(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * A point-in-time record of assets vs liabilities. Doesn't exist anywhere in
   * the source workbook — it only ever stores "current" net worth, never a
   * history — so this is what makes trend charts and forecasting possible.
   * @typedef {Object} NetWorthSnapshot
   * @property {string} id
   * @property {string} date - ISO date
   * @property {number} totalAssets
   * @property {number} totalLiabilities
   * @property {number} netWorth
   * @property {string} currency
   */
  /** @param {Omit<NetWorthSnapshot,'id'>} fields */
  function createNetWorthSnapshot(fields) {
    return { id: newId(), ...fields };
  }

  /**
   * @typedef {Object} ExchangeRate
   * @property {string} id
   * @property {string} fromCurrency
   * @property {string} toCurrency
   * @property {number} rate
   * @property {string} date
   */
  /** @param {Omit<ExchangeRate,'id'>} fields */
  function createExchangeRate(fields) {
    return { id: newId(), ...fields };
  }

  function createFixedExpense(fields) {
    return { id: newId(), ...fields };
  }

  function createEmergencyFundContribution(fields) {
    return { id: newId(), ...fields };
  }

  function createDayToDayAccount(fields) {
    return { id: newId(), ...fields };
  }

  function createDayToDayTransaction(fields) {
    return { id: newId(), ...fields };
  }

  WR.models = {
    newId,
    createUserProfile,
    createIncomeSource,
    createExpenseCategory,
    createBudgetLine,
    createDebt,
    createDebtPayment,
    createAsset,
    createInvestment,
    createNetWorthSnapshot,
    createExchangeRate,
    createFixedExpense,
    createEmergencyFundContribution,
    createDayToDayAccount,
    createDayToDayTransaction,
  };
})();
// Cash flow, savings rate, and expense-split calculations.
//
// Every function here is pure: plain data in, plain data/numbers out. No
// storage calls, no DOM, no side effects — this is what makes the engine
// independently testable and keeps financial math out of UI code, per the
// "deterministic engine" principle from the brief.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Sum actualAmount for budget lines of a given type.
   * Caller is expected to have already filtered to a single month (e.g. via
   * WR.queries.getBudgetLinesByMonth).
   * @param {Array} budgetLines
   * @param {'income'|'fixed'|'variable'|'savings'|'debtPayment'} type
   */
  function sumActualByType(budgetLines, type) {
    return budgetLines
      .filter((line) => line.type === type)
      .reduce((total, line) => total + line.actualAmount, 0);
  }

  /**
   * Sum budgetAmount (planned, not actual) for budget lines of a given type.
   * Useful for budget-vs-actual variance, same shape as the workbook's
   * Budget/Actual/Difference columns.
   */
  function sumBudgetByType(budgetLines, type) {
    return budgetLines
      .filter((line) => line.type === type)
      .reduce((total, line) => total + line.budgetAmount, 0);
  }

  /**
   * Builds the core monthly cash flow picture from one month's budget lines.
   * Mirrors the workbook's "Left to Spend" formula (income minus everything
   * actually spent), but exposes each component separately so the dashboard
   * and rules engine can reason about them individually rather than only
   * seeing one final number.
   *
   * @param {Array} budgetLines - budget lines for a single month
   * @returns {{
   *   income: number, fixedExpenses: number, variableExpenses: number,
   *   savings: number, debtPayments: number, totalExpenses: number,
   *   availableSurplus: number, savingsRate: number
   * }}
   */
  function calculateCashFlowSummary(budgetLines, minimumDebtPayments) {
    const income = sumActualByType(budgetLines, 'income');
    const fixedExpenses = sumActualByType(budgetLines, 'fixed');
    const variableExpenses = sumActualByType(budgetLines, 'variable');
    const savings = sumActualByType(budgetLines, 'savings');
    const debtPayments = minimumDebtPayments === undefined
      ? sumActualByType(budgetLines, 'debtPayment')
      : Math.max(0, Number(minimumDebtPayments) || 0);

    const totalExpenses = fixedExpenses + variableExpenses;
    const availableSurplus = income - totalExpenses - debtPayments;
    const savingsRate = income > 0 ? savings / income : 0;

    return {
      income,
      fixedExpenses,
      variableExpenses,
      savings,
      debtPayments,
      totalExpenses,
      availableSurplus,
      savingsRate,
    };
  }

  /**
   * Splits fixed+variable expense budget lines into essential vs discretionary
   * totals, using each line's categoryId to look up ExpenseCategory.essential.
   * A line with no matching category (or no categoryId at all) is counted as
   * discretionary — safer to flag it for review than to silently assume it's
   * essential when nobody has categorised it yet.
   *
   * @param {Array} budgetLines
   * @param {Array} expenseCategories
   * @returns {{ essential: number, discretionary: number }}
   */
  function calculateEssentialVsDiscretionary(budgetLines, expenseCategories) {
    const categoryById = new Map(expenseCategories.map((c) => [c.id, c]));

    let essential = 0;
    let discretionary = 0;

    budgetLines
      .filter((line) => line.type === 'fixed' || line.type === 'variable')
      .forEach((line) => {
        const category = line.categoryId ? categoryById.get(line.categoryId) : undefined;
        if (category && category.essential) {
          essential += line.actualAmount;
        } else {
          discretionary += line.actualAmount;
        }
      });

    return { essential, discretionary };
  }

  Object.assign(WR.financial, {
    sumActualByType,
    sumBudgetByType,
    calculateCashFlowSummary,
    calculateEssentialVsDiscretionary,
  });
})();
// Debt totals and interest calculations. Pure functions — no storage calls,
// no UI. This is the foundation the avalanche/snowball prioritisation engine
// (a later sprint) builds on top of.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /** @param {Array} debts */
  function calculateTotalDebt(debts) {
    return debts.reduce((total, debt) => total + debt.currentBalance, 0);
  }

  /** @param {Array} debts */
  function calculateTotalMinPayments(debts) {
    return debts.reduce((total, debt) => total + debt.minPayment, 0);
  }

  /**
   * Debt-to-income ratio using minimum required payments against monthly
   * income. Returns 0 when income is 0 or negative, to avoid Infinity/NaN
   * leaking into the dashboard or health score.
   * @param {Array} debts
   * @param {number} monthlyIncome
   */
  function calculateDebtToIncomeRatio(debts, monthlyIncome) {
    if (monthlyIncome <= 0) return 0;
    return calculateTotalMinPayments(debts) / monthlyIncome;
  }

  /**
   * The debt currently costing the most in interest rate — this is what
   * avalanche prioritisation and the "what should I do now" panel key off.
   * Returns null if there are no debts, rather than throwing.
   * @param {Array} debts
   */
  function getHighestInterestDebt(debts) {
    if (debts.length === 0) return null;
    return debts.reduce((highest, debt) => (debt.interestRate > highest.interestRate ? debt : highest));
  }

  /**
   * Balance-weighted average interest rate across all debts — one number
   * summarising "how expensive is my debt overall", used by the debt-vs-invest
   * decision logic in a later sprint.
   * @param {Array} debts
   */
  function calculateWeightedAverageInterestRate(debts) {
    const totalBalance = calculateTotalDebt(debts);
    if (totalBalance <= 0) return 0;
    const weightedSum = debts.reduce((sum, debt) => sum + debt.interestRate * debt.currentBalance, 0);
    return weightedSum / totalBalance;
  }

  Object.assign(WR.financial, {
    calculateTotalDebt,
    calculateTotalMinPayments,
    calculateDebtToIncomeRatio,
    getHighestInterestDebt,
    calculateWeightedAverageInterestRate,
  });
})();
// Net worth: assets minus liabilities, converted to one base currency.
// The source workbook keeps a separate USD assets table that is summed but
// never actually folded into the net worth total — this fixes that by
// requiring every value to be converted to baseCurrency before summing.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Converts an amount from one currency to another using the most recent
   * matching ExchangeRate record. Returns the original amount unconverted
   * (with a warning flag) if no rate is found and the currencies differ —
   * silently assuming a 1:1 rate would misstate net worth, so callers get
   * an explicit signal instead.
   *
   * @param {number} amount
   * @param {string} fromCurrency
   * @param {string} toCurrency
   * @param {Array} exchangeRates
   * @returns {{ value: number, converted: boolean }}
   */
  function convertCurrency(amount, fromCurrency, toCurrency, exchangeRates) {
    if (fromCurrency === toCurrency) return { value: amount, converted: true };

    const candidates = exchangeRates.filter(
      (r) => r.fromCurrency === fromCurrency && r.toCurrency === toCurrency,
    );
    if (candidates.length > 0) {
      const latest = candidates.reduce((a, b) => (a.date > b.date ? a : b));
      return { value: amount * latest.rate, converted: true };
    }

    // Try the inverse rate if that's what's stored.
    const inverseCandidates = exchangeRates.filter(
      (r) => r.fromCurrency === toCurrency && r.toCurrency === fromCurrency,
    );
    if (inverseCandidates.length > 0) {
      const latest = inverseCandidates.reduce((a, b) => (a.date > b.date ? a : b));
      return { value: amount / latest.rate, converted: true };
    }

    return { value: amount, converted: false };
  }

  /**
   * Calculates total assets, total liabilities, and net worth in one base
   * currency. Items that couldn't be converted (no exchange rate on file)
   * are tracked separately in `unconvertedItems` rather than silently
   * folded in at face value.
   *
   * @param {Array} assets
   * @param {Array} investments
   * @param {Array} debts
   * @param {Array} exchangeRates
   * @param {string} baseCurrency
   */
  function calculateNetWorth(assets, investments, debts, exchangeRates, baseCurrency) {
    let totalAssets = 0;
    let totalLiabilities = 0;
    const unconvertedItems = [];

    assets.forEach((asset) => {
      const { value, converted } = convertCurrency(
        asset.currentValue,
        asset.currency,
        baseCurrency,
        exchangeRates,
      );
      totalAssets += value;
      if (!converted) unconvertedItems.push({ name: asset.name, currency: asset.currency });
    });

    investments.forEach((inv) => {
      const { value, converted } = convertCurrency(
        inv.currentValue,
        inv.currency,
        baseCurrency,
        exchangeRates,
      );
      totalAssets += value;
      if (!converted) unconvertedItems.push({ name: inv.name, currency: inv.currency });
    });

    debts.forEach((debt) => {
      // Older records created before debts carried a currency field fall
      // back to base currency, matching the original assumption \u2014 but any
      // debt with an explicit foreign currency is now converted correctly.
      const { value, converted } = convertCurrency(
        debt.currentBalance,
        debt.currency || baseCurrency,
        baseCurrency,
        exchangeRates,
      );
      totalLiabilities += value;
      if (!converted) unconvertedItems.push({ name: debt.name, currency: debt.currency });
    });

    return {
      totalAssets,
      totalLiabilities,
      netWorth: totalAssets - totalLiabilities,
      currency: baseCurrency,
      unconvertedItems,
    };
  }

  Object.assign(WR.financial, { convertCurrency, calculateNetWorth });
})();
// Emergency fund coverage: how many months of essential expenses the
// user's liquid assets would cover.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  /**
   * Sums the current value of assets flagged as high liquidity — the
   * practical definition of "emergency fund" money (cash, money market,
   * easily-accessed savings), as opposed to a house or a retirement annuity.
   * @param {Array} assets
   */
  function calculateLiquidAssets(assets) {
    return assets.filter((a) => a.liquidity === 'high').reduce((sum, a) => sum + a.currentValue, 0);
  }

  /**
   * How many months of essential expenses the liquid assets would cover.
   * Returns Infinity (not a crash) when essential expenses are 0 and there
   * are liquid assets — genuinely "fully covered" in that case, and 0 when
   * there's nothing liquid at all.
   * @param {number} liquidAssets
   * @param {number} monthlyEssentialExpenses
   */
  function calculateEmergencyFundMonths(liquidAssets, monthlyEssentialExpenses) {
    if (monthlyEssentialExpenses <= 0) return liquidAssets > 0 ? Infinity : 0;
    return liquidAssets / monthlyEssentialExpenses;
  }

  Object.assign(WR.financial, { calculateLiquidAssets, calculateEmergencyFundMonths });
})();
// Financial health score. Every point traces back to an explicit formula —
// per your brief, this must never become an opaque AI-generated number.
// Five equally-weighted components (20 points each): cash flow, emergency
// fund, debt burden, savings rate, net worth trend.

window.WR = window.WR || {};
WR.financial = WR.financial || {};

(function () {
  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  /**
   * Scales a ratio linearly onto a 0-100 range between a floor (0 points)
   * and a target (100 points). Used so each component has one obvious,
   * inspectable formula rather than a hidden curve.
   */
  function scaleLinear(value, floor, target) {

  const MAX_MONTHS = 600; // 50-year safety cap, so a payment too small to ever

  /** Highest interest rate first — minimises total interest paid. */
  function orderAvalanche(debts) {
    return [...debts].sort((a, b) => b.interestRate - a.interestRate);
  }

  /** Smallest balance first — maximises early "wins" for motivation. */
  function orderSnowball(debts) {
    return [...debts].sort((a, b) => a.currentBalance - b.currentBalance);
  }

  /**
   * Blends interest rate and balance so a merely-elevated rate on a huge
   * balance can still outrank a tiny balance at a very high rate. Weights
   * are parameters, not hidden constants, so the ordering stays inspectable.
   */
  function orderHybrid(debts, weights) {
    const w = weights || { interestWeight: 0.7, balanceWeight: 0.3 };
    if (debts.length === 0) return [];
    const maxRate = Math.max(...debts.map((d) => d.interestRate)) || 1;
    const maxBalance = Math.max(...debts.map((d) => d.currentBalance)) || 1;
    const scored = debts.map((d) => ({
      debt: d,
      score: w.interestWeight * (d.interestRate / maxRate) + w.balanceWeight * (1 - d.currentBalance / maxBalance),

    scored.sort((a, b) => b.score - a.score);
    return scored.map((s) => s.debt);

   * Simulates paying off a set of debts month by month. Every open debt
   * always gets at least its minimum payment; all extra payment (plus any
   * minimums freed up as debts get fully paid off) goes to whichever debt
   * is first, still open, in `orderedDebts`.
   *
   * @param {Array} orderedDebts - pre-sorted by avalanche/snowball/hybrid
   * @param {number} extraMonthlyPayment - beyond the sum of all minimums
   * @returns {{
   *   months: number, totalInterestPaid: number,
   *   payoffOrder: Array<{name: string, monthsToPayoff: number|null}>,
   *   reachedSafetyCap: boolean
   * }}
   */

    const balances = orderedDebts.map((d) => ({
      name: d.name,
      balance: d.currentBalance,
      monthlyRate: d.interestRate / 12,
      minPayment: d.minPayment,
      paidOffMonth: null,
    }));

    let month = 0;
    let totalInterestPaid = 0;
    let extraPool = extraMonthlyPayment;

    while (balances.some((b) => b.balance > 0.01) && month < MAX_MONTHS) {
      month += 1;

      balances.forEach((b) => {
        if (b.balance > 0) {
          const interest = b.balance * b.monthlyRate;
          b.balance += interest;
          totalInterestPaid += interest;
        }
      });

      balances.forEach((b) => {
        if (b.balance > 0) {
          b.balance -= Math.min(b.minPayment, b.balance);
        }
      });

      let pool = extraPool;
      for (const b of balances) {
        if (b.balance > 0 && pool > 0) {
          const payment = Math.min(pool, b.balance);
          b.balance -= payment;
          pool -= payment;
        }
      }

      balances.forEach((b) => {
        if (b.balance <= 0.01 && b.paidOffMonth === null) {
          b.paidOffMonth = month;
          extraPool += b.minPayment; // rollover: freed-up minimum joins next month's extra pool
        }
      });
    }

    return {
      months: month,
      totalInterestPaid,
      payoffOrder: balances.map((b) => ({ name: b.name, monthsToPayoff: b.paidOffMonth })),
      reachedSafetyCap: month >= MAX_MONTHS,

  function calculateInterestSaved(orderedDebts, extraMonthlyPayment) {

      monthsSaved: withoutExtra.months - withExtra.months,

      withExtra,

   * payment (floored at 0, doesn't go negative); investments grow by an
   * assumed annual return and receive a fixed monthly contribution.
   * Everything else that makes up net worth today (property, vehicles, etc.)

   * price growth is exactly the kind of unfounded certainty the brief warns
   * against.

   * @param {number} params.currentNetWorth
   * @param {number} params.currentDebtTotal
   * @param {number} params.currentInvestmentTotal
   * @param {number} params.monthlyDebtPayment
   * @param {number} params.monthlyInvestmentContribution
   * @param {number} params.debtInterestAnnual - weighted average, fraction
   * @param {number} params.investmentReturnAnnual - assumed, fraction, never guaranteed
   * @param {number} years

      currentNetWorth,

      currentInvestmentTotal,
      monthlyDebtPayment,
      monthlyInvestmentContribution,
      debtInterestAnnual,
      investmentReturnAnnual,

      if (!byMonth[line.month]) {

      }

      else if (line.type === 'fixed') bucket.fixed += line.actualAmount;
      else if (line.type === 'variable') bucket.variable += line.actualAmount;
      else if (line.type === 'savings') bucket.savings += line.actualAmount;
      else if (line.type === 'debtPayment') bucket.debtPayments += line.actualAmount;

   * @param {Object} row - already mapped to { name, amount, type, month, categoryId }
   */
  function validateImportRow(row) {
    const problems = [];
    if (!row.name || String(row.name).trim() === '') problems.push('Missing name/description');
    if (row.amount === undefined || row.amount === '' || Number.isNaN(Number(row.amount))) {
      problems.push('Missing or invalid amount');
    }
    if (!['income', 'fixed', 'variable', 'savings', 'debtPayment'].includes(row.type)) {
      problems.push(`Invalid type "${row.type}"`);
    }
    if (!/^\d{4}-\d{2}$/.test(row.month || '')) problems.push('Month must be in YYYY-MM format');
    return problems;
  }

  /**
   * Parses a spreadsheet cell into a number, handling currency symbols,
   * thousands separators, and accounting-style negatives like "(500.00)"
   * (parentheses meaning negative, common in exported financial data).
   * @param {*} raw
   */
  function parseAmount(raw) {
    const str = String(raw ?? '').trim();
    const isParenNegative = /^\(.*\)$/.test(str);
    const cleaned = str.replace(/[^\d.-]/g, '');
    const value = parseFloat(cleaned);
    if (Number.isNaN(value)) return NaN;
    return isParenNegative ? -Math.abs(value) : value;
  }

  /**
   * Applies a column mapping to raw sheet rows, producing WealthRoute
   * BudgetLine-shaped records (not yet saved). `mapping` keys are
   * WealthRoute field names, values are the source column header to read
   * from each raw row. `constants` supplies fields not present as columns
   * (e.g. a fixed month or type for the whole import).
   *
   * @param {Array<Object>} rawRows
   * @param {{name?: string, amount?: string, type?: string, month?: string, currency?: string}} mapping
   * @param {{type?: string, month?: string, currency?: string}} constants
   */
  function applyMapping(rawRows, mapping, constants) {
    return rawRows.map((raw) => {
      const name = mapping.name ? raw[mapping.name] : undefined;
      const amountRaw = mapping.amount ? raw[mapping.amount] : undefined;
      const amount = typeof amountRaw === 'number' ? amountRaw : parseAmount(amountRaw);
      const type = constants.type || (mapping.type ? raw[mapping.type] : undefined);
      const month = constants.month || (mapping.month ? raw[mapping.month] : undefined);
      const currency = constants.currency || (mapping.currency ? raw[mapping.currency] : 'ZAR');

      return { name, amount, type, month, currency };
    });
  }

  /**
   * Imports validated rows as BudgetLine records via the repository layer.
   * Rows that fail validation are skipped and returned separately, rather
   * than silently importing bad data.
   * @param {Array<Object>} mappedRows
   */
  async function importBudgetLines(mappedRows) {
    const imported = [];
    const rejected = [];

    for (const row of mappedRows) {
      const problems = validateImportRow(row);
      if (problems.length > 0) {
        rejected.push({ row, problems });
        continue;
      }
      const line = WR.models.createBudgetLine({
        month: row.month,
        type: row.type,
        name: row.name,
        budgetAmount: Number(row.amount),
        actualAmount: Number(row.amount),
        currency: row.currency || 'ZAR',
      });
      await WR.repos.budgetLines.add(line);
      imported.push(line);
    }

    return { imported, rejected };
  }

  /**
   * Exports all current data as a multi-sheet workbook: one sheet per
   * entity. This intentionally does not attempt to reproduce the exact
   * 16-sheet source template (Annual Overview + 12 month sheets + Networth
   * + Goal/Habit trackers) — it exports WealthRoute's own normalised data
   * model instead, which is what round-trips cleanly.
   */
  async function exportWorkbook() {
    const [budgetLines, debts, assets, investments, netWorthSnapshots] = await Promise.all([
      WR.repos.budgetLines.getAll(),
      WR.repos.debts.getAll(),
      WR.repos.assets.getAll(),
      WR.repos.investments.getAll(),
      WR.repos.netWorthSnapshots.getAll(),
    ]);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(budgetLines), 'Budget Lines');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(debts), 'Debts');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assets), 'Assets');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(investments), 'Investments');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(netWorthSnapshots), 'Net Worth History');

    XLSX.writeFile(wb, `wealthroute-export-${new Date().toISOString().slice(0, 10)}.xlsx`);
  }

  WR.excel = {
    parseWorkbook,
    getSheetNames,
    readSheetRows,
    validateImportRow,
    parseAmount,
    applyMapping,
    importBudgetLines,
    exportWorkbook,
  };
})();
// Hand-rolled SVG charts. No charting library — the whole point of this

(function () {
  const PALETTE = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)', 'var(--chart-1)'];

  function escapeXml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
  }

  /**
   * @param {Array<{label: string, value: number}>} data
   * @param {{width?: number, height?: number, color?: string}} [options]
   */
  function barChart(data, options) {
    const opts = options || {};
    const width = opts.width || 480;
    const height = opts.height || 240;
    const padding = 32;
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;

    if (data.length === 0) {
      return `<svg width="${width}" height="${height}"><text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="#888">No data</text></svg>`;
    }

    const maxVal = Math.max(...data.map((d) => d.value), 0.01);
    const barWidth = chartW / data.length;

    const bars = data
      .map((d, i) => {
        const barH = (Math.max(d.value, 0) / maxVal) * chartH;
        const x = padding + i * barWidth + barWidth * 0.15;
        const y = padding + (chartH - barH);
        const w = barWidth * 0.7;
        const color = opts.color || PALETTE[i % PALETTE.length];
        return `
          <rect x="${x}" y="${y}" width="${w}" height="${barH}" fill="${color}" rx="2"></rect>
          <text x="${x + w / 2}" y="${height - padding + 14}" text-anchor="middle" font-size="10" fill="#444">${escapeXml(d.label)}</text>
          <text x="${x + w / 2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="#222">${d.value.toFixed(0)}</text>
        `;
      })
      .join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
  }

  /**
   * @param {Array<{label: string, value: number}>} data - ordered chronologically
   * @param {{width?: number, height?: number, color?: string}} [options]
   */
  function lineChart(data, options) {
    const opts = options || {};
    const width = opts.width || 480;
    const height = opts.height || 240;
    const padding = 32;
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;

    if (data.length === 0) {
      return `<svg width="${width}" height="${height}"><text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="#888">No data</text></svg>`;
    }

    const values = data.map((d) => d.value);
    const maxVal = Math.max(...values);
    const minVal = Math.min(...values, 0);
    const range = maxVal - minVal || 1;
    const stepX = data.length > 1 ? chartW / (data.length - 1) : 0;
    const color = opts.color || PALETTE[0];

    const points = data.map((d, i) => {
      const x = padding + i * stepX;
      const y = padding + chartH - ((d.value - minVal) / range) * chartH;
      return { x, y, label: d.label, value: d.value };
    });

    const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const dots = points
      .map(
        (p) =>
          `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"><title>${escapeXml(p.label)}: ${p.value.toFixed(2)}</title></circle>`,
      )
      .join('');
    const labels = points
      .map((p, i) => (i % Math.ceil(points.length / 8 || 1) === 0
        ? `<text x="${p.x.toFixed(1)}" y="${height - padding + 14}" text-anchor="middle" font-size="9" fill="#444">${escapeXml(p.label)}</text>`
        : ''))
      .join('');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2"></path>
      ${dots}
      ${labels}
    </svg>`;
  }

  function pieChart(data, options) {
    const opts = options || {};
    const size = opts.size || 180;
    const radius = size / 2 - 8;
    const innerRadius = opts.innerRadius || radius * 0.58;
    const cx = size / 2;
    const cy = size / 2;

    const valid = (data || []).filter((d) => Number(d.value) > 0);
    const total = valid.reduce((sum, d) => sum + Number(d.value || 0), 0);
    if (!valid.length || total <= 0) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="#d6d6d6" stroke-width="14"></circle><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#888">No data</text></svg>`;
    }

    const arcs = [];
    let start = -Math.PI / 2;
    valid.forEach((item, i) => {
      const angle = (Number(item.value) / total) * Math.PI * 2;
      const end = start + angle;
      const x1 = cx + Math.cos(start) * radius;
      const y1 = cy + Math.sin(start) * radius;
      const x2 = cx + Math.cos(end) * radius;
      const y2 = cy + Math.sin(end) * radius;
      const large = angle > Math.PI ? 1 : 0;
      const color = PALETTE[i % PALETTE.length];
      arcs.push(`<path d="M ${cx} ${cy} L ${x1.toFixed(3)} ${y1.toFixed(3)} A ${radius} ${radius} 0 ${large} 1 ${x2.toFixed(3)} ${y2.toFixed(3)} Z" fill="${color}"></path>`);
      start = end;
    });

    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${arcs.join('')}<circle cx="${cx}" cy="${cy}" r="${innerRadius}" fill="#fff"></circle><text x="${cx}" y="${cy - 8}" text-anchor="middle" font-size="11" fill="#666">Total</text><text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="14" fill="#222">${total.toFixed(0)}</text></svg>`;
  }

  WR.charts = { barChart, lineChart, pieChart };
})();

(function () {
  function monthlyAmountFromFrequency(amount, frequency) {
    const value = Number(amount) || 0;
    if (frequency === 'weekly') return value * 52 / 12;
    if (frequency === 'biweekly') return value * 26 / 12;
    if (frequency === 'quarterly') return value / 3;
    if (frequency === 'yearly' || frequency === 'annual') return value / 12;
    return value;
  }

  function isActiveForMonth(record, monthKey) {
    const start = record.startMonth || `${record.year || monthKey.slice(0, 4)}-01`;
    const end = record.endMonth || `${record.year || monthKey.slice(0, 4)}-12`;
    return String(monthKey) >= String(start) && String(monthKey) <= String(end);
  }

  function getDayToDayOpeningAccount(accounts, year) {
    return accounts
      .filter((account) => Number(account.year) <= Number(year))
      .sort((left, right) => Number(right.year) - Number(left.year))[0] || null;
  }

  function calculateDayToDaySummary(accountsOrAccount, transactions, throughMonth) {
    const accounts = Array.isArray(accountsOrAccount) ? accountsOrAccount : [accountsOrAccount].filter(Boolean);
    const month = typeof throughMonth === 'number' ? `${throughMonth}-12` : throughMonth;
    const year = Number(month.slice(0, 4));
    const openingAccount = getDayToDayOpeningAccount(accounts, year);
    const openingYear = Number(openingAccount && openingAccount.year) || Number(year);
    const opening = Number(openingAccount && openingAccount.startingBalance) || 0;
    const yearTransactions = transactions.filter((tx) => {
      const transactionMonth = String(tx.date || '').slice(0, 7);
      return transactionMonth >= `${openingYear}-01` && transactionMonth <= month;
    });
    const added = yearTransactions
      .filter((tx) => tx.kind === 'add')
      .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
    const spent = yearTransactions
      .filter((tx) => tx.kind !== 'add')
      .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
    return {
      opening,
      added,
      spent,
      currentBalance: opening + added - spent,
      totalTransactions: yearTransactions.length,
    };
  }

  function calculateDayToDayMonthBalance(accounts, transactions, month) {
    const year = Number(month.slice(0, 4));
    const openingAccount = getDayToDayOpeningAccount(accounts, year);
    const openingYear = Number(openingAccount && openingAccount.year) || year;
    const opening = Number(openingAccount && openingAccount.startingBalance) || 0;
    const relevantTransactions = transactions.filter((tx) => {
      const date = String(tx.date || '');
      return Number(tx.year) >= openingYear && date.slice(0, 7) <= month;
    });
    const beforeMonth = relevantTransactions.filter((tx) => String(tx.date || '').slice(0, 7) < month);
    const netAmount = (items) => items.reduce((sum, tx) => sum + (tx.kind === 'add' ? 1 : -1) * (Number(tx.amount) || 0), 0);
    return {
      opening,
      balanceBeforeMonth: opening + netAmount(beforeMonth),
      currentBalance: opening + netAmount(relevantTransactions),
    };
  }

  WR.uiCalc = {
    monthlyAmountFromFrequency,
    isActiveForMonth,
    calculateDayToDaySummary,
    calculateDayToDayMonthBalance,
  };
})();
// A deliberately tiny test runner — no dependency, runs by just opening
// tests.html in a browser. Not a replacement for Jest/Vitest at scale, but
// this project's whole point this sprint is having zero install step.

window.WR = window.WR || {};

(function () {
  const results = [];

  /**
   * @param {string} name
   * @param {() => Promise<void>|void} fn
   */
  async function test(name, fn) {
    try {
      await fn();
      results.push({ name, passed: true });
    } catch (err) {
      results.push({ name, passed: false, error: err && err.message ? err.message : String(err) });
    }
  }

  /** @param {*} actual */
  function expect(actual) {
    return {
      toBe(expected) {
        if (actual !== expected) {
          throw new Error(`Expected ${JSON.stringify(actual)} to be ${JSON.stringify(expected)}`);
        }
      },
      toEqual(expected) {
        const a = JSON.stringify(actual);
        const e = JSON.stringify(expected);
        if (a !== e) throw new Error(`Expected ${a} to equal ${e}`);
      },
      toBeUndefined() {
        if (actual !== undefined) {
          throw new Error(`Expected ${JSON.stringify(actual)} to be undefined`);
        }
      },
      toHaveLength(n) {
        const len = actual ? actual.length : undefined;
        if (len !== n) throw new Error(`Expected length ${n}, got ${len}`);
      },
      toBeCloseTo(expected, precision = 2) {
        const diff = Math.abs(actual - expected);
        if (diff > Math.pow(10, -precision)) {
          throw new Error(`Expected ${actual} to be close to ${expected}`);
        }
      },
      toBeTruthy() {
        if (!actual) throw new Error(`Expected ${JSON.stringify(actual)} to be truthy`);
      },
    };
  }

  function render() {
    const container = document.getElementById('results');
    if (!container) return;

    const passed = results.filter((r) => r.passed).length;
    const failed = results.length - passed;

    const summary = document.createElement('h2');
    summary.textContent = `${passed} passed, ${failed} failed (of ${results.length})`;
    summary.style.color = failed === 0 ? '#1a7f37' : '#c1121f';
    container.appendChild(summary);

    results.forEach((r) => {
      const div = document.createElement('div');
      div.style.color = r.passed ? '#1a7f37' : '#c1121f';
      div.style.fontFamily = 'monospace';
      div.textContent = r.passed ? `\u2713 ${r.name}` : `\u2717 ${r.name} \u2014 ${r.error}`;
      container.appendChild(div);
    });
  }

  WR.test = { test, expect, render };
})();

WR.testRuns = WR.testRuns || [];

WR.testRuns.push(
  (async function () {
    const { test, expect } = WR.test;
    const F = WR.financial;

    // --- calculateCashFlowSummary ---------------------------------------

    await test('calculateCashFlowSummary > computes income, expenses, surplus and savings rate', () => {
      // Mirrors the real Aug figures from the source workbook.
      const budgetLines = [
        { type: 'income', actualAmount: 31470.19, budgetAmount: 31000 },
        { type: 'fixed', actualAmount: 12800, budgetAmount: 12500 },
        { type: 'variable', actualAmount: 5600, budgetAmount: 6000 },
        { type: 'savings', actualAmount: 0, budgetAmount: 2000 },
        { type: 'debtPayment', actualAmount: 3621.42, budgetAmount: 3500 },
      ];

      const summary = F.calculateCashFlowSummary(budgetLines);

      expect(summary.income).toBeCloseTo(31470.19);
      expect(summary.fixedExpenses).toBe(12800);
      expect(summary.variableExpenses).toBe(5600);
      expect(summary.totalExpenses).toBe(18400);
      expect(summary.savings).toBe(0);
      expect(summary.debtPayments).toBeCloseTo(3621.42);
      // 31470.19 - 12800 - 5600 - 3621.42 (savings are tracked separately)
      expect(summary.availableSurplus).toBeCloseTo(9448.77);
      expect(summary.savingsRate).toBe(0); // R0 actually saved despite a budget of R2000
    });

    await test('calculateCashFlowSummary > uses required debt minimums and does not deduct savings from surplus', () => {
      const summary = F.calculateCashFlowSummary([
        { type: 'income', actualAmount: 10000, budgetAmount: 10000 },
        { type: 'fixed', actualAmount: 3000, budgetAmount: 3000 },
        { type: 'variable', actualAmount: 1500, budgetAmount: 1500 },
        { type: 'savings', actualAmount: 1000, budgetAmount: 1000 },
        { type: 'debtPayment', actualAmount: 900, budgetAmount: 900 },
      ], 600);

      expect(summary.totalExpenses).toBe(4500);
      expect(summary.debtPayments).toBe(600);
      expect(summary.availableSurplus).toBe(4900);
    });

    await test('calculateCashFlowSummary > returns a 0 savings rate rather than NaN when income is 0', () => {
      const summary = F.calculateCashFlowSummary([
        { type: 'fixed', actualAmount: 500, budgetAmount: 500 },
        { type: 'savings', actualAmount: 100, budgetAmount: 100 },
      ]);

      expect(summary.income).toBe(0);
      expect(summary.savingsRate).toBe(0);
    });

    await test('calculateCashFlowSummary > handles an empty month with no data at all', () => {
      const summary = F.calculateCashFlowSummary([]);

      expect(summary.income).toBe(0);
      expect(summary.availableSurplus).toBe(0);
      expect(summary.savingsRate).toBe(0);
    });

    // --- calculateEssentialVsDiscretionary --------------------------------

    await test('calculateEssentialVsDiscretionary > splits spend by category essential flag', () => {
      const categories = [
        { id: 'rent', name: 'Rent', type: 'fixed', essential: true },
        { id: 'dining', name: 'Dining Out', type: 'variable', essential: false },
      ];
      const budgetLines = [
        { type: 'fixed', categoryId: 'rent', actualAmount: 9000, budgetAmount: 9000 },
        { type: 'variable', categoryId: 'dining', actualAmount: 1800, budgetAmount: 1200 },
        { type: 'income', actualAmount: 30000, budgetAmount: 30000 }, // ignored — not fixed/variable
      ];

      const split = F.calculateEssentialVsDiscretionary(budgetLines, categories);

      expect(split.essential).toBe(9000);
      expect(split.discretionary).toBe(1800);
    });

    await test('calculateEssentialVsDiscretionary > treats an uncategorised line as discretionary', () => {
      const split = F.calculateEssentialVsDiscretionary(
        [{ type: 'variable', categoryId: undefined, actualAmount: 500, budgetAmount: 500 }],
        [],
      );

      expect(split.essential).toBe(0);
      expect(split.discretionary).toBe(500);
    });

    // --- debt totals -------------------------------------------------------

    const sampleDebts = [
      { name: 'MTN', currentBalance: 7668.87, interestRate: 0.2, minPayment: 1000 },
      { name: 'Loan', currentBalance: 2600, interestRate: 0.15, minPayment: 500 },
      { name: 'FNB Overdraft', currentBalance: 700, interestRate: 0.22, minPayment: 100 },
    ];

    await test('calculateTotalDebt > sums current balances across all debts', () => {
      expect(F.calculateTotalDebt(sampleDebts)).toBeCloseTo(10968.87);
    });

    await test('calculateTotalMinPayments > sums minimum payments across all debts', () => {
      expect(F.calculateTotalMinPayments(sampleDebts)).toBe(1600);
    });

    await test('calculateDebtToIncomeRatio > divides total min payments by monthly income', () => {
      const ratio = F.calculateDebtToIncomeRatio(sampleDebts, 31470.19);
      expect(ratio).toBeCloseTo(0.05084, 3);
    });

    await test('calculateDebtToIncomeRatio > returns 0 instead of Infinity when income is 0', () => {
      expect(F.calculateDebtToIncomeRatio(sampleDebts, 0)).toBe(0);
    });

    await test('getHighestInterestDebt > returns the debt with the highest interest rate', () => {
      const highest = F.getHighestInterestDebt(sampleDebts);
      expect(highest.name).toBe('FNB Overdraft');
    });

    await test('getHighestInterestDebt > returns null when there are no debts', () => {
      expect(F.getHighestInterestDebt([])).toBe(null);
    });

    await test('calculateWeightedAverageInterestRate > weights by balance, not a simple average', () => {
      // Simple average of 0.2, 0.15, 0.22 would be ~0.19 — balance-weighted
      // should pull toward the two large balances (0.2 and 0.15) instead.
      const weighted = F.calculateWeightedAverageInterestRate(sampleDebts);
      expect(weighted).toBeCloseTo(0.18942, 3);
    });
  })(),
);

   // Tests for net worth, emergency fund, health score, debt payoff,
// investment readiness, forecast, the rules engine, and Excel mapping.
// All pure functions \u2014 no IndexedDB involved.

window.WR = window.WR || {};
WR.testRuns = WR.testRuns || [];

WR.testRuns.push(
  (async function () {
    const { test, expect } = WR.test;
    const F = WR.financial;

    // --- net worth / currency conversion ---------------------------------

    await test('calculateNetWorth > converts a foreign-currency asset using the exchange rate on file', () => {
      const assets = [
        { name: 'Cash', currency: 'ZAR', currentValue: 5000 },
        { name: 'US Brokerage', currency: 'USD', currentValue: 1000 },
      ];
      const rates = [{ fromCurrency: 'USD', toCurrency: 'ZAR', rate: 18.5, date: '2026-09-01' }];
      const nw = F.calculateNetWorth(assets, [], [{ currentBalance: 3000 }], rates, 'ZAR');

      expect(nw.totalAssets).toBeCloseTo(5000 + 1000 * 18.5);
      expect(nw.totalLiabilities).toBe(3000);
      expect(nw.unconvertedItems).toHaveLength(0);
    });

    await test('calculateNetWorth > flags an asset with no matching exchange rate instead of guessing 1:1', () => {
      const nw = F.calculateNetWorth([{ name: 'EUR asset', currency: 'EUR', currentValue: 100 }], [], [], [], 'ZAR');
      expect(nw.unconvertedItems).toHaveLength(1);
    });

    // --- emergency fund ----------------------------------------------------

    await test('calculateEmergencyFundMonths > divides liquid assets by essential monthly expenses', () => {
      const months = F.calculateEmergencyFundMonths(6000, 3000);
      expect(months).toBe(2);
    });

    // --- health score --------------------------------------------------

    await test('calculateFinancialHealthScore > produces a score within 0-100 with a full breakdown', () => {
      const result = F.calculateFinancialHealthScore({
        income: 30000,
        availableSurplus: 3000,
        savingsRate: 0.1,
        emergencyFundMonths: 1.5,
        emergencyFundTargetMonths: 3,
        debtToIncomeRatio: 0.1,
        netWorthHistory: [{ netWorth: 100 }, { netWorth: 200 }],
      });
      expect(result.score >= 0 && result.score <= 100).toBeTruthy();
      expect(result.breakdown.netWorthTrend).toBe(100); // net worth increased between the two snapshots
    });

    await test('calculateFinancialHealthScore > net worth trend defaults to neutral with fewer than 2 snapshots', () => {
      const result = F.calculateFinancialHealthScore({
        income: 30000, availableSurplus: 0, savingsRate: 0,
        emergencyFundMonths: 0, emergencyFundTargetMonths: 3,
        debtToIncomeRatio: 0, netWorthHistory: [],
      });
      expect(result.breakdown.netWorthTrend).toBe(50);
    });

    await test('calculateNetWorthTrendScore > a rolling window survives a single noisy recent point', () => {
      // Clearly upward overall, but the very last point dips slightly \u2014
      // the old last-two-points comparison would have called this a decline.
      const sixPoints = [
        { netWorth: 100 }, { netWorth: 120 }, { netWorth: 140 },
        { netWorth: 180 }, { netWorth: 210 }, { netWorth: 205 },
      ];
      expect(F.calculateNetWorthTrendScore(sixPoints)).toBe(100);
    });

    await test('calculateNetWorth > converts a foreign-currency debt using the exchange rate on file', () => {
      const debts = [{ name: 'US Loan', currency: 'USD', currentBalance: 1000 }];
      const rates = [{ fromCurrency: 'USD', toCurrency: 'ZAR', rate: 18.5, date: '2026-09-01' }];
      const nw = F.calculateNetWorth([], [], debts, rates, 'ZAR');
      expect(nw.totalLiabilities).toBe(18500);
    });

    await test('calculateNetWorth > a debt with no currency field falls back to base currency (legacy records)', () => {
      const nw = F.calculateNetWorth([], [], [{ name: 'Old debt', currentBalance: 500 }], [], 'ZAR');
      expect(nw.totalLiabilities).toBe(500);
    });

    // --- debt payoff simulation ------------------------------------------

    const sampleDebts = [
      { name: 'CardA', currentBalance: 5000, interestRate: 0.24, minPayment: 200 },
      { name: 'CardB', currentBalance: 2000, interestRate: 0.15, minPayment: 100 },
    ];

    await test('orderDebtsAvalanche > sorts highest interest rate first', () => {
      const ordered = F.orderDebtsAvalanche(sampleDebts);
      expect(ordered[0].name).toBe('CardA');
    });

    await test('orderDebtsSnowball > sorts smallest balance first', () => {
      const ordered = F.orderDebtsSnowball(sampleDebts);
      expect(ordered[0].name).toBe('CardB');
    });

    await test('simulateDebtPayoff > pays off all debts within a reasonable timeframe given a real extra payment', () => {
      const result = F.simulateDebtPayoff(F.orderDebtsAvalanche(sampleDebts), 500);
      expect(result.months > 0 && result.months < 600).toBeTruthy();
      expect(result.reachedSafetyCap).toBe(false);
    });

    await test('simulateDebtPayoff > flags the safety cap when payments can never cover interest', () => {
      const stuck = F.simulateDebtPayoff([{ name: 'Stuck', currentBalance: 100000, interestRate: 0.9, minPayment: 10 }], 0);
      expect(stuck.reachedSafetyCap).toBe(true);
    });

    await test('calculateInterestSaved > an extra payment always saves interest and time vs minimums only', () => {
      const saved = F.calculateInterestSaved(F.orderDebtsAvalanche(sampleDebts), 500);
      expect(saved.interestSaved > 0).toBeTruthy();
      expect(saved.monthsSaved > 0).toBeTruthy();
    });

    // --- investment readiness ---------------------------------------------

    await test('assessInvestmentReadiness > prioritises the emergency fund when it is under half the target', () => {
      const result = F.assessInvestmentReadiness({
        emergencyFundMonths: 0.5, emergencyFundTargetMonths: 3,
        highestDebtInterestRate: 0.2, assumedInvestmentReturn: 0.08, availableSurplus: 1000,
      });
      expect(result.readiness).toBe('build_emergency_fund');
    });

    await test('assessInvestmentReadiness > prioritises debt when its rate beats the assumed investment return', () => {
      const result = F.assessInvestmentReadiness({
        emergencyFundMonths: 3, emergencyFundTargetMonths: 3,
        highestDebtInterestRate: 0.25, assumedInvestmentReturn: 0.08, availableSurplus: 1000,
      });
      expect(result.readiness).toBe('focus_on_debt');
    });

    await test('assessInvestmentReadiness > ready to invest once fund and debt conditions are met', () => {
      const result = F.assessInvestmentReadiness({
        emergencyFundMonths: 3, emergencyFundTargetMonths: 3,
        highestDebtInterestRate: null, assumedInvestmentReturn: 0.08, availableSurplus: 1000,
      });
      expect(result.readiness).toBe('ready_to_invest');
    });

    // --- forecast ------------------------------------------------------

    await test('forecastNetWorth > debt shrinks and investments grow over time under positive assumptions', () => {
      const forecast = F.forecastNetWorth(
        {
          currentNetWorth: 50000, currentDebtTotal: 20000, currentInvestmentTotal: 10000,
          monthlyDebtPayment: 500, monthlyInvestmentContribution: 1000,
          debtInterestAnnual: 0.2, investmentReturnAnnual: 0.08,
        },
        5,
      );
      expect(forecast).toHaveLength(5);
      expect(forecast[4].debtBalance <= forecast[0].debtBalance).toBeTruthy();
      expect(forecast[4].investmentBalance > forecast[0].investmentBalance).toBeTruthy();
    });

    // --- rules engine ----------------------------------------------------

    await test('generateRecommendations > flags negative cash flow and high-interest debt as high priority', () => {
      const recs = WR.recommendations.generateRecommendations({
        income: 30000, availableSurplus: -500, savingsRate: 0,
        emergencyFundMonths: 1, emergencyFundTargetMonths: 3,
        debtToIncomeRatio: 0.15,
        highestInterestDebt: { name: 'CardA', interestRate: 0.24, currentBalance: 5000 },
        totalDebt: 7000, assumedInvestmentReturn: 0.08,
        essentialVsDiscretionary: { essential: 12000, discretionary: 5000 },
        discretionarySpendChangePct: 0.2,
        investmentReadiness: { readiness: 'focus_on_debt', reasons: ['test'] },
      });
      expect(recs[0].priority).toBe('high');
      expect(recs.some((r) => r.id === 'negative-cashflow')).toBeTruthy();
      expect(recs.some((r) => r.id === 'high-interest-debt')).toBeTruthy();
    });

    await test('generateRecommendations > a healthy snapshot produces no high-priority warnings', () => {
      const recs = WR.recommendations.generateRecommendations({
        income: 30000, availableSurplus: 5000, savingsRate: 0.15,
        emergencyFundMonths: 4, emergencyFundTargetMonths: 3,
        debtToIncomeRatio: 0, highestInterestDebt: null,
        totalDebt: 0, assumedInvestmentReturn: 0.08,
        essentialVsDiscretionary: { essential: 12000, discretionary: 3000 },
        discretionarySpendChangePct: 0,
        investmentReadiness: { readiness: 'ready_to_invest', reasons: ['test'] },
      });
      expect(recs.every((r) => r.priority !== 'high')).toBeTruthy();
    });

    // --- Excel mapping ---------------------------------------------------

    await test('applyMapping + validateImportRow > parses currency-formatted amounts and flags bad rows', () => {
      const rawRows = [
        { Date: '2026-08-15', Desc: 'Salary', Amt: 'R 31,470.19' },
        { Date: '2026-08-16', Desc: '', Amt: 500 },
        { Date: '2026-08-17', Desc: 'Rent', Amt: 'not-a-number' },
      ];
      const mapped = WR.excel.applyMapping(
        rawRows,
        { name: 'Desc', amount: 'Amt' },
        { type: 'income', month: '2026-08', currency: 'ZAR' },
      );
      expect(mapped[0].amount).toBeCloseTo(31470.19);

      const problems0 = WR.excel.validateImportRow(mapped[0]);
      expect(problems0).toHaveLength(0);

      const problems1 = WR.excel.validateImportRow(mapped[1]);
      expect(problems1.includes('Missing name/description')).toBeTruthy();

      const problems2 = WR.excel.validateImportRow(mapped[2]);
      expect(problems2.includes('Missing or invalid amount')).toBeTruthy();
    });

    await test('parseAmount > handles accounting-style negative numbers in parentheses', () => {
      expect(WR.excel.parseAmount('(500.00)')).toBe(-500);
      expect(WR.excel.parseAmount('R 1,234.56')).toBeCloseTo(1234.56);
      expect(WR.excel.parseAmount('1234')).toBe(1234);
    });

    // --- reports aggregation ------------------------------------------

    await test('aggregateMonthlyTotals > groups budget lines by month, summed by type, sorted chronologically', () => {
      const lines = [
        { month: '2026-08', type: 'income', actualAmount: 30000 },
        { month: '2026-08', type: 'fixed', actualAmount: 12000 },
        { month: '2026-09', type: 'income', actualAmount: 31000 },
      ];
      const monthly = WR.financial.aggregateMonthlyTotals(lines);
      expect(monthly).toHaveLength(2);
      expect(monthly[0].month).toBe('2026-08');
      expect(monthly[0].income).toBe(30000);
      expect(monthly[1].income).toBe(31000);
    });

    await test('aggregateSpendingByCategory > sums by category name and buckets uncategorised spending separately', () => {
      const lines = [
        { type: 'fixed', actualAmount: 12000, categoryId: 'rent' },
        { type: 'fixed', actualAmount: 12000, categoryId: 'rent' },
        { type: 'variable', actualAmount: 500 },
      ];
      const categories = [{ id: 'rent', name: 'Rent' }];
      const spend = WR.financial.aggregateSpendingByCategory(lines, categories);
      expect(spend[0].label).toBe('Rent');
      expect(spend[0].value).toBe(24000);
      expect(spend.some((s) => s.label === 'Uncategorised' && s.value === 500)).toBeTruthy();
    });

    await test('monthlyAmountFromFrequency > converts recurring frequencies to monthly equivalents', () => {
      expect(WR.uiCalc.monthlyAmountFromFrequency(1200, 'monthly')).toBe(1200);
      expect(WR.uiCalc.monthlyAmountFromFrequency(300, 'weekly')).toBeCloseTo(1300, 1);
      expect(WR.uiCalc.monthlyAmountFromFrequency(600, 'biweekly')).toBeCloseTo(1300, 1);
      expect(WR.uiCalc.monthlyAmountFromFrequency(900, 'quarterly')).toBe(300);
      expect(WR.uiCalc.monthlyAmountFromFrequency(12000, 'yearly')).toBe(1000);
    });

    await test('isActiveForMonth > respects start/end month boundaries with sane defaults', () => {
      const recurring = { year: 2026, startMonth: '2026-03', endMonth: '2026-06' };
      expect(WR.uiCalc.isActiveForMonth(recurring, '2026-02')).toBe(false);
      expect(WR.uiCalc.isActiveForMonth(recurring, '2026-03')).toBe(true);
      expect(WR.uiCalc.isActiveForMonth(recurring, '2026-06')).toBe(true);
      expect(WR.uiCalc.isActiveForMonth(recurring, '2026-07')).toBe(false);

      const defaultRange = { year: 2026 };
      expect(WR.uiCalc.isActiveForMonth(defaultRange, '2026-01')).toBe(true);
      expect(WR.uiCalc.isActiveForMonth(defaultRange, '2026-12')).toBe(true);
    });

    await test('calculateDayToDaySummary > computes totals and current balance for selected year only', () => {
      const summary = WR.uiCalc.calculateDayToDaySummary(
        { year: 2026, startingBalance: 1000 },
        [
          { year: 2026, kind: 'add', amount: 500 },
          { year: 2026, kind: 'spend', amount: 300 },
          { year: 2026, kind: 'spend', amount: 200 },
          { year: 2025, kind: 'add', amount: 9999 },
        ],
        2026,
      );
      expect(summary.opening).toBe(1000);
      expect(summary.added).toBe(500);
      expect(summary.spent).toBe(500);
      expect(summary.currentBalance).toBe(1000);
      expect(summary.totalTransactions).toBe(3);
    });

    await test('calculateDayToDayMonthBalance > carries September money into October and deducts October spending', () => {
      const balance = WR.uiCalc.calculateDayToDayMonthBalance(
        [{ year: 2026, startingBalance: 0 }],
        [
          { year: 2026, date: '2026-09-01', kind: 'add', amount: 91 },
          { year: 2026, date: '2026-09-15', kind: 'add', amount: 40 },
          { year: 2026, date: '2026-10-03', kind: 'spend', amount: 25 },
        ],
        '2026-10',
      );
      expect(balance.balanceBeforeMonth).toBe(131);
      expect(balance.currentBalance).toBe(106);
    });

    await test('calculateDayToDaySummary > uses the selected month and carries an unused balance into a new year', () => {
      const summary = WR.uiCalc.calculateDayToDaySummary(
        [{ year: 2026, startingBalance: 0 }],
        [
          { year: 2026, date: '2026-09-01', kind: 'add', amount: 91 },
          { year: 2027, date: '2027-01-03', kind: 'add', amount: 20 },
          { year: 2027, date: '2027-02-01', kind: 'spend', amount: 10 },
        ],
        '2027-01',
      );
      expect(summary.currentBalance).toBe(111);
      expect(summary.totalTransactions).toBe(2);
    });

    // --- charts (smoke test \u2014 valid SVG string, no exceptions) -----------

    await test('charts > barChart and lineChart return valid SVG for data and for empty input', () => {
      const bar = WR.charts.barChart([{ label: 'Jan', value: 100 }]);
      expect(bar.includes('<svg')).toBeTruthy();
      const line = WR.charts.lineChart([{ label: '2026-01', value: 100 }, { label: '2026-02', value: 150 }]);
      expect(line.includes('<svg')).toBeTruthy();
      const empty = WR.charts.barChart([]);
      expect(empty.includes('No data')).toBeTruthy();
    });

    await test('charts > pieChart returns valid SVG and empty-state output', () => {
      const pie = WR.charts.pieChart([{ label: 'Fixed', value: 1000 }, { label: 'Variable', value: 500 }], { size: 180 });
      expect(pie.includes('<svg')).toBeTruthy();
      const emptyPie = WR.charts.pieChart([]);
      expect(emptyPie.includes('No data')).toBeTruthy();
    });
  })(),
);
// Waits for every suite registered in WR.testRuns (storage-tests.js,
// financial/tests.js, and any future test files that push onto that array),
// then renders one combined results page. Must be the last script loaded.

(async function () {
  await Promise.all(WR.testRuns);
  WR.test.render();
})();
